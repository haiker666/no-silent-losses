）。\n\n把握度：C｜经验判断。\n\n"}, {"num": "049", "title": "领证前的十个红灯：看到三个以上，先别领证", "grade": "C", "lead": "红灯不是判决，是提醒。看到的越多，越要把话问清楚，把时间放长。这十条，对你自己同样适用。", "html": "<blockquote>红灯不是判决，是提醒。看到的越多，越要把话问清楚，把时间放长。这十条，对你自己同样适用。<\/blockquote>\n<p>小冯和女友谈婚论嫁，陆续注意到几件事：对方不愿聊债务；每次分歧就说\"那就分手\"；对婚前协议一概拒绝；曾经有过一次摔东西。他一件一件，都解释成\"她压力大\"。领证后三个月，每一件事都放大了。<\/p>\n<p>婚后的矛盾，大部分在婚前就有苗头。红灯里很多事，单独看都有解释，凑在一起才是模式。看模式，不看单次：<\/p>\n<ol><li>被追问重大事实（婚史、债务、疾病）时，反复含糊、回避；\n<\/li><li>对钱的态度走极端：只进不出，或者只出不进，不愿谈预算；\n<\/li><li>常把\"你不给就是不爱我\"当成手段；\n<\/li><li>出现过肢体暴力、摔砸东西，或明显的情绪失控；\n<\/li><li>反复贬低、否定你的家人和朋友，让你和他们疏远；\n<\/li><li>一有分歧就用分手、离婚、自伤来威胁；\n<\/li><li>对婚检、信息披露、婚前协议，一概拒绝，连谈都不谈；\n<\/li><li>债务滚动、以贷养贷，不愿面对；\n<\/li><li>重大决定完全由父母代替，本人没有主见；\n<\/li><li>你自己发现：你越来越不敢对他（她）说真话。\n<\/li><\/ol>\n<p>怎么处理？看到 1 到 2 条，问清楚，给时间，观察是不是持续；看到 3 条及以上，先别领证，把时间放长，把话谈透，必要时找咨询师；出现第 4 条（暴力）或第 1 条（重大隐瞒），不管数量，都要认真评估，必要时保护好自己，见 <a href=\"#/e/026\">第 026 条<\/a>。如果这十条里，你自己占了好几条，也是个信号：先处理自己。<\/p>\n<p>不要用一两次事件下定论，也不要因为\"已经投入了这么多\"，就不敢刹车。领证之前，你有一万个理由停下来；领证之后，每一个理由，都变成要花钱的事。<\/p>\n<p><strong>法律依据<\/strong>：无直接条文。与重大疾病告知、重婚等有关的部分，见 <a href=\"#/e/045\">第 045 条<\/a>、<a href=\"#/e/054\">第 054 条<\/a>。<\/p>\n<p><strong>把握度<\/strong>：C｜经验判断。<\/p>", "text": "领证前的十个红灯：看到三个以上，先别领证 \n 红灯不是判决，是提醒。看到的越多，越要把话问清楚，把时间放长。这十条，对你自己同样适用。\n\n小冯和女友谈婚论嫁，陆续注意到几件事：对方不愿聊债务；每次分歧就说\"那就分手\"；对婚前协议一概拒绝；曾经有过一次摔东西。他一件一件，都解释成\"她压力大\"。领证后三个月，每一件事都放大了。\n\n婚后的矛盾，大部分在婚前就有苗头。红灯里很多事，单独看都有解释，凑在一起才是模式。看模式，不看单次：\n\n1. 被追问重大事实（婚史、债务、疾病）时，反复含糊、回避；\n2. 对钱的态度走极端：只进不出，或者只出不进，不愿谈预算；\n3. 常把\"你不给就是不爱我\"当成手段；\n4. 出现过肢体暴力、摔砸东西，或明显的情绪失控；\n5. 反复贬低、否定你的家人和朋友，让你和他们疏远；\n6. 一有分歧就用分手、离婚、自伤来威胁；\n7. 对婚检、信息披露、婚前协议，一概拒绝，连谈都不谈；\n8. 债务滚动、以贷养贷，不愿面对；\n9. 重大决定完全由父母代替，本人没有主见；\n10. 你自己发现：你越来越不敢对他（她）说真话。\n\n怎么处理？看到 1 到 2 条，问清楚，给时间，观察是不是持续；看到 3 条及以上，先别领证，把时间放长，把话谈透，必要时找咨询师；出现第 4 条（暴力）或第 1 条（重大隐瞒），不管数量，都要认真评估，必要时保护好自己，见 第 026 条。如果这十条里，你自己占了好几条，也是个信号：先处理自己。\n\n不要用一两次事件下定论，也不要因为\"已经投入了这么多\"，就不敢刹车。领证之前，你有一万个理由停下来；领证之后，每一个理由，都变成要花钱的事。\n\n法律依据：无直接条文。与重大疾病告知、重婚等有关的部分，见 第 045 条、第 054 条。\n\n把握度：C｜经验判断。\n\n"}, {"num": "050", "title": "婚前聊十二件事，等吵起来再谈就贵了", "grade": "C", "lead": "把婚后一定会遇到的事，在婚前谈。吵的时候再谈，代价高得多。", "html": "<blockquote>把婚后一定会遇到的事，在婚前谈。吵的时候再谈，代价高得多。<\/blockquote>\n<p>婚前没谈过生孩子的事。婚后一年，男方想要孩子，女方想先拼事业，吵了半年，差点走到离婚。如果婚前谈过，这件事就不会成为一个\"意外\"。<\/p>\n<p>这十二件事，是你们婚后一定会吵的：<\/p>\n<ol><li>钱：谁管钱，共同账户，个人账户，零用金额度；\n<\/li><li>房：住哪，买不买，首付谁出，登记谁的名字；\n<\/li><li>车：买不买，谁出钱；\n<\/li><li>债：已有的债务，将来的大额借贷；\n<\/li><li>孩子：要不要，什么时候要，几个；\n<\/li><li>养孩子：谁带，花多少钱，教育观；\n<\/li><li>双方父母：同住与否，赡养费用，生病照护；\n<\/li><li>家务：怎么分；\n<\/li><li>工作：是否换城市，是否有人暂停工作；\n<\/li><li>冲突：吵架时的规则，不人身攻击，不冷战超过 24 小时，不拿离婚威胁；\n<\/li><li>重大风险：生病、失业、创业失败怎么办；\n<\/li><li>底线：各自的三个\"不能接受\"。\n<\/li><\/ol>\n<p>做法是：两个人各自在不同的地方独立填，填完再交换，一项一项讨论，把分歧列出来。附录 F 有 40 题的问卷范本。不要把问卷变成审问，目的是对齐预期。<\/p>\n<p><strong>法律依据<\/strong>：无直接条文。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "婚前聊十二件事，等吵起来再谈就贵了 \n 把婚后一定会遇到的事，在婚前谈。吵的时候再谈，代价高得多。\n\n婚前没谈过生孩子的事。婚后一年，男方想要孩子，女方想先拼事业，吵了半年，差点走到离婚。如果婚前谈过，这件事就不会成为一个\"意外\"。\n\n这十二件事，是你们婚后一定会吵的：\n\n1. 钱：谁管钱，共同账户，个人账户，零用金额度；\n2. 房：住哪，买不买，首付谁出，登记谁的名字；\n3. 车：买不买，谁出钱；\n4. 债：已有的债务，将来的大额借贷；\n5. 孩子：要不要，什么时候要，几个；\n6. 养孩子：谁带，花多少钱，教育观；\n7. 双方父母：同住与否，赡养费用，生病照护；\n8. 家务：怎么分；\n9. 工作：是否换城市，是否有人暂停工作；\n10. 冲突：吵架时的规则，不人身攻击，不冷战超过 24 小时，不拿离婚威胁；\n11. 重大风险：生病、失业、创业失败怎么办；\n12. 底线：各自的三个\"不能接受\"。\n\n做法是：两个人各自在不同的地方独立填，填完再交换，一项一项讨论，把分歧列出来。附录 F 有 40 题的问卷范本。不要把问卷变成审问，目的是对齐预期。\n\n法律依据：无直接条文。\n\n把握度：C｜经验做法。\n\n"}, {"num": "051", "title": "怎么开口提婚前协议：最难的是第一句", "grade": "C", "lead": "很多人知道该签，却不知道怎么开口。开口的方式，往往比协议本身更决定结果。", "html": "<blockquote>很多人知道该签，却不知道怎么开口。开口的方式，往往比协议本身更决定结果。<\/blockquote>\n<p>小秦想签婚前协议，直接对女友说：\"我们签个婚前协议吧，保护我的房子。\"对方当场就哭了，说\"你从一开始就在防着我\"。后来他换了一种方式，一起聊了一次，才慢慢达成一致。<\/p>\n<p>难的不是协议，是第一句话。说得对，是坦诚；说得不对，就成了审判。<\/p>\n<p><strong>时间<\/strong>：不要在婚礼前几天提，不要在吵架时提，也不要在登记当天提。提前三到六个月。<\/p>\n<p><strong>场合<\/strong>：安静、私密、有时间的地方，不要在餐厅，不要在朋友面前。<\/p>\n<p><strong>先说\"为什么\"，再说\"写什么\"<\/strong>：目的是明确规则，减少将来的猜测和吵架。<\/p>\n<p><strong>用\"我们\"，不用\"你\"<\/strong>：协议对双方都适用，各自有各自的清单。<\/p>\n<p><strong>把你自己的清单，先拿出来<\/strong>：你自己也要披露财产、债务、父母出资等。<\/p>\n<p><strong>各自找律师<\/strong>：避免被认为对方在逼迫，也避免将来说\"我没看懂\"。<\/p>\n<p><strong>留出时间<\/strong>：对方说\"我再想想\"，就给一周，不要逼。<\/p>\n<p>对方坚决拒绝一切形式的约定，也是一个信号：你们对财产的预期差距比较大，要认真聊清楚。不要用协议\"逼\"对方，也不要把签协议变成\"考验感情\"。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我想跟你聊一件事，不是不信任你，是我觉得我们结婚前，把钱和房的事都想清楚，以后能少很多吵架。\"\n<\/li><li>\"我先把我的情况都摊开：我有一套婚前买的房，贷款还有 40 万，存款 20 万。你也把你的情况告诉我，我们各自找个律师看看，一起定一份。\"\n<\/li><li>\"如果你觉得有哪一条不舒服，我们可以一起改。这份协议对我们两个人都适用。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1065 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "怎么开口提婚前协议：最难的是第一句 \n 很多人知道该签，却不知道怎么开口。开口的方式，往往比协议本身更决定结果。\n\n小秦想签婚前协议，直接对女友说：\"我们签个婚前协议吧，保护我的房子。\"对方当场就哭了，说\"你从一开始就在防着我\"。后来他换了一种方式，一起聊了一次，才慢慢达成一致。\n\n难的不是协议，是第一句话。说得对，是坦诚；说得不对，就成了审判。\n\n时间：不要在婚礼前几天提，不要在吵架时提，也不要在登记当天提。提前三到六个月。\n\n场合：安静、私密、有时间的地方，不要在餐厅，不要在朋友面前。\n\n先说\"为什么\"，再说\"写什么\"：目的是明确规则，减少将来的猜测和吵架。\n\n用\"我们\"，不用\"你\"：协议对双方都适用，各自有各自的清单。\n\n把你自己的清单，先拿出来：你自己也要披露财产、债务、父母出资等。\n\n各自找律师：避免被认为对方在逼迫，也避免将来说\"我没看懂\"。\n\n留出时间：对方说\"我再想想\"，就给一周，不要逼。\n\n对方坚决拒绝一切形式的约定，也是一个信号：你们对财产的预期差距比较大，要认真聊清楚。不要用协议\"逼\"对方，也不要把签协议变成\"考验感情\"。\n\n可以这样说：\n\n \"我想跟你聊一件事，不是不信任你，是我觉得我们结婚前，把钱和房的事都想清楚，以后能少很多吵架。\"\n \"我先把我的情况都摊开：我有一套婚前买的房，贷款还有 40 万，存款 20 万。你也把你的情况告诉我，我们各自找个律师看看，一起定一份。\"\n \"如果你觉得有哪一条不舒服，我们可以一起改。这份协议对我们两个人都适用。\"\n\n法律依据：《民法典》第 1065 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "052", "title": "婚前协议能写什么，不能写什么", "grade": "C", "lead": "能约定财产归属，不能约定剥夺法定权利。财产边界天然复杂的人，最该签。", "html": "<blockquote>能约定财产归属，不能约定剥夺法定权利。财产边界天然复杂的人，最该签。<\/blockquote>\n<p>婚前协议里，男方写了\"如果女方生不出儿子，就离婚并且她净身出户\"。这类条款违反法律和公序良俗，无效，还可能影响整份协议的可信度。<\/p>\n<p>《民法典》第 1065 条规定：夫妻可以约定婚姻关系存续期间所得的财产，以及婚前财产，归各自所有、共同所有，或者部分各自所有、部分共同所有。约定要书面，对双方有约束力。<\/p>\n<p><strong>可以约定<\/strong>：婚前个人财产的归属；婚姻存续期间所得的归属；婚后各自收入、房产、投资收益的归属；各自债务各自承担；日常开支的分担方式。<\/p>\n<p><strong>不能约定，或者效力存疑<\/strong>：约定子女抚养权归谁，法院仍以子女利益最大化判断；约定放弃对方的法定扶养义务；限制人身自由、生育自由、离婚自由；\"出轨净身出户\"这类惩罚性条款，法院的态度不统一，要审慎；以欺诈、胁迫方式签的协议，可以请求撤销。<\/p>\n<p>另外，约定财产归各自所有的，一方对外所负的债务，如果第三人知道这个约定，以个人财产清偿；第三人不知道的，仍按夫妻共同债务处理。<\/p>\n<p>那哪些人最该签？有这六种情形，建议认真考虑：一方婚前有较大金额的存款、理财；婚前已购房，婚后需要还贷；一方持有公司股权，或者是创业者；一方有婚前的大额债务；再婚，各自有前一段婚姻的子女和财产；双方资产差距较大。同时考虑：双方家庭对婚房、彩礼、嫁妆的出资安排，父母出资的性质，将来遗产、继承的安排。<\/p>\n<p>不要把婚前协议，理解成\"准备离婚\"。它的作用，是提前约定规则。协议能管钱，管不了人。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1065 条、第 143 条、第 153 条、第 154 条。；《民法典》第 1065 条。<\/p>\n<p><strong>把握度<\/strong>：C｜法条明确。<\/p>", "text": "婚前协议能写什么，不能写什么 \n 能约定财产归属，不能约定剥夺法定权利。财产边界天然复杂的人，最该签。\n\n婚前协议里，男方写了\"如果女方生不出儿子，就离婚并且她净身出户\"。这类条款违反法律和公序良俗，无效，还可能影响整份协议的可信度。\n\n《民法典》第 1065 条规定：夫妻可以约定婚姻关系存续期间所得的财产，以及婚前财产，归各自所有、共同所有，或者部分各自所有、部分共同所有。约定要书面，对双方有约束力。\n\n可以约定：婚前个人财产的归属；婚姻存续期间所得的归属；婚后各自收入、房产、投资收益的归属；各自债务各自承担；日常开支的分担方式。\n\n不能约定，或者效力存疑：约定子女抚养权归谁，法院仍以子女利益最大化判断；约定放弃对方的法定扶养义务；限制人身自由、生育自由、离婚自由；\"出轨净身出户\"这类惩罚性条款，法院的态度不统一，要审慎；以欺诈、胁迫方式签的协议，可以请求撤销。\n\n另外，约定财产归各自所有的，一方对外所负的债务，如果第三人知道这个约定，以个人财产清偿；第三人不知道的，仍按夫妻共同债务处理。\n\n那哪些人最该签？有这六种情形，建议认真考虑：一方婚前有较大金额的存款、理财；婚前已购房，婚后需要还贷；一方持有公司股权，或者是创业者；一方有婚前的大额债务；再婚，各自有前一段婚姻的子女和财产；双方资产差距较大。同时考虑：双方家庭对婚房、彩礼、嫁妆的出资安排，父母出资的性质，将来遗产、继承的安排。\n\n不要把婚前协议，理解成\"准备离婚\"。它的作用，是提前约定规则。协议能管钱，管不了人。\n\n法律依据：《民法典》第 1065 条、第 143 条、第 153 条、第 154 条。；《民法典》第 1065 条。\n\n把握度：C｜法条明确。\n\n"}, {"num": "053", "title": "手把手写一份婚前协议，以及八个坑", "grade": "B", "lead": "协议结构化，逐项写清楚，比\"原则性表述\"强得多。", "html": "<blockquote>协议结构化，逐项写清楚，比\"原则性表述\"强得多。<\/blockquote>\n<p>小葛的协议里写：\"婚后双方共同努力，财产合理分配。\"后来出了争议，法官问：什么叫\"合理\"？这一句，几乎无法执行。<\/p>\n<p>写协议不是写散文。数字、日期、账户，越具体越好。一份婚前协议，建议这样搭结构：<\/p>\n<ol><li>双方身份信息\n<\/li><li>婚前财产清单：房产、存款、股权、车辆、债权，写明价值和来源\n<\/li><li>婚前债务清单：谁的债务，谁负责\n<\/li><li>婚后收入怎么归属，或设共同账户，各自出资比例\n<\/li><li>婚后房产：登记在谁名下，首付、还贷的资金来源，离婚时如何处理\n<\/li><li>投资与经营：股权、分红、增值的归属\n<\/li><li>日常开支怎么分担\n<\/li><li>子女相关：教育金等，不涉及抚养权\n<\/li><li>财产变更与赠与的规则：重大赠与需要书面\n<\/li><li>争议解决\n<\/li><li>签字、日期，各自留存原件\n<\/li><\/ol>\n<p>签署前，各自独立咨询律师；有重大资产的，做公证；婚后资产有变动，及时更新协议。范本见附录 G。<\/p>\n<p>最容易踩的八个坑：<\/p>\n<ol><li><strong>\"离婚时房子全部归对方\"<\/strong>：附离婚条件的财产惩罚条款，法院态度不一，有的认定为有效，有的认定为需要审慎的忠诚协议，要谨慎写。\n<\/li><li><strong>手写修改没签字<\/strong>：对方否认，修改部分可能无效。\n<\/li><li><strong>约定子女抚养权<\/strong>：条款无效。\n<\/li><li><strong>模糊表述<\/strong>：\"酌情分配\"\"合理补偿\"，无法执行，要有具体金额、比例、计算方式。\n<\/li><li><strong>一方有律师，另一方没有<\/strong>：事后可能主张显失公平。\n<\/li><li><strong>临近婚礼才签<\/strong>：事后可能主张胁迫。\n<\/li><li><strong>财产清单遗漏<\/strong>：后续另行购买的，没有约定。\n<\/li><li><strong>没有保存原件<\/strong>：需要时拿不出。\n<\/li><\/ol>\n<p>协议输在写法上的，比输在法律上的多。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1065 条。；《民法典》第 143 条、第 150 条、第 151 条、第 153 条、第 1065 条。<\/p>\n<p><strong>把握度<\/strong>：B｜法律依据明确；具体结构属于经验。<\/p>", "text": "手把手写一份婚前协议，以及八个坑 \n 协议结构化，逐项写清楚，比\"原则性表述\"强得多。\n\n小葛的协议里写：\"婚后双方共同努力，财产合理分配。\"后来出了争议，法官问：什么叫\"合理\"？这一句，几乎无法执行。\n\n写协议不是写散文。数字、日期、账户，越具体越好。一份婚前协议，建议这样搭结构：\n\n1. 双方身份信息\n2. 婚前财产清单：房产、存款、股权、车辆、债权，写明价值和来源\n3. 婚前债务清单：谁的债务，谁负责\n4. 婚后收入怎么归属，或设共同账户，各自出资比例\n5. 婚后房产：登记在谁名下，首付、还贷的资金来源，离婚时如何处理\n6. 投资与经营：股权、分红、增值的归属\n7. 日常开支怎么分担\n8. 子女相关：教育金等，不涉及抚养权\n9. 财产变更与赠与的规则：重大赠与需要书面\n10. 争议解决\n11. 签字、日期，各自留存原件\n\n签署前，各自独立咨询律师；有重大资产的，做公证；婚后资产有变动，及时更新协议。范本见附录 G。\n\n最容易踩的八个坑：\n\n1. \"离婚时房子全部归对方\"：附离婚条件的财产惩罚条款，法院态度不一，有的认定为有效，有的认定为需要审慎的忠诚协议，要谨慎写。\n2. 手写修改没签字：对方否认，修改部分可能无效。\n3. 约定子女抚养权：条款无效。\n4. 模糊表述：\"酌情分配\"\"合理补偿\"，无法执行，要有具体金额、比例、计算方式。\n5. 一方有律师，另一方没有：事后可能主张显失公平。\n6. 临近婚礼才签：事后可能主张胁迫。\n7. 财产清单遗漏：后续另行购买的，没有约定。\n8. 没有保存原件：需要时拿不出。\n\n协议输在写法上的，比输在法律上的多。\n\n法律依据：《民法典》第 1065 条。；《民法典》第 143 条、第 150 条、第 151 条、第 153 条、第 1065 条。\n\n把握度：B｜法律依据明确；具体结构属于经验。\n\n"}, {"num": "054", "title": "被骗婚、被逼婚：能撤销的只有这几种", "grade": "A", "lead": "只有三类情况，婚姻可以无效或被撤销；其他\"被骗了\"的情况，不在其中。", "html": "<blockquote>只有三类情况，婚姻可以无效或被撤销；其他\"被骗了\"的情况，不在其中。<\/blockquote>\n<p>小魏发现妻子婚前隐瞒了学历，收入也造假，想撤销婚姻，结果发现这不属于法定的撤销事由。他只能选择离婚。<\/p>\n<p>婚姻是身份关系，法律尽量让它稳定，所以无效和撤销的事由是封闭的，只有法律列明的几种。<\/p>\n<p><strong>无效婚姻<\/strong>（《民法典》第 1051 条）：重婚；有禁止结婚的亲属关系；未到法定婚龄（男 22 周岁，女 20 周岁）。无效婚姻自始没有法律约束力。<\/p>\n<p><strong>可撤销婚姻<\/strong>：因胁迫结婚的，受胁迫的一方请求撤销，期限为一年，自胁迫行为终止之日起算，被非法限制人身自由的，自恢复人身自由之日起算（第 1052 条）；一方患有重大疾病，婚前没告知的，另一方请求撤销，期限为一年，自知道或应当知道之日起算（第 1053 条）。<\/p>\n<p>其他事由，比如隐瞒婚史、隐瞒债务、编造学历收入，不属于法定的撤销事由。<\/p>\n<p>重婚的，有配偶者再婚，涉嫌重婚罪（《刑法》第 258 条）。《婚姻家庭编解释（二）》第 1 条还明确：因重婚被请求确认无效的婚姻，不会因为前一段婚姻在诉讼时已经离婚或配偶死亡，就\"转为有效\"，法院不再支持这种抗辩。<\/p>\n<p>婚姻被确认无效或被撤销后，无过错方可以请求损害赔偿；同居期间取得的财产，按共同共有处理，除非有证据证明为一方所有。撤销的一年期间，不能中止、中断或延长，必须按时提出。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1051 条至第 1054 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 9 条至第 22 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 1 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "被骗婚、被逼婚：能撤销的只有这几种 \n 只有三类情况，婚姻可以无效或被撤销；其他\"被骗了\"的情况，不在其中。\n\n小魏发现妻子婚前隐瞒了学历，收入也造假，想撤销婚姻，结果发现这不属于法定的撤销事由。他只能选择离婚。\n\n婚姻是身份关系，法律尽量让它稳定，所以无效和撤销的事由是封闭的，只有法律列明的几种。\n\n无效婚姻（《民法典》第 1051 条）：重婚；有禁止结婚的亲属关系；未到法定婚龄（男 22 周岁，女 20 周岁）。无效婚姻自始没有法律约束力。\n\n可撤销婚姻：因胁迫结婚的，受胁迫的一方请求撤销，期限为一年，自胁迫行为终止之日起算，被非法限制人身自由的，自恢复人身自由之日起算（第 1052 条）；一方患有重大疾病，婚前没告知的，另一方请求撤销，期限为一年，自知道或应当知道之日起算（第 1053 条）。\n\n其他事由，比如隐瞒婚史、隐瞒债务、编造学历收入，不属于法定的撤销事由。\n\n重婚的，有配偶者再婚，涉嫌重婚罪（《刑法》第 258 条）。《婚姻家庭编解释（二）》第 1 条还明确：因重婚被请求确认无效的婚姻，不会因为前一段婚姻在诉讼时已经离婚或配偶死亡，就\"转为有效\"，法院不再支持这种抗辩。\n\n婚姻被确认无效或被撤销后，无过错方可以请求损害赔偿；同居期间取得的财产，按共同共有处理，除非有证据证明为一方所有。撤销的一年期间，不能中止、中断或延长，必须按时提出。\n\n法律依据：《民法典》第 1051 条至第 1054 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 9 条至第 22 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 1 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "055", "title": "去领证：新规和该带的东西", "grade": "A", "lead": "现在结婚登记不需要户口本，可以在全国范围内办理。手续越简单，越要在领证前把事想清楚。", "html": "<blockquote>现在结婚登记不需要户口本，可以在全国范围内办理。手续越简单，越要在领证前把事想清楚。<\/blockquote>\n<p>小谢在北京工作，户籍在外地。以前登记要回户籍地，现在可以在北京有权限的登记机关办理，也不用户口本。<\/p>\n<p>新修订的《婚姻登记条例》，自 2025 年 5 月 10 日起施行：结婚、离婚登记不再要求提供户口本，可以在有权限的婚姻登记机关办理，不限于一方户籍所在地。<\/p>\n<p>需要什么？双方本人的有效身份证件；本人签名的书面声明（声明无配偶、没有禁止结婚的亲属关系、符合法定婚龄等）。具体材料和表格名称，以当地民政部门公布的为准，登记预约、材料细节，各地有差异，办理前电话确认。<\/p>\n<p>办理前，先把这几件事做完：完成 <a href=\"#/e/046\">第 046 条<\/a> 的信息核对；完成 <a href=\"#/e/050\">第 050 条<\/a> 的婚前沟通；需要婚前协议的，先签署；彩礼、婚房出资的安排，先落成书面。办理当天，双方亲自到场。婚姻关系成立之日，是取得结婚证之日。<\/p>\n<p><strong>附件<\/strong>：婚前深度沟通问卷见附录 F，婚前财产协议见附录 G。<\/p>\n<p><strong>法律依据<\/strong>：《婚姻登记条例》（2025 年修订，自 2025 年 5 月 10 日起施行）；《民法典》第 1049 条。<\/p>\n<p><strong>把握度<\/strong>：A｜施行日期明确；具体材料以当地为准。<\/p>", "text": "去领证：新规和该带的东西 \n 现在结婚登记不需要户口本，可以在全国范围内办理。手续越简单，越要在领证前把事想清楚。\n\n小谢在北京工作，户籍在外地。以前登记要回户籍地，现在可以在北京有权限的登记机关办理，也不用户口本。\n\n新修订的《婚姻登记条例》，自 2025 年 5 月 10 日起施行：结婚、离婚登记不再要求提供户口本，可以在有权限的婚姻登记机关办理，不限于一方户籍所在地。\n\n需要什么？双方本人的有效身份证件；本人签名的书面声明（声明无配偶、没有禁止结婚的亲属关系、符合法定婚龄等）。具体材料和表格名称，以当地民政部门公布的为准，登记预约、材料细节，各地有差异，办理前电话确认。\n\n办理前，先把这几件事做完：完成 第 046 条 的信息核对；完成 第 050 条 的婚前沟通；需要婚前协议的，先签署；彩礼、婚房出资的安排，先落成书面。办理当天，双方亲自到场。婚姻关系成立之日，是取得结婚证之日。\n\n附件：婚前深度沟通问卷见附录 F，婚前财产协议见附录 G。\n\n法律依据：《婚姻登记条例》（2025 年修订，自 2025 年 5 月 10 日起施行）；《民法典》第 1049 条。\n\n把握度：A｜施行日期明确；具体材料以当地为准。\n\n"}]}, {"title": "第六章　共同财产和婚内协议", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：婚后的钱，默认是\"我们的\"。想让它不是，要写下来，要分开放。<br><br><strong>口诀<\/strong>：婚后所得共，婚前财产私；混了说不清，写了才算数。<\/blockquote>\n<p>财产，是婚姻里最容易起争议的地方。这一章讲清楚：什么是你的，什么是我们的，房子、股权、债务这几样最复杂的东西，到底怎么算。<\/p>", "entries": [{"num": "056", "title": "夫妻财产的底层逻辑：先搞懂这套默认规则", "grade": "A", "lead": "没有特别约定，法律默认\"婚后所得共同制\"：婚后挣的，一起挣的；婚前有的，各人的。", "html": "<blockquote>没有特别约定，法律默认\"婚后所得共同制\"：婚后挣的，一起挣的；婚前有的，各人的。<\/blockquote>\n<p>小岳和妻子结婚时，没签任何协议。婚后他的工资、年终奖照常入账，妻子全职在家，没有收入。离婚时他才明白：他婚后挣的钱，有一半属于妻子。<\/p>\n<p>这就是法定的财产制度。夫妻在婚姻存续期间所得的财产，除非另有约定，都是夫妻共同财产；婚前财产，仍归各自。理由很朴素：一方多承担了家务和照顾老人孩子，另一方才能专心赚钱，这份贡献是共同的。<\/p>\n<p>这套规则的好处，是保护家庭这个共同体。它也有风险：<strong>财产混同<\/strong>。婚前的钱，和婚后的钱，混在同一个账户里，将来很难分清，容易被认定为共同财产。<\/p>\n<p>所以想用这套规则，不需要做什么；想不用，要做两件事：一是书面约定，二是日常管理上，保持区分。<\/p>\n<p>约定优先于法定。夫妻可以书面约定，婚姻存续期间所得和婚前财产，归各自、共同，或者部分各自、部分共同（《民法典》第 1065 条）。<\/p>\n<p>结婚，不等于所有东西都合并，只是把婚后挣的合并。搞懂这一条，后面一半的官司，你都看得懂。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1063 条、第 1065 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "夫妻财产的底层逻辑：先搞懂这套默认规则 \n 没有特别约定，法律默认\"婚后所得共同制\"：婚后挣的，一起挣的；婚前有的，各人的。\n\n小岳和妻子结婚时，没签任何协议。婚后他的工资、年终奖照常入账，妻子全职在家，没有收入。离婚时他才明白：他婚后挣的钱，有一半属于妻子。\n\n这就是法定的财产制度。夫妻在婚姻存续期间所得的财产，除非另有约定，都是夫妻共同财产；婚前财产，仍归各自。理由很朴素：一方多承担了家务和照顾老人孩子，另一方才能专心赚钱，这份贡献是共同的。\n\n这套规则的好处，是保护家庭这个共同体。它也有风险：财产混同。婚前的钱，和婚后的钱，混在同一个账户里，将来很难分清，容易被认定为共同财产。\n\n所以想用这套规则，不需要做什么；想不用，要做两件事：一是书面约定，二是日常管理上，保持区分。\n\n约定优先于法定。夫妻可以书面约定，婚姻存续期间所得和婚前财产，归各自、共同，或者部分各自、部分共同（《民法典》第 1065 条）。\n\n结婚，不等于所有东西都合并，只是把婚后挣的合并。搞懂这一条，后面一半的官司，你都看得懂。\n\n法律依据：《民法典》第 1062 条、第 1063 条、第 1065 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "057", "title": "哪些钱是\"我们的\"，哪些钱永远是\"你自己的\"", "grade": "A", "lead": "工资、奖金、经营和投资收益，婚后都是共同的；婚前财产、人身损害赔偿、明确只给你一个人的，是你自己的。", "html": "<blockquote>工资、奖金、经营和投资收益，婚后都是共同的；婚前财产、人身损害赔偿、明确只给你一个人的，是你自己的。<\/blockquote>\n<p>小彭婚后继承了父亲留下的 80 万。遗嘱里没写\"只归小彭一人\"。离婚时，对方主张这 80 万是共同财产。他才知道：继承、受赠，除非遗嘱或赠与合同里写明只给一方，否则就是共同的。<\/p>\n<p>按《民法典》第 1062 条，夫妻在婚姻存续期间所得的下列财产，是夫妻共同财产：工资、奖金、劳务报酬；生产、经营、投资的收益；知识产权的收益；继承或受赠的财产，但遗嘱或赠与合同里确定只归一方的除外；其他应当归共同所有的财产。其中，知识产权收益，是指婚姻存续期间已经取得，或者已经明确可以取得的。<\/p>\n<p>按第 1063 条，下列是夫妻一方的个人财产：一方的婚前财产；一方因受到人身损害获得的赔偿或补偿；遗嘱或赠与合同中确定只归一方的财产；一方专用的生活用品；其他应当归一方的财产。<\/p>\n<p>还有两个细节，常被忽略。一是婚前财产婚后产生的<strong>孳息和自然增值<\/strong>，仍归个人，比如婚前存款的利息、婚前房产因市场因素的升值；但一方个人财产在婚后产生的其他收益，一般属于夫妻共同财产（《婚姻家庭编解释（一）》第 26 条）。二是个人财产不会因为婚姻持续，而自动变成共同财产，除非双方另有约定（第 31 条）。<\/p>\n<p>要说的是，\"你自己的\"有个前提：<strong>能证明是你的<\/strong>。混在一起，就说不清了。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 24 条、第 25 条、第 26 条。；《民法典》第 1063 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 26 条、第 31 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "哪些钱是\"我们的\"，哪些钱永远是\"你自己的\" \n 工资、奖金、经营和投资收益，婚后都是共同的；婚前财产、人身损害赔偿、明确只给你一个人的，是你自己的。\n\n小彭婚后继承了父亲留下的 80 万。遗嘱里没写\"只归小彭一人\"。离婚时，对方主张这 80 万是共同财产。他才知道：继承、受赠，除非遗嘱或赠与合同里写明只给一方，否则就是共同的。\n\n按《民法典》第 1062 条，夫妻在婚姻存续期间所得的下列财产，是夫妻共同财产：工资、奖金、劳务报酬；生产、经营、投资的收益；知识产权的收益；继承或受赠的财产，但遗嘱或赠与合同里确定只归一方的除外；其他应当归共同所有的财产。其中，知识产权收益，是指婚姻存续期间已经取得，或者已经明确可以取得的。\n\n按第 1063 条，下列是夫妻一方的个人财产：一方的婚前财产；一方因受到人身损害获得的赔偿或补偿；遗嘱或赠与合同中确定只归一方的财产；一方专用的生活用品；其他应当归一方的财产。\n\n还有两个细节，常被忽略。一是婚前财产婚后产生的孳息和自然增值，仍归个人，比如婚前存款的利息、婚前房产因市场因素的升值；但一方个人财产在婚后产生的其他收益，一般属于夫妻共同财产（《婚姻家庭编解释（一）》第 26 条）。二是个人财产不会因为婚姻持续，而自动变成共同财产，除非双方另有约定（第 31 条）。\n\n要说的是，\"你自己的\"有个前提：能证明是你的。混在一起，就说不清了。\n\n法律依据：《民法典》第 1062 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 24 条、第 25 条、第 26 条。；《民法典》第 1063 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 26 条、第 31 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "058", "title": "三个最常见的误会：婚前存款、婚前房子、不上班的另一半", "grade": "A", "lead": "三个误会，每一个都可能让你少拿或者多赔几十万。", "html": "<blockquote>三个误会，每一个都可能让你少拿或者多赔几十万。<\/blockquote>\n<p>小施有三个想法：我婚前的 50 万存款，永远是我的；我婚前买的房，整套都是我的；妻子没工作，不能分我的工资。这三个想法，每一个都有问题。<\/p>\n<p><strong>误会一：婚前存款永远是我的。<\/strong> 存款本身是婚前财产，属于个人。但是婚后工资、奖金继续存进去，又用它日常支出，账户里的钱难以区分，将来举证困难，就容易被认为发生了混同。做法很简单：婚前存款放在单独的账户，不混用，保存开户和转入的记录。<\/p>\n<p><strong>误会二：房子是我婚前买的，整套都是我的。<\/strong> 房产登记在你名下，通常归你。但婚后用共同财产偿还的贷款，以及对应的增值，离婚时需要向另一方补偿，见 <a href=\"#/e/060\">第 060 条<\/a>。<\/p>\n<p><strong>误会三：对方没有收入，就不能分我的工资。<\/strong> 法定共同财产制，不看谁赚得多。婚后收入就是共同财产；法院分割时，还会考虑对家庭的贡献，包括家务劳动，见 <a href=\"#/e/076\">第 076 条<\/a>。<\/p>\n<p>不要在发生纠纷之后，才开始\"区分\"。那时已经晚了。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1063 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 78 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；混同的具体认定是 B。<\/p>", "text": "三个最常见的误会：婚前存款、婚前房子、不上班的另一半 \n 三个误会，每一个都可能让你少拿或者多赔几十万。\n\n小施有三个想法：我婚前的 50 万存款，永远是我的；我婚前买的房，整套都是我的；妻子没工作，不能分我的工资。这三个想法，每一个都有问题。\n\n误会一：婚前存款永远是我的。 存款本身是婚前财产，属于个人。但是婚后工资、奖金继续存进去，又用它日常支出，账户里的钱难以区分，将来举证困难，就容易被认为发生了混同。做法很简单：婚前存款放在单独的账户，不混用，保存开户和转入的记录。\n\n误会二：房子是我婚前买的，整套都是我的。 房产登记在你名下，通常归你。但婚后用共同财产偿还的贷款，以及对应的增值，离婚时需要向另一方补偿，见 第 060 条。\n\n误会三：对方没有收入，就不能分我的工资。 法定共同财产制，不看谁赚得多。婚后收入就是共同财产；法院分割时，还会考虑对家庭的贡献，包括家务劳动，见 第 076 条。\n\n不要在发生纠纷之后，才开始\"区分\"。那时已经晚了。\n\n法律依据：《民法典》第 1062 条、第 1063 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 78 条。\n\n把握度：A｜规则明确；混同的具体认定是 B。\n\n"}, {"num": "059", "title": "不签协议，也能护住自己的钱：账户这样分", "grade": "C", "lead": "分开放，不是防着谁，是留证据。", "html": "<blockquote>分开放，不是防着谁，是留证据。<\/blockquote>\n<p>小章婚前有 40 万存款。婚后他开了一个\"个人账户\"，只放这 40 万和它的利息；另开一个\"共同账户\"，放工资和家庭开销。三年后离婚，流水清晰，他很容易证明那 40 万和利息是自己的。<\/p>\n<p>不想签协议，也可以通过日常习惯，保留区分个人财产和共同财产的证据。<\/p>\n<p>第一，开一个\"个人账户\"，存放婚前财产、个人收到的赠与、继承，不要往里放婚后工资。第二，开一个\"共同账户\"，放婚后收入和日常支出。第三，婚前房产的婚后还贷，想主张是用个人财产还的，用个人账户支付，并保留流水。第四，大额转账，备注写明用途和资金来源。第五，父母给你的钱，转账备注写\"赠与我个人\"，并请父母出具书面说明，见 <a href=\"#/e/061\">第 061 条<\/a>。第六，不要轻易把婚前房产加上对方名字，见 <a href=\"#/e/062\">第 062 条<\/a>。<\/p>\n<p>这些做法的前提，是日常生活里自觉、持续、真实地操作。<\/p>\n<p>另外要警惕一件事：不要在婚姻出现危机时，突然把钱转到别人名下。这样的转移，法律上会被认定为隐藏、转移夫妻共同财产，分割时可能少分或不分，见 <a href=\"#/e/103\">第 103 条<\/a>。管理的重点，是\"区分\"，不是\"藏\"。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1063 条、第 1092 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "不签协议，也能护住自己的钱：账户这样分 \n 分开放，不是防着谁，是留证据。\n\n小章婚前有 40 万存款。婚后他开了一个\"个人账户\"，只放这 40 万和它的利息；另开一个\"共同账户\"，放工资和家庭开销。三年后离婚，流水清晰，他很容易证明那 40 万和利息是自己的。\n\n不想签协议，也可以通过日常习惯，保留区分个人财产和共同财产的证据。\n\n第一，开一个\"个人账户\"，存放婚前财产、个人收到的赠与、继承，不要往里放婚后工资。第二，开一个\"共同账户\"，放婚后收入和日常支出。第三，婚前房产的婚后还贷，想主张是用个人财产还的，用个人账户支付，并保留流水。第四，大额转账，备注写明用途和资金来源。第五，父母给你的钱，转账备注写\"赠与我个人\"，并请父母出具书面说明，见 第 061 条。第六，不要轻易把婚前房产加上对方名字，见 第 062 条。\n\n这些做法的前提，是日常生活里自觉、持续、真实地操作。\n\n另外要警惕一件事：不要在婚姻出现危机时，突然把钱转到别人名下。这样的转移，法律上会被认定为隐藏、转移夫妻共同财产，分割时可能少分或不分，见 第 103 条。管理的重点，是\"区分\"，不是\"藏\"。\n\n法律依据：《民法典》第 1062 条、第 1063 条、第 1092 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "060", "title": "婚前付首付、婚后一起还贷：离婚时这套房怎么算", "grade": "A", "lead": "房子通常归登记的一方，但婚后用共同财产还的贷款，以及对应的增值，要向对方补偿。", "html": "<blockquote>房子通常归登记的一方，但婚后用共同财产还的贷款，以及对应的增值，要向对方补偿。<\/blockquote>\n<p>小林婚前买房，总价 100 万，首付 30 万（他个人出），贷款 70 万。婚后夫妻共同还了 20 万本金。离婚时房子市价 150 万。房子归小林，他需要补偿对方 15 万。<\/p>\n<p>这个数是怎么来的？<\/p>\n<p>先看规则。《婚姻家庭编解释（一）》第 78 条规定：夫妻一方婚前签订不动产买卖合同，以个人财产支付首付款并向银行贷款，婚后用夫妻共同财产还贷，不动产登记在首付款支付方名下的，离婚时，由双方协议处理；协议不成，法院可以判决房产归登记一方，尚未归还的贷款，为登记一方的个人债务；双方婚后共同还贷支付的款项，及其对应的财产增值部分，由登记一方对另一方进行补偿。<\/p>\n<p>补偿金额，<strong>没有全国统一的公式<\/strong>。实务里常见的思路是：<\/p>\n<p>共同还贷对应的价值 = 婚后共同偿还的贷款本金 ÷ 购房总价 × 离婚时的房屋市场价；补偿给对方的金额，通常是这个数的一半。<\/p>\n<p>小林的算法：20 ÷ 100 × 150 = 30 万，补偿 30 ÷ 2 = 15 万。网页版有这个计算器，可以改成自己的数字。<\/p>\n<p>要提醒的是：贷款利息要不要计入、装修款算不算购房总价、增值怎么确定，各地法院的做法不同。这里的\"增值\"，一般是指整个房屋的市场价格，相对购买价的上涨，需要评估确定。上面的公式是常见思路，不是法定公式。<\/p>\n<p>怎么预防？在婚前协议里，写明这套房子婚后还贷的资金来源，以及离婚时的处理办法，见 <a href=\"#/e/053\">第 053 条<\/a>。房子是你的，贷款是一起还的。这中间的钱，要算。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 78 条；《民法典》第 1087 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；公式与口径是 B。<\/p>", "text": "婚前付首付、婚后一起还贷：离婚时这套房怎么算 \n 房子通常归登记的一方，但婚后用共同财产还的贷款，以及对应的增值，要向对方补偿。\n\n小林婚前买房，总价 100 万，首付 30 万（他个人出），贷款 70 万。婚后夫妻共同还了 20 万本金。离婚时房子市价 150 万。房子归小林，他需要补偿对方 15 万。\n\n这个数是怎么来的？\n\n先看规则。《婚姻家庭编解释（一）》第 78 条规定：夫妻一方婚前签订不动产买卖合同，以个人财产支付首付款并向银行贷款，婚后用夫妻共同财产还贷，不动产登记在首付款支付方名下的，离婚时，由双方协议处理；协议不成，法院可以判决房产归登记一方，尚未归还的贷款，为登记一方的个人债务；双方婚后共同还贷支付的款项，及其对应的财产增值部分，由登记一方对另一方进行补偿。\n\n补偿金额，没有全国统一的公式。实务里常见的思路是：\n\n共同还贷对应的价值 = 婚后共同偿还的贷款本金 ÷ 购房总价 × 离婚时的房屋市场价；补偿给对方的金额，通常是这个数的一半。\n\n小林的算法：20 ÷ 100 × 150 = 30 万，补偿 30 ÷ 2 = 15 万。网页版有这个计算器，可以改成自己的数字。\n\n要提醒的是：贷款利息要不要计入、装修款算不算购房总价、增值怎么确定，各地法院的做法不同。这里的\"增值\"，一般是指整个房屋的市场价格，相对购买价的上涨，需要评估确定。上面的公式是常见思路，不是法定公式。\n\n怎么预防？在婚前协议里，写明这套房子婚后还贷的资金来源，以及离婚时的处理办法，见 第 053 条。房子是你的，贷款是一起还的。这中间的钱，要算。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 78 条；《民法典》第 1087 条。\n\n把握度：A｜规则明确；公式与口径是 B。\n\n"}, {"num": "061", "title": "爸妈出钱买房，算谁的", "grade": "A", "lead": "婚前父母出资，一般是给自己孩子的赠与；婚后出资，先看赠与合同怎么写，没写清楚，法院会综合判断。", "html": "<blockquote>婚前父母出资，一般是给自己孩子的赠与；婚后出资，先看赠与合同怎么写，没写清楚，法院会综合判断。<\/blockquote>\n<p>小苏的父母在婚后出了 60 万给小夫妻买房，登记在两人名下，没写\"只给小苏\"。离婚时，对方说\"房子是我们俩的\"。如果当初父母写了一份\"只赠与自己儿子\"的书面说明，局面完全不同。<\/p>\n<p>父母出钱，是给谁？这是赠与的意思表示问题。法律的态度分两段。<\/p>\n<p><strong>婚前<\/strong>：父母为子女购房出资，一般认定为对自己子女个人的赠与，但父母明确表示赠与双方的除外（《婚姻家庭编解释（一）》第 29 条）。<\/p>\n<p><strong>婚后<\/strong>：《婚姻家庭编解释（二）》第 8 条规定，婚姻关系存续期间，夫妻购置房屋由一方父母全额出资的，如果赠与合同明确约定只赠与自己子女一方，按约定处理；没有约定或约定不明确的，离婚分割夫妻共同财产时，法院可以判决房屋归出资人的子女，并综合考虑共同生活及孕育共同子女情况、离婚过错、对家庭的贡献大小、房屋市场价格等因素，决定是否补偿另一方、补偿多少。一方父母部分出资，或双方父母都出资的，法院可以以出资来源及比例为基础，综合考虑上述因素，判决房屋归一方，并由获得房屋的一方，对另一方予以合理补偿。<\/p>\n<p>最高人民法院 2025 年 1 月公布的一个案例：男方父母在儿子结婚前全款买了一套房，婚后又把房子登记到小两口两个人名下。结婚时间短、没有孩子，房子价值 30 万元，法院认为，父母是为了支持小夫妻共同生活而赠与，仍判房子归男方，由男方补偿女方 7 万元。见附录 O 案例 O-11。<\/p>\n<p>怎么做？父母出资，转账备注写\"赠与 ××（自己子女）个人\"；签一份书面的赠与合同，写清\"只赠与自己子女一方\"；保存转账记录和赠与合同。<\/p>\n<p><strong>可以这样写<\/strong>（父母的赠与说明）：<\/p>\n<ul><li>\"我们夫妻二人，于 ×× 年 × 月 × 日，向儿子 ××× 转账 60 万元，用于购买位于 ×× 的房屋。该笔款项系我们对儿子 ××× 个人的赠与，不属于其夫妻共同财产。\"（签字、日期）\n<\/li><\/ul>\n<p>要提醒的是，不要等到离婚时才补写赠与说明，转账当时，就要有清晰的意思表示。另外，解释（一）第 29 条第二款对婚后出资倾向于视为对夫妻双方的赠与，与解释（二）第 8 条如何衔接，官方没有作出说明，以最新官方文本和所在地法院的做法为准（待核实）。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 29 条（婚前出资）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 8 条（婚后出资）。解释（一）第 29 条第二款（婚后出资，\"依照约定处理；没有约定或者约定不明确的，按照民法典第 1062 条第 1 款第 4 项的原则处理\"，也就是倾向视为对夫妻双方的赠与）与解释（二）第 8 条（婚后出资，没有约定时法院可判房屋归出资人子女并补偿）如何衔接，官方没有作出说明，以最新官方文本和所在地法院的做法为准（待核实）。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；补偿金额是 B。<\/p>", "text": "爸妈出钱买房，算谁的 \n 婚前父母出资，一般是给自己孩子的赠与；婚后出资，先看赠与合同怎么写，没写清楚，法院会综合判断。\n\n小苏的父母在婚后出了 60 万给小夫妻买房，登记在两人名下，没写\"只给小苏\"。离婚时，对方说\"房子是我们俩的\"。如果当初父母写了一份\"只赠与自己儿子\"的书面说明，局面完全不同。\n\n父母出钱，是给谁？这是赠与的意思表示问题。法律的态度分两段。\n\n婚前：父母为子女购房出资，一般认定为对自己子女个人的赠与，但父母明确表示赠与双方的除外（《婚姻家庭编解释（一）》第 29 条）。\n\n婚后：《婚姻家庭编解释（二）》第 8 条规定，婚姻关系存续期间，夫妻购置房屋由一方父母全额出资的，如果赠与合同明确约定只赠与自己子女一方，按约定处理；没有约定或约定不明确的，离婚分割夫妻共同财产时，法院可以判决房屋归出资人的子女，并综合考虑共同生活及孕育共同子女情况、离婚过错、对家庭的贡献大小、房屋市场价格等因素，决定是否补偿另一方、补偿多少。一方父母部分出资，或双方父母都出资的，法院可以以出资来源及比例为基础，综合考虑上述因素，判决房屋归一方，并由获得房屋的一方，对另一方予以合理补偿。\n\n最高人民法院 2025 年 1 月公布的一个案例：男方父母在儿子结婚前全款买了一套房，婚后又把房子登记到小两口两个人名下。结婚时间短、没有孩子，房子价值 30 万元，法院认为，父母是为了支持小夫妻共同生活而赠与，仍判房子归男方，由男方补偿女方 7 万元。见附录 O 案例 O11。\n\n怎么做？父母出资，转账备注写\"赠与 ××（自己子女）个人\"；签一份书面的赠与合同，写清\"只赠与自己子女一方\"；保存转账记录和赠与合同。\n\n可以这样写（父母的赠与说明）：\n\n \"我们夫妻二人，于 ×× 年 × 月 × 日，向儿子 ××× 转账 60 万元，用于购买位于 ×× 的房屋。该笔款项系我们对儿子 ××× 个人的赠与，不属于其夫妻共同财产。\"（签字、日期）\n\n要提醒的是，不要等到离婚时才补写赠与说明，转账当时，就要有清晰的意思表示。另外，解释（一）第 29 条第二款对婚后出资倾向于视为对夫妻双方的赠与，与解释（二）第 8 条如何衔接，官方没有作出说明，以最新官方文本和所在地法院的做法为准（待核实）。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 29 条（婚前出资）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 8 条（婚后出资）。解释（一）第 29 条第二款（婚后出资，\"依照约定处理；没有约定或者约定不明确的，按照民法典第 1062 条第 1 款第 4 项的原则处理\"，也就是倾向视为对夫妻双方的赠与）与解释（二）第 8 条（婚后出资，没有约定时法院可判房屋归出资人子女并补偿）如何衔接，官方没有作出说明，以最新官方文本和所在地法院的做法为准（待核实）。\n\n把握度：A｜规则明确；补偿金额是 B。\n\n"}, {"num": "062", "title": "房产证上加个名字：一念之间，几十万的事", "grade": "A", "lead": "把对方的名字加到你的房产证上，等于赠与。没办完登记之前还能撤，办完之后很难。", "html": "<blockquote>把对方的名字加到你的房产证上，等于赠与。没办完登记之前还能撤，办完之后很难。<\/blockquote>\n<p>婚后一个月，为了表示诚意，小黎把婚前全款买的房，加了妻子的名字。婚姻持续了两年就结束了。他以为\"这房子是我婚前买的，大部分应该归我\"，但法院要考虑加名之后的情形。<\/p>\n<p>最高人民法院 2025 年 1 月公布的案例：男方婚前买的房子，婚后一个月把妻子的名字加上了房产证。双方估价都在 600 万元左右，妻子在离婚时主张 250 万元，男方只愿意给 100 万元。法院判房子归男方，由男方补偿妻子 120 万元。见附录 O 案例 O-10。<\/p>\n<p>这里面的规则是：<\/p>\n<p><strong>赠与，登记之前能撤。<\/strong> 将房产赠与配偶，在办理变更登记之前，赠与人原则上可以撤销赠与（经过公证的除外，《民法典》第 658 条）。<\/p>\n<p><strong>登记之后，很难撤。<\/strong> 已经办完变更登记，赠与完成，不能随意撤销。只有在法定情形下才可以：受赠人严重侵害赠与人或赠与人近亲属的合法权益；受赠人对赠与人有扶养义务而不履行；受赠人不履行赠与合同约定的义务（第 663 条）。撤销权要在知道或应当知道撤销事由之日起一年内行使。<\/p>\n<p><strong>有约定但没登记。<\/strong> 离婚时，法院可以根据赠与目的等因素，判决房屋归其中一方，并判决给予补偿；婚姻关系存续时间较短、给予方没有重大过错的，可以判决房屋归给予方（《婚姻家庭编解释（二）》第 5 条）。<\/p>\n<p>所以不要因为一时感动，或关系压力，就轻易加名。要加，先书面写清楚。如果是为了贷款、购房资格，临时加名，写一份书面说明。口头说\"只是临时加个名字\"，没有书面材料，几乎无法举证。加名是一念之间，撤名是一场官司。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 658 条、第 663 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 32 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 5 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确；补偿金额是 B。<\/p>", "text": "房产证上加个名字：一念之间，几十万的事 \n 把对方的名字加到你的房产证上，等于赠与。没办完登记之前还能撤，办完之后很难。\n\n婚后一个月，为了表示诚意，小黎把婚前全款买的房，加了妻子的名字。婚姻持续了两年就结束了。他以为\"这房子是我婚前买的，大部分应该归我\"，但法院要考虑加名之后的情形。\n\n最高人民法院 2025 年 1 月公布的案例：男方婚前买的房子，婚后一个月把妻子的名字加上了房产证。双方估价都在 600 万元左右，妻子在离婚时主张 250 万元，男方只愿意给 100 万元。法院判房子归男方，由男方补偿妻子 120 万元。见附录 O 案例 O10。\n\n这里面的规则是：\n\n赠与，登记之前能撤。 将房产赠与配偶，在办理变更登记之前，赠与人原则上可以撤销赠与（经过公证的除外，《民法典》第 658 条）。\n\n登记之后，很难撤。 已经办完变更登记，赠与完成，不能随意撤销。只有在法定情形下才可以：受赠人严重侵害赠与人或赠与人近亲属的合法权益；受赠人对赠与人有扶养义务而不履行；受赠人不履行赠与合同约定的义务（第 663 条）。撤销权要在知道或应当知道撤销事由之日起一年内行使。\n\n有约定但没登记。 离婚时，法院可以根据赠与目的等因素，判决房屋归其中一方，并判决给予补偿；婚姻关系存续时间较短、给予方没有重大过错的，可以判决房屋归给予方（《婚姻家庭编解释（二）》第 5 条）。\n\n所以不要因为一时感动，或关系压力，就轻易加名。要加，先书面写清楚。如果是为了贷款、购房资格，临时加名，写一份书面说明。口头说\"只是临时加个名字\"，没有书面材料，几乎无法举证。加名是一念之间，撤名是一场官司。\n\n法律依据：《民法典》第 658 条、第 663 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 32 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 5 条。\n\n把握度：A｜法条明确；补偿金额是 B。\n\n"}, {"num": "063", "title": "另一半偷偷卖房、转钱：追得回来吗", "grade": "A", "lead": "对方擅自处分共同的房子，如果买家是善意的、付了合理价款、已登记，通常追不回房子，但可以向对方主张赔偿。", "html": "<blockquote>对方擅自处分共同的房子，如果买家是善意的、付了合理价款、已登记，通常追不回房子，但可以向对方主张赔偿。<\/blockquote>\n<p>小骆的妻子趁他出差，以个人名义把共同的房子卖了。买家不知情，付了市价，也过了户。小骆回来才发现，房子已经不是他们的了。他只能在离婚时，向妻子主张赔偿。<\/p>\n<p>这是因为，法律保护善意的第三人，是为了交易安全：买家看的是登记，不应该为你们夫妻的内部矛盾买单（《民法典》第 311 条；《婚姻家庭编解释（一）》第 28 条）。所以追回房子难，追赔偿相对可行。<\/p>\n<p>股权也一样：一方用共同财产购买、登记在自己名下的有限责任公司股权，转让时，不能仅因为没有经另一方同意，就认定转让无效，但有证据证明转让人与受让人恶意串通的除外（《婚姻家庭编解释（二）》第 9 条）。<\/p>\n<p>但有一种情形，是可以追回的：<strong>赠与第三者<\/strong>。一方与重婚、同居、婚外情有关，擅自把夫妻共同财产送给第三人，或者明显低价转让的，另一方可以主张这个行为违背公序良俗而无效（第 7 条）。<\/p>\n<p>最高人民法院 2025 年 1 月公布的案例：丈夫在婚内与第三者交往，先后把夫妻共同财产 73 万元转给对方，对方后来退回 17 万元。妻子起诉要回全部。法院认定这些转账因违背公序良俗而无效，对方应当返还实际收到的款项，不能以\"已经花掉了\"为由免责。见附录 O 案例 O-13。<\/p>\n<p>怎么预防？定期核对房产、车辆的登记信息；发现对方有出售迹象，尽快沟通，必要时通过律师评估是否可以申请保全，见 <a href=\"#/e/102\">第 102 条<\/a>；家庭重大财产，夫妻共同签字，留存。<\/p>\n<p>另外，夫妻一方因家庭日常生活需要实施的民事法律行为，对夫妻双方发生效力；夫妻之间对一方可实施的民事行为范围的限制，不能对抗善意相对人（《民法典》第 1060 条）。<\/p>\n<p>房子一旦被善意的买家买走，就很难要回来。预防，比追回便宜得多。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 311 条（善意取得）、第 1060 条（日常家事代理）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 28 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 7 条、第 9 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "另一半偷偷卖房、转钱：追得回来吗 \n 对方擅自处分共同的房子，如果买家是善意的、付了合理价款、已登记，通常追不回房子，但可以向对方主张赔偿。\n\n小骆的妻子趁他出差，以个人名义把共同的房子卖了。买家不知情，付了市价，也过了户。小骆回来才发现，房子已经不是他们的了。他只能在离婚时，向妻子主张赔偿。\n\n这是因为，法律保护善意的第三人，是为了交易安全：买家看的是登记，不应该为你们夫妻的内部矛盾买单（《民法典》第 311 条；《婚姻家庭编解释（一）》第 28 条）。所以追回房子难，追赔偿相对可行。\n\n股权也一样：一方用共同财产购买、登记在自己名下的有限责任公司股权，转让时，不能仅因为没有经另一方同意，就认定转让无效，但有证据证明转让人与受让人恶意串通的除外（《婚姻家庭编解释（二）》第 9 条）。\n\n但有一种情形，是可以追回的：赠与第三者。一方与重婚、同居、婚外情有关，擅自把夫妻共同财产送给第三人，或者明显低价转让的，另一方可以主张这个行为违背公序良俗而无效（第 7 条）。\n\n最高人民法院 2025 年 1 月公布的案例：丈夫在婚内与第三者交往，先后把夫妻共同财产 73 万元转给对方，对方后来退回 17 万元。妻子起诉要回全部。法院认定这些转账因违背公序良俗而无效，对方应当返还实际收到的款项，不能以\"已经花掉了\"为由免责。见附录 O 案例 O13。\n\n怎么预防？定期核对房产、车辆的登记信息；发现对方有出售迹象，尽快沟通，必要时通过律师评估是否可以申请保全，见 第 102 条；家庭重大财产，夫妻共同签字，留存。\n\n另外，夫妻一方因家庭日常生活需要实施的民事法律行为，对夫妻双方发生效力；夫妻之间对一方可实施的民事行为范围的限制，不能对抗善意相对人（《民法典》第 1060 条）。\n\n房子一旦被善意的买家买走，就很难要回来。预防，比追回便宜得多。\n\n法律依据：《民法典》第 311 条（善意取得）、第 1060 条（日常家事代理）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 28 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 7 条、第 9 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "064", "title": "创业者离婚，公司会被分走一半吗", "grade": "B", "lead": "离婚分的是股权的价值，不是直接拆公司。公司和家要分账。账不分，官司就不会分。", "html": "<blockquote>离婚分的是股权的价值，不是直接拆公司。公司和家要分账。账不分，官司就不会分。<\/blockquote>\n<p>小匡有一家公司，他个人占股 60%，是婚后出资（用了夫妻共同财产）。离婚时，法院不会把公司一分为二，而是评估他的股权价值，再决定他是留股权补偿对方，还是对方拿折价款。<\/p>\n<p>创业者最怕的，是\"公司被分走一半\"。其实要分清几件事：<\/p>\n<p><strong>婚前取得的股权<\/strong>，股权本身是个人财产。婚后的分红，一般属于夫妻共同财产。股权的增值，要区分是市场自然增值，还是经营劳动带来的，各地认定标准有差异。<\/p>\n<p><strong>婚后取得的股权<\/strong>，用夫妻共同财产出资的，一般是夫妻共同财产。<\/p>\n<p><strong>离婚时<\/strong>，一般不是直接拆分公司，而是分割股权价值，或者由一方拿股权，向另一方折价补偿。有限责任公司的股权，涉及其他股东的优先购买权（《公司法》第 84 条），配偶不一定能直接成为股东。夫妻都是股东、对股权份额没有明确约定的，不能只按公司登记的出资额或章程来分，由法院依据夫妻共同财产分割的规则处理（《婚姻家庭编解释（二）》第 10 条）。<\/p>\n<p><strong>公司债务和家庭财产<\/strong>，是另一个坑：公司和股东个人财产要分开，账户分开；个人为公司借款、贷款提供担保的，要特别谨慎，担保责任是个人的，可能连带牵涉夫妻共同财产；一人有限公司的股东，如果不能证明公司财产独立于个人财产，要对公司债务承担连带责任（《公司法》第 23 条）。<\/p>\n<p>怎么预防？婚前协议或婚内协议里，写明股权的归属、分红的处理、离婚时的估值方式。股权的估值，是离婚案件里争议最大的部分，要提前准备好财务资料。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 26 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 9 条、第 10 条；《公司法》（2023 年修订，自 2024 年 7 月 1 日起施行）第 23 条、第 84 条。<\/p>\n<p><strong>把握度<\/strong>：B｜各地口径有差异。<\/p>", "text": "创业者离婚，公司会被分走一半吗 \n 离婚分的是股权的价值，不是直接拆公司。公司和家要分账。账不分，官司就不会分。\n\n小匡有一家公司，他个人占股 60%，是婚后出资（用了夫妻共同财产）。离婚时，法院不会把公司一分为二，而是评估他的股权价值，再决定他是留股权补偿对方，还是对方拿折价款。\n\n创业者最怕的，是\"公司被分走一半\"。其实要分清几件事：\n\n婚前取得的股权，股权本身是个人财产。婚后的分红，一般属于夫妻共同财产。股权的增值，要区分是市场自然增值，还是经营劳动带来的，各地认定标准有差异。\n\n婚后取得的股权，用夫妻共同财产出资的，一般是夫妻共同财产。\n\n离婚时，一般不是直接拆分公司，而是分割股权价值，或者由一方拿股权，向另一方折价补偿。有限责任公司的股权，涉及其他股东的优先购买权（《公司法》第 84 条），配偶不一定能直接成为股东。夫妻都是股东、对股权份额没有明确约定的，不能只按公司登记的出资额或章程来分，由法院依据夫妻共同财产分割的规则处理（《婚姻家庭编解释（二）》第 10 条）。\n\n公司债务和家庭财产，是另一个坑：公司和股东个人财产要分开，账户分开；个人为公司借款、贷款提供担保的，要特别谨慎，担保责任是个人的，可能连带牵涉夫妻共同财产；一人有限公司的股东，如果不能证明公司财产独立于个人财产，要对公司债务承担连带责任（《公司法》第 23 条）。\n\n怎么预防？婚前协议或婚内协议里，写明股权的归属、分红的处理、离婚时的估值方式。股权的估值，是离婚案件里争议最大的部分，要提前准备好财务资料。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 26 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 9 条、第 10 条；《公司法》（2023 年修订，自 2024 年 7 月 1 日起施行）第 23 条、第 84 条。\n\n把握度：B｜各地口径有差异。\n\n"}, {"num": "065", "title": "基金、股票、保险、公积金、养老金：离婚时怎么分", "grade": "B", "lead": "看买的时间和用的钱。婚后用共同财产买的，通常是共同的；婚前个人资金买的，通常是个人的。", "html": "<blockquote>看买的时间和用的钱。婚后用共同财产买的，通常是共同的；婚前个人资金买的，通常是个人的。<\/blockquote>\n<p>小潘的股票账户里，一部分是婚前买的，一部分是婚后用工资买的，中间还有多次买进卖出。离婚时，他才发现：要区分婚前部分和婚后部分，得整理几年的交易记录。<\/p>\n<p><strong>股票、基金、理财<\/strong>：婚后用共同财产购买的，是夫妻共同财产；婚前个人资金购买的，是个人财产，其自然增值归个人，但婚后投资经营的收益，一般是共同的。<\/p>\n<p><strong>保险<\/strong>：保险合同的投保人、被保险人、受益人，有不同的权利。婚后以夫妻共同财产缴纳的保费，对应的现金价值，实务中一般按共同财产处理。具体处理方式，各地有差异，待核实。<\/p>\n<p><strong>住房公积金<\/strong>：婚后缴存的部分，实务中一般属于夫妻共同财产。分割方式、提取条件，各地有差异，待核实。<\/p>\n<p><strong>养老金<\/strong>：未退休、不符合领取条件的，离婚时对养老保险金账户的分割，实务做法有限制，具体要以所在地法院的口径为准，待核实。<\/p>\n<p><strong>虚拟货币、数字资产<\/strong>：法律上的认定尚不统一，实务中存在差异，建议咨询律师。<\/p>\n<p>离婚之前，列一张金融资产清单：账户、购买时间、资金来源、当前价值，见附录 N。越复杂的资产，越要从婚前就开始留记录。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1063 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 25 条、第 26 条、第 80 条。<\/p>\n<p><strong>把握度<\/strong>：B｜各地口径有差异。<\/p>", "text": "基金、股票、保险、公积金、养老金：离婚时怎么分 \n 看买的时间和用的钱。婚后用共同财产买的，通常是共同的；婚前个人资金买的，通常是个人的。\n\n小潘的股票账户里，一部分是婚前买的，一部分是婚后用工资买的，中间还有多次买进卖出。离婚时，他才发现：要区分婚前部分和婚后部分，得整理几年的交易记录。\n\n股票、基金、理财：婚后用共同财产购买的，是夫妻共同财产；婚前个人资金购买的，是个人财产，其自然增值归个人，但婚后投资经营的收益，一般是共同的。\n\n保险：保险合同的投保人、被保险人、受益人，有不同的权利。婚后以夫妻共同财产缴纳的保费，对应的现金价值，实务中一般按共同财产处理。具体处理方式，各地有差异，待核实。\n\n住房公积金：婚后缴存的部分，实务中一般属于夫妻共同财产。分割方式、提取条件，各地有差异，待核实。\n\n养老金：未退休、不符合领取条件的，离婚时对养老保险金账户的分割，实务做法有限制，具体要以所在地法院的口径为准，待核实。\n\n虚拟货币、数字资产：法律上的认定尚不统一，实务中存在差异，建议咨询律师。\n\n离婚之前，列一张金融资产清单：账户、购买时间、资金来源、当前价值，见附录 N。越复杂的资产，越要从婚前就开始留记录。\n\n法律依据：《民法典》第 1062 条、第 1063 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 25 条、第 26 条、第 80 条。\n\n把握度：B｜各地口径有差异。\n\n"}, {"num": "066", "title": "对方借的钱，什么时候轮到你还", "grade": "A", "lead": "共同签字的、事后追认的、用于家庭日常生活的，是共同债务。超出日常需要的，债权人要证明用于共同生活。", "html": "<blockquote>共同签字的、事后追认的、用于家庭日常生活的，是共同债务。超出日常需要的，债权人要证明用于共同生活。<\/blockquote>\n<p>小方的妻子以个人名义向朋友借了 50 万，说是\"周转\"。后来还不上，朋友起诉要求夫妻共同偿还。小方不知情，没有签字。债权人要证明：这笔钱用于夫妻共同生活或共同经营，或者小方有共同的意思表示。<\/p>\n<p>夫妻债务是\"共同生活的成本\"，所以用于家庭日常的，双方都要负责；超出日常的，不能让不知情的一方，背上巨额债务。《民法典》第 1064 条的规定是：<\/p>\n<p><strong>共同债务<\/strong>：夫妻共同签名，或者一方事后追认的债务；夫妻一方在婚姻存续期间，以个人名义，为家庭日常生活需要所负的债务。<\/p>\n<p><strong>不一定是共同债务<\/strong>：夫妻一方以个人名义，超出家庭日常生活需要所负的债务，不属于夫妻共同债务，除非债权人能证明该债务用于夫妻共同生活、共同生产经营，或者基于夫妻双方共同意思表示。<\/p>\n<p><strong>一般不支持<\/strong>：一方与第三人恶意串通，虚构债务；赌博、吸毒等违法犯罪活动所负的债务（《婚姻家庭编解释（一）》第 33 条至第 34 条）。<\/p>\n<p>另外要注意两点。第一，<strong>离婚协议、判决对债务的分配，不影响债权人<\/strong>，债权人仍然可以主张夫妻共同债务，由任何一方清偿，清偿后，可以向对方追偿（第 35 条）。第二，单方面发\"不承担该债务的声明\"，对债权人通常没有约束力，除非债权人明知。<\/p>\n<p>怎么判断？可以走这几步：这笔债是婚前还是婚后借的？婚前的，原则上是个人债务；是共同签字或事后追认的吗？是，就是共同债务；是不是用于家庭日常（吃穿、孩子教育、医疗）？是，共同债务；金额大、超出日常需要？债权人要证明用于共同生活或共同经营；涉及赌博、非法活动？一般不支持。<\/p>\n<p>你没签字、不知情的大额债务，债权人要证明是用在这个家里，别急着认下。但也别装不知道。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1064 条、第 1089 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 33 条至第 36 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "对方借的钱，什么时候轮到你还 \n 共同签字的、事后追认的、用于家庭日常生活的，是共同债务。超出日常需要的，债权人要证明用于共同生活。\n\n小方的妻子以个人名义向朋友借了 50 万，说是\"周转\"。后来还不上，朋友起诉要求夫妻共同偿还。小方不知情，没有签字。债权人要证明：这笔钱用于夫妻共同生活或共同经营，或者小方有共同的意思表示。\n\n夫妻债务是\"共同生活的成本\"，所以用于家庭日常的，双方都要负责；超出日常的，不能让不知情的一方，背上巨额债务。《民法典》第 1064 条的规定是：\n\n共同债务：夫妻共同签名，或者一方事后追认的债务；夫妻一方在婚姻存续期间，以个人名义，为家庭日常生活需要所负的债务。\n\n不一定是共同债务：夫妻一方以个人名义，超出家庭日常生活需要所负的债务，不属于夫妻共同债务，除非债权人能证明该债务用于夫妻共同生活、共同生产经营，或者基于夫妻双方共同意思表示。\n\n一般不支持：一方与第三人恶意串通，虚构债务；赌博、吸毒等违法犯罪活动所负的债务（《婚姻家庭编解释（一）》第 33 条至第 34 条）。\n\n另外要注意两点。第一，离婚协议、判决对债务的分配，不影响债权人，债权人仍然可以主张夫妻共同债务，由任何一方清偿，清偿后，可以向对方追偿（第 35 条）。第二，单方面发\"不承担该债务的声明\"，对债权人通常没有约束力，除非债权人明知。\n\n怎么判断？可以走这几步：这笔债是婚前还是婚后借的？婚前的，原则上是个人债务；是共同签字或事后追认的吗？是，就是共同债务；是不是用于家庭日常（吃穿、孩子教育、医疗）？是，共同债务；金额大、超出日常需要？债权人要证明用于共同生活或共同经营；涉及赌博、非法活动？一般不支持。\n\n你没签字、不知情的大额债务，债权人要证明是用在这个家里，别急着认下。但也别装不知道。\n\n法律依据：《民法典》第 1064 条、第 1089 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 33 条至第 36 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "067", "title": "直播打赏、赌博、乱花钱：另一半怎么办", "grade": "A", "lead": "一方大额挥霍夫妻共同财产，另一方可以主张提前分割，或者离婚时少分。", "html": "<blockquote>一方大额挥霍夫妻共同财产，另一方可以主张提前分割，或者离婚时少分。<\/blockquote>\n<p>小雷的丈夫每月在直播平台打赏几万元，一年下来 40 多万，家庭年收入总共也就 30 万。她想知道，这算不算\"挥霍\"，能不能主张分割。<\/p>\n<p>《婚姻家庭编解释（二）》第 6 条给出了答案：未经另一方同意，用夫妻共同财产在网络直播平台实施打赏，数额明显超出家庭一般消费水平，严重损害夫妻共同财产利益的，可以认定为\"挥霍\"。<\/p>\n<p>怎么主张？婚姻存续期间，可以请求分割共同财产（婚内分割，《民法典》第 1066 条，理由包括一方隐藏、转移、变卖、毁损、挥霍夫妻共同财产）；离婚时，可以请求对挥霍的一方少分或不分（第 1092 条）。<\/p>\n<p>证据要备哪些？平台的充值、打赏记录；银行、支付软件的流水；平台出具的消费记录（可以通过法院调取）；聊天记录、对方承认的内容。<\/p>\n<p>要注意金额的相对性：要与家庭收入、一般消费水平对比。小额的娱乐消费，一般不构成挥霍。要同时证明\"未经同意\"\"明显超出家庭一般消费水平\"\"严重损害共同财产\"三点，缺一都可能不被认定。至于能不能向平台追回已打赏的款项，各地认定不一，建议先咨询律师。<\/p>\n<p>败家是一回事，败\"共同的家\"，是另一回事。法律管的是后者。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1066 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 6 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；金额标准是 B。<\/p>", "text": "直播打赏、赌博、乱花钱：另一半怎么办 \n 一方大额挥霍夫妻共同财产，另一方可以主张提前分割，或者离婚时少分。\n\n小雷的丈夫每月在直播平台打赏几万元，一年下来 40 多万，家庭年收入总共也就 30 万。她想知道，这算不算\"挥霍\"，能不能主张分割。\n\n《婚姻家庭编解释（二）》第 6 条给出了答案：未经另一方同意，用夫妻共同财产在网络直播平台实施打赏，数额明显超出家庭一般消费水平，严重损害夫妻共同财产利益的，可以认定为\"挥霍\"。\n\n怎么主张？婚姻存续期间，可以请求分割共同财产（婚内分割，《民法典》第 1066 条，理由包括一方隐藏、转移、变卖、毁损、挥霍夫妻共同财产）；离婚时，可以请求对挥霍的一方少分或不分（第 1092 条）。\n\n证据要备哪些？平台的充值、打赏记录；银行、支付软件的流水；平台出具的消费记录（可以通过法院调取）；聊天记录、对方承认的内容。\n\n要注意金额的相对性：要与家庭收入、一般消费水平对比。小额的娱乐消费，一般不构成挥霍。要同时证明\"未经同意\"\"明显超出家庭一般消费水平\"\"严重损害共同财产\"三点，缺一都可能不被认定。至于能不能向平台追回已打赏的款项，各地认定不一，建议先咨询律师。\n\n败家是一回事，败\"共同的家\"，是另一回事。法律管的是后者。\n\n法律依据：《民法典》第 1066 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 6 条。\n\n把握度：A｜规则明确；金额标准是 B。\n\n"}, {"num": "068", "title": "婚内协议和忠诚协议：写了，管不管用", "grade": "A", "lead": "婚内财产协议是有效的；\"出轨就净身出户\"之类的忠诚协议，各地法院判得不一样。", "html": "<blockquote>婚内财产协议是有效的；\"出轨就净身出户\"之类的忠诚协议，各地法院判得不一样。<\/blockquote>\n<p>小曹的妻子要求他签\"如果出轨，房子和存款全归我\"的协议。他签了，后来离婚时想主张无效。法院的态度不一：有的认为有效，有的认为需要综合判断。<\/p>\n<p><strong>婚内财产协议<\/strong>：夫妻可以约定婚姻关系存续期间所得的财产，归各自所有、共同所有，或部分各自所有、部分共同所有。约定要书面，对双方有约束力（《民法典》第 1065 条）。它的作用，是理清财产边界，减少猜忌。婚内协议不是为了预设离婚，是为了让日常的财务规则更明确。<\/p>\n<p>写什么？具体财产清单；归属方式；日常开支怎么分担；重大支出的决策方式；变更的规则。对外效力：约定归各自所有的，一方对外所负的债务，第三人知道该约定的，以一方个人财产清偿；第三人不知道的，仍按夫妻共同债务处理。范本见附录 H。<\/p>\n<p><strong>忠诚协议<\/strong>：约定一方有过错就少分或不分财产的，法院裁判有分歧，有的支持，有的认为属于道德范畴，不予支持。比较稳妥的做法是：约定的内容合理，双方自愿，没有显失公平，有明确的补偿金额，并且保留好协商过程的证据。<\/p>\n<p>不要用忠诚协议\"逼\"对方签字，那样容易被认定为胁迫，或者显失公平。也不要指望一份忠诚协议能解决问题。写下来是好事，但别拿协议当武器，要当规则。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1065 条、第 1091 条。<\/p>\n<p><strong>把握度<\/strong>：A｜婚内财产协议明确；忠诚协议是 B。<\/p>", "text": "婚内协议和忠诚协议：写了，管不管用 \n 婚内财产协议是有效的；\"出轨就净身出户\"之类的忠诚协议，各地法院判得不一样。\n\n小曹的妻子要求他签\"如果出轨，房子和存款全归我\"的协议。他签了，后来离婚时想主张无效。法院的态度不一：有的认为有效，有的认为需要综合判断。\n\n婚内财产协议：夫妻可以约定婚姻关系存续期间所得的财产，归各自所有、共同所有，或部分各自所有、部分共同所有。约定要书面，对双方有约束力（《民法典》第 1065 条）。它的作用，是理清财产边界，减少猜忌。婚内协议不是为了预设离婚，是为了让日常的财务规则更明确。\n\n写什么？具体财产清单；归属方式；日常开支怎么分担；重大支出的决策方式；变更的规则。对外效力：约定归各自所有的，一方对外所负的债务，第三人知道该约定的，以一方个人财产清偿；第三人不知道的，仍按夫妻共同债务处理。范本见附录 H。\n\n忠诚协议：约定一方有过错就少分或不分财产的，法院裁判有分歧，有的支持，有的认为属于道德范畴，不予支持。比较稳妥的做法是：约定的内容合理，双方自愿，没有显失公平，有明确的补偿金额，并且保留好协商过程的证据。\n\n不要用忠诚协议\"逼\"对方签字，那样容易被认定为胁迫，或者显失公平。也不要指望一份忠诚协议能解决问题。写下来是好事，但别拿协议当武器，要当规则。\n\n法律依据：《民法典》第 1065 条、第 1091 条。\n\n把握度：A｜婚内财产协议明确；忠诚协议是 B。\n\n"}, {"num": "069", "title": "合法的家庭财产防火墙：七件事，现在就能做", "grade": "C", "lead": "防的不是对方，是\"说不清\"。这七件事，全都合法，全都能在婚姻还平静的时候做。", "html": "<blockquote>防的不是对方，是\"说不清\"。这七件事，全都合法，全都能在婚姻还平静的时候做。<\/blockquote>\n<p>小秦夫妻都有工作，婚前小秦有一套房和一笔存款，妻子有一家小公司的股权。他们婚前做了七件事：写了婚前协议，开了个人账户，父母出资写了赠与说明，没有加名，各自买了保险，互相告知对外担保，立了遗嘱。十年后，婚姻结束，没有任何一件事需要打官司。<\/p>\n<p>大多数财产纠纷，输在\"说不清\"，而不是\"没道理\"。防火墙的作用，不是赢对方，而是让规则在出事之前，就写清楚，让双方都不用靠猜。<\/p>\n<p><strong>第一，婚前协议或婚内协议。<\/strong> 把婚前财产、婚后收入、房产、股权的归属写下来，见 <a href=\"#/e/053\">第 053 条<\/a>、<a href=\"#/e/068\">第 068 条<\/a>。<\/p>\n<p><strong>第二，账户分开。<\/strong> 个人财产、共同开销，分账户，保留流水，见 <a href=\"#/e/059\">第 059 条<\/a>。<\/p>\n<p><strong>第三，大额资金留凭证。<\/strong> 转账备注写清，父母出资写\"赠与自己子女个人\"，见 <a href=\"#/e/061\">第 061 条<\/a>。<\/p>\n<p><strong>第四，不轻易加名，不轻易赠与。<\/strong> 见 <a href=\"#/e/062\">第 062 条<\/a>。<\/p>\n<p><strong>第五，对外担保、借款，先沟通。<\/strong> 不要一个人替公司或朋友担保，见 <a href=\"#/e/066\">第 066 条<\/a>、<a href=\"#/e/064\">第 064 条<\/a>。<\/p>\n<p><strong>第六，保险和遗嘱。<\/strong> 保障家庭底盘，让财产按自己的意思传，见 <a href=\"#/e/116\">第 116 条<\/a>。<\/p>\n<p><strong>第七，危机出现，先咨询律师，再动作。<\/strong> 这时候最容易出错的，是自己突击转移财产，见 <a href=\"#/e/103\">第 103 条<\/a>。<\/p>\n<p>还有三件事，不能做：突击转移、隐藏、变卖共同财产；伪造债务、虚假借条；以\"假离婚\"\"假买卖\"来规避。这些不是防火墙，是引火上身。防火墙要在没起火的时候建，起火之后才建，容易被认为是转移。<\/p>\n<p>建防火墙，不是不信任，是对两个人的钱负责。<\/p>\n<p><strong>附件<\/strong>：婚内财产协议见附录 H。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1063 条、第 1065 条、第 1066 条、第 1092 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法，法律依据见各条。<\/p>", "text": "合法的家庭财产防火墙：七件事，现在就能做 \n 防的不是对方，是\"说不清\"。这七件事，全都合法，全都能在婚姻还平静的时候做。\n\n小秦夫妻都有工作，婚前小秦有一套房和一笔存款，妻子有一家小公司的股权。他们婚前做了七件事：写了婚前协议，开了个人账户，父母出资写了赠与说明，没有加名，各自买了保险，互相告知对外担保，立了遗嘱。十年后，婚姻结束，没有任何一件事需要打官司。\n\n大多数财产纠纷，输在\"说不清\"，而不是\"没道理\"。防火墙的作用，不是赢对方，而是让规则在出事之前，就写清楚，让双方都不用靠猜。\n\n第一，婚前协议或婚内协议。 把婚前财产、婚后收入、房产、股权的归属写下来，见 第 053 条、第 068 条。\n\n第二，账户分开。 个人财产、共同开销，分账户，保留流水，见 第 059 条。\n\n第三，大额资金留凭证。 转账备注写清，父母出资写\"赠与自己子女个人\"，见 第 061 条。\n\n第四，不轻易加名，不轻易赠与。 见 第 062 条。\n\n第五，对外担保、借款，先沟通。 不要一个人替公司或朋友担保，见 第 066 条、第 064 条。\n\n第六，保险和遗嘱。 保障家庭底盘，让财产按自己的意思传，见 第 116 条。\n\n第七，危机出现，先咨询律师，再动作。 这时候最容易出错的，是自己突击转移财产，见 第 103 条。\n\n还有三件事，不能做：突击转移、隐藏、变卖共同财产；伪造债务、虚假借条；以\"假离婚\"\"假买卖\"来规避。这些不是防火墙，是引火上身。防火墙要在没起火的时候建，起火之后才建，容易被认为是转移。\n\n建防火墙，不是不信任，是对两个人的钱负责。\n\n附件：婚内财产协议见附录 H。\n\n法律依据：《民法典》第 1062 条、第 1063 条、第 1065 条、第 1066 条、第 1092 条。\n\n把握度：C｜经验做法，法律依据见各条。\n\n"}]}, {"title": "第七章　读懂另一半", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：日子过不好，多半不是法律问题，是规则和沟通问题。法律面前，夫妻地位平等、义务对等；网上的极端口号，多数不是法律规则。<br><br><strong>口诀<\/strong>：事实先于评价，大事先商量，吵架有边界。<\/blockquote>\n<p>网上有很多关于婚姻的口号，有的出自男性的怨气，有的出自女性的怨气，简单，极端，带着情绪。这一章的做法是：把口号放回法律事实，看看规则到底怎么写。不替任何一方站队，只问一句：事实是什么？<\/p>", "entries": [{"num": "070", "title": "网上那些婚姻口号，放到法律面前，哪些站得住", "grade": "A", "lead": "口号是用来出气的，规则是用来过日子的。", "html": "<blockquote>口号是用来出气的，规则是用来过日子的。<\/blockquote>\n<p>吵架时，一方说\"家是讲爱的地方，不是讲理的地方，你就该认错\"，另一方回：\"婚姻本来就是对男人的剥削。\"两个人都在用口号替代事实，吵得越来越凶，一件具体的事也没解决。<\/p>\n<p>下面这些话，你大概都听过。一句一句，放到法律面前：<\/p>\n<p><strong>\"婚姻就是对某一方的剥削。\"<\/strong> 现代婚姻，法律上夫妻地位平等，互相扶养，共同抚育子女，财产规则兼顾双方（《民法典》第 1055 条、第 1058 条、第 1059 条）。可以讨论婚姻里存在的现实困境，但不能直接定性为单方面剥削。你听到伴侣反复这样说，要意识到：对方看待婚姻的底层框架，是对立，不是合作。<\/p>\n<p><strong>\"家是讲爱的地方，不是讲理的地方，一方就该无条件认错。\"<\/strong> 法律没有这样的规则。家庭里需要情感包容，但包容不等于放弃是非。长期要求单方面认错，本质是拒绝平等沟通。健康的家庭，情感和规则两样都要有。<\/p>\n<p><strong>\"生孩子是为你生的，你得补偿。\"<\/strong> 子女是夫妻共同的子女，父母共同承担抚养教育的义务（第 1058 条）。生育会带来巨大的身体成本，应当尊重；离婚时，承担较多义务的一方，有权请求补偿（第 1088 条）。但不能把生育当成筹码，单方面主张无限度的财产补偿。<\/p>\n<p><strong>\"嘘寒问暖，不如给钱，钱就是态度。\"<\/strong> 付钱是表达在意的方式之一，但不是唯一标准。把态度完全等价于金额，是一种简化的极端逻辑。<\/p>\n<p><strong>\"只要离婚，男方必须净身出户。\"<\/strong> 没有这条规则，见 <a href=\"#/e/079\">第 079 条<\/a>。<\/p>\n<p><strong>\"男人家暴，零次和无数次，一次就该离。\"<\/strong> 家暴是法定的离婚事由和损害赔偿事由，应当坚决反对；但认定看具体事实，见 <a href=\"#/e/077\">第 077 条<\/a>。<\/p>\n<p><strong>\"不能陪我吃苦的人，不值得。\"<\/strong> 夫妻有互相扶养的义务（第 1059 条）。这是双向的法律义务，不是单向的道德要求。<\/p>\n<p><strong>\"男人给自己父母花钱，就是愚孝。\"<\/strong> 成年子女对父母有赡养义务。金额是否合理，要看是否超出家庭的承受能力，见 <a href=\"#/e/074\">第 074 条<\/a>。<\/p>\n<p><strong>\"讲道理就是 PUA，不说话就是 NPD。\"<\/strong> 这是标签。标签化的语言，作用是终止理性讨论。当对方不去讨论事情本身，直接贴人格标签，就要意识到：沟通已经失去理性基础。<\/p>\n<p>这张清单，不是为了反驳谁。而是提醒：当一句口号替代了具体事实，沟通就已经失去了基础。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1055 条、第 1058 条、第 1059 条、第 1088 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "网上那些婚姻口号，放到法律面前，哪些站得住 \n 口号是用来出气的，规则是用来过日子的。\n\n吵架时，一方说\"家是讲爱的地方，不是讲理的地方，你就该认错\"，另一方回：\"婚姻本来就是对男人的剥削。\"两个人都在用口号替代事实，吵得越来越凶，一件具体的事也没解决。\n\n下面这些话，你大概都听过。一句一句，放到法律面前：\n\n\"婚姻就是对某一方的剥削。\" 现代婚姻，法律上夫妻地位平等，互相扶养，共同抚育子女，财产规则兼顾双方（《民法典》第 1055 条、第 1058 条、第 1059 条）。可以讨论婚姻里存在的现实困境，但不能直接定性为单方面剥削。你听到伴侣反复这样说，要意识到：对方看待婚姻的底层框架，是对立，不是合作。\n\n\"家是讲爱的地方，不是讲理的地方，一方就该无条件认错。\" 法律没有这样的规则。家庭里需要情感包容，但包容不等于放弃是非。长期要求单方面认错，本质是拒绝平等沟通。健康的家庭，情感和规则两样都要有。\n\n\"生孩子是为你生的，你得补偿。\" 子女是夫妻共同的子女，父母共同承担抚养教育的义务（第 1058 条）。生育会带来巨大的身体成本，应当尊重；离婚时，承担较多义务的一方，有权请求补偿（第 1088 条）。但不能把生育当成筹码，单方面主张无限度的财产补偿。\n\n\"嘘寒问暖，不如给钱，钱就是态度。\" 付钱是表达在意的方式之一，但不是唯一标准。把态度完全等价于金额，是一种简化的极端逻辑。\n\n\"只要离婚，男方必须净身出户。\" 没有这条规则，见 第 079 条。\n\n\"男人家暴，零次和无数次，一次就该离。\" 家暴是法定的离婚事由和损害赔偿事由，应当坚决反对；但认定看具体事实，见 第 077 条。\n\n\"不能陪我吃苦的人，不值得。\" 夫妻有互相扶养的义务（第 1059 条）。这是双向的法律义务，不是单向的道德要求。\n\n\"男人给自己父母花钱，就是愚孝。\" 成年子女对父母有赡养义务。金额是否合理，要看是否超出家庭的承受能力，见 第 074 条。\n\n\"讲道理就是 PUA，不说话就是 NPD。\" 这是标签。标签化的语言，作用是终止理性讨论。当对方不去讨论事情本身，直接贴人格标签，就要意识到：沟通已经失去理性基础。\n\n这张清单，不是为了反驳谁。而是提醒：当一句口号替代了具体事实，沟通就已经失去了基础。\n\n法律依据：《民法典》第 1055 条、第 1058 条、第 1059 条、第 1088 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "071", "title": "\"家里不讲理\"：怎么把吵架变成商量", "grade": "C", "lead": "好的家庭不是不吵，是吵完还能往前走。", "html": "<blockquote>好的家庭不是不吵，是吵完还能往前走。<\/blockquote>\n<p>小袁夫妻每次吵架，都以冷战三天收场。后来他们约定了几条规则：吵架不翻旧账，不说\"离婚\"，一方说\"暂停\"，就停 24 小时，之后再谈。半年后，吵架的次数少了一半，吵完也不再冷战。<\/p>\n<p>家庭里的规则，由两个人约定，不由谁的情绪或口号决定。建议两个人一起定这五条：<\/p>\n<p><strong>第一，事实先于评价。<\/strong> 先讲发生了什么，再讲感受，不直接给对方贴标签。<\/p>\n<p><strong>第二，重大决定提前商量。<\/strong> 买房、借款、投资、换工作、生育，不单方面决定。<\/p>\n<p><strong>第三，吵架有边界。<\/strong> 不人身攻击，不翻旧账，不拿离婚当筹码，不冷战超过 24 小时。<\/p>\n<p><strong>第四，暂停机制。<\/strong> 任何一方说\"我需要暂停\"，就停下，约定 24 小时内再谈。<\/p>\n<p><strong>第五，外部支持。<\/strong> 重复出现、无法解决的问题，找婚姻咨询师或心理咨询师，或双方信任的第三人。<\/p>\n<p>对方只讲情绪、不愿谈事实，或者开口就贴标签，怎么办？<\/p>\n<p>不跟着升级。把话题缩小到一件具体的事。暂时中止，晚点再谈。重要的事，用文字沟通，让对话留痕，避免情绪放大。也留心自己：你是不是也在给对方贴标签。这种模式长期稳定出现，要评估这段关系的沟通基础。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们先停一下。我现在也有情绪，明天晚上吃完饭我们再聊这件事，好吗？\"\n<\/li><li>\"你说我 PUA 你，我想知道具体是哪句话、哪件事，我们就这件事聊。\"\n<\/li><li>\"我们约定一下：吵架的时候，不提离婚，也不翻旧账，行吗？\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1043 条（夫妻应当互相忠实，互相尊重，互相关爱）。；无直接条文。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "\"家里不讲理\"：怎么把吵架变成商量 \n 好的家庭不是不吵，是吵完还能往前走。\n\n小袁夫妻每次吵架，都以冷战三天收场。后来他们约定了几条规则：吵架不翻旧账，不说\"离婚\"，一方说\"暂停\"，就停 24 小时，之后再谈。半年后，吵架的次数少了一半，吵完也不再冷战。\n\n家庭里的规则，由两个人约定，不由谁的情绪或口号决定。建议两个人一起定这五条：\n\n第一，事实先于评价。 先讲发生了什么，再讲感受，不直接给对方贴标签。\n\n第二，重大决定提前商量。 买房、借款、投资、换工作、生育，不单方面决定。\n\n第三，吵架有边界。 不人身攻击，不翻旧账，不拿离婚当筹码，不冷战超过 24 小时。\n\n第四，暂停机制。 任何一方说\"我需要暂停\"，就停下，约定 24 小时内再谈。\n\n第五，外部支持。 重复出现、无法解决的问题，找婚姻咨询师或心理咨询师，或双方信任的第三人。\n\n对方只讲情绪、不愿谈事实，或者开口就贴标签，怎么办？\n\n不跟着升级。把话题缩小到一件具体的事。暂时中止，晚点再谈。重要的事，用文字沟通，让对话留痕，避免情绪放大。也留心自己：你是不是也在给对方贴标签。这种模式长期稳定出现，要评估这段关系的沟通基础。\n\n可以这样说：\n\n \"我们先停一下。我现在也有情绪，明天晚上吃完饭我们再聊这件事，好吗？\"\n \"你说我 PUA 你，我想知道具体是哪句话、哪件事，我们就这件事聊。\"\n \"我们约定一下：吵架的时候，不提离婚，也不翻旧账，行吗？\"\n\n法律依据：《民法典》第 1043 条（夫妻应当互相忠实，互相尊重，互相关爱）。；无直接条文。\n\n把握度：C｜经验做法。\n\n"}, {"num": "072", "title": "要不要孩子：谁说了都不算，两个人说了才算", "grade": "A", "lead": "是否生育，是夫妻共同的事。孩子不是谈判的筹码，也不是争吵的结果。", "html": "<blockquote>是否生育，是夫妻共同的事。孩子不是谈判的筹码，也不是争吵的结果。<\/blockquote>\n<p>妻子背着丈夫终止了妊娠。丈夫以侵犯生育权为由起诉，要求赔偿，法院不支持；但这件事让感情彻底破裂，后来经调解无效，法院准予离婚。<\/p>\n<p>这类事，法律的态度是：《婚姻家庭编解释（一）》第 23 条规定，妻子未经丈夫同意擅自终止妊娠，丈夫以侵犯生育权为由请求损害赔偿的，法院不支持；但夫妻双方因是否生育发生纠纷，致使感情破裂，经调解无效的，应当准予离婚。<\/p>\n<p>也就是说，法律不允许强迫生育，也不会因为拒绝生育，就直接判决离婚，要结合是否导致感情破裂。<\/p>\n<p>生育的身体负担，主要由女性承担，应当被尊重。这不是一个\"可以用来换取财产的筹码\"，而是夫妻共同面对的事。<\/p>\n<p>怎么做？婚前就谈，要不要孩子，什么时候要，几个，怎么带，谁负担什么，见 <a href=\"#/e/050\">第 050 条<\/a>。孩子出生后，父母共同承担抚养义务，不因为是谁\"决定生\"而改变。一方想要孩子，另一方不想，长期分歧无法调和的，要评估关系的长期走向，而不是用别的事情，来换取一方让步。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 23 条；《民法典》第 1058 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "要不要孩子：谁说了都不算，两个人说了才算 \n 是否生育，是夫妻共同的事。孩子不是谈判的筹码，也不是争吵的结果。\n\n妻子背着丈夫终止了妊娠。丈夫以侵犯生育权为由起诉，要求赔偿，法院不支持；但这件事让感情彻底破裂，后来经调解无效，法院准予离婚。\n\n这类事，法律的态度是：《婚姻家庭编解释（一）》第 23 条规定，妻子未经丈夫同意擅自终止妊娠，丈夫以侵犯生育权为由请求损害赔偿的，法院不支持；但夫妻双方因是否生育发生纠纷，致使感情破裂，经调解无效的，应当准予离婚。\n\n也就是说，法律不允许强迫生育，也不会因为拒绝生育，就直接判决离婚，要结合是否导致感情破裂。\n\n生育的身体负担，主要由女性承担，应当被尊重。这不是一个\"可以用来换取财产的筹码\"，而是夫妻共同面对的事。\n\n怎么做？婚前就谈，要不要孩子，什么时候要，几个，怎么带，谁负担什么，见 第 050 条。孩子出生后，父母共同承担抚养义务，不因为是谁\"决定生\"而改变。一方想要孩子，另一方不想，长期分歧无法调和的，要评估关系的长期走向，而不是用别的事情，来换取一方让步。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 23 条；《民法典》第 1058 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "073", "title": "钱和态度：家里的账怎么记才不吵", "grade": "C", "lead": "钱的矛盾，多数不是金额的问题，而是规则和透明度的问题。", "html": "<blockquote>钱的矛盾，多数不是金额的问题，而是规则和透明度的问题。<\/blockquote>\n<p>小戚夫妻月收入合计 3 万元。他们定了规则：共同账户每月存入 2 万，用于房贷、生活费、孩子；各自留 5000 元零用金，不需要交代；单笔超过 5000 元的支出，先商量。三年下来，吵\"钱\"的次数很少。<\/p>\n<p>先选一种模式，写下来：<strong>完全共管<\/strong>，所有收入进共同账户；<strong>部分共管<\/strong>，共同账户付家庭开支，各自保留零用金；<strong>AA 制<\/strong>，分别负担，按比例或固定金额出共同开销。<\/p>\n<p>再定四条规矩：零用金，每人每月一个额度，不需要对方批准，也不需要解释；大额支出，超过某个金额（比如 5000 元）要先商量；透明度，每季度一次，对一遍家庭账目，不是审问，是对齐；债务，任何新的借款、担保、投资，都要告知对方。<\/p>\n<p>不要用金额衡量感情，也不要用金额替代陪伴。定了规则，要遵守。规则可以调整，但不能单方面改。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们每季度花半小时，把家里的账对一下，不是查你，是我们一起看看钱花到哪了，以后有什么要调整的。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1065 条、第 1066 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "钱和态度：家里的账怎么记才不吵 \n 钱的矛盾，多数不是金额的问题，而是规则和透明度的问题。\n\n小戚夫妻月收入合计 3 万元。他们定了规则：共同账户每月存入 2 万，用于房贷、生活费、孩子；各自留 5000 元零用金，不需要交代；单笔超过 5000 元的支出，先商量。三年下来，吵\"钱\"的次数很少。\n\n先选一种模式，写下来：完全共管，所有收入进共同账户；部分共管，共同账户付家庭开支，各自保留零用金；AA 制，分别负担，按比例或固定金额出共同开销。\n\n再定四条规矩：零用金，每人每月一个额度，不需要对方批准，也不需要解释；大额支出，超过某个金额（比如 5000 元）要先商量；透明度，每季度一次，对一遍家庭账目，不是审问，是对齐；债务，任何新的借款、担保、投资，都要告知对方。\n\n不要用金额衡量感情，也不要用金额替代陪伴。定了规则，要遵守。规则可以调整，但不能单方面改。\n\n可以这样说：\n\n \"我们每季度花半小时，把家里的账对一下，不是查你，是我们一起看看钱花到哪了，以后有什么要调整的。\"\n\n法律依据：《民法典》第 1062 条、第 1065 条、第 1066 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "074", "title": "给爸妈钱：是孝顺，还是掏空小家", "grade": "A", "lead": "赡养父母是法定义务，男女都一样。合理的赡养不是愚孝；超出家庭承受能力的单向掏空，才是问题。", "html": "<blockquote>赡养父母是法定义务，男女都一样。合理的赡养不是愚孝；超出家庭承受能力的单向掏空，才是问题。<\/blockquote>\n<p>小孟每月给自己父母 3000 元，妻子也每月给她父母 3000 元。两人月收入合计 2 万。他们定了\"双方父母同一标准\"，这件事反而从来不成为矛盾。另一个家庭，丈夫偷偷每月给父母 8000 元，不告诉妻子，被发现后吵了一场。<\/p>\n<p>法律上，成年子女对父母有赡养扶助的义务（《民法典》第 1067 条）；赡养人要在经济上供养、生活上照料、精神上慰藉，赡养人的配偶应当协助赡养人履行（《老年人权益保障法》第 14 条）。<\/p>\n<p>夫妻内部，怎么办？<\/p>\n<p>第一，双方父母的赡养义务，对等，用同一套规则。第二，事先约定一个年度额度，不超过家庭可承受范围。第三，超出额度的大额支出，两人商量，不单方面决定。第四，父母大病、住院等突发支出，另行商量。第五，给父母的钱，是夫妻共同财产的一部分，使用时要透明。<\/p>\n<p>一方长期向自己的父母大额转账而不告诉对方，可能被认定为损害夫妻共同财产的行为，但\"合理赡养\"，一般不会被认定为挥霍。<\/p>\n<p>不要用\"孝\"绑架对方，也不要用\"小家庭优先\"，拒绝所有赡养。孝顺和掏空，差的就是一次商量。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 26 条、第 1067 条；《老年人权益保障法》第 14 条（赡养人要在经济上供养、生活上照料、精神上慰藉；赡养人的配偶应当协助赡养人履行赡养义务）。<\/p>\n<p><strong>把握度<\/strong>：A｜义务明确；约定做法是 C。<\/p>", "text": "给爸妈钱：是孝顺，还是掏空小家 \n 赡养父母是法定义务，男女都一样。合理的赡养不是愚孝；超出家庭承受能力的单向掏空，才是问题。\n\n小孟每月给自己父母 3000 元，妻子也每月给她父母 3000 元。两人月收入合计 2 万。他们定了\"双方父母同一标准\"，这件事反而从来不成为矛盾。另一个家庭，丈夫偷偷每月给父母 8000 元，不告诉妻子，被发现后吵了一场。\n\n法律上，成年子女对父母有赡养扶助的义务（《民法典》第 1067 条）；赡养人要在经济上供养、生活上照料、精神上慰藉，赡养人的配偶应当协助赡养人履行（《老年人权益保障法》第 14 条）。\n\n夫妻内部，怎么办？\n\n第一，双方父母的赡养义务，对等，用同一套规则。第二，事先约定一个年度额度，不超过家庭可承受范围。第三，超出额度的大额支出，两人商量，不单方面决定。第四，父母大病、住院等突发支出，另行商量。第五，给父母的钱，是夫妻共同财产的一部分，使用时要透明。\n\n一方长期向自己的父母大额转账而不告诉对方，可能被认定为损害夫妻共同财产的行为，但\"合理赡养\"，一般不会被认定为挥霍。\n\n不要用\"孝\"绑架对方，也不要用\"小家庭优先\"，拒绝所有赡养。孝顺和掏空，差的就是一次商量。\n\n法律依据：《民法典》第 26 条、第 1067 条；《老年人权益保障法》第 14 条（赡养人要在经济上供养、生活上照料、精神上慰藉；赡养人的配偶应当协助赡养人履行赡养义务）。\n\n把握度：A｜义务明确；约定做法是 C。\n\n"}, {"num": "075", "title": "对方家人持续要钱、要房、要你表态：边界怎么设", "grade": "A", "lead": "你对配偶的父母，没有直接的赡养义务；但配偶有。你的边界，是和配偶一起商量出来的，不是对方家人开口开出来的。", "html": "<blockquote>你对配偶的父母，没有直接的赡养义务；但配偶有。你的边界，是和配偶一起商量出来的，不是对方家人开口开出来的。<\/blockquote>\n<p>小戚婚后，岳母隔三差五提\"弟弟买房差首付\"\"家里装修缺钱\"，一次几万，累计十几万。他每次都给了，也没跟妻子明说。后来夫妻矛盾，这些钱成了争议：他说是替妻子家人出的，岳母说是他自愿送的，妻子说\"我不知道\"。<\/p>\n<p>法律上，成年子女对自己的父母有赡养义务，配偶有协助的义务，但对配偶的父母，没有直接的赡养义务。对方家人其他的借钱、要钱，没有法定的\"必须给\"。所以边界，要靠夫妻两个人商量和约定。<\/p>\n<p>怎么设？<\/p>\n<p>第一，先和配偶达成一致：对双方的家人，用同一套规则，设一个年度额度，超出的先商量，见 <a href=\"#/e/074\">第 074 条<\/a>。<\/p>\n<p>第二，对外统一口径：对方家人开口时，不要当场答应或拒绝，回一句\"这件事我们夫妻商量后答复你\"。<\/p>\n<p>第三，借钱要写借条：向亲属借出的钱，写明金额、期限、是否还；没写，就可能被认为是赠与，见 <a href=\"#/e/011\">第 011 条<\/a>。<\/p>\n<p>第四，不单方面决定大额支出：不要背着配偶，给任何一方家人大额转账，尤其是共同财产。<\/p>\n<p>第五，对方家人干预婚姻、财产，由配偶出面沟通，你不要直接对立。<\/p>\n<p>需要拒绝时，给理由，给替代。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"妈，这个事我和 ×× 商量一下，周末给您答复。\"\n<\/li><li>\"我们能支持 2 万，一次性的。你们看这样行不行？如果不够，我们也再想想办法。\"\n<\/li><li>对配偶：\"我们定一个双方家里都适用的规则，好吗？每年每边最多多少，超出的我们商量。\"\n<\/li><\/ul>\n<p>不要用\"你家人怎么样\"攻击配偶，规则对双方同样适用。对方家人要钱，不一定是坏心。但你要是不设边界，最后委屈的是你，吵起来的是夫妻。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 26 条、第 1067 条；《老年人权益保障法》第 14 条。<\/p>\n<p><strong>把握度<\/strong>：A｜赡养义务的范围有明文；约定做法是 C。<\/p>", "text": "对方家人持续要钱、要房、要你表态：边界怎么设 \n 你对配偶的父母，没有直接的赡养义务；但配偶有。你的边界，是和配偶一起商量出来的，不是对方家人开口开出来的。\n\n小戚婚后，岳母隔三差五提\"弟弟买房差首付\"\"家里装修缺钱\"，一次几万，累计十几万。他每次都给了，也没跟妻子明说。后来夫妻矛盾，这些钱成了争议：他说是替妻子家人出的，岳母说是他自愿送的，妻子说\"我不知道\"。\n\n法律上，成年子女对自己的父母有赡养义务，配偶有协助的义务，但对配偶的父母，没有直接的赡养义务。对方家人其他的借钱、要钱，没有法定的\"必须给\"。所以边界，要靠夫妻两个人商量和约定。\n\n怎么设？\n\n第一，先和配偶达成一致：对双方的家人，用同一套规则，设一个年度额度，超出的先商量，见 第 074 条。\n\n第二，对外统一口径：对方家人开口时，不要当场答应或拒绝，回一句\"这件事我们夫妻商量后答复你\"。\n\n第三，借钱要写借条：向亲属借出的钱，写明金额、期限、是否还；没写，就可能被认为是赠与，见 第 011 条。\n\n第四，不单方面决定大额支出：不要背着配偶，给任何一方家人大额转账，尤其是共同财产。\n\n第五，对方家人干预婚姻、财产，由配偶出面沟通，你不要直接对立。\n\n需要拒绝时，给理由，给替代。\n\n可以这样说：\n\n \"妈，这个事我和 ×× 商量一下，周末给您答复。\"\n \"我们能支持 2 万，一次性的。你们看这样行不行？如果不够，我们也再想想办法。\"\n 对配偶：\"我们定一个双方家里都适用的规则，好吗？每年每边最多多少，超出的我们商量。\"\n\n不要用\"你家人怎么样\"攻击配偶，规则对双方同样适用。对方家人要钱，不一定是坏心。但你要是不设边界，最后委屈的是你，吵起来的是夫妻。\n\n法律依据：《民法典》第 26 条、第 1067 条；《老年人权益保障法》第 14 条。\n\n把握度：A｜赡养义务的范围有明文；约定做法是 C。\n\n"}, {"num": "076", "title": "一个人在家带孩子：家务也能折成钱", "grade": "A", "lead": "夫妻一方因抚育子女、照料老人、协助另一方工作等负担较多义务的，离婚时有权请求补偿。", "html": "<blockquote>夫妻一方因抚育子女、照料老人、协助另一方工作等负担较多义务的，离婚时有权请求补偿。<\/blockquote>\n<p>小陶的妻子全职照顾孩子和两位老人八年。离婚时，妻子主张家务补偿。法院综合考虑她投入的时间精力、小陶的负担能力、当地的收入水平，给了一个合理的补偿数额。小陶事先不知道有这一条。<\/p>\n<p>家务劳动是有价值的。一方在家带孩子、照顾老人，另一方才能专心工作，法律承认这份贡献。《民法典》第 1088 条规定：夫妻一方因抚育子女、照料老年人、协助另一方工作等负担较多义务的，离婚时有权向另一方请求补偿，另一方应当给予补偿。<\/p>\n<p>法院会综合考虑：负担这些义务投入的时间、精力，对双方的影响，给付方的负担能力，当地居民人均可支配收入等因素（《婚姻家庭编解释（二）》第 21 条）。这条规则，不限于约定了分别财产制的夫妻，也适用于其他情形。<\/p>\n<p><strong>如果你是主要工作的一方<\/strong>，要知道：对方可能提出补偿请求；数额没有固定标准，要看具体情况；补偿有上限，不是无限。<\/p>\n<p><strong>如果你是主要照顾家庭的一方<\/strong>，要保存相关的证据：接送孩子、就医、照顾老人的记录；也要理解，补偿不是\"工资\"，而是对贡献的认可。<\/p>\n<p>夫妻之间，也可以在婚内协议里，约定家务贡献如何折算，见 <a href=\"#/e/068\">第 068 条<\/a>。补偿请求，需要在离婚诉讼中提出，并由主张方举证。家务不是\"白干的\"，法律给它算了价。别等到离婚，才第一次听说。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1088 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 21 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；数额是 B。<\/p>", "text": "一个人在家带孩子：家务也能折成钱 \n 夫妻一方因抚育子女、照料老人、协助另一方工作等负担较多义务的，离婚时有权请求补偿。\n\n小陶的妻子全职照顾孩子和两位老人八年。离婚时，妻子主张家务补偿。法院综合考虑她投入的时间精力、小陶的负担能力、当地的收入水平，给了一个合理的补偿数额。小陶事先不知道有这一条。\n\n家务劳动是有价值的。一方在家带孩子、照顾老人，另一方才能专心工作，法律承认这份贡献。《民法典》第 1088 条规定：夫妻一方因抚育子女、照料老年人、协助另一方工作等负担较多义务的，离婚时有权向另一方请求补偿，另一方应当给予补偿。\n\n法院会综合考虑：负担这些义务投入的时间、精力，对双方的影响，给付方的负担能力，当地居民人均可支配收入等因素（《婚姻家庭编解释（二）》第 21 条）。这条规则，不限于约定了分别财产制的夫妻，也适用于其他情形。\n\n如果你是主要工作的一方，要知道：对方可能提出补偿请求；数额没有固定标准，要看具体情况；补偿有上限，不是无限。\n\n如果你是主要照顾家庭的一方，要保存相关的证据：接送孩子、就医、照顾老人的记录；也要理解，补偿不是\"工资\"，而是对贡献的认可。\n\n夫妻之间，也可以在婚内协议里，约定家务贡献如何折算，见 第 068 条。补偿请求，需要在离婚诉讼中提出，并由主张方举证。家务不是\"白干的\"，法律给它算了价。别等到离婚，才第一次听说。\n\n法律依据：《民法典》第 1088 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 21 条。\n\n把握度：A｜规则明确；数额是 B。\n\n"}, {"num": "077", "title": "家暴不分男女：怎么认定、怎么取证、怎么自保", "grade": "A", "lead": "暴力没有性别，也没有\"一点点\"。", "html": "<blockquote>暴力没有性别，也没有\"一点点\"。<\/blockquote>\n<p>夫妻争吵中，妻子抓伤了丈夫，丈夫推了妻子一把，妻子摔倒受伤。双方都报了警，都说对方家暴。法院会看双方的完整事实：谁先动手，谁在自我防卫，有没有长期的暴力。<\/p>\n<p><strong>怎么认定。<\/strong> 家庭暴力，是指家庭成员之间以殴打、捆绑、残害、限制人身自由，以及经常性谩骂、恐吓等方式实施的身体、精神等侵害行为（《反家庭暴力法》第 2 条）。<\/p>\n<p><strong>法律后果。<\/strong> 它是法定的判决离婚的情形之一；无过错方有权请求离婚损害赔偿；在抚养权争夺里，是不利于施暴一方的重要因素；构成犯罪的，追究刑事责任。<\/p>\n<p><strong>受害者怎么做。<\/strong> 保证安全，离开现场；报警，要求出警记录、告诫书；验伤，保留病历、照片；申请人身安全保护令，见 <a href=\"#/e/026\">第 026 条<\/a>；保存聊天记录、监控、证人。<\/p>\n<p><strong>被指控的一方怎么做。<\/strong> 如果你确实动手了，要认识到后果，不能把它当作\"家务事\"；如果是双方冲突、你在自我防卫，保留证据：现场照片、对方的伤情、自己的伤情、聊天记录；不要用\"我也被打过\"，来抵消另一方的指控，各自的事实，各自处理。<\/p>\n<p>不要用一句口号，取代对事实的判断。一次动手和长期殴打，法院在认定\"持续性、经常性\"时会区分，但每一次暴力，都应当被严肃对待。也不要在没有人身危险的情况下，自行\"取证\"，比如故意激怒对方。<\/p>\n<p><strong>法律依据<\/strong>：《反家庭暴力法》第 2 条、第 23 条至第 33 条；《民法典》第 1042 条、第 1079 条、第 1091 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 1 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "家暴不分男女：怎么认定、怎么取证、怎么自保 \n 暴力没有性别，也没有\"一点点\"。\n\n夫妻争吵中，妻子抓伤了丈夫，丈夫推了妻子一把，妻子摔倒受伤。双方都报了警，都说对方家暴。法院会看双方的完整事实：谁先动手，谁在自我防卫，有没有长期的暴力。\n\n怎么认定。 家庭暴力，是指家庭成员之间以殴打、捆绑、残害、限制人身自由，以及经常性谩骂、恐吓等方式实施的身体、精神等侵害行为（《反家庭暴力法》第 2 条）。\n\n法律后果。 它是法定的判决离婚的情形之一；无过错方有权请求离婚损害赔偿；在抚养权争夺里，是不利于施暴一方的重要因素；构成犯罪的，追究刑事责任。\n\n受害者怎么做。 保证安全，离开现场；报警，要求出警记录、告诫书；验伤，保留病历、照片；申请人身安全保护令，见 第 026 条；保存聊天记录、监控、证人。\n\n被指控的一方怎么做。 如果你确实动手了，要认识到后果，不能把它当作\"家务事\"；如果是双方冲突、你在自我防卫，保留证据：现场照片、对方的伤情、自己的伤情、聊天记录；不要用\"我也被打过\"，来抵消另一方的指控，各自的事实，各自处理。\n\n不要用一句口号，取代对事实的判断。一次动手和长期殴打，法院在认定\"持续性、经常性\"时会区分，但每一次暴力，都应当被严肃对待。也不要在没有人身危险的情况下，自行\"取证\"，比如故意激怒对方。\n\n法律依据：《反家庭暴力法》第 2 条、第 23 条至第 33 条；《民法典》第 1042 条、第 1079 条、第 1091 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 1 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "078", "title": "妻子怀着孕，你提不了离婚：这条规矩得知道", "grade": "A", "lead": "女方怀孕期间、分娩后一年内、终止妊娠后六个月内，男方不能提出离婚；特殊情形除外。", "html": "<blockquote>女方怀孕期间、分娩后一年内、终止妊娠后六个月内，男方不能提出离婚；特殊情形除外。<\/blockquote>\n<p>小杭和妻子关系早已破裂。他在妻子怀孕六个月时起诉离婚，法院告知：这一期间，男方不能提出离婚，除非法院认为确有必要。他的起诉被驳回。<\/p>\n<p>《民法典》第 1082 条规定：女方在怀孕期间、分娩后一年内或者终止妊娠后六个月内，男方不得提出离婚；女方提出离婚的，或者人民法院认为确有必要受理男方离婚请求的，除外。<\/p>\n<p>这条规则，保护的是孕期、产后女性的身心状态，不是剥夺男方的权利。\"确有必要\"，一般指女方存在严重过错、双方感情完全破裂且有重大事由等情形，由法院判断。<\/p>\n<p>它只限制男方\"提出离婚\"，不影响女方起诉。双方协议到民政部门办理离婚登记，是否受此限制，条文没有明说，各地做法可能不同，待核实。<\/p>\n<p>婚姻已经走到尽头，又处在上述期间，不要强行起诉，法院可能不予受理。可以通过协商、分居、婚姻调解等方式，期间届满后，再提出。<\/p>\n<p>规则不一定顺你的意，但你得先知道它。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1082 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确；协议离婚是否受限待核实。<\/p>", "text": "妻子怀着孕，你提不了离婚：这条规矩得知道 \n 女方怀孕期间、分娩后一年内、终止妊娠后六个月内，男方不能提出离婚；特殊情形除外。\n\n小杭和妻子关系早已破裂。他在妻子怀孕六个月时起诉离婚，法院告知：这一期间，男方不能提出离婚，除非法院认为确有必要。他的起诉被驳回。\n\n《民法典》第 1082 条规定：女方在怀孕期间、分娩后一年内或者终止妊娠后六个月内，男方不得提出离婚；女方提出离婚的，或者人民法院认为确有必要受理男方离婚请求的，除外。\n\n这条规则，保护的是孕期、产后女性的身心状态，不是剥夺男方的权利。\"确有必要\"，一般指女方存在严重过错、双方感情完全破裂且有重大事由等情形，由法院判断。\n\n它只限制男方\"提出离婚\"，不影响女方起诉。双方协议到民政部门办理离婚登记，是否受此限制，条文没有明说，各地做法可能不同，待核实。\n\n婚姻已经走到尽头，又处在上述期间，不要强行起诉，法院可能不予受理。可以通过协商、分居、婚姻调解等方式，期间届满后，再提出。\n\n规则不一定顺你的意，但你得先知道它。\n\n法律依据：《民法典》第 1082 条。\n\n把握度：A｜法条明确；协议离婚是否受限待核实。\n\n"}, {"num": "079", "title": "离婚就得净身出户吗", "grade": "A", "lead": "法律没有\"离婚男方净身出户\"的规则。净身出户，只有自愿放弃，或者法院因对方隐匿转移财产而判少分、不分。", "html": "<blockquote>法律没有\"离婚男方净身出户\"的规则。净身出户，只有自愿放弃，或者法院因对方隐匿转移财产而判少分、不分。<\/blockquote>\n<p>小褚刷到短视频，说\"男人离婚就是净身出户\"，吓得不敢提离婚。其实他和妻子婚后共同财产 200 万，如果协商不成，法院会综合财产来源、子女抚养、过错等因素分割，不是\"全部归对方\"。<\/p>\n<p>法律的规定是：夫妻共同财产，离婚时先协议处理；协议不成，法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决（《民法典》第 1087 条）。分割不是简单对半，也不是一方全部拿走，见 <a href=\"#/e/100\">第 100 条<\/a>。<\/p>\n<p>\"少分或不分\"的情形，只有一种：一方有隐藏、转移、变卖、毁损、挥霍夫妻共同财产，或伪造夫妻共同债务的，分割时可以对该方少分或不分（第 1092 条）。<\/p>\n<p>所以\"净身出户\"，只有两种可能：一是本人自愿，在离婚协议中放弃全部财产（必须是真实意思）；二是本人有上述严重行为，被法院判少分、不分。个人财产不会被分割：婚前财产、个人专用物品、人身损害赔偿，仍然归个人。<\/p>\n<p>反过来说，不要以\"反正会净身出户\"为由，在婚姻出现问题之前，转移资产。这反而会让你被法院少分。<\/p>\n<p>法律说\"照顾女方、子女和无过错方权益\"，是分割时的价值导向，不是自动倾斜，具体看案情。\"净身出户\"不是法律，是流言。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1087 条、第 1092 条、第 1063 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "离婚就得净身出户吗 \n 法律没有\"离婚男方净身出户\"的规则。净身出户，只有自愿放弃，或者法院因对方隐匿转移财产而判少分、不分。\n\n小褚刷到短视频，说\"男人离婚就是净身出户\"，吓得不敢提离婚。其实他和妻子婚后共同财产 200 万，如果协商不成，法院会综合财产来源、子女抚养、过错等因素分割，不是\"全部归对方\"。\n\n法律的规定是：夫妻共同财产，离婚时先协议处理；协议不成，法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决（《民法典》第 1087 条）。分割不是简单对半，也不是一方全部拿走，见 第 100 条。\n\n\"少分或不分\"的情形，只有一种：一方有隐藏、转移、变卖、毁损、挥霍夫妻共同财产，或伪造夫妻共同债务的，分割时可以对该方少分或不分（第 1092 条）。\n\n所以\"净身出户\"，只有两种可能：一是本人自愿，在离婚协议中放弃全部财产（必须是真实意思）；二是本人有上述严重行为，被法院判少分、不分。个人财产不会被分割：婚前财产、个人专用物品、人身损害赔偿，仍然归个人。\n\n反过来说，不要以\"反正会净身出户\"为由，在婚姻出现问题之前，转移资产。这反而会让你被法院少分。\n\n法律说\"照顾女方、子女和无过错方权益\"，是分割时的价值导向，不是自动倾斜，具体看案情。\"净身出户\"不是法律，是流言。\n\n法律依据：《民法典》第 1087 条、第 1092 条、第 1063 条。\n\n把握度：A｜法条明确。\n\n"}]}, {"title": "第八章　离婚协议", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：离婚协议，是你这辈子签的最贵的一份合同。签字之前，每一项都要写到\"执行时不用再猜\"。<br><br><strong>口诀<\/strong>：先盘家底，再谈条件，写到不用猜；冷静期里别提前过户。<\/blockquote>\n<p>大多数离婚，不是一天发生的。这一章先讲婚姻亮红灯时，该做什么、不该做什么，再讲协议离婚的流程、协议怎么审、房子和房贷怎么处理，以及最容易出事的几个地方。<\/p>", "entries": [{"num": "080", "title": "婚姻亮红灯：该做什么，千万别做什么", "grade": "C", "lead": "危机是一种持续的变化，不是一次吵架。出现信号，一边修复，一边做预案，但预案必须合法。", "html": "<blockquote>危机是一种持续的变化，不是一次吵架。出现信号，一边修复，一边做预案，但预案必须合法。<\/blockquote>\n<p>小贺发现妻子半年来一直在回避沟通，工资卡换了新的，手机从不离手，一提话题就说\"别烦我\"。他没有去翻手机，也没有转移财产，而是先整理了自己的财产资料，约了一次婚姻咨询。<\/p>\n<p>先看信号，它们需要持续出现，不是一次：<\/p>\n<ul><li>持续拒绝沟通，回避重要话题\n<\/li><li>隐瞒收入、账户、资金去向\n<\/li><li>频繁提出离婚，或持续冷战、分居\n<\/li><li>持续的言语攻击和贬低\n<\/li><li>出现明显的财务异常，比如大额转账、赠与、挥霍\n<\/li><li>出现婚外关系的迹象\n<\/li><li>出现暴力或恐吓\n<\/li><\/ul>\n<p>该做的有六件：<\/p>\n<ul><li>尝试理性沟通，必要时找婚姻咨询\n<\/li><li>整理自己的财产资料：房产证、存款、股权、保险、债务\n<\/li><li>保管好自己的身份证件、结婚证、产权证明\n<\/li><li>了解自己的权利，咨询律师\n<\/li><li>保存家庭开支记录、子女照顾的记录\n<\/li><li>观察对方的财务动向，必要时留存证据\n<\/li><\/ul>\n<p>不该做的有五件：<\/p>\n<ul><li>转移、隐藏、变卖共同财产\n<\/li><li>偷拍、偷录、侵入对方的手机和账户\n<\/li><li>在冲动下签任何文件\n<\/li><li>把孩子带走、藏起来\n<\/li><li>在社交平台上发泄、曝光对方\n<\/li><\/ul>\n<p>要强调一句：做预案，不是做准备\"算计\"对方，而是为了在冲突升级时，自己有证据，有底线。婚姻亮红灯的时候，该做的是修，也是备。不该做的是躲，是藏，是急。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1066 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 12 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "婚姻亮红灯：该做什么，千万别做什么 \n 危机是一种持续的变化，不是一次吵架。出现信号，一边修复，一边做预案，但预案必须合法。\n\n小贺发现妻子半年来一直在回避沟通，工资卡换了新的，手机从不离手，一提话题就说\"别烦我\"。他没有去翻手机，也没有转移财产，而是先整理了自己的财产资料，约了一次婚姻咨询。\n\n先看信号，它们需要持续出现，不是一次：\n\n 持续拒绝沟通，回避重要话题\n 隐瞒收入、账户、资金去向\n 频繁提出离婚，或持续冷战、分居\n 持续的言语攻击和贬低\n 出现明显的财务异常，比如大额转账、赠与、挥霍\n 出现婚外关系的迹象\n 出现暴力或恐吓\n\n该做的有六件：\n\n 尝试理性沟通，必要时找婚姻咨询\n 整理自己的财产资料：房产证、存款、股权、保险、债务\n 保管好自己的身份证件、结婚证、产权证明\n 了解自己的权利，咨询律师\n 保存家庭开支记录、子女照顾的记录\n 观察对方的财务动向，必要时留存证据\n\n不该做的有五件：\n\n 转移、隐藏、变卖共同财产\n 偷拍、偷录、侵入对方的手机和账户\n 在冲动下签任何文件\n 把孩子带走、藏起来\n 在社交平台上发泄、曝光对方\n\n要强调一句：做预案，不是做准备\"算计\"对方，而是为了在冲突升级时，自己有证据，有底线。婚姻亮红灯的时候，该做的是修，也是备。不该做的是躲，是藏，是急。\n\n法律依据：《民法典》第 1066 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 12 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "081", "title": "发现对方出轨：第一周该做什么，不该做什么", "grade": "B", "lead": "发现的那一刻，最危险的是你自己的冲动。先稳住，再收证，再决定。", "html": "<blockquote>发现的那一刻，最危险的是你自己的冲动。先稳住，再收证，再决定。<\/blockquote>\n<p>小汪发现妻子手机里有暧昧聊天。他当场摔了手机，打了对方一巴掌，又在朋友圈发了截图。结果，他自己因为动手被报警，也因为曝光隐私惹上了麻烦，而妻子反而成了\"受害者\"。<\/p>\n<p>发现出轨的那天，是你最容易犯错的一天。<\/p>\n<p><strong>第一天<\/strong>，先管住自己：不动手，不摔东西，不发朋友圈，不通知对方的父母和单位；保留你已经合法看到的东西，对方主动展示的聊天、你自己手机里收到的信息，截图保存，不要删；不要偷看、破解对方的手机、云盘、账号；给自己找一个人说话，朋友，咨询师。<\/p>\n<p><strong>第一周<\/strong>，做四件事：整理你自己手上合法获得的证据，见 <a href=\"#/e/105\">第 105 条<\/a>；清点家里的财产，看有没有异常转账；咨询律师：你的权利，你的选择，证据够不够；暂时不要转移财产，不要做任何难以挽回的决定。想好你想要什么：挽回、分居，还是离婚。<\/p>\n<p>需要知道几个法律事实：偶尔的婚外情，不一定构成\"与他人同居\"；离婚损害赔偿，只在重婚、与他人同居、家暴、虐待遗弃等法定情形下才支持，见 <a href=\"#/e/104\">第 104 条<\/a>；对方把夫妻共同财产送给第三者，可以要求返还，见 <a href=\"#/e/063\">第 063 条<\/a>；对方的出轨，会影响财产分割、抚养权，但不是自动的。<\/p>\n<p><strong>可以这样说<\/strong>（对对方）：<\/p>\n<ul><li>\"我已经知道这件事了。我现在不想吵，也不想做任何决定。我们都先冷静几天，之后找时间好好谈，我也会找律师了解我的权利。\"\n<\/li><\/ul>\n<p>激动之下的动手、曝光、跟踪，都可能让你从\"受害者\"变成\"违法者\"。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1091 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 7 条、第 14 条。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实；法律事实部分是 A。<\/p>", "text": "发现对方出轨：第一周该做什么，不该做什么 \n 发现的那一刻，最危险的是你自己的冲动。先稳住，再收证，再决定。\n\n小汪发现妻子手机里有暧昧聊天。他当场摔了手机，打了对方一巴掌，又在朋友圈发了截图。结果，他自己因为动手被报警，也因为曝光隐私惹上了麻烦，而妻子反而成了\"受害者\"。\n\n发现出轨的那天，是你最容易犯错的一天。\n\n第一天，先管住自己：不动手，不摔东西，不发朋友圈，不通知对方的父母和单位；保留你已经合法看到的东西，对方主动展示的聊天、你自己手机里收到的信息，截图保存，不要删；不要偷看、破解对方的手机、云盘、账号；给自己找一个人说话，朋友，咨询师。\n\n第一周，做四件事：整理你自己手上合法获得的证据，见 第 105 条；清点家里的财产，看有没有异常转账；咨询律师：你的权利，你的选择，证据够不够；暂时不要转移财产，不要做任何难以挽回的决定。想好你想要什么：挽回、分居，还是离婚。\n\n需要知道几个法律事实：偶尔的婚外情，不一定构成\"与他人同居\"；离婚损害赔偿，只在重婚、与他人同居、家暴、虐待遗弃等法定情形下才支持，见 第 104 条；对方把夫妻共同财产送给第三者，可以要求返还，见 第 063 条；对方的出轨，会影响财产分割、抚养权，但不是自动的。\n\n可以这样说（对对方）：\n\n \"我已经知道这件事了。我现在不想吵，也不想做任何决定。我们都先冷静几天，之后找时间好好谈，我也会找律师了解我的权利。\"\n\n激动之下的动手、曝光、跟踪，都可能让你从\"受害者\"变成\"违法者\"。\n\n法律依据：《民法典》第 1091 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 7 条、第 14 条。\n\n把握度：B｜依个案事实；法律事实部分是 A。\n\n"}, {"num": "082", "title": "对方写的\"保证书\"\"认错书\"有用吗", "grade": "B", "lead": "自愿写的，可以当证据；逼着写的，可能不作数，还会反过来害你。", "html": "<blockquote>自愿写的，可以当证据；逼着写的，可能不作数，还会反过来害你。<\/blockquote>\n<p>小廖发现妻子出轨，当场把她拦在房里，逼她写下\"保证书\"：再犯就净身出户，另赔 50 万。后来离婚，他拿出保证书要求执行。对方说是被逼的。法院审查后，对\"净身出户\"和 50 万的约定持谨慎态度，没有支持，只把其中承认出轨事实的部分，作为证据参考。他自己还因为当晚的做法，被对方反过来报了警。<\/p>\n<p>法院看一份承诺，先看是不是真实、自愿，再看有没有显失公平、是不是违背公序良俗。胁迫下写的，可以撤销（《民法典》第 150 条）；惩罚性的金额明显过高，可以请求调减（第 585 条）。保证书里承认的\"事实\"，有时可以作为过错的证据，但\"赔多少\"\"净身出户\"这类处罚性约定，法院的态度不一，见 <a href=\"#/e/068\">第 068 条<\/a>。<\/p>\n<p>怎么做？想要书面承认，在对方平静、自愿的时候谈，不要把人关在房里，不要威胁，不要当众逼。写事实，不写狠话：时间、对象、行为经过，这些是有证据价值的部分；承诺写成合理、可执行的，比如\"断绝联系\"\"配合夫妻咨询\"；不要写\"净身出户\"\"赔偿百万\"这类明显过高的约定。签字、写日期，双方各留一份。保证书之外，还要有别的证据，只靠一张保证书，对方说\"当时是被逼的\"，就会有争议。<\/p>\n<p>如果是你被要求写：不要在情绪下签，可以说\"我愿意认真写，但我需要冷静后再写，也想让律师看一下\"。<\/p>\n<p>逼着对方写，本身就可能碰上非法拘禁、敲诈勒索，见 <a href=\"#/e/022\">第 022 条<\/a>、<a href=\"#/e/023\">第 023 条<\/a>，得不偿失。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们都先冷静一下。我想把你的承诺写下来，不是为了逼你，是为了我们以后都有依据。\"\n<\/li><li>\"这份东西我先拿回去看看，明天再给你答复。\"（被要求写的一方）\n<\/li><\/ul>\n<p>一张逼出来的保证书，更像是你的把柄。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 150 条（胁迫）、第 151 条（显失公平）、第 585 条（违约金过分高于损失的，可以请求适当减少）、第 1091 条。<\/p>\n<p><strong>把握度<\/strong>：B｜法院对此类约定态度不一。<\/p>", "text": "对方写的\"保证书\"\"认错书\"有用吗 \n 自愿写的，可以当证据；逼着写的，可能不作数，还会反过来害你。\n\n小廖发现妻子出轨，当场把她拦在房里，逼她写下\"保证书\"：再犯就净身出户，另赔 50 万。后来离婚，他拿出保证书要求执行。对方说是被逼的。法院审查后，对\"净身出户\"和 50 万的约定持谨慎态度，没有支持，只把其中承认出轨事实的部分，作为证据参考。他自己还因为当晚的做法，被对方反过来报了警。\n\n法院看一份承诺，先看是不是真实、自愿，再看有没有显失公平、是不是违背公序良俗。胁迫下写的，可以撤销（《民法典》第 150 条）；惩罚性的金额明显过高，可以请求调减（第 585 条）。保证书里承认的\"事实\"，有时可以作为过错的证据，但\"赔多少\"\"净身出户\"这类处罚性约定，法院的态度不一，见 第 068 条。\n\n怎么做？想要书面承认，在对方平静、自愿的时候谈，不要把人关在房里，不要威胁，不要当众逼。写事实，不写狠话：时间、对象、行为经过，这些是有证据价值的部分；承诺写成合理、可执行的，比如\"断绝联系\"\"配合夫妻咨询\"；不要写\"净身出户\"\"赔偿百万\"这类明显过高的约定。签字、写日期，双方各留一份。保证书之外，还要有别的证据，只靠一张保证书，对方说\"当时是被逼的\"，就会有争议。\n\n如果是你被要求写：不要在情绪下签，可以说\"我愿意认真写，但我需要冷静后再写，也想让律师看一下\"。\n\n逼着对方写，本身就可能碰上非法拘禁、敲诈勒索，见 第 022 条、第 023 条，得不偿失。\n\n可以这样说：\n\n \"我们都先冷静一下。我想把你的承诺写下来，不是为了逼你，是为了我们以后都有依据。\"\n \"这份东西我先拿回去看看，明天再给你答复。\"（被要求写的一方）\n\n一张逼出来的保证书，更像是你的把柄。\n\n法律依据：《民法典》第 150 条（胁迫）、第 151 条（显失公平）、第 585 条（违约金过分高于损失的，可以请求适当减少）、第 1091 条。\n\n把握度：B｜法院对此类约定态度不一。\n\n"}, {"num": "083", "title": "先别急着起诉：咨询、调解、分居，先试一轮", "grade": "C", "lead": "能修复的先修复，修复不了的也要有秩序地结束。起诉是最后一步，不是第一步。", "html": "<blockquote>能修复的先修复，修复不了的也要有秩序地结束。起诉是最后一步，不是第一步。<\/blockquote>\n<p>小殷夫妻约定分居三个月，期间做了三次婚姻咨询，各自列了\"我想要的\"\"我不能接受的\"。三个月后，有一半的问题缓解了，另一半让他们明确了：这段婚姻走不下去了。之后协议离婚，没有任何一方事后后悔。<\/p>\n<p>起诉之前，可以先试一轮：<\/p>\n<p><strong>婚姻咨询<\/strong>，找有资质的婚姻家庭咨询师，双方一起去，至少三次。<strong>家庭调解<\/strong>，当地的妇联、人民调解委员会、社区、法院诉前调解，都可以。<strong>分居<\/strong>，约定分居一段时间，写下分居期间的规则：谁照顾孩子，开支怎么分，怎么沟通。<strong>约定期限<\/strong>，给彼此三到六个月的冷静期，到期再决定。<strong>书面确认<\/strong>，分居协议要写明：不属于离婚；期间财产不变动；孩子的安排；谁住哪里。<\/p>\n<p>还有一条法律上的事实：分居满两年，是法院判决离婚的一个法定情形（《民法典》第 1079 条）。所以分居期间的事实，可以留存证据。要注意的是：分居不等于离婚，期间的财产、债务，还是夫妻共同的。<\/p>\n<p>先试过一轮，之后的每一步，都更有底气。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1079 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法；分居两年是 A。<\/p>", "text": "先别急着起诉：咨询、调解、分居，先试一轮 \n 能修复的先修复，修复不了的也要有秩序地结束。起诉是最后一步，不是第一步。\n\n小殷夫妻约定分居三个月，期间做了三次婚姻咨询，各自列了\"我想要的\"\"我不能接受的\"。三个月后，有一半的问题缓解了，另一半让他们明确了：这段婚姻走不下去了。之后协议离婚，没有任何一方事后后悔。\n\n起诉之前，可以先试一轮：\n\n婚姻咨询，找有资质的婚姻家庭咨询师，双方一起去，至少三次。家庭调解，当地的妇联、人民调解委员会、社区、法院诉前调解，都可以。分居，约定分居一段时间，写下分居期间的规则：谁照顾孩子，开支怎么分，怎么沟通。约定期限，给彼此三到六个月的冷静期，到期再决定。书面确认，分居协议要写明：不属于离婚；期间财产不变动；孩子的安排；谁住哪里。\n\n还有一条法律上的事实：分居满两年，是法院判决离婚的一个法定情形（《民法典》第 1079 条）。所以分居期间的事实，可以留存证据。要注意的是：分居不等于离婚，期间的财产、债务，还是夫妻共同的。\n\n先试过一轮，之后的每一步，都更有底气。\n\n法律依据：《民法典》第 1079 条。\n\n把握度：C｜经验做法；分居两年是 A。\n\n"}, {"num": "084", "title": "离婚谈判怎么谈：底线、让步顺序、话术", "grade": "C", "lead": "谈判的目的不是赢，是在你能接受的范围里，把事情了结，并且结果能被执行。", "html": "<blockquote>谈判的目的不是赢，是在你能接受的范围里，把事情了结，并且结果能被执行。<\/blockquote>\n<p>小傅夫妻在谈房子和孩子。他先列了三栏：必须拿到的（孩子的探望权、自己的婚前房）、可以让的（共同存款的比例）、可以换的（多付抚养费，换更多探望时间）。谈判从\"争\"变成了\"交换\"，两周就谈成了。<\/p>\n<p>十条做法：<\/p>\n<ol><li><strong>先列三栏<\/strong>：底线（必须拿到），可让步，可交换的。\n<\/li><li><strong>先信息，后条件<\/strong>：先把双方的财产、债务摊开核对，再谈分配。\n<\/li><li><strong>用清单谈，不用情绪谈<\/strong>：财产清单（附录 N），抚养安排，时间表。\n<\/li><li><strong>按议题分开谈<\/strong>：孩子、房子、存款、债务，一个一个谈，不捆绑成\"一场总战\"。\n<\/li><li><strong>选对场合<\/strong>：双方都冷静的时候，最好有一个中立的第三方，律师或调解员。\n<\/li><li><strong>书面确认<\/strong>：每谈成一项，用短信或邮件确认，别只靠口头。\n<\/li><li><strong>不要在这些时候谈<\/strong>：对方情绪激动，有威胁，或者你自己想\"快点结束\"而愿意让很多的时候。\n<\/li><li><strong>让步有顺序<\/strong>：先让不重要的，再让次要的，核心的最后，不要一开始就让底线。\n<\/li><li><strong>给时间<\/strong>：给对方时间考虑，不逼；自己也设期限，避免无限拖延。\n<\/li><li><strong>找律师审协议<\/strong>：再好的协商，最终要落到一份能执行的协议里。\n<\/li><\/ol>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我最看重的是孩子，你最看重的是什么？我们先把这两件事列出来。\"\n<\/li><li>\"房子和存款，我们先各自把清单列出来，对一遍，再谈怎么分。\"\n<\/li><li>\"这一项我可以让，但我想在探望时间上多一些，你看行吗？\"\n<\/li><li>\"你的这个要求，我需要回去想想，这个星期五给你答复。\"\n<\/li><\/ul>\n<p>不要因为想\"早点结束\"，就在核心问题上让步。让出去的，很难再拿回来。别一上来就把底线交出去。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1076 条、第 1087 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "离婚谈判怎么谈：底线、让步顺序、话术 \n 谈判的目的不是赢，是在你能接受的范围里，把事情了结，并且结果能被执行。\n\n小傅夫妻在谈房子和孩子。他先列了三栏：必须拿到的（孩子的探望权、自己的婚前房）、可以让的（共同存款的比例）、可以换的（多付抚养费，换更多探望时间）。谈判从\"争\"变成了\"交换\"，两周就谈成了。\n\n十条做法：\n\n1. 先列三栏：底线（必须拿到），可让步，可交换的。\n2. 先信息，后条件：先把双方的财产、债务摊开核对，再谈分配。\n3. 用清单谈，不用情绪谈：财产清单（附录 N），抚养安排，时间表。\n4. 按议题分开谈：孩子、房子、存款、债务，一个一个谈，不捆绑成\"一场总战\"。\n5. 选对场合：双方都冷静的时候，最好有一个中立的第三方，律师或调解员。\n6. 书面确认：每谈成一项，用短信或邮件确认，别只靠口头。\n7. 不要在这些时候谈：对方情绪激动，有威胁，或者你自己想\"快点结束\"而愿意让很多的时候。\n8. 让步有顺序：先让不重要的，再让次要的，核心的最后，不要一开始就让底线。\n9. 给时间：给对方时间考虑，不逼；自己也设期限，避免无限拖延。\n10. 找律师审协议：再好的协商，最终要落到一份能执行的协议里。\n\n可以这样说：\n\n \"我最看重的是孩子，你最看重的是什么？我们先把这两件事列出来。\"\n \"房子和存款，我们先各自把清单列出来，对一遍，再谈怎么分。\"\n \"这一项我可以让，但我想在探望时间上多一些，你看行吗？\"\n \"你的这个要求，我需要回去想想，这个星期五给你答复。\"\n\n不要因为想\"早点结束\"，就在核心问题上让步。让出去的，很难再拿回来。别一上来就把底线交出去。\n\n法律依据：《民法典》第 1076 条、第 1087 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "085", "title": "协议离婚：流程、冷静期，以及怎么防对方反复", "grade": "A", "lead": "双方都同意，就可以到民政部门办理。有一个 30 天的冷静期，然后 30 天内领证。", "html": "<blockquote>双方都同意，就可以到民政部门办理。有一个 30 天的冷静期，然后 30 天内领证。<\/blockquote>\n<p>小戈夫妻协商好后，9 月 1 日提交申请，到 10 月 1 日冷静期结束，在 10 月 31 日前双方到场领证。如果没去，视为撤回，要重新申请。<\/p>\n<p><strong>前提<\/strong>：双方自愿，对子女抚养、财产、债务有协议，双方都具有完全民事行为能力。<\/p>\n<p><strong>办理<\/strong>：双方亲自到婚姻登记机关，提交离婚登记申请，材料包括身份证、结婚证、离婚协议书、本人的书面声明，具体以当地为准。从 2025 年 5 月 10 日起，办理离婚登记也不再需要户口本，可以在有权限的登记机关办理，不限于户籍地。<\/p>\n<p><strong>冷静期<\/strong>：登记机关收到申请之日起 30 日内，任何一方不愿意离婚的，可以撤回申请（《民法典》第 1077 条）。<strong>领证<\/strong>：冷静期满后 30 日内，双方必须亲自到场申请发给离婚证；逾期没去的，视为撤回申请。<strong>生效<\/strong>：取得离婚证，婚姻关系解除。<\/p>\n<p>对子女抚养、财产没有达成一致，一方不同意离婚，或一方没有民事行为能力的，不能协议离婚，只能起诉。网页版有冷静期日期计算器：输入提交日，给出冷静期结束日和领证最后一日。<\/p>\n<p><strong>冷静期怎么用？<\/strong> 把离婚协议再读一遍，找专业人员审核；核对财产清单，补充遗漏；确认子女的安排；跟对方沟通，是不是仍然同意。<\/p>\n<p><strong>怎么防对方反复？<\/strong> 小葛夫妻在提交申请前，已经把一套房过户给了妻子，申请后的第 25 天，妻子突然撤回了申请。他再想要回房子，只能起诉，打了一年官司。教训是：不要在登记前，就先过户财产、先转账、先搬离，因为一旦撤回，已经履行的内容，会变成争议。财产的变动，放在领到离婚证之后。冷静期，是个保险，也是个漏洞，用好它。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1076 条至第 1078 条；《婚姻登记条例》（2025 年修订）。；《民法典》第 1077 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "协议离婚：流程、冷静期，以及怎么防对方反复 \n 双方都同意，就可以到民政部门办理。有一个 30 天的冷静期，然后 30 天内领证。\n\n小戈夫妻协商好后，9 月 1 日提交申请，到 10 月 1 日冷静期结束，在 10 月 31 日前双方到场领证。如果没去，视为撤回，要重新申请。\n\n前提：双方自愿，对子女抚养、财产、债务有协议，双方都具有完全民事行为能力。\n\n办理：双方亲自到婚姻登记机关，提交离婚登记申请，材料包括身份证、结婚证、离婚协议书、本人的书面声明，具体以当地为准。从 2025 年 5 月 10 日起，办理离婚登记也不再需要户口本，可以在有权限的登记机关办理，不限于户籍地。\n\n冷静期：登记机关收到申请之日起 30 日内，任何一方不愿意离婚的，可以撤回申请（《民法典》第 1077 条）。领证：冷静期满后 30 日内，双方必须亲自到场申请发给离婚证；逾期没去的，视为撤回申请。生效：取得离婚证，婚姻关系解除。\n\n对子女抚养、财产没有达成一致，一方不同意离婚，或一方没有民事行为能力的，不能协议离婚，只能起诉。网页版有冷静期日期计算器：输入提交日，给出冷静期结束日和领证最后一日。\n\n冷静期怎么用？ 把离婚协议再读一遍，找专业人员审核；核对财产清单，补充遗漏；确认子女的安排；跟对方沟通，是不是仍然同意。\n\n怎么防对方反复？ 小葛夫妻在提交申请前，已经把一套房过户给了妻子，申请后的第 25 天，妻子突然撤回了申请。他再想要回房子，只能起诉，打了一年官司。教训是：不要在登记前，就先过户财产、先转账、先搬离，因为一旦撤回，已经履行的内容，会变成争议。财产的变动，放在领到离婚证之后。冷静期，是个保险，也是个漏洞，用好它。\n\n法律依据：《民法典》第 1076 条至第 1078 条；《婚姻登记条例》（2025 年修订）。；《民法典》第 1077 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "086", "title": "离婚协议怎么审：十二项逐条过", "grade": "A", "lead": "离婚协议是有法律约束力的合同。每一项都要写到\"执行时不需要再猜\"的程度。", "html": "<blockquote>离婚协议是有法律约束力的合同。每一项都要写到\"执行时不需要再猜\"的程度。<\/blockquote>\n<p>小秋签了一份离婚协议，写着\"孩子的抚养费，每月合理支付\"。后来对方要求每月 1 万，他认为 3000 够了，吵了几个月，也没有一个\"合理\"的标准可以参考。<\/p>\n<p>逐项核对：<\/p>\n<ol><li><strong>身份信息<\/strong>：双方姓名、身份证号、结婚日期；\n<\/li><li><strong>离婚意愿<\/strong>：双方自愿离婚；\n<\/li><li><strong>子女<\/strong>：谁直接抚养；抚养费金额、支付时间、方式、到何时；教育、医疗等大额费用如何分担；探望的具体时间、地点、接送方式；子女的姓氏、户口、保险；\n<\/li><li><strong>房产<\/strong>：每套的地址、产权证号、登记人；归属，对方是否获得补偿；贷款谁继续还，银行是否同意变更借款人；过户时间、税费谁承担、过户不成的处理；\n<\/li><li><strong>车辆<\/strong>：归属、过户；\n<\/li><li><strong>存款、理财、股票、保险、公积金<\/strong>：账户、金额、分割方式；\n<\/li><li><strong>股权、公司<\/strong>：归属、折价、补偿；\n<\/li><li><strong>债务<\/strong>：共同债务、个人债务，各自承担多少；对债权人的告知；\n<\/li><li><strong>其他<\/strong>：家具家电、贵重物品；\n<\/li><li><strong>违约责任<\/strong>：一方不履行，违约金、对方支付的律师费、诉讼费；\n<\/li><li><strong>兜底条款<\/strong>：双方确认已经全面披露所有共同财产，没有隐瞒；若发现遗漏，另行协商分割；\n<\/li><li><strong>生效条件<\/strong>：自登记离婚之日起生效。\n<\/li><\/ol>\n<p>不要直接下载网上的免费模板填写，每个家庭的情况不一样。范本见附录 I，可以作为起点；签署之前，找律师审阅。口头约定的内容，不写进协议，离婚后没有执行力。一份没写清的协议，比没有协议更贵。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1076 条、第 1087 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 3 条、第 16 条、第 20 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法律依据明确；具体清单属于经验。<\/p>", "text": "离婚协议怎么审：十二项逐条过 \n 离婚协议是有法律约束力的合同。每一项都要写到\"执行时不需要再猜\"的程度。\n\n小秋签了一份离婚协议，写着\"孩子的抚养费，每月合理支付\"。后来对方要求每月 1 万，他认为 3000 够了，吵了几个月，也没有一个\"合理\"的标准可以参考。\n\n逐项核对：\n\n1. 身份信息：双方姓名、身份证号、结婚日期；\n2. 离婚意愿：双方自愿离婚；\n3. 子女：谁直接抚养；抚养费金额、支付时间、方式、到何时；教育、医疗等大额费用如何分担；探望的具体时间、地点、接送方式；子女的姓氏、户口、保险；\n4. 房产：每套的地址、产权证号、登记人；归属，对方是否获得补偿；贷款谁继续还，银行是否同意变更借款人；过户时间、税费谁承担、过户不成的处理；\n5. 车辆：归属、过户；\n6. 存款、理财、股票、保险、公积金：账户、金额、分割方式；\n7. 股权、公司：归属、折价、补偿；\n8. 债务：共同债务、个人债务，各自承担多少；对债权人的告知；\n9. 其他：家具家电、贵重物品；\n10. 违约责任：一方不履行，违约金、对方支付的律师费、诉讼费；\n11. 兜底条款：双方确认已经全面披露所有共同财产，没有隐瞒；若发现遗漏，另行协商分割；\n12. 生效条件：自登记离婚之日起生效。\n\n不要直接下载网上的免费模板填写，每个家庭的情况不一样。范本见附录 I，可以作为起点；签署之前，找律师审阅。口头约定的内容，不写进协议，离婚后没有执行力。一份没写清的协议，比没有协议更贵。\n\n法律依据：《民法典》第 1076 条、第 1087 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 3 条、第 16 条、第 20 条。\n\n把握度：A｜法律依据明确；具体清单属于经验。\n\n"}, {"num": "087", "title": "协议离了，事情就完了吗", "grade": "A", "lead": "拿到离婚证，不等于一了百了。协议里没写清的，都会变成日后的纠纷。", "html": "<blockquote>拿到离婚证，不等于一了百了。协议里没写清的，都会变成日后的纠纷。<\/blockquote>\n<p>很多人以为，拿到离婚证、签了离婚协议，所有的事情就此了结。现实不是这样。<\/p>\n<p>离婚后最常见的几类纠纷：<strong>协议不履行<\/strong>，约定的抚养费、财产过户、补偿款，对方不履行，可以起诉要求履行，拿到判决后申请强制执行，协议经过公证并赋予强制执行效力的，可以直接申请执行，见 <a href=\"#/e/112\">第 112 条<\/a>；<strong>隐匿财产<\/strong>，发现对方离婚前隐藏、转移了财产，可以另行起诉再次分割，三年时效，见 <a href=\"#/e/093\">第 093 条<\/a>；<strong>探望纠纷<\/strong>，约定模糊，对方阻碍探望，见 <a href=\"#/e/108\">第 108 条<\/a>；<strong>债务纠纷<\/strong>，协议里写了谁还，但债权人不受协议约束，见 <a href=\"#/e/091\">第 091 条<\/a>。<\/p>\n<p>所以协议离婚，不是一劳永逸。签协议的那一刻，就要预判后续可能遗留的争议，把条款写完整。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》执行编；《民法典》第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 83 条、第 84 条。<\/p>\n<p><strong>把握度<\/strong>：A｜综合各条，法条明确；具体到个案，要看协议怎么写。<\/p>", "text": "协议离了，事情就完了吗 \n 拿到离婚证，不等于一了百了。协议里没写清的，都会变成日后的纠纷。\n\n很多人以为，拿到离婚证、签了离婚协议，所有的事情就此了结。现实不是这样。\n\n离婚后最常见的几类纠纷：协议不履行，约定的抚养费、财产过户、补偿款，对方不履行，可以起诉要求履行，拿到判决后申请强制执行，协议经过公证并赋予强制执行效力的，可以直接申请执行，见 第 112 条；隐匿财产，发现对方离婚前隐藏、转移了财产，可以另行起诉再次分割，三年时效，见 第 093 条；探望纠纷，约定模糊，对方阻碍探望，见 第 108 条；债务纠纷，协议里写了谁还，但债权人不受协议约束，见 第 091 条。\n\n所以协议离婚，不是一劳永逸。签协议的那一刻，就要预判后续可能遗留的争议，把条款写完整。\n\n法律依据：《民事诉讼法》执行编；《民法典》第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 83 条、第 84 条。\n\n把握度：A｜综合各条，法条明确；具体到个案，要看协议怎么写。\n\n"}, {"num": "088", "title": "离婚时的房子和房贷：银行不同意变更借款人怎么办", "grade": "B", "lead": "离婚协议约束的是你们两个人，不约束银行。房子归谁，贷款谁还，要分开想。", "html": "<blockquote>离婚协议约束的是你们两个人，不约束银行。房子归谁，贷款谁还，要分开想。<\/blockquote>\n<p>小岳和妻子约定房子归他，贷款也由他还。但贷款合同上，借款人是妻子。他去银行申请变更借款人，银行说他收入不够，不同意。房子过不了户，妻子名下还背着这笔贷款，影响她的征信，两人为此反复拉扯了半年。<\/p>\n<p>这是因为，贷款合同是你们和银行之间的合同，离婚协议对银行没有约束力（《民法典》第 465 条：合同仅对当事人具有法律约束力）。<\/p>\n<p>房子的几种处理方式：<\/p>\n<p><strong>拿房子的一方，一次性还清贷款<\/strong>，最干净，需要资金；<strong>申请变更借款人<\/strong>，需要银行同意，看收入、征信；<strong>找担保人，或者用其他资产置换担保<\/strong>，与银行协商；<strong>房子先不过户，借款人继续还，另一方按月补偿<\/strong>，风险较大，要写清违约责任；<strong>卖掉，分钱<\/strong>，最简单，但可能不是双方想要的。<\/p>\n<p>协议里要写：谁负责还贷，还到什么时候；银行不同意变更时的备选方案；一方不还贷，导致另一方征信受损时的违约责任；过户的时间和税费。<\/p>\n<p>最重要的一条：<strong>先和银行沟通，再签协议<\/strong>，避免签了才发现银行不同意。贷款还没还清的房产，办理过户，通常需要银行同意，或先结清，具体流程以当地不动产登记中心和银行为准。<\/p>\n<p>银行只认借款合同。别让一份离婚协议，替你做它做不了的决定。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 465 条（合同的相对性）、第 1087 条。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实和银行政策。<\/p>", "text": "离婚时的房子和房贷：银行不同意变更借款人怎么办 \n 离婚协议约束的是你们两个人，不约束银行。房子归谁，贷款谁还，要分开想。\n\n小岳和妻子约定房子归他，贷款也由他还。但贷款合同上，借款人是妻子。他去银行申请变更借款人，银行说他收入不够，不同意。房子过不了户，妻子名下还背着这笔贷款，影响她的征信，两人为此反复拉扯了半年。\n\n这是因为，贷款合同是你们和银行之间的合同，离婚协议对银行没有约束力（《民法典》第 465 条：合同仅对当事人具有法律约束力）。\n\n房子的几种处理方式：\n\n拿房子的一方，一次性还清贷款，最干净，需要资金；申请变更借款人，需要银行同意，看收入、征信；找担保人，或者用其他资产置换担保，与银行协商；房子先不过户，借款人继续还，另一方按月补偿，风险较大，要写清违约责任；卖掉，分钱，最简单，但可能不是双方想要的。\n\n协议里要写：谁负责还贷，还到什么时候；银行不同意变更时的备选方案；一方不还贷，导致另一方征信受损时的违约责任；过户的时间和税费。\n\n最重要的一条：先和银行沟通，再签协议，避免签了才发现银行不同意。贷款还没还清的房产，办理过户，通常需要银行同意，或先结清，具体流程以当地不动产登记中心和银行为准。\n\n银行只认借款合同。别让一份离婚协议，替你做它做不了的决定。\n\n法律依据：《民法典》第 465 条（合同的相对性）、第 1087 条。\n\n把握度：B｜依个案事实和银行政策。\n\n"}, {"num": "089", "title": "抚养费怎么写：写模糊了，要吃亏一辈子", "grade": "A", "lead": "抚养费要写金额、时间、方式、期限、调整条件。写得越具体，将来越少争议。", "html": "<blockquote>抚养费要写金额、时间、方式、期限、调整条件。写得越具体，将来越少争议。<\/blockquote>\n<p>小魏月收入 1.5 万，按 20% 至 30% 的标准，一个孩子的抚养费应该是每月 3000 到 4500 元。他在协议里写\"每月 4000 元，教育医疗大额费用另行协商\"。后来孩子上私立学校，对方要他承担一半的学费，他没想到这一条，吵了半年。<\/p>\n<p>怎么写？<\/p>\n<ul><li><strong>金额<\/strong>：有固定收入的，一般为月总收入的 20% 至 30%；两个以上子女，可以适当提高，但一般不超过月总收入的 50%（《婚姻家庭编解释（一）》第 49 条）。网页版有抚养费计算器。\n<\/li><li><strong>支付方式<\/strong>：每月几号，转到哪个账户，用什么方式。\n<\/li><li><strong>期限<\/strong>：一般到孩子 18 周岁；孩子已满 16 周岁不满 18 周岁，以自己的劳动收入为主要生活来源，并能维持当地一般生活水平的，可以不支付（第 53 条）。\n<\/li><li><strong>范围<\/strong>：生活费、教育费、医疗费；大额教育、医疗费用（私立学校、手术），另行约定如何分担。\n<\/li><li><strong>调整条件<\/strong>：双方收入发生重大变化时，可以重新协商。\n<\/li><li><strong>一次性给付<\/strong>：可以约定，但要写明\"一次性结清\"的金额，并预留孩子特殊情况下的请求。\n<\/li><\/ul>\n<p>还要知道两条规则。第一，离婚协议里约定一方直接抚养、另一方不负担抚养费的，该约定对双方有约束力；但直接抚养的一方经济状况发生变化，导致孩子生活水平显著下降，或孩子必要的费用显著增加的，孩子可以请求另一方负担（《婚姻家庭编解释（二）》第 16 条）。第二，不按协议支付的，要补足；孩子成年后，直接抚养的一方也可以主张拖欠的部分（第 17 条）。<\/p>\n<p>承诺的金额写入协议后，想降低，需要另行起诉并举证，难度较大。不要因为一时的情绪，答应超出能力的金额。抚养费一旦写进协议，十八年是个很长的数字。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1085 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 49 条、第 53 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 16 条、第 17 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "抚养费怎么写：写模糊了，要吃亏一辈子 \n 抚养费要写金额、时间、方式、期限、调整条件。写得越具体，将来越少争议。\n\n小魏月收入 1.5 万，按 20% 至 30% 的标准，一个孩子的抚养费应该是每月 3000 到 4500 元。他在协议里写\"每月 4000 元，教育医疗大额费用另行协商\"。后来孩子上私立学校，对方要他承担一半的学费，他没想到这一条，吵了半年。\n\n怎么写？\n\n 金额：有固定收入的，一般为月总收入的 20% 至 30%；两个以上子女，可以适当提高，但一般不超过月总收入的 50%（《婚姻家庭编解释（一）》第 49 条）。网页版有抚养费计算器。\n 支付方式：每月几号，转到哪个账户，用什么方式。\n 期限：一般到孩子 18 周岁；孩子已满 16 周岁不满 18 周岁，以自己的劳动收入为主要生活来源，并能维持当地一般生活水平的，可以不支付（第 53 条）。\n 范围：生活费、教育费、医疗费；大额教育、医疗费用（私立学校、手术），另行约定如何分担。\n 调整条件：双方收入发生重大变化时，可以重新协商。\n 一次性给付：可以约定，但要写明\"一次性结清\"的金额，并预留孩子特殊情况下的请求。\n\n还要知道两条规则。第一，离婚协议里约定一方直接抚养、另一方不负担抚养费的，该约定对双方有约束力；但直接抚养的一方经济状况发生变化，导致孩子生活水平显著下降，或孩子必要的费用显著增加的，孩子可以请求另一方负担（《婚姻家庭编解释（二）》第 16 条）。第二，不按协议支付的，要补足；孩子成年后，直接抚养的一方也可以主张拖欠的部分（第 17 条）。\n\n承诺的金额写入协议后，想降低，需要另行起诉并举证，难度较大。不要因为一时的情绪，答应超出能力的金额。抚养费一旦写进协议，十八年是个很长的数字。\n\n法律依据：《民法典》第 1085 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 49 条、第 53 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 16 条、第 17 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "090", "title": "假离婚变真离婚：你赌得起吗", "grade": "A", "lead": "法律上没有\"假离婚\"。拿了离婚证就是真离了，事后想以\"当时是假的\"来推翻，不被支持。", "html": "<blockquote>法律上没有\"假离婚\"。拿了离婚证就是真离了，事后想以\"当时是假的\"来推翻，不被支持。<\/blockquote>\n<p>小施夫妻为了买第二套房的资格，\"假离婚\"，约好办完再复婚。结果女方在离婚后不愿复婚，房产也已经按离婚协议归属了她。他想以\"当初是假的\"来推翻，法院不支持。<\/p>\n<p>《婚姻家庭编解释（二）》第 2 条规定：夫妻登记离婚后，一方以双方意思表示虚假为由，请求确认离婚无效的，法院不予支持。<\/p>\n<p>风险有哪些？对方不愿意复婚；离婚协议里的财产分割条款生效，财产归属发生变动；对方把财产转给第三人，或者再婚；孩子的抚养权、抚养费等安排，生效后需要履行。即使有书面的\"复婚协议\"，法院也难以强制对方复婚。<\/p>\n<p>如果确有购房、贷款方面的政策考虑：先咨询当地住建部门、银行，确认政策本身是否允许；各地的限购、贷款政策，对此规定不同，以当地为准；评估风险：你愿不愿意承担对方不复婚的后果。<\/p>\n<p>不建议。离婚证拿到手的那一刻，一切都是真的。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 2 条；《民法典》第 1078 条、第 1080 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "假离婚变真离婚：你赌得起吗 \n 法律上没有\"假离婚\"。拿了离婚证就是真离了，事后想以\"当时是假的\"来推翻，不被支持。\n\n小施夫妻为了买第二套房的资格，\"假离婚\"，约好办完再复婚。结果女方在离婚后不愿复婚，房产也已经按离婚协议归属了她。他想以\"当初是假的\"来推翻，法院不支持。\n\n《婚姻家庭编解释（二）》第 2 条规定：夫妻登记离婚后，一方以双方意思表示虚假为由，请求确认离婚无效的，法院不予支持。\n\n风险有哪些？对方不愿意复婚；离婚协议里的财产分割条款生效，财产归属发生变动；对方把财产转给第三人，或者再婚；孩子的抚养权、抚养费等安排，生效后需要履行。即使有书面的\"复婚协议\"，法院也难以强制对方复婚。\n\n如果确有购房、贷款方面的政策考虑：先咨询当地住建部门、银行，确认政策本身是否允许；各地的限购、贷款政策，对此规定不同，以当地为准；评估风险：你愿不愿意承担对方不复婚的后果。\n\n不建议。离婚证拿到手的那一刻，一切都是真的。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 2 条；《民法典》第 1078 条、第 1080 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "091", "title": "协议里的两个陷阱：躲债，和写给孩子的财产", "grade": "A", "lead": "离婚协议不是万能的。有两类条款，写错了会反咬你一口。", "html": "<blockquote>离婚协议不是万能的。有两类条款，写错了会反咬你一口。<\/blockquote>\n<p><strong>第一个陷阱：想靠离婚躲债。<\/strong> 小葛欠了 100 万，离婚协议里把房子和存款都分给了妻子，自己净身出户。债权人发现后起诉，要求撤销协议中这部分条款。法院结合整体分割情况和履行情况，可以支持撤销。<\/p>\n<p>夫妻一方的债权人，有证据证明离婚协议中的财产分割条款影响其债权实现，可以请求撤销相应的条款（《婚姻家庭编解释（二）》第 3 条；《民法典》第 538 条、第 539 条）。法院会综合考虑：财产分割的整体情况，是否履行，子女抚养负担，双方过错。对有债务的一方来说，不要以离婚来逃避债务；协议里写明债务承担，对债权人不产生约束力；损害债权的条款可能被撤销，到时候财产要重新面对债权人，纠纷反而更大。对没有债务的一方来说，对方有大额债务时，离婚后财产不一定能保住，协议里要写清楚债务的承担。<\/p>\n<p><strong>第二个陷阱：把财产写给孩子，又想反悔。<\/strong> 小葛夫妻在离婚协议里写\"房子归孩子\"，但没写过户时间和代持人。离婚一年后，小葛想改主意，对方不同意。法院不支持他单方撤销。<\/p>\n<p>《婚姻家庭编解释（二）》第 20 条：离婚后，一方在财产权利转移之前，请求撤销该约定的，法院不予支持，但另一方同意的除外。一方不履行的，另一方可以请求履行或赔偿；协议里明确约定子女可以直接请求交付的，子女可以直接主张；因欺诈、胁迫签订的，可以请求撤销。<\/p>\n<p>怎么写？约定给孩子的财产，写清楚：财产名称、价值、归属、过户时间、由谁代管直到孩子成年；不要只写\"房子给孩子\"，要写由谁保管，如果出售，收益归谁；想保留一定的灵活度，写明条件。<\/p>\n<p>躲债的离婚，躲不掉债，也躲不掉后果。写给孩子的，就是孩子的，别拿孩子当筹码。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 3 条；《民法典》第 538 条、第 539 条（债权人撤销权）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 35 条。；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 20 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "协议里的两个陷阱：躲债，和写给孩子的财产 \n 离婚协议不是万能的。有两类条款，写错了会反咬你一口。\n\n第一个陷阱：想靠离婚躲债。 小葛欠了 100 万，离婚协议里把房子和存款都分给了妻子，自己净身出户。债权人发现后起诉，要求撤销协议中这部分条款。法院结合整体分割情况和履行情况，可以支持撤销。\n\n夫妻一方的债权人，有证据证明离婚协议中的财产分割条款影响其债权实现，可以请求撤销相应的条款（《婚姻家庭编解释（二）》第 3 条；《民法典》第 538 条、第 539 条）。法院会综合考虑：财产分割的整体情况，是否履行，子女抚养负担，双方过错。对有债务的一方来说，不要以离婚来逃避债务；协议里写明债务承担，对债权人不产生约束力；损害债权的条款可能被撤销，到时候财产要重新面对债权人，纠纷反而更大。对没有债务的一方来说，对方有大额债务时，离婚后财产不一定能保住，协议里要写清楚债务的承担。\n\n第二个陷阱：把财产写给孩子，又想反悔。 小葛夫妻在离婚协议里写\"房子归孩子\"，但没写过户时间和代持人。离婚一年后，小葛想改主意，对方不同意。法院不支持他单方撤销。\n\n《婚姻家庭编解释（二）》第 20 条：离婚后，一方在财产权利转移之前，请求撤销该约定的，法院不予支持，但另一方同意的除外。一方不履行的，另一方可以请求履行或赔偿；协议里明确约定子女可以直接请求交付的，子女可以直接主张；因欺诈、胁迫签订的，可以请求撤销。\n\n怎么写？约定给孩子的财产，写清楚：财产名称、价值、归属、过户时间、由谁代管直到孩子成年；不要只写\"房子给孩子\"，要写由谁保管，如果出售，收益归谁；想保留一定的灵活度，写明条件。\n\n躲债的离婚，躲不掉债，也躲不掉后果。写给孩子的，就是孩子的，别拿孩子当筹码。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 3 条；《民法典》第 538 条、第 539 条（债权人撤销权）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 35 条。；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 20 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "092", "title": "签字前先盘家底：十类财产，一个都别漏", "grade": "A", "lead": "协议再好，漏了一项资产，就是漏了。不盘家底就签字，等于闭着眼睛签。", "html": "<blockquote>协议再好，漏了一项资产，就是漏了。不盘家底就签字，等于闭着眼睛签。<\/blockquote>\n<p>小景签完离婚协议，一年后才发现对方名下有一份他不知情的保险，现金价值 20 万。协议里有\"兜底条款\"，他才有了另行主张的依据。<\/p>\n<p>签字之前，十类财产，一个一个核对：<\/p>\n<ol><li><strong>不动产<\/strong>：到不动产登记中心查询名下房产；\n<\/li><li><strong>车辆<\/strong>：到车管所查询；\n<\/li><li><strong>银行账户<\/strong>：自己的账户，自己可以查；对方的，通过协商要求对方提供；\n<\/li><li><strong>理财、基金、证券<\/strong>：核对证券账户；\n<\/li><li><strong>保险<\/strong>：保单清单，现金价值；\n<\/li><li><strong>公积金、社保、养老账户<\/strong>：可以自己查询自己的，也要求对方提供；\n<\/li><li><strong>股权、合伙份额<\/strong>：通过企业信用信息公示系统、工商信息，查询对方持有的企业；\n<\/li><li><strong>债权债务<\/strong>：借条、债权、担保；\n<\/li><li><strong>虚拟资产、数字资产<\/strong>：支付宝、微信、交易所账户；\n<\/li><li><strong>隐性资产<\/strong>：收藏品、贵金属、大额现金。\n<\/li><\/ol>\n<p>查询要合法：自己的信息，自己查；对方的信息，通过协商要求对方书面提供；协商不成，可以在诉讼中申请法院调查，或者律师调查令；不得通过非法手段获取对方的个人信息。清单表格见附录 N。<\/p>\n<p>漏项怎么补救？协议里写明：若发现遗漏，另行分割。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1087 条、第 1092 条；《民事诉讼法》第 67 条。<\/p>\n<p><strong>把握度<\/strong>：A｜原则明确；清单属于经验。<\/p>", "text": "签字前先盘家底：十类财产，一个都别漏 \n 协议再好，漏了一项资产，就是漏了。不盘家底就签字，等于闭着眼睛签。\n\n小景签完离婚协议，一年后才发现对方名下有一份他不知情的保险，现金价值 20 万。协议里有\"兜底条款\"，他才有了另行主张的依据。\n\n签字之前，十类财产，一个一个核对：\n\n1. 不动产：到不动产登记中心查询名下房产；\n2. 车辆：到车管所查询；\n3. 银行账户：自己的账户，自己可以查；对方的，通过协商要求对方提供；\n4. 理财、基金、证券：核对证券账户；\n5. 保险：保单清单，现金价值；\n6. 公积金、社保、养老账户：可以自己查询自己的，也要求对方提供；\n7. 股权、合伙份额：通过企业信用信息公示系统、工商信息，查询对方持有的企业；\n8. 债权债务：借条、债权、担保；\n9. 虚拟资产、数字资产：支付宝、微信、交易所账户；\n10. 隐性资产：收藏品、贵金属、大额现金。\n\n查询要合法：自己的信息，自己查；对方的信息，通过协商要求对方书面提供；协商不成，可以在诉讼中申请法院调查，或者律师调查令；不得通过非法手段获取对方的个人信息。清单表格见附录 N。\n\n漏项怎么补救？协议里写明：若发现遗漏，另行分割。\n\n法律依据：《民法典》第 1087 条、第 1092 条；《民事诉讼法》第 67 条。\n\n把握度：A｜原则明确；清单属于经验。\n\n"}, {"num": "093", "title": "离婚后才发现被瞒了：三年内还能追", "grade": "A", "lead": "离婚后发现对方隐瞒了财产，可以另行起诉再分割，时效三年，从发现之日起算。", "html": "<blockquote>离婚后发现对方隐瞒了财产，可以另行起诉再分割，时效三年，从发现之日起算。<\/blockquote>\n<p>小肖离婚两年后，发现前妻在离婚前把 60 万转给了朋友，以\"借款\"的名义，但借条是后补的。他在发现之日起三年内起诉，请求再次分割。<\/p>\n<p>《民法典》第 1092 条规定：一方隐藏、转移、变卖、毁损、挥霍夫妻共同财产，或者伪造夫妻共同债务企图侵占另一方财产的，分割时，对该方可以少分或不分；离婚后，另一方发现的，可以向法院提起诉讼，请求再次分割。诉讼时效是三年，从发现之日起算（《婚姻家庭编解释（一）》第 84 条）。<\/p>\n<p>具体有几种情形：发现对方隐藏、转移、变卖、毁损夫妻共同财产，可以另行起诉，请求再次分割，对该方可以少分或不分；发现有遗漏、没处理的共同财产，可以另行起诉分割（第 83 条）；协议因欺诈、胁迫签订的，可以请求撤销。<\/p>\n<p>起诉前要准备：对方隐瞒财产的证据；时间线，什么时候发现的；评估价值。<\/p>\n<p>离婚不是终点，发现之日起的三年内，都有机会补救。所以签协议时，保留\"兜底条款\"，就是保留日后主张的权利。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 83 条、第 84 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "离婚后才发现被瞒了：三年内还能追 \n 离婚后发现对方隐瞒了财产，可以另行起诉再分割，时效三年，从发现之日起算。\n\n小肖离婚两年后，发现前妻在离婚前把 60 万转给了朋友，以\"借款\"的名义，但借条是后补的。他在发现之日起三年内起诉，请求再次分割。\n\n
