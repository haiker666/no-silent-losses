话术（<a href=\"#/e/084\">第 084 条<\/a>）<\/h5>\n<ul><li>\"我最看重的是孩子，你最看重的是什么？我们先把这两件事列出来。\"\n<\/li><li>\"房子和存款，我们先各自把清单列出来，对一遍，再谈怎么分。\"\n<\/li><li>\"这一项我可以让，但我想在探望时间上多一些，你看行吗？\"\n<\/li><li>\"你的这个要求，我需要回去想想，这个星期五给你答复。\"\n<\/li><\/ul>\n<h3>第九章　离婚诉讼<\/h3>\n<h5>收到法院的起诉状和传票：被告第一周怎么做（<a href=\"#/e/097\">第 097 条<\/a>）<\/h5>\n<ul><li>\"答辩人（被告）×××，针对原告 ××× 的诉讼请求，现答辩如下：（一）是否同意离婚：同意／不同意，理由是……（二）关于子女抚养：……（三）关于财产分割：……\"\n<\/li><\/ul>\n<h5>出庭怎么说：法庭上的十件事（<a href=\"#/e/098\">第 098 条<\/a>）<\/h5>\n<ul><li>\"对这份证据的真实性没有异议，但关联性有异议，理由是……\"\n<\/li><li>\"我不清楚这个情况，没有证据，我不确定。\"\n<\/li><li>\"请求法院判决由我直接抚养孩子，理由有三点：第一……第二……第三……\"\n<\/li><\/ul>\n<h3>第十章　离婚之后<\/h3>\n<h5>离婚后怎么和前任一起养孩子（<a href=\"#/e/114\">第 114 条<\/a>）<\/h5>\n<ul><li>\"关于孩子下学期的兴趣班，我想听听你的意见，你有空时我们在群里说一下。\"\n<\/li><li>\"这周六的接送我有点事，能不能提前一天？我可以多补一次。\"\n<\/li><\/ul>\n<h3>第十一章　已婚男性生存指南<\/h3>\n<h5>做个在场的父亲：陪伴也是最好的证据（<a href=\"#/e/120\">第 120 条<\/a>）<\/h5>\n<ul><li>\"爸爸妈妈决定不住在一起了，这不是你的错。爸爸和妈妈都很爱你，这一点不会变。以后你有一些时间和妈妈住，一些时间和爸爸住，我们会提前告诉你。\"\n<\/li><\/ul>", "text": "# 话术手册：可以直接说、直接写的话\n\n> 这是全书所有\"可以这样说\"的汇总，按章排列，每段后面标了出处。照着说，别照着念：把名字、金额、日期换成你自己的。\n> 话术只是一个起点。对方情绪激动、涉及威胁或人身安全的时候，先保证安全，再谈话术。\n\n## 第一章　恋爱里的钱\n\n#### 对方总在要钱：是真有需要，还是在拿捏你（第 005 条）\n\n- \"每月我可以拿出 2000 元给你应急，超过的部分我给不了。你要用大额，告诉我是做什么，我们一起想办法。\"\n\n#### \"你不给我就去死\"：怎么回应，才不被拖下水（第 006 条）\n\n- \"我很担心你，现在你的安全最重要。我先联系你家人来陪你，我们都冷静一下，钱和分手的事，等你稳定了再谈。\"\n\n#### 分手后要钱：先说，再发函，最后起诉（第 007 条）\n\n- \"× 年 × 月 × 日，我转给你 8 万元，我们当时说好是用来办婚礼的。现在婚事不办了，请你在 × 月 × 日前退回。如果你有不同看法，请告诉我。\"\n\n#### 不肯付出的关系：什么时候该止损（第 008 条）\n\n- \"我们平时吃饭轮流买单，大额的东西提前商量，借钱写个借条，这样我们都轻松，好吗？\"\n\n#### 转账备注写\"爱你\"，这钱可能就要不回来（第 009 条）\n\n- 借款：\"这笔 3 万我借你，下个月 30 号前还我，可以吗？\"（等对方回复\"可以\"\"好\"）\n- 为结婚：\"这 10 万是我们说好的婚礼和彩礼用的钱，婚事办成就算数，办不成就退给我，你确认一下？\"\n- 代偿：\"你那张卡我先替你还了，4000 块，这个月底你转给我。\"\n\n#### 大额转账，怎么证明是\"为了结婚\"才给的（第 010 条）\n\n- \"× 年 × 月 × 日，我给你转了 20 万，我们当时说好是用来办婚礼的。现在婚事办不成，请你按照我们的约定退还。你有不同意见，请说明。\"\n\n#### 恋人借钱，借条怎么写才不怕翻脸（第 011 条）\n\n- \"你要借的这 3 万，我们写个简单的借条吧，不是不信任你，是怕以后我们自己都记不清。写上还款日期就行。\"\n\n#### 替对方还了信用卡和网贷，分手后能要回来吗（第 012 条）\n\n- \"你那张卡 6 万我先替你还了，我们说好，你从下个月开始每月还我 5000，还清为止。你回复一下。\"\n\n#### 吵到最凶的时候：不转账，不签字，不认错（第 015 条）\n\n- \"我听到你说的了，我现在情绪也不太好，我们明天上午再谈，好吗？\"\n- \"这件事我需要和家人商量一下，之后给你答复。\"\n- \"我不会在这种状态下做决定，也不会签任何东西。\"\n\n#### 三年一过，钱就难要了（第 016 条）\n\n- \"×× 你好，你于 2022 年 3 月向我借款 2 万元，约定 2022 年 9 月 30 日归还，至今未还。请于 ×× 月 ×× 日前还清。本信息作为正式催收，请你确认收到。\"\n\n## 第二章　红线与保命\n\n#### 接到警察电话，前二十四小时怎么走（第 021 条）\n\n- \"我愿意配合，但我需要先联系律师，律师到场之前，我不回答。\"\n- \"这个笔录我没有看完，我看完再签。\"\n- \"这一句不是我的意思，请改成……\"\n\n#### \"不给钱我就报警\"：什么时候从讨债变成敲诈（第 023 条）\n\n- \"你这样要求我付钱，我不会同意。我会把我们的聊天记录交给警方处理。\"（说完后，务必把记录交出去，不要只是说说。）\n\n## 第三章　同居与孩子\n\n#### 同居一起买房买车，出资和约定一个都别漏（第 030 条）\n\n- \"我们一起买这套房，写个简单的协议吧：首付 30 万，你出 10 万、我出 20 万，登记在我名下，将来如果分开，我按你出的份额补偿你。\"\n\n#### 孩子是不是亲生的，怎么验才合法（第 033 条）\n\n- \"我想和你一起去做一个正规的亲子鉴定，为了孩子，也为了我们都放心。我们一起去，这样结果大家都认。\"\n\n## 第四章　彩礼纠纷\n\n#### 给彩礼，别给现金（第 037 条）\n\n- \"订婚的这笔 18 万，我们家是按当地的规矩给的，转到您账上。我们把这个写一下，万一以后有变化，彼此都有依据，您看行吗？\"\n\n#### 漫天要价，算不算\"借婚姻要钱\"（第 040 条）\n\n- \"我们家能拿出 15 万，这是我们的上限，再多我们确实拿不出。如果你们觉得不够，我们再商量别的办法，或者我们都再想想。\"\n\n## 第五章　婚前准备\n\n#### 婚检：不是走形式，是保住你的知情权（第 045 条）\n\n- \"我们结婚前去做个婚检吧，我们都做，你的我不看你的隐私细节，只是为了我们都放心。\"\n\n#### 看钱怎么花，也看家怎么过（第 048 条）\n\n- \"我们结婚前，把各自的收入、存款和负债都摊开来看一下，不是互相审查，是为了一起做个婚后的预算，你觉得呢？\"\n\n#### 怎么开口提婚前协议：最难的是第一句（第 051 条）\n\n- \"我想跟你聊一件事，不是不信任你，是我觉得我们结婚前，把钱和房的事都想清楚，以后能少很多吵架。\"\n- \"我先把我的情况都摊开：我有一套婚前买的房，贷款还有 40 万，存款 20 万。你也把你的情况告诉我，我们各自找个律师看看，一起定一份。\"\n- \"如果你觉得有哪一条不舒服，我们可以一起改。这份协议对我们两个人都适用。\"\n\n## 第六章　共同财产和婚内协议\n\n#### 爸妈出钱买房，算谁的（第 061 条）\n\n- \"我们夫妻二人，于 ×× 年 × 月 × 日，向儿子 ××× 转账 60 万元，用于购买位于 ×× 的房屋。该笔款项系我们对儿子 ××× 个人的赠与，不属于其夫妻共同财产。\"（签字、日期）\n\n## 第七章　读懂另一半\n\n#### \"家里不讲理\"：怎么把吵架变成商量（第 071 条）\n\n- \"我们先停一下。我现在也有情绪，明天晚上吃完饭我们再聊这件事，好吗？\"\n- \"你说我 PUA 你，我想知道具体是哪句话、哪件事，我们就这件事聊。\"\n- \"我们约定一下：吵架的时候，不提离婚，也不翻旧账，行吗？\"\n\n#### 钱和态度：家里的账怎么记才不吵（第 073 条）\n\n- \"我们每季度花半小时，把家里的账对一下，不是查你，是我们一起看看钱花到哪了，以后有什么要调整的。\"\n\n#### 对方家人持续要钱、要房、要你表态：边界怎么设（第 075 条）\n\n- \"妈，这个事我和 ×× 商量一下，周末给您答复。\"\n- \"我们能支持 2 万，一次性的。你们看这样行不行？如果不够，我们也再想想办法。\"\n- 对配偶：\"我们定一个双方家里都适用的规则，好吗？每年每边最多多少，超出的我们商量。\"\n\n## 第八章　离婚协议\n\n#### 发现对方出轨：第一周该做什么，不该做什么（第 081 条）\n\n- \"我已经知道这件事了。我现在不想吵，也不想做任何决定。我们都先冷静几天，之后找时间好好谈，我也会找律师了解我的权利。\"\n\n#### 对方写的\"保证书\"\"认错书\"有用吗（第 082 条）\n\n- \"我们都先冷静一下。我想把你的承诺写下来，不是为了逼你，是为了我们以后都有依据。\"\n- \"这份东西我先拿回去看看，明天再给你答复。\"（被要求写的一方）\n\n#### 离婚谈判怎么谈：底线、让步顺序、话术（第 084 条）\n\n- \"我最看重的是孩子，你最看重的是什么？我们先把这两件事列出来。\"\n- \"房子和存款，我们先各自把清单列出来，对一遍，再谈怎么分。\"\n- \"这一项我可以让，但我想在探望时间上多一些，你看行吗？\"\n- \"你的这个要求，我需要回去想想，这个星期五给你答复。\"\n\n## 第九章　离婚诉讼\n\n#### 收到法院的起诉状和传票：被告第一周怎么做（第 097 条）\n\n- \"答辩人（被告）×××，针对原告 ××× 的诉讼请求，现答辩如下：（一）是否同意离婚：同意／不同意，理由是……（二）关于子女抚养：……（三）关于财产分割：……\"\n\n#### 出庭怎么说：法庭上的十件事（第 098 条）\n\n- \"对这份证据的真实性没有异议，但关联性有异议，理由是……\"\n- \"我不清楚这个情况，没有证据，我不确定。\"\n- \"请求法院判决由我直接抚养孩子，理由有三点：第一……第二……第三……\"\n\n## 第十章　离婚之后\n\n#### 离婚后怎么和前任一起养孩子（第 114 条）\n\n- \"关于孩子下学期的兴趣班，我想听听你的意见，你有空时我们在群里说一下。\"\n- \"这周六的接送我有点事，能不能提前一天？我可以多补一次。\"\n\n## 第十一章　已婚男性生存指南\n\n#### 做个在场的父亲：陪伴也是最好的证据（第 120 条）\n\n- \"爸爸妈妈决定不住在一起了，这不是你的错。爸爸和妈妈都很爱你，这一点不会变。以后你有一些时间和妈妈住，一些时间和爸爸住，我们会提前告诉你。\"\n\n"}, {"id": "后记", "label": "后记", "html": "<h2>后记<\/h2>\n<p>写完这本书，我最想说的，只有几句。<\/p>\n<p>书里所有的内容，都是基于现行的法律条文和公开的典型案例。书里的例子和规则，只能作为参考，不能替代律师对你案子的一对一分析。法条是固定的，但每一段感情、每一起纠纷，细节千差万别。同样的行为，细微的事实差别，裁判的走向就会完全不同。<\/p>\n<p>这本书的初衷，不是制造两性对立，不是教人算计伴侣。它希望男性可以在亲密关系里，同时拥有真诚和理性。<\/p>\n<p>真诚，是对感情保有善意；理性，是看懂婚恋里潜藏的财产和人身风险。善意不需要裸奔，真诚可以搭配自我保护。<\/p>\n<p>婚恋的本质，是两个人自愿合作经营一段生活。合作的前提，是双方权责对等，双向付出。当合作无法继续，你也清楚自己的权利和风险，知道如何体面、合法地保护自己。<\/p>\n<p>不要等到付出巨大的代价之后，才去学习这些规则。最好的避险，是在风险到来之前，看懂规则，守住边界。<\/p>\n<p>如果你正在经历其中的某一件事，先深呼吸，再翻回《救急卡》。如果你已经走过来了，希望这本书能帮你少走一点弯路，也帮你身边的人，少吃一点说不出口的亏。<\/p>\n<p>最后，书里一定还有错。法条会变，口径各地不同，我也可能写错。发现了，请告诉我。<\/p>", "text": "# 后记\n\n写完这本书，我最想说的，只有几句。\n\n书里所有的内容，都是基于现行的法律条文和公开的典型案例。书里的例子和规则，只能作为参考，不能替代律师对你案子的一对一分析。法条是固定的，但每一段感情、每一起纠纷，细节千差万别。同样的行为，细微的事实差别，裁判的走向就会完全不同。\n\n这本书的初衷，不是制造两性对立，不是教人算计伴侣。它希望男性可以在亲密关系里，同时拥有真诚和理性。\n\n真诚，是对感情保有善意；理性，是看懂婚恋里潜藏的财产和人身风险。善意不需要裸奔，真诚可以搭配自我保护。\n\n婚恋的本质，是两个人自愿合作经营一段生活。合作的前提，是双方权责对等，双向付出。当合作无法继续，你也清楚自己的权利和风险，知道如何体面、合法地保护自己。\n\n不要等到付出巨大的代价之后，才去学习这些规则。最好的避险，是在风险到来之前，看懂规则，守住边界。\n\n如果你正在经历其中的某一件事，先深呼吸，再翻回《救急卡》。如果你已经走过来了，希望这本书能帮你少走一点弯路，也帮你身边的人，少吃一点说不出口的亏。\n\n最后，书里一定还有错。法条会变，口径各地不同，我也可能写错。发现了，请告诉我。\n"}], "apps": [{"id": "A-法条速查表", "title": "附录 A　法条速查表", "html": "<h2>附录 A　法条速查表<\/h2>\n<p>核对时点：2026 年 10 月。凡标\"待核实\"的，请以官方文本为准。官方文本查询：国家法律法规数据库、最高人民法院官网（court.gov.cn）。<\/p>\n<h3>一、民法典（婚姻家庭编及相关）<\/h3>\n<div class='tw'><table><thead><tr><th>主题<\/th><th>条文<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>禁止借婚姻索取财物<\/td><td>第 1042 条第 1 款<\/td><td>禁止借婚姻索取财物<\/td><\/tr><tr><td>禁止家暴、重婚、有配偶者与他人同居<\/td><td>第 1042 条第 2、3 款<\/td><td>禁止重婚、有配偶者与他人同居、家庭暴力、虐待遗弃<\/td><\/tr><tr><td>无效婚姻<\/td><td>第 1051 条<\/td><td>重婚；有禁止结婚的亲属关系；未到法定婚龄<\/td><\/tr><tr><td>胁迫结婚的撤销<\/td><td>第 1052 条<\/td><td>一年内请求撤销<\/td><\/tr><tr><td>重大疾病不告知<\/td><td>第 1053 条<\/td><td>登记前应告知；不告知，另一方可请求撤销，一年内<\/td><\/tr><tr><td>婚姻无效或被撤销的后果<\/td><td>第 1054 条<\/td><td>自始没有法律约束力；无过错方可请求赔偿<\/td><\/tr><tr><td>夫妻平等<\/td><td>第 1055 条<\/td><td>夫妻在婚姻家庭中地位平等<\/td><\/tr><tr><td>抚养教育子女<\/td><td>第 1058 条<\/td><td>夫妻双方平等享有权利，共同承担义务<\/td><\/tr><tr><td>夫妻互相扶养<\/td><td>第 1059 条<\/td><td>需要扶养的一方有权要求对方给付扶养费<\/td><\/tr><tr><td>日常家事代理<\/td><td>第 1060 条<\/td><td>日常生活需要实施的民事法律行为，对夫妻双方发生效力<\/td><\/tr><tr><td>夫妻共同财产<\/td><td>第 1062 条<\/td><td>工资奖金、经营投资收益、知识产权收益、继承赠与（除外情形）、其他<\/td><\/tr><tr><td>夫妻个人财产<\/td><td>第 1063 条<\/td><td>婚前财产、人身损害赔偿、明确只归一方的遗赠或赠与、专用生活用品、其他<\/td><\/tr><tr><td>夫妻债务<\/td><td>第 1064 条<\/td><td>共同签名或追认；日常家庭生活需要；超出的，债权人要证明用于共同生活或共同意思表示<\/td><\/tr><tr><td>约定财产制<\/td><td>第 1065 条<\/td><td>书面约定；对双方有约束力；对外债务，第三人知道约定的，以个人财产清偿<\/td><\/tr><tr><td>婚内分割<\/td><td>第 1066 条<\/td><td>一方隐藏转移变卖毁损挥霍等，或负有法定扶养义务的人患重大疾病不同意支付医疗费<\/td><\/tr><tr><td>子女与父母的权利义务<\/td><td>第 1067 条<\/td><td>成年子女对父母有赡养扶助义务<\/td><\/tr><tr><td>继父母继子女<\/td><td>第 1072 条<\/td><td>受其抚养教育的，适用父母子女关系的规定<\/td><\/tr><tr><td>亲子关系异议<\/td><td>第 1073 条<\/td><td>有正当理由的，可请求确认或否认亲子关系<\/td><\/tr><tr><td>协议离婚<\/td><td>第 1076 条<\/td><td>书面离婚协议，对子女抚养、财产、债务处理达成一致<\/td><\/tr><tr><td>离婚冷静期<\/td><td>第 1077 条<\/td><td>收到申请之日起三十日内可撤回；期满后三十日内亲自申请发证，否则视为撤回<\/td><\/tr><tr><td>判决离婚的情形<\/td><td>第 1079 条<\/td><td>重婚或同居；家暴、虐待遗弃；赌博吸毒屡教不改；分居满二年；其他感情破裂；再次起诉分居满一年的，应准予离婚<\/td><\/tr><tr><td>婚姻关系解除时间<\/td><td>第 1080 条<\/td><td>登记之日<\/td><\/tr><tr><td>怀孕期间限制<\/td><td>第 1082 条<\/td><td>女方怀孕期间、分娩后一年内、终止妊娠后六个月内，男方不得提出离婚（例外）<\/td><\/tr><tr><td>离婚后子女抚养<\/td><td>第 1084 条<\/td><td>不满两周岁，原则上由母亲抚养；已满八周岁，尊重真实意愿<\/td><\/tr><tr><td>抚养费<\/td><td>第 1085 条<\/td><td>不直接抚养一方负担部分或全部抚养费<\/td><\/tr><tr><td>探望权<\/td><td>第 1086 条<\/td><td>不直接抚养的一方有探望权<\/td><\/tr><tr><td>离婚财产分割<\/td><td>第 1087 条<\/td><td>协议；协议不成，法院照顾子女、女方和无过错方权益判决<\/td><\/tr><tr><td>家务劳动补偿<\/td><td>第 1088 条<\/td><td>负担较多义务的一方，有权请求补偿<\/td><\/tr><tr><td>离婚时共同债务清偿<\/td><td>第 1089 条<\/td><td>共同债务共同偿还；协议不成，由法院判决<\/td><\/tr><tr><td>经济帮助<\/td><td>第 1090 条<\/td><td>一方生活困难，另一方有负担能力的，应当给予适当帮助<\/td><\/tr><tr><td>离婚损害赔偿<\/td><td>第 1091 条<\/td><td>重婚、与他人同居、家暴、虐待遗弃、其他重大过错<\/td><\/tr><tr><td>隐匿转移财产<\/td><td>第 1092 条<\/td><td>分割时可少分或不分；离婚后发现的，可另行起诉<\/td><\/tr><tr><td>非婚生子女<\/td><td>第 1071 条<\/td><td>与婚生子女享有同等权利<\/td><\/tr><tr><td>诉讼时效<\/td><td>第 188 条<\/td><td>三年<\/td><\/tr><tr><td>人格权侵害禁令<\/td><td>第 997 条<\/td><td>申请人民法院作出禁令<\/td><\/tr><tr><td>隐私权<\/td><td>第 1032 条<\/td><td>隐私权保护<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>二、司法解释<\/h3>\n<div class='tw'><table><thead><tr><th>文件<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>最高人民法院关于适用民法典婚姻家庭编的解释（一）（法释〔2020〕22 号，2021 年 1 月 1 日起施行）<\/td><td>第 2 条同居定义；第 23 条擅自中止妊娠；第 24 至 26 条夫妻共同财产、孳息自然增值；第 28 条擅自处分共同房屋；第 29 条婚前父母出资；第 33 至 36 条夫妻债务；第 39 条亲子鉴定；第 42 至 49 条抚养、抚养费；第 56 条变更抚养；第 65 至 68 条探望；第 78 条婚前买房婚后还贷；第 83、84 条离婚后发现财产及时效；第 86 至 90 条损害赔偿<\/td><\/tr><tr><td>最高人民法院关于适用民法典婚姻家庭编的解释（二）（法释〔2025〕1 号，2025 年 2 月 1 日起施行）<\/td><td>第 1 条重婚；第 2 条离婚登记不得以虚假为由请求无效；第 3 条债权人撤销离婚协议财产条款；第 4 条同居财产；第 5 条房屋赠与；第 6 条直播打赏；第 7 条婚外情赠与；第 8 条父母出资购房；第 9、10 条股权；第 12 至 14 条抢夺藏匿子女与抚养权；第 16、17 条抚养费；第 18、19 条继父母；第 20 条给子女的财产约定；第 21 条家务补偿；第 22 条经济帮助<\/td><\/tr><tr><td>最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定（法释〔2024〕1 号，2024 年 2 月 1 日起施行）<\/td><td>第 1 条适用范围；第 2 条借婚姻索取财物；第 3 条彩礼范围；第 4 条当事人；第 5 条已登记并共同生活；第 6 条未登记但共同生活；第 7 条时间效力<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>三、程序与证据（2026 年 10 月对照官方文本核对过）<\/h3>\n<div class='tw'><table><thead><tr><th>文件<\/th><th>条号与要点<\/th><\/tr><\/thead><tbody><tr><td>民事诉讼法（2023 年修正）<\/td><td>第 22 条被告住所地管辖；第 54 条被告可反诉；第 66 条证据种类；第 67 条谁主张谁举证；第 103 条诉讼中保全；第 104 条诉前保全（四十八小时内裁定，三十日内不起诉解除）；第 128 条被告答辩期十五日；第 146 条原告不到庭按撤诉；第 147 条被告不到庭可缺席判决；第 171 条判决上诉期十五日；第 250 条申请执行期间二年<\/td><\/tr><tr><td>民事诉讼法解释（2022 年修正）<\/td><td>第 90 条举证责任；第 106 条非法证据排除；第 112 条书证提出命令；第 116 条电子数据<\/td><\/tr><tr><td>刑事诉讼法（2018 年修正）<\/td><td>第 34 条委托辩护人；第 52 条不得强迫自证其罪；第 55 条重证据、不轻信口供；第 119 条传唤拘传不超过十二小时（特别重大复杂的不超过二十四小时）；第 122 条讯问笔录交核对、签名<\/td><\/tr><tr><td>诉讼费用交纳办法<\/td><td>第 13 条离婚案件每件 50 至 300 元，财产分割超过 20 万元的部分按 0.5%；第 14 条保全费：不超过 1000 元的 30 元，1000 元至 10 万元部分 1%，超过 10 万元部分 0.5%，最多 5000 元<\/td><\/tr><tr><td>最高人民法院关于审理民间借贷案件适用法律若干问题的规定<\/td><td>第 15 条仅有借条；第 16 条仅有转账凭证，出借人仍要证明借贷关系；第 24 条自然人之间借款没约定利息的不支持利息；第 25 条利率不超过合同成立时一年期 LPR 的四倍<\/td><\/tr><tr><td>反家庭暴力法<\/td><td>第 2 条定义；第 16 条告诫书；第 23 条申请人身安全保护令；第 28 条七十二小时内作出，紧急的二十四小时；第 30 条有效期不超过六个月；第 37 条家庭成员以外共同生活的人，参照适用<\/td><\/tr><tr><td>公司法（2023 年修订，2024 年 7 月 1 日起施行）<\/td><td>第 23 条第 3 款一人公司股东不能证明财产独立的，承担连带责任；第 84 条股权对外转让，其他股东同等条件下优先购买<\/td><\/tr><tr><td>老年人权益保障法<\/td><td>第 14 条赡养人要在经济上供养、生活上照料、精神上慰藉；赡养人的配偶应当协助履行<\/td><\/tr><tr><td>刑法（2023 年版）<\/td><td>第 20 条正当防卫；第 234 条故意伤害；第 236 条强奸；第 237 条强制猥亵；第 238 条非法拘禁；第 243 条诬告陷害；第 245 条非法侵入住宅；第 246 条侮辱、诽谤；第 253 条之一侵犯公民个人信息；第 258 条重婚；第 260 条虐待；第 261 条遗弃；第 266 条诈骗；第 274 条敲诈勒索；第 284 条非法使用窃听、窃照专用器材；第 307 条之一虚假诉讼；第 313 条拒不执行判决裁定；第 364 条传播淫秽物品<\/td><\/tr><tr><td>婚姻登记条例（2025 年修订，2025 年 5 月 10 日起施行）<\/td><td>结婚、离婚登记全国通办，不再要求提供户口本<\/td><\/tr><\/tbody><\/table><\/div>", "text": "# 附录 A　法条速查表\n\n核对时点：2026 年 10 月。凡标\"待核实\"的，请以官方文本为准。官方文本查询：国家法律法规数据库、最高人民法院官网（court.gov.cn）。\n\n## 一、民法典（婚姻家庭编及相关）\n\n| 主题 | 条文 | 要点 |\n|---|---|---|\n| 禁止借婚姻索取财物 | 第 1042 条第 1 款 | 禁止借婚姻索取财物 |\n| 禁止家暴、重婚、有配偶者与他人同居 | 第 1042 条第 2、3 款 | 禁止重婚、有配偶者与他人同居、家庭暴力、虐待遗弃 |\n| 无效婚姻 | 第 1051 条 | 重婚；有禁止结婚的亲属关系；未到法定婚龄 |\n| 胁迫结婚的撤销 | 第 1052 条 | 一年内请求撤销 |\n| 重大疾病不告知 | 第 1053 条 | 登记前应告知；不告知，另一方可请求撤销，一年内 |\n| 婚姻无效或被撤销的后果 | 第 1054 条 | 自始没有法律约束力；无过错方可请求赔偿 |\n| 夫妻平等 | 第 1055 条 | 夫妻在婚姻家庭中地位平等 |\n| 抚养教育子女 | 第 1058 条 | 夫妻双方平等享有权利，共同承担义务 |\n| 夫妻互相扶养 | 第 1059 条 | 需要扶养的一方有权要求对方给付扶养费 |\n| 日常家事代理 | 第 1060 条 | 日常生活需要实施的民事法律行为，对夫妻双方发生效力 |\n| 夫妻共同财产 | 第 1062 条 | 工资奖金、经营投资收益、知识产权收益、继承赠与（除外情形）、其他 |\n| 夫妻个人财产 | 第 1063 条 | 婚前财产、人身损害赔偿、明确只归一方的遗赠或赠与、专用生活用品、其他 |\n| 夫妻债务 | 第 1064 条 | 共同签名或追认；日常家庭生活需要；超出的，债权人要证明用于共同生活或共同意思表示 |\n| 约定财产制 | 第 1065 条 | 书面约定；对双方有约束力；对外债务，第三人知道约定的，以个人财产清偿 |\n| 婚内分割 | 第 1066 条 | 一方隐藏转移变卖毁损挥霍等，或负有法定扶养义务的人患重大疾病不同意支付医疗费 |\n| 子女与父母的权利义务 | 第 1067 条 | 成年子女对父母有赡养扶助义务 |\n| 继父母继子女 | 第 1072 条 | 受其抚养教育的，适用父母子女关系的规定 |\n| 亲子关系异议 | 第 1073 条 | 有正当理由的，可请求确认或否认亲子关系 |\n| 协议离婚 | 第 1076 条 | 书面离婚协议，对子女抚养、财产、债务处理达成一致 |\n| 离婚冷静期 | 第 1077 条 | 收到申请之日起三十日内可撤回；期满后三十日内亲自申请发证，否则视为撤回 |\n| 判决离婚的情形 | 第 1079 条 | 重婚或同居；家暴、虐待遗弃；赌博吸毒屡教不改；分居满二年；其他感情破裂；再次起诉分居满一年的，应准予离婚 |\n| 婚姻关系解除时间 | 第 1080 条 | 登记之日 |\n| 怀孕期间限制 | 第 1082 条 | 女方怀孕期间、分娩后一年内、终止妊娠后六个月内，男方不得提出离婚（例外） |\n| 离婚后子女抚养 | 第 1084 条 | 不满两周岁，原则上由母亲抚养；已满八周岁，尊重真实意愿 |\n| 抚养费 | 第 1085 条 | 不直接抚养一方负担部分或全部抚养费 |\n| 探望权 | 第 1086 条 | 不直接抚养的一方有探望权 |\n| 离婚财产分割 | 第 1087 条 | 协议；协议不成，法院照顾子女、女方和无过错方权益判决 |\n| 家务劳动补偿 | 第 1088 条 | 负担较多义务的一方，有权请求补偿 |\n| 离婚时共同债务清偿 | 第 1089 条 | 共同债务共同偿还；协议不成，由法院判决 |\n| 经济帮助 | 第 1090 条 | 一方生活困难，另一方有负担能力的，应当给予适当帮助 |\n| 离婚损害赔偿 | 第 1091 条 | 重婚、与他人同居、家暴、虐待遗弃、其他重大过错 |\n| 隐匿转移财产 | 第 1092 条 | 分割时可少分或不分；离婚后发现的，可另行起诉 |\n| 非婚生子女 | 第 1071 条 | 与婚生子女享有同等权利 |\n| 诉讼时效 | 第 188 条 | 三年 |\n| 人格权侵害禁令 | 第 997 条 | 申请人民法院作出禁令 |\n| 隐私权 | 第 1032 条 | 隐私权保护 |\n\n## 二、司法解释\n\n| 文件 | 要点 |\n|---|---|\n| 最高人民法院关于适用民法典婚姻家庭编的解释（一）（法释〔2020〕22 号，2021 年 1 月 1 日起施行） | 第 2 条同居定义；第 23 条擅自中止妊娠；第 24 至 26 条夫妻共同财产、孳息自然增值；第 28 条擅自处分共同房屋；第 29 条婚前父母出资；第 33 至 36 条夫妻债务；第 39 条亲子鉴定；第 42 至 49 条抚养、抚养费；第 56 条变更抚养；第 65 至 68 条探望；第 78 条婚前买房婚后还贷；第 83、84 条离婚后发现财产及时效；第 86 至 90 条损害赔偿 |\n| 最高人民法院关于适用民法典婚姻家庭编的解释（二）（法释〔2025〕1 号，2025 年 2 月 1 日起施行） | 第 1 条重婚；第 2 条离婚登记不得以虚假为由请求无效；第 3 条债权人撤销离婚协议财产条款；第 4 条同居财产；第 5 条房屋赠与；第 6 条直播打赏；第 7 条婚外情赠与；第 8 条父母出资购房；第 9、10 条股权；第 12 至 14 条抢夺藏匿子女与抚养权；第 16、17 条抚养费；第 18、19 条继父母；第 20 条给子女的财产约定；第 21 条家务补偿；第 22 条经济帮助 |\n| 最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定（法释〔2024〕1 号，2024 年 2 月 1 日起施行） | 第 1 条适用范围；第 2 条借婚姻索取财物；第 3 条彩礼范围；第 4 条当事人；第 5 条已登记并共同生活；第 6 条未登记但共同生活；第 7 条时间效力 |\n\n## 三、程序与证据（2026 年 10 月对照官方文本核对过）\n\n| 文件 | 条号与要点 |\n|---|---|\n| 民事诉讼法（2023 年修正） | 第 22 条被告住所地管辖；第 54 条被告可反诉；第 66 条证据种类；第 67 条谁主张谁举证；第 103 条诉讼中保全；第 104 条诉前保全（四十八小时内裁定，三十日内不起诉解除）；第 128 条被告答辩期十五日；第 146 条原告不到庭按撤诉；第 147 条被告不到庭可缺席判决；第 171 条判决上诉期十五日；第 250 条申请执行期间二年 |\n| 民事诉讼法解释（2022 年修正） | 第 90 条举证责任；第 106 条非法证据排除；第 112 条书证提出命令；第 116 条电子数据 |\n| 刑事诉讼法（2018 年修正） | 第 34 条委托辩护人；第 52 条不得强迫自证其罪；第 55 条重证据、不轻信口供；第 119 条传唤拘传不超过十二小时（特别重大复杂的不超过二十四小时）；第 122 条讯问笔录交核对、签名 |\n| 诉讼费用交纳办法 | 第 13 条离婚案件每件 50 至 300 元，财产分割超过 20 万元的部分按 0.5%；第 14 条保全费：不超过 1000 元的 30 元，1000 元至 10 万元部分 1%，超过 10 万元部分 0.5%，最多 5000 元 |\n| 最高人民法院关于审理民间借贷案件适用法律若干问题的规定 | 第 15 条仅有借条；第 16 条仅有转账凭证，出借人仍要证明借贷关系；第 24 条自然人之间借款没约定利息的不支持利息；第 25 条利率不超过合同成立时一年期 LPR 的四倍 |\n| 反家庭暴力法 | 第 2 条定义；第 16 条告诫书；第 23 条申请人身安全保护令；第 28 条七十二小时内作出，紧急的二十四小时；第 30 条有效期不超过六个月；第 37 条家庭成员以外共同生活的人，参照适用 |\n| 公司法（2023 年修订，2024 年 7 月 1 日起施行） | 第 23 条第 3 款一人公司股东不能证明财产独立的，承担连带责任；第 84 条股权对外转让，其他股东同等条件下优先购买 |\n| 老年人权益保障法 | 第 14 条赡养人要在经济上供养、生活上照料、精神上慰藉；赡养人的配偶应当协助履行 |\n| 刑法（2023 年版） | 第 20 条正当防卫；第 234 条故意伤害；第 236 条强奸；第 237 条强制猥亵；第 238 条非法拘禁；第 243 条诬告陷害；第 245 条非法侵入住宅；第 246 条侮辱、诽谤；第 253 条之一侵犯公民个人信息；第 258 条重婚；第 260 条虐待；第 261 条遗弃；第 266 条诈骗；第 274 条敲诈勒索；第 284 条非法使用窃听、窃照专用器材；第 307 条之一虚假诉讼；第 313 条拒不执行判决裁定；第 364 条传播淫秽物品 |\n| 婚姻登记条例（2025 年修订，2025 年 5 月 10 日起施行） | 结婚、离婚登记全国通办，不再要求提供户口本 |\n"}, {"id": "B-借条与彩礼约定书", "title": "附录 B　借条与彩礼约定书", "html": "<h2>附录 B　借条与彩礼约定书<\/h2>\n<blockquote>范本仅供参考，签署前建议请律师审阅。方括号和下划线处请按实际情况填写。<\/blockquote>\n<hr>\n<h3>一、借条<\/h3>\n<p><strong>借　条<\/strong><\/p>\n<p>出借人：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿＿＿<\/p>\n<p>借款人：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿＿＿<\/p>\n<p>借款人因＿＿＿＿＿＿（用途）向出借人借款人民币＿＿＿＿元（大写：＿＿＿＿＿＿＿＿），已于＿＿年＿＿月＿＿日通过［银行转账／微信／支付宝］收到。<\/p>\n<p>借款期限：＿＿年＿＿月＿＿日至＿＿年＿＿月＿＿日。<\/p>\n<p>利息：［无息／年利率＿＿％（不得超过合同成立时一年期贷款市场报价利率的四倍）］。<\/p>\n<p>还款方式：＿＿＿＿＿＿＿＿＿＿。<\/p>\n<p>逾期还款的，按＿＿＿＿＿＿计算逾期利息。<\/p>\n<p>本借条一式两份，双方各执一份。<\/p>\n<p>借款人（签字、按手印）：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日<\/p>\n<p>出借人（签字）：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日<\/p>\n<hr>\n<h3>二、转账确认书（用于恋爱期间的大额转账）<\/h3>\n<p>本人＿＿＿＿＿＿（姓名）确认：<\/p>\n<p>于＿＿年＿＿月＿＿日，收到＿＿＿＿＿＿（姓名）转入的人民币＿＿＿＿元，转入账户：＿＿＿＿＿＿。<\/p>\n<p>该款项性质为（请勾选其一）：<\/p>\n<p>□ 借款，将于＿＿年＿＿月＿＿日前归还；<br>□ 为共同购房／购车／办婚礼提供的出资，用途：＿＿＿＿＿＿，如双方未结婚，该款项应当返还；<br>□ 赠与，不需要返还。<\/p>\n<p>本人签字：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日<\/p>\n<hr>\n<h3>三、彩礼约定书<\/h3>\n<p>甲方（给付方）：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿<br>甲方给付人（如为父母出资，请填写）：＿＿＿＿＿＿，与甲方关系：＿＿＿＿<\/p>\n<p>乙方（接收方）：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿<br>乙方接收人（如为父母代收，请填写）：＿＿＿＿＿＿，与乙方关系：＿＿＿＿<\/p>\n<p>双方因缔结婚姻，按照当地习俗，约定如下：<\/p>\n<ol><li>彩礼金额：人民币＿＿＿＿元（大写：＿＿＿＿＿＿），于＿＿年＿＿月＿＿日前，通过银行转账交付，转入乙方（或乙方父母）账户：＿＿＿＿＿＿。\n<\/li><li>彩礼的用途：用于双方共同生活，包括＿＿＿＿＿＿。\n<\/li><li>婚礼费用由＿＿＿＿＿＿承担。\n<\/li><li>如双方未办理结婚登记，婚约解除的，乙方应当在＿＿日内，返还彩礼的＿＿％，具体比例由双方协商；协商不成的，由法院依据彩礼规定处理。\n<\/li><li>如双方办理结婚登记后，共同生活不满＿＿年即离婚的，彩礼的返还，按照法律规定及双方约定处理。\n<\/li><li>双方确认，本约定书不含有借婚姻索取财物的情形。\n<\/li><li>本约定书一式四份，双方及给付人、接收人各执一份。\n<\/li><\/ol>\n<p>甲方签字：＿＿＿＿＿＿　　乙方签字：＿＿＿＿＿＿<br>甲方给付人签字：＿＿＿＿＿＿　　乙方接收人签字：＿＿＿＿＿＿<br>日期：＿＿年＿＿月＿＿日<\/p>", "text": "# 附录 B　借条与彩礼约定书\n\n> 范本仅供参考，签署前建议请律师审阅。方括号和下划线处请按实际情况填写。\n\n---\n\n## 一、借条\n\n**借　条**\n\n出借人：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿＿＿\n\n借款人：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿＿＿\n\n借款人因＿＿＿＿＿＿（用途）向出借人借款人民币＿＿＿＿元（大写：＿＿＿＿＿＿＿＿），已于＿＿年＿＿月＿＿日通过［银行转账／微信／支付宝］收到。\n\n借款期限：＿＿年＿＿月＿＿日至＿＿年＿＿月＿＿日。\n\n利息：［无息／年利率＿＿％（不得超过合同成立时一年期贷款市场报价利率的四倍）］。\n\n还款方式：＿＿＿＿＿＿＿＿＿＿。\n\n逾期还款的，按＿＿＿＿＿＿计算逾期利息。\n\n本借条一式两份，双方各执一份。\n\n借款人（签字、按手印）：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日\n\n出借人（签字）：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日\n\n---\n\n## 二、转账确认书（用于恋爱期间的大额转账）\n\n本人＿＿＿＿＿＿（姓名）确认：\n\n于＿＿年＿＿月＿＿日，收到＿＿＿＿＿＿（姓名）转入的人民币＿＿＿＿元，转入账户：＿＿＿＿＿＿。\n\n该款项性质为（请勾选其一）：\n\n□ 借款，将于＿＿年＿＿月＿＿日前归还；\n□ 为共同购房／购车／办婚礼提供的出资，用途：＿＿＿＿＿＿，如双方未结婚，该款项应当返还；\n□ 赠与，不需要返还。\n\n本人签字：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日\n\n---\n\n## 三、彩礼约定书\n\n甲方（给付方）：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿\n甲方给付人（如为父母出资，请填写）：＿＿＿＿＿＿，与甲方关系：＿＿＿＿\n\n乙方（接收方）：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿＿＿\n乙方接收人（如为父母代收，请填写）：＿＿＿＿＿＿，与乙方关系：＿＿＿＿\n\n双方因缔结婚姻，按照当地习俗，约定如下：\n\n1. 彩礼金额：人民币＿＿＿＿元（大写：＿＿＿＿＿＿），于＿＿年＿＿月＿＿日前，通过银行转账交付，转入乙方（或乙方父母）账户：＿＿＿＿＿＿。\n2. 彩礼的用途：用于双方共同生活，包括＿＿＿＿＿＿。\n3. 婚礼费用由＿＿＿＿＿＿承担。\n4. 如双方未办理结婚登记，婚约解除的，乙方应当在＿＿日内，返还彩礼的＿＿％，具体比例由双方协商；协商不成的，由法院依据彩礼规定处理。\n5. 如双方办理结婚登记后，共同生活不满＿＿年即离婚的，彩礼的返还，按照法律规定及双方约定处理。\n6. 双方确认，本约定书不含有借婚姻索取财物的情形。\n7. 本约定书一式四份，双方及给付人、接收人各执一份。\n\n甲方签字：＿＿＿＿＿＿　　乙方签字：＿＿＿＿＿＿\n甲方给付人签字：＿＿＿＿＿＿　　乙方接收人签字：＿＿＿＿＿＿\n日期：＿＿年＿＿月＿＿日\n"}, {"id": "C-民事起诉状（婚约财产赠与返还）", "title": "附录 C　民事起诉状（恋爱期间大额给付返还）", "html": "<h2>附录 C　民事起诉状（恋爱期间大额给付返还）<\/h2>\n<blockquote>范本仅供参考。案由可能是\"婚约财产纠纷\"\"赠与合同纠纷\"或\"民间借贷纠纷\"，请根据事实选择。起诉前，对照 <a href=\"#/e/007\">第 007 条<\/a> 评估证据。<\/blockquote>\n<hr>\n<p><strong>民事起诉状<\/strong><\/p>\n<p><strong>原告<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。<\/p>\n<p><strong>被告<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。<\/p>\n<p><strong>案由<\/strong>：＿＿＿＿＿＿纠纷<\/p>\n<p><strong>诉讼请求<\/strong>：<\/p>\n<ol><li>请求判令被告返还原告人民币＿＿＿＿元（大写：＿＿＿＿＿＿）；\n<\/li><li>请求判令被告支付以上款项自＿＿年＿＿月＿＿日起至实际给付之日止的利息（以＿＿＿＿＿＿为基数，按＿＿＿＿＿＿计算）；（如无，可删除）\n<\/li><li>本案诉讼费用由被告承担。\n<\/li><\/ol>\n<p><strong>事实与理由<\/strong>：<\/p>\n<p>原、被告于＿＿年＿＿月相识，＿＿年＿＿月确立恋爱关系。<\/p>\n<p>＿＿年＿＿月＿＿日，原告通过［银行转账／微信／支付宝］向被告转账人民币＿＿＿＿元。该笔款项的用途是＿＿＿＿＿＿（如：双方已商定结婚，该款项用于购置婚房／办理婚礼／彩礼）。有双方的聊天记录为证。<\/p>\n<p>＿＿年＿＿月，双方因＿＿＿＿＿＿，婚约未能继续履行（或：双方分手）。原告多次要求被告返还该款项，被告以＿＿＿＿＿＿为由拒绝。<\/p>\n<p>原告认为，该笔款项数额较大，并非日常维系感情的消费，而是以缔结婚姻为目的所作的给付。现婚约无法履行，被告继续占有该款项，缺乏法律依据。依照《中华人民共和国民法典》＿＿＿＿＿＿的规定，特诉至贵院，请求依法判令。<\/p>\n<p><strong>此致<\/strong><\/p>\n<p>＿＿＿＿＿＿人民法院<\/p>\n<p><strong>具状人（签名）<\/strong>：＿＿＿＿＿＿<br>＿＿年＿＿月＿＿日<\/p>\n<p><strong>附<\/strong>：<\/p>\n<ol><li>起诉状副本＿＿份；\n<\/li><li>证据清单及证据（转账记录、聊天记录、购买订单、身份信息等）；\n<\/li><li>原告、被告身份证明。\n<\/li><\/ol>", "text": "# 附录 C　民事起诉状（恋爱期间大额给付返还）\n\n> 范本仅供参考。案由可能是\"婚约财产纠纷\"\"赠与合同纠纷\"或\"民间借贷纠纷\"，请根据事实选择。起诉前，对照 第 007 条 评估证据。\n\n---\n\n**民事起诉状**\n\n**原告**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。\n\n**被告**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。\n\n**案由**：＿＿＿＿＿＿纠纷\n\n**诉讼请求**：\n\n1. 请求判令被告返还原告人民币＿＿＿＿元（大写：＿＿＿＿＿＿）；\n2. 请求判令被告支付以上款项自＿＿年＿＿月＿＿日起至实际给付之日止的利息（以＿＿＿＿＿＿为基数，按＿＿＿＿＿＿计算）；（如无，可删除）\n3. 本案诉讼费用由被告承担。\n\n**事实与理由**：\n\n原、被告于＿＿年＿＿月相识，＿＿年＿＿月确立恋爱关系。\n\n＿＿年＿＿月＿＿日，原告通过［银行转账／微信／支付宝］向被告转账人民币＿＿＿＿元。该笔款项的用途是＿＿＿＿＿＿（如：双方已商定结婚，该款项用于购置婚房／办理婚礼／彩礼）。有双方的聊天记录为证。\n\n＿＿年＿＿月，双方因＿＿＿＿＿＿，婚约未能继续履行（或：双方分手）。原告多次要求被告返还该款项，被告以＿＿＿＿＿＿为由拒绝。\n\n原告认为，该笔款项数额较大，并非日常维系感情的消费，而是以缔结婚姻为目的所作的给付。现婚约无法履行，被告继续占有该款项，缺乏法律依据。依照《中华人民共和国民法典》＿＿＿＿＿＿的规定，特诉至贵院，请求依法判令。\n\n**此致**\n\n＿＿＿＿＿＿人民法院\n\n**具状人（签名）**：＿＿＿＿＿＿\n＿＿年＿＿月＿＿日\n\n**附**：\n\n1. 起诉状副本＿＿份；\n2. 证据清单及证据（转账记录、聊天记录、购买订单、身份信息等）；\n3. 原告、被告身份证明。\n"}, {"id": "D-民事起诉状（彩礼返还）", "title": "附录 D　民事起诉状（彩礼返还）", "html": "<h2>附录 D　民事起诉状（彩礼返还）<\/h2>\n<blockquote>范本仅供参考。适用《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》。起诉前对照 <a href=\"#/e/038\">第 038 条<\/a>、<a href=\"#/e/039\">第 039 条<\/a>。<\/blockquote>\n<hr>\n<p><strong>民事起诉状<\/strong><\/p>\n<p><strong>原告<\/strong>：＿＿＿＿＿＿（订婚一方），男／女，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>原告<\/strong>：＿＿＿＿＿＿（实际给付彩礼的父母），与原告关系：＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>被告<\/strong>：＿＿＿＿＿＿（订婚另一方），男／女，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>被告<\/strong>：＿＿＿＿＿＿（实际接收彩礼的父母），与被告关系：＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>案由<\/strong>：婚约财产纠纷<\/p>\n<p><strong>诉讼请求<\/strong>：<\/p>\n<ol><li>请求判令被告返还彩礼人民币＿＿＿＿元（大写：＿＿＿＿＿＿）及＿＿＿＿＿＿（物品名称，如金饰）；\n<\/li><li>请求判令被告支付逾期返还的利息（如有）；\n<\/li><li>本案诉讼费用由被告承担。\n<\/li><\/ol>\n<p><strong>事实与理由<\/strong>：<\/p>\n<p>＿＿年＿＿月，经＿＿＿＿＿＿（介绍人）介绍，原告与被告相识，＿＿年＿＿月订婚。<\/p>\n<p>按照当地习俗，＿＿年＿＿月＿＿日，原告父母通过银行转账／现金，向被告（或被告父母）给付彩礼人民币＿＿＿＿元，及＿＿＿＿＿＿（金饰等物品），价值约＿＿＿＿元。有转账记录、聊天记录、亲友证言为证。<\/p>\n<p>［情形一：未办理结婚登记］双方未办理结婚登记。＿＿年＿＿月，因＿＿＿＿＿＿，婚约解除。［是否共同生活：＿＿＿＿＿＿，共同生活时间：＿＿＿＿＿＿，是否生育：＿＿＿＿＿＿］。<\/p>\n<p>［情形二：已办理结婚登记］双方于＿＿年＿＿月＿＿日办理结婚登记，共同生活时间仅＿＿＿＿，＿＿年＿＿月双方离婚（或原告提起离婚诉讼）。彩礼数额＿＿＿＿元，明显超出原告方所在地居民人均可支配收入（＿＿＿＿元）及原告家庭经济状况，且共同生活时间较短。<\/p>\n<p>彩礼的实际使用情况：＿＿＿＿＿＿；嫁妆情况：＿＿＿＿＿＿；双方过错：＿＿＿＿＿＿；当地习俗：＿＿＿＿＿＿。<\/p>\n<p>原告多次要求被告返还，被告拒绝。<\/p>\n<p>依据《中华人民共和国民法典》第一千零四十二条，《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第＿＿条，特向贵院提起诉讼，请依法判决。<\/p>\n<p><strong>此致<\/strong><\/p>\n<p>＿＿＿＿＿＿人民法院<\/p>\n<p><strong>具状人（签名）<\/strong>：＿＿＿＿＿＿<br>＿＿年＿＿月＿＿日<\/p>\n<p><strong>附<\/strong>：起诉状副本＿＿份；证据清单（转账凭证、聊天记录、订婚照片、证人证言、当地居民收入统计、双方身份证明）。<\/p>", "text": "# 附录 D　民事起诉状（彩礼返还）\n\n> 范本仅供参考。适用《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》。起诉前对照 第 038 条、第 039 条。\n\n---\n\n**民事起诉状**\n\n**原告**：＿＿＿＿＿＿（订婚一方），男／女，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**原告**：＿＿＿＿＿＿（实际给付彩礼的父母），与原告关系：＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**被告**：＿＿＿＿＿＿（订婚另一方），男／女，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**被告**：＿＿＿＿＿＿（实际接收彩礼的父母），与被告关系：＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**案由**：婚约财产纠纷\n\n**诉讼请求**：\n\n1. 请求判令被告返还彩礼人民币＿＿＿＿元（大写：＿＿＿＿＿＿）及＿＿＿＿＿＿（物品名称，如金饰）；\n2. 请求判令被告支付逾期返还的利息（如有）；\n3. 本案诉讼费用由被告承担。\n\n**事实与理由**：\n\n＿＿年＿＿月，经＿＿＿＿＿＿（介绍人）介绍，原告与被告相识，＿＿年＿＿月订婚。\n\n按照当地习俗，＿＿年＿＿月＿＿日，原告父母通过银行转账／现金，向被告（或被告父母）给付彩礼人民币＿＿＿＿元，及＿＿＿＿＿＿（金饰等物品），价值约＿＿＿＿元。有转账记录、聊天记录、亲友证言为证。\n\n［情形一：未办理结婚登记］双方未办理结婚登记。＿＿年＿＿月，因＿＿＿＿＿＿，婚约解除。［是否共同生活：＿＿＿＿＿＿，共同生活时间：＿＿＿＿＿＿，是否生育：＿＿＿＿＿＿］。\n\n［情形二：已办理结婚登记］双方于＿＿年＿＿月＿＿日办理结婚登记，共同生活时间仅＿＿＿＿，＿＿年＿＿月双方离婚（或原告提起离婚诉讼）。彩礼数额＿＿＿＿元，明显超出原告方所在地居民人均可支配收入（＿＿＿＿元）及原告家庭经济状况，且共同生活时间较短。\n\n彩礼的实际使用情况：＿＿＿＿＿＿；嫁妆情况：＿＿＿＿＿＿；双方过错：＿＿＿＿＿＿；当地习俗：＿＿＿＿＿＿。\n\n原告多次要求被告返还，被告拒绝。\n\n依据《中华人民共和国民法典》第一千零四十二条，《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第＿＿条，特向贵院提起诉讼，请依法判决。\n\n**此致**\n\n＿＿＿＿＿＿人民法院\n\n**具状人（签名）**：＿＿＿＿＿＿\n＿＿年＿＿月＿＿日\n\n**附**：起诉状副本＿＿份；证据清单（转账凭证、聊天记录、订婚照片、证人证言、当地居民收入统计、双方身份证明）。\n"}, {"id": "E-同居协议与分手协议", "title": "附录 E　同居协议与分手协议（含子女）", "html": "<h2>附录 E　同居协议与分手协议（含子女）<\/h2>\n<blockquote>范本仅供参考。子女的抚养安排，最终以子女利益最大化为准，协议约定不能损害子女利益。签署前建议各自咨询律师。<\/blockquote>\n<hr>\n<h3>一、同居财产协议<\/h3>\n<p>甲方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿<br>乙方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿<\/p>\n<p>双方自愿同居，为明确同居期间的财产关系，约定如下：<\/p>\n<p><strong>第一条　同居起止<\/strong><br>双方自＿＿年＿＿月＿＿日起同居，住所为＿＿＿＿＿＿。<\/p>\n<p><strong>第二条　各自财产<\/strong><br>甲方个人财产：＿＿＿＿＿＿（清单）。<br>乙方个人财产：＿＿＿＿＿＿（清单）。<br>同居期间的劳动所得、继承或受赠所得，归各自所有。<\/p>\n<p><strong>第三条　共同购置财产<\/strong><br>双方共同出资购置的财产，包括：<\/p>\n<ol><li>＿＿＿＿＿＿（房／车／其他），总价＿＿＿元，甲方出资＿＿＿元，乙方出资＿＿＿元，登记在＿＿＿名下，份额按出资比例（甲＿＿％，乙＿＿％）确定。\n<\/li><li>同居期间的贷款，由＿＿＿＿＿＿负责偿还。\n<\/li><\/ol>\n<p><strong>第四条　日常开销<\/strong><br>日常生活费用，按＿＿＿＿＿＿（比例／各付一半／固定金额）分担。<\/p>\n<p><strong>第五条　债务<\/strong><br>各自的债务，各自承担。共同债务，按出资比例承担，包括：＿＿＿＿＿＿。<\/p>\n<p><strong>第六条　同居关系解除后<\/strong><\/p>\n<ol><li>共同财产，按第三条约定处理；\n<\/li><li>登记在一方名下，另一方出资的，登记方应当在＿＿日内，向对方支付补偿＿＿＿元，或办理份额变更登记；\n<\/li><li>共同财产的出售，应当征得双方书面同意。\n<\/li><\/ol>\n<p><strong>第七条　子女<\/strong><br>如同居期间生育子女：<\/p>\n<ol><li>子女的抚养、教育、医疗费用，由＿＿＿＿＿＿按＿＿比例承担；\n<\/li><li>如同居关系解除，由＿＿＿＿＿＿直接抚养，另一方每月支付抚养费＿＿＿元，至子女年满十八周岁；\n<\/li><li>不直接抚养的一方，有权探望，具体为：＿＿＿＿＿＿；\n<\/li><li>双方理解，子女抚养安排以子女利益最大化为原则，法院可根据具体情况调整。\n<\/li><\/ol>\n<p><strong>第八条　违约责任<\/strong><br>一方不履行本协议的，应当向另一方支付违约金＿＿＿元，并承担对方为主张权利支付的合理费用。<\/p>\n<p><strong>第九条　争议解决<\/strong><br>协商；协商不成，向＿＿＿＿＿＿人民法院起诉。<\/p>\n<p><strong>第十条<\/strong><br>本协议一式两份，各执一份。<\/p>\n<p>甲方（签字、按手印）：＿＿＿＿＿＿　乙方（签字、按手印）：＿＿＿＿＿＿<br>日期：＿＿年＿＿月＿＿日<\/p>\n<hr>\n<h3>二、分手财产分割及子女抚养协议<\/h3>\n<p>甲方：＿＿＿＿＿＿　乙方：＿＿＿＿＿＿<\/p>\n<p>双方同居关系于＿＿年＿＿月＿＿日解除。为妥善处理财产和子女问题，达成如下协议：<\/p>\n<p><strong>一、财产分割<\/strong><\/p>\n<div class='tw'><table><thead><tr><th>财产<\/th><th>归属<\/th><th>补偿<\/th><th>履行期限<\/th><\/tr><\/thead><tbody><tr><td>＿＿＿＿<\/td><td>甲／乙<\/td><td>＿＿元<\/td><td>＿＿年＿＿月＿＿日前<\/td><\/tr><tr><td>＿＿＿＿<\/td><td>甲／乙<\/td><td>＿＿元<\/td><td>＿＿年＿＿月＿＿日前<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>二、债务<\/strong>：由＿＿＿＿＿＿承担，对债权人的通知方式：＿＿＿＿＿＿。<\/p>\n<p><strong>三、子女<\/strong><\/p>\n<ol><li>子女＿＿＿＿＿＿，出生于＿＿年＿＿月＿＿日，由＿＿＿＿＿＿直接抚养；\n<\/li><li>另一方每月＿＿日前，支付抚养费＿＿＿元，至子女年满十八周岁；子女教育、医疗等大额费用，按＿＿＿＿＿＿比例分担；\n<\/li><li>探望：每周＿＿＿，＿＿时至＿＿时，在＿＿＿＿＿＿交接；节假日安排：＿＿＿＿＿＿；\n<\/li><li>子女的姓名、户口、保险，保持＿＿＿＿＿＿。\n<\/li><\/ol>\n<p><strong>四、违约责任<\/strong>：任一方不履行，向对方支付违约金＿＿＿元。<\/p>\n<p><strong>五、其他<\/strong>：双方确认，除本协议所列外，没有其他需要分割的共同财产，也没有隐瞒的财产。<\/p>\n<p>甲方：＿＿＿＿＿＿　乙方：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日<\/p>", "text": "# 附录 E　同居协议与分手协议（含子女）\n\n> 范本仅供参考。子女的抚养安排，最终以子女利益最大化为准，协议约定不能损害子女利益。签署前建议各自咨询律师。\n\n---\n\n## 一、同居财产协议\n\n甲方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿\n乙方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿\n\n双方自愿同居，为明确同居期间的财产关系，约定如下：\n\n**第一条　同居起止**\n双方自＿＿年＿＿月＿＿日起同居，住所为＿＿＿＿＿＿。\n\n**第二条　各自财产**\n甲方个人财产：＿＿＿＿＿＿（清单）。\n乙方个人财产：＿＿＿＿＿＿（清单）。\n同居期间的劳动所得、继承或受赠所得，归各自所有。\n\n**第三条　共同购置财产**\n双方共同出资购置的财产，包括：\n1. ＿＿＿＿＿＿（房／车／其他），总价＿＿＿元，甲方出资＿＿＿元，乙方出资＿＿＿元，登记在＿＿＿名下，份额按出资比例（甲＿＿％，乙＿＿％）确定。\n2. 同居期间的贷款，由＿＿＿＿＿＿负责偿还。\n\n**第四条　日常开销**\n日常生活费用，按＿＿＿＿＿＿（比例／各付一半／固定金额）分担。\n\n**第五条　债务**\n各自的债务，各自承担。共同债务，按出资比例承担，包括：＿＿＿＿＿＿。\n\n**第六条　同居关系解除后**\n1. 共同财产，按第三条约定处理；\n2. 登记在一方名下，另一方出资的，登记方应当在＿＿日内，向对方支付补偿＿＿＿元，或办理份额变更登记；\n3. 共同财产的出售，应当征得双方书面同意。\n\n**第七条　子女**\n如同居期间生育子女：\n1. 子女的抚养、教育、医疗费用，由＿＿＿＿＿＿按＿＿比例承担；\n2. 如同居关系解除，由＿＿＿＿＿＿直接抚养，另一方每月支付抚养费＿＿＿元，至子女年满十八周岁；\n3. 不直接抚养的一方，有权探望，具体为：＿＿＿＿＿＿；\n4. 双方理解，子女抚养安排以子女利益最大化为原则，法院可根据具体情况调整。\n\n**第八条　违约责任**\n一方不履行本协议的，应当向另一方支付违约金＿＿＿元，并承担对方为主张权利支付的合理费用。\n\n**第九条　争议解决**\n协商；协商不成，向＿＿＿＿＿＿人民法院起诉。\n\n**第十条**\n本协议一式两份，各执一份。\n\n甲方（签字、按手印）：＿＿＿＿＿＿　乙方（签字、按手印）：＿＿＿＿＿＿\n日期：＿＿年＿＿月＿＿日\n\n---\n\n## 二、分手财产分割及子女抚养协议\n\n甲方：＿＿＿＿＿＿　乙方：＿＿＿＿＿＿\n\n双方同居关系于＿＿年＿＿月＿＿日解除。为妥善处理财产和子女问题，达成如下协议：\n\n**一、财产分割**\n\n| 财产 | 归属 | 补偿 | 履行期限 |\n|---|---|---|---|\n| ＿＿＿＿ | 甲／乙 | ＿＿元 | ＿＿年＿＿月＿＿日前 |\n| ＿＿＿＿ | 甲／乙 | ＿＿元 | ＿＿年＿＿月＿＿日前 |\n\n**二、债务**：由＿＿＿＿＿＿承担，对债权人的通知方式：＿＿＿＿＿＿。\n\n**三、子女**\n1. 子女＿＿＿＿＿＿，出生于＿＿年＿＿月＿＿日，由＿＿＿＿＿＿直接抚养；\n2. 另一方每月＿＿日前，支付抚养费＿＿＿元，至子女年满十八周岁；子女教育、医疗等大额费用，按＿＿＿＿＿＿比例分担；\n3. 探望：每周＿＿＿，＿＿时至＿＿时，在＿＿＿＿＿＿交接；节假日安排：＿＿＿＿＿＿；\n4. 子女的姓名、户口、保险，保持＿＿＿＿＿＿。\n\n**四、违约责任**：任一方不履行，向对方支付违约金＿＿＿元。\n\n**五、其他**：双方确认，除本协议所列外，没有其他需要分割的共同财产，也没有隐瞒的财产。\n\n甲方：＿＿＿＿＿＿　乙方：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日\n"}, {"id": "F-婚前深度沟通问卷", "title": "附录 F　婚前深度沟通问卷", "html": "<h2>附录 F　婚前深度沟通问卷<\/h2>\n<blockquote>用法：两个人各自在不同的地方独立填写，填完再交换，逐题对照。目的不是审问对方，而是把婚后一定会遇到的事，提前摆到桌面上。可以按自己的情况增删题目。<\/blockquote>\n<p>填写人：＿＿＿＿＿＿　日期：＿＿＿＿＿＿<\/p>\n<hr>\n<h3>一、钱<\/h3>\n<ol><li>我目前的月收入大约是＿＿＿＿元，稳定程度（1 到 5 分）：＿＿\n<\/li><li>我目前的存款大约＿＿＿＿元，投资、理财大约＿＿＿＿元。\n<\/li><li>我目前的债务（房贷、车贷、信用卡、网贷、借款）合计＿＿＿＿元，每月还款＿＿＿＿元。\n<\/li><li>我是否为他人提供过担保：□ 否　□ 是，对象＿＿＿＿，金额＿＿＿＿\n<\/li><li>我希望婚后的钱怎么管：□ 全部共管　□ 部分共管，各留零用金　□ AA 制\n<\/li><li>每月我希望自己有＿＿＿＿元零用金，不需要向对方解释。\n<\/li><li>超过＿＿＿＿元的支出，我认为需要先商量。\n<\/li><li>我认为的\"家庭紧急储备金\"应该有＿＿＿＿个月的开支。\n<\/li><\/ol>\n<h3>二、房<\/h3>\n<ol><li>婚后住哪里？□ 我的房子　□ 对方的房子　□ 租房　□ 买新房　□ 和父母同住\n<\/li><li>如果买房：首付谁出？来源是什么？登记谁的名字？贷款谁还？\n<\/li><li>如果有一方的房子，婚后还贷是否使用共同收入？\n<\/li><li>房子的装修由谁出钱？\n<\/li><\/ol>\n<h3>三、车和其他大件<\/h3>\n<ol><li>是否买车？预算＿＿＿＿元，谁出钱，登记谁的名字？\n<\/li><\/ol>\n<h3>四、孩子<\/h3>\n<ol><li>我希望有＿＿＿＿个孩子；希望在＿＿＿＿岁之前开始。\n<\/li><li>如果暂时怀不上，我愿意做哪些检查和治疗？\n<\/li><li>谁来带孩子？是否需要有人暂停工作？暂停期间的收入怎么处理？\n<\/li><li>孩子的教育：公立／私立／国际，预算大概是＿＿＿＿元。\n<\/li><li>我对孩子的养育理念：＿＿＿＿＿＿\n<\/li><li>如果我们将来分开，孩子我认为应该＿＿＿＿＿＿\n<\/li><\/ol>\n<h3>五、双方父母<\/h3>\n<ol><li>婚后是否和父母同住？同住的期限和范围是什么？\n<\/li><li>每年给父母的赡养费用大约＿＿＿＿元，是否同意对双方父母按同一标准？\n<\/li><li>父母生病时，谁负责照护，费用怎么分担？\n<\/li><li>我的父母对我们婚后生活有什么期待？我认为合理的是＿＿＿＿＿＿，不合理的是＿＿＿＿＿＿\n<\/li><\/ol>\n<h3>六、家务和工作<\/h3>\n<ol><li>家务的分工，我认为应该＿＿＿＿＿＿\n<\/li><li>如果一方想换城市、换工作、创业，另一方的态度是＿＿＿＿＿＿\n<\/li><li>如果有一方长期失业，我们怎么应对？\n<\/li><\/ol>\n<h3>七、冲突与沟通<\/h3>\n<ol><li>吵架时，我希望对方做的是＿＿＿＿＿＿，不希望的是＿＿＿＿＿＿\n<\/li><li>我需要的\"暂停\"时间是＿＿＿＿＿＿\n<\/li><li>我不能接受的行为（至少三条）：＿＿＿＿＿＿\n<\/li><li>如果我们没法自己解决问题，我愿意接受：□ 婚姻咨询　□ 家庭调解　□ 其他＿＿＿＿＿＿\n<\/li><\/ol>\n<h3>八、健康和风险<\/h3>\n<ol><li>我的健康情况，包括重大疾病、传染病、遗传疾病、生育相关情况：＿＿＿＿＿＿\n<\/li><li>我的心理健康情况（是否有诊断、是否在治疗）：＿＿＿＿＿＿\n<\/li><li>我们的保险安排：＿＿＿＿＿＿\n<\/li><\/ol>\n<h3>九、过去<\/h3>\n<ol><li>我是否有过婚姻：□ 否　□ 是，对方姓名＿＿＿＿，离婚时间＿＿＿＿，有无子女＿＿＿＿，有无未了结的财产或债务＿＿＿＿\n<\/li><li>我是否有其他需要在婚前告知对方的重要事项：＿＿＿＿＿＿\n<\/li><\/ol>\n<h3>十、对照之后<\/h3>\n<ol><li>我们完全一致的地方有：＿＿＿＿＿＿\n<\/li><li>我们有分歧，但可以协调的地方有：＿＿＿＿＿＿\n<\/li><li>我们有分歧，一时无法协调的地方有：＿＿＿＿＿＿\n<\/li><li>这些分歧，我们打算怎么处理：＿＿＿＿＿＿\n<\/li><li>是否需要签署婚前协议：□ 是　□ 否　□ 再商量\n<\/li><\/ol>", "text": "# 附录 F　婚前深度沟通问卷\n\n> 用法：两个人各自在不同的地方独立填写，填完再交换，逐题对照。目的不是审问对方，而是把婚后一定会遇到的事，提前摆到桌面上。可以按自己的情况增删题目。\n\n填写人：＿＿＿＿＿＿　日期：＿＿＿＿＿＿\n\n---\n\n## 一、钱\n\n1. 我目前的月收入大约是＿＿＿＿元，稳定程度（1 到 5 分）：＿＿\n2. 我目前的存款大约＿＿＿＿元，投资、理财大约＿＿＿＿元。\n3. 我目前的债务（房贷、车贷、信用卡、网贷、借款）合计＿＿＿＿元，每月还款＿＿＿＿元。\n4. 我是否为他人提供过担保：□ 否　□ 是，对象＿＿＿＿，金额＿＿＿＿\n5. 我希望婚后的钱怎么管：□ 全部共管　□ 部分共管，各留零用金　□ AA 制\n6. 每月我希望自己有＿＿＿＿元零用金，不需要向对方解释。\n7. 超过＿＿＿＿元的支出，我认为需要先商量。\n8. 我认为的\"家庭紧急储备金\"应该有＿＿＿＿个月的开支。\n\n## 二、房\n\n9. 婚后住哪里？□ 我的房子　□ 对方的房子　□ 租房　□ 买新房　□ 和父母同住\n10. 如果买房：首付谁出？来源是什么？登记谁的名字？贷款谁还？\n11. 如果有一方的房子，婚后还贷是否使用共同收入？\n12. 房子的装修由谁出钱？\n\n## 三、车和其他大件\n\n13. 是否买车？预算＿＿＿＿元，谁出钱，登记谁的名字？\n\n## 四、孩子\n\n14. 我希望有＿＿＿＿个孩子；希望在＿＿＿＿岁之前开始。\n15. 如果暂时怀不上，我愿意做哪些检查和治疗？\n16. 谁来带孩子？是否需要有人暂停工作？暂停期间的收入怎么处理？\n17. 孩子的教育：公立／私立／国际，预算大概是＿＿＿＿元。\n18. 我对孩子的养育理念：＿＿＿＿＿＿\n19. 如果我们将来分开，孩子我认为应该＿＿＿＿＿＿\n\n## 五、双方父母\n\n20. 婚后是否和父母同住？同住的期限和范围是什么？\n21. 每年给父母的赡养费用大约＿＿＿＿元，是否同意对双方父母按同一标准？\n22. 父母生病时，谁负责照护，费用怎么分担？\n23. 我的父母对我们婚后生活有什么期待？我认为合理的是＿＿＿＿＿＿，不合理的是＿＿＿＿＿＿\n\n## 六、家务和工作\n\n24. 家务的分工，我认为应该＿＿＿＿＿＿\n25. 如果一方想换城市、换工作、创业，另一方的态度是＿＿＿＿＿＿\n26. 如果有一方长期失业，我们怎么应对？\n\n## 七、冲突与沟通\n\n27. 吵架时，我希望对方做的是＿＿＿＿＿＿，不希望的是＿＿＿＿＿＿\n28. 我需要的\"暂停\"时间是＿＿＿＿＿＿\n29. 我不能接受的行为（至少三条）：＿＿＿＿＿＿\n30. 如果我们没法自己解决问题，我愿意接受：□ 婚姻咨询　□ 家庭调解　□ 其他＿＿＿＿＿＿\n\n## 八、健康和风险\n\n31. 我的健康情况，包括重大疾病、传染病、遗传疾病、生育相关情况：＿＿＿＿＿＿\n32. 我的心理健康情况（是否有诊断、是否在治疗）：＿＿＿＿＿＿\n33. 我们的保险安排：＿＿＿＿＿＿\n\n## 九、过去\n\n34. 我是否有过婚姻：□ 否　□ 是，对方姓名＿＿＿＿，离婚时间＿＿＿＿，有无子女＿＿＿＿，有无未了结的财产或债务＿＿＿＿\n35. 我是否有其他需要在婚前告知对方的重要事项：＿＿＿＿＿＿\n\n## 十、对照之后\n\n36. 我们完全一致的地方有：＿＿＿＿＿＿\n37. 我们有分歧，但可以协调的地方有：＿＿＿＿＿＿\n38. 我们有分歧，一时无法协调的地方有：＿＿＿＿＿＿\n39. 这些分歧，我们打算怎么处理：＿＿＿＿＿＿\n40. 是否需要签署婚前协议：□ 是　□ 否　□ 再商量\n"}, {"id": "G-婚前财产协议", "title": "附录 G　婚前财产协议", "html": "<h2>附录 G　婚前财产协议<\/h2>\n<blockquote>范本仅供参考，不能直接套用。签署前，双方各自咨询律师；有较大资产的，建议公证。不要写违反法律的条款，不要写限制人身自由、约定子女抚养权归属的条款。<\/blockquote>\n<hr>\n<p><strong>婚前财产协议<\/strong><\/p>\n<p>甲方：＿＿＿＿＿＿，男／女，身份证号：＿＿＿＿＿＿＿＿＿＿<br>乙方：＿＿＿＿＿＿，男／女，身份证号：＿＿＿＿＿＿＿＿＿＿<\/p>\n<p>双方拟于＿＿年＿＿月前后登记结婚。为明确婚前、婚后的财产关系，双方在平等、自愿、协商一致的基础上，签订如下协议：<\/p>\n<p><strong>第一条　声明<\/strong><\/p>\n<ol><li>双方均已认真阅读本协议，理解各条款的法律后果；\n<\/li><li>双方均已各自咨询过律师（或：双方自愿放弃咨询律师的权利，并确认已理解本协议）；\n<\/li><li>双方均确认，本协议不存在欺诈、胁迫，是双方真实意思表示；\n<\/li><li>双方均已向对方如实披露自己的财产和债务情况。\n<\/li><\/ol>\n<p><strong>第二条　婚前个人财产<\/strong><\/p>\n<p>甲方婚前个人财产清单：<\/p>\n<div class='tw'><table><thead><tr><th>类别<\/th><th>名称 / 位置 / 账户<\/th><th>价值（元）<\/th><th>取得方式<\/th><\/tr><\/thead><tbody><tr><td>房产<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>存款<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>股权<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>车辆<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>其他<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p>乙方婚前个人财产清单：（同上）<\/p>\n<p>上述财产及其孳息、自然增值，婚后仍归各自所有。<\/p>\n<p><strong>第三条　婚前债务<\/strong><\/p>\n<p>甲方婚前债务：＿＿＿＿＿＿（债权人、金额、期限），由甲方个人承担。<br>乙方婚前债务：＿＿＿＿＿＿，由乙方个人承担。<br>一方婚后使用共同财产偿还婚前债务的，应当视为向另一方的借款，另一方有权要求返还，除非另有书面约定。<\/p>\n<p><strong>第四条　婚后收入与财产<\/strong><\/p>\n<p>（请选择一项）<br>□ 方案一：婚后所得，归夫妻共同所有。<br>□ 方案二：婚后各自收入，归各自所有。<br>□ 方案三：婚后工资收入，归夫妻共同所有；经营、投资收益，归取得一方所有。<br>□ 方案四：设共同账户＿＿＿＿＿＿，双方每月分别存入＿＿＿元，用于家庭开支；其余收入归各自所有。<\/p>\n<p>继承或受赠的财产：遗嘱或赠与合同明确指定只归一方的，归该方所有。<\/p>\n<p><strong>第五条　房产<\/strong><\/p>\n<ol><li>甲方名下房屋（地址＿＿＿＿＿＿），婚后仍归甲方所有。\n<\/li><li>该房屋婚后的贷款，由＿＿＿＿＿＿偿还，资金来源为＿＿＿＿＿＿。\n<\/li><li>如婚后用夫妻共同财产偿还该房屋贷款，离婚时，乙方可获得补偿，补偿金额按下列方式计算：＿＿＿＿＿＿（例：婚后共同偿还的贷款本金 ÷ 房屋购买总价 × 离婚时评估价 × ＿＿％）。\n<\/li><li>婚后新购房产的出资、登记和归属，另行书面约定。\n<\/li><li>一方未经另一方书面同意，不得将自己名下房屋加另一方的名字，也不得赠与第三人。\n<\/li><\/ol>\n<p><strong>第六条　股权与经营<\/strong><\/p>\n<ol><li>甲方持有的＿＿＿＿＿＿公司的股权，为甲方个人财产。\n<\/li><li>该股权婚后产生的分红，归＿＿＿＿＿＿。\n<\/li><li>该股权的增值，归＿＿＿＿＿＿。\n<\/li><li>一方为公司借款、担保，须提前告知另一方。\n<\/li><\/ol>\n<p><strong>第七条　日常开支<\/strong><\/p>\n<p>家庭日常开支，按＿＿＿＿＿＿（比例／固定金额）分担。重大支出（单笔超过＿＿＿元），双方应当先协商。<\/p>\n<p><strong>第八条　赠与<\/strong><\/p>\n<p>一方向第三人赠与单笔超过＿＿＿元的财产，须经另一方书面同意。<\/p>\n<p><strong>第九条　对外债务<\/strong><\/p>\n<p>双方确认，本协议已书面告知，将在必要时向债权人说明。<\/p>\n<p><strong>第十条　子女<\/strong><\/p>\n<p>本协议不涉及子女的抚养权归属。子女的抚养、教育，依法处理。<\/p>\n<p><strong>第十一条　协议的变更与终止<\/strong><\/p>\n<ol><li>本协议的变更，须双方书面同意；\n<\/li><li>本协议在双方婚姻关系存续期间有效；\n<\/li><li>双方协议变更时，应当重新清点财产清单。\n<\/li><\/ol>\n<p><strong>第十二条　争议解决<\/strong><\/p>\n<p>协商；协商不成，向＿＿＿＿＿＿人民法院起诉。<\/p>\n<p><strong>第十三条<\/strong><\/p>\n<p>本协议一式两份，双方各执一份。如经公证，公证处留存一份。修改处须双方签字或盖手印。<\/p>\n<p>甲方（签字、按手印）：＿＿＿＿＿＿　　乙方（签字、按手印）：＿＿＿＿＿＿<br>签署日期：＿＿年＿＿月＿＿日<\/p>", "text": "# 附录 G　婚前财产协议\n\n> 范本仅供参考，不能直接套用。签署前，双方各自咨询律师；有较大资产的，建议公证。不要写违反法律的条款，不要写限制人身自由、约定子女抚养权归属的条款。\n\n---\n\n**婚前财产协议**\n\n甲方：＿＿＿＿＿＿，男／女，身份证号：＿＿＿＿＿＿＿＿＿＿\n乙方：＿＿＿＿＿＿，男／女，身份证号：＿＿＿＿＿＿＿＿＿＿\n\n双方拟于＿＿年＿＿月前后登记结婚。为明确婚前、婚后的财产关系，双方在平等、自愿、协商一致的基础上，签订如下协议：\n\n**第一条　声明**\n\n1. 双方均已认真阅读本协议，理解各条款的法律后果；\n2. 双方均已各自咨询过律师（或：双方自愿放弃咨询律师的权利，并确认已理解本协议）；\n3. 双方均确认，本协议不存在欺诈、胁迫，是双方真实意思表示；\n4. 双方均已向对方如实披露自己的财产和债务情况。\n\n**第二条　婚前个人财产**\n\n甲方婚前个人财产清单：\n\n| 类别 | 名称 / 位置 / 账户 | 价值（元） | 取得方式 |\n|---|---|---|---|\n| 房产 | | | |\n| 存款 | | | |\n| 股权 | | | |\n| 车辆 | | | |\n| 其他 | | | |\n\n乙方婚前个人财产清单：（同上）\n\n上述财产及其孳息、自然增值，婚后仍归各自所有。\n\n**第三条　婚前债务**\n\n甲方婚前债务：＿＿＿＿＿＿（债权人、金额、期限），由甲方个人承担。\n乙方婚前债务：＿＿＿＿＿＿，由乙方个人承担。\n一方婚后使用共同财产偿还婚前债务的，应当视为向另一方的借款，另一方有权要求返还，除非另有书面约定。\n\n**第四条　婚后收入与财产**\n\n（请选择一项）\n□ 方案一：婚后所得，归夫妻共同所有。\n□ 方案二：婚后各自收入，归各自所有。\n□ 方案三：婚后工资收入，归夫妻共同所有；经营、投资收益，归取得一方所有。\n□ 方案四：设共同账户＿＿＿＿＿＿，双方每月分别存入＿＿＿元，用于家庭开支；其余收入归各自所有。\n\n继承或受赠的财产：遗嘱或赠与合同明确指定只归一方的，归该方所有。\n\n**第五条　房产**\n\n1. 甲方名下房屋（地址＿＿＿＿＿＿），婚后仍归甲方所有。\n2. 该房屋婚后的贷款，由＿＿＿＿＿＿偿还，资金来源为＿＿＿＿＿＿。\n3. 如婚后用夫妻共同财产偿还该房屋贷款，离婚时，乙方可获得补偿，补偿金额按下列方式计算：＿＿＿＿＿＿（例：婚后共同偿还的贷款本金 ÷ 房屋购买总价 × 离婚时评估价 × ＿＿％）。\n4. 婚后新购房产的出资、登记和归属，另行书面约定。\n5. 一方未经另一方书面同意，不得将自己名下房屋加另一方的名字，也不得赠与第三人。\n\n**第六条　股权与经营**\n\n1. 甲方持有的＿＿＿＿＿＿公司的股权，为甲方个人财产。\n2. 该股权婚后产生的分红，归＿＿＿＿＿＿。\n3. 该股权的增值，归＿＿＿＿＿＿。\n4. 一方为公司借款、担保，须提前告知另一方。\n\n**第七条　日常开支**\n\n家庭日常开支，按＿＿＿＿＿＿（比例／固定金额）分担。重大支出（单笔超过＿＿＿元），双方应当先协商。\n\n**第八条　赠与**\n\n一方向第三人赠与单笔超过＿＿＿元的财产，须经另一方书面同意。\n\n**第九条　对外债务**\n\n双方确认，本协议已书面告知，将在必要时向债权人说明。\n\n**第十条　子女**\n\n本协议不涉及子女的抚养权归属。子女的抚养、教育，依法处理。\n\n**第十一条　协议的变更与终止**\n\n1. 本协议的变更，须双方书面同意；\n2. 本协议在双方婚姻关系存续期间有效；\n3. 双方协议变更时，应当重新清点财产清单。\n\n**第十二条　争议解决**\n\n协商；协商不成，向＿＿＿＿＿＿人民法院起诉。\n\n**第十三条**\n\n本协议一式两份，双方各执一份。如经公证，公证处留存一份。修改处须双方签字或盖手印。\n\n甲方（签字、按手印）：＿＿＿＿＿＿　　乙方（签字、按手印）：＿＿＿＿＿＿\n签署日期：＿＿年＿＿月＿＿日\n"}, {"id": "H-婚内财产协议", "title": "附录 H　婚内财产协议", "html": "<h2>附录 H　婚内财产协议<\/h2>\n<blockquote>范本仅供参考。婚内协议要在双方真实自愿的前提下签署，不要用逼迫的方式让对方签字。涉及大额财产，建议各自咨询律师并公证。<\/blockquote>\n<hr>\n<p><strong>婚内财产协议<\/strong><\/p>\n<p>甲方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿<br>乙方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿<\/p>\n<p>甲乙双方于＿＿年＿＿月＿＿日登记结婚。为理清婚姻存续期间的财产关系，增进互相信任，减少因财产产生的猜测和矛盾，双方自愿达成如下协议：<\/p>\n<p><strong>第一条　目的<\/strong><br>本协议是为了明确财产归属，不是为了解除婚姻关系。<\/p>\n<p><strong>第二条　财产清单<\/strong><\/p>\n<div class='tw'><table><thead><tr><th>财产<\/th><th>位置 / 账户<\/th><th>价值<\/th><th>取得时间<\/th><th>取得方式<\/th><th>本协议约定的归属<\/th><\/tr><\/thead><tbody><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>甲个人 / 乙个人 / 共同<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>第三条　婚后收入<\/strong><br>自本协议签订之日起：<\/p>\n<ol><li>甲方的工资、奖金、劳务报酬，归＿＿＿＿＿＿所有；\n<\/li><li>乙方的工资、奖金、劳务报酬，归＿＿＿＿＿＿所有；\n<\/li><li>经营、投资收益，归＿＿＿＿＿＿所有；\n<\/li><li>继承或受赠的财产，遗嘱或赠与合同明确只归一方的，归该方所有。\n<\/li><\/ol>\n<p><strong>第四条　共同账户与日常开支<\/strong><br>设立共同账户＿＿＿＿＿＿，每月存入＿＿＿元，用于家庭日常开支。<\/p>\n<p><strong>第五条　重大支出<\/strong><br>单笔超过＿＿＿元的支出，应当提前商量。<\/p>\n<p><strong>第六条　房产<\/strong><br>＿＿＿＿＿＿房屋，归＿＿＿＿＿＿所有，贷款由＿＿＿＿＿＿偿还。<\/p>\n<p><strong>第七条　家务和照顾家庭的补偿<\/strong><br>一方因照顾孩子、老人，减少工作，对家庭做出较多贡献的，另一方同意＿＿＿＿＿＿（例如：每月划转＿＿＿元至对方账户，或在离婚时另行补偿＿＿＿元）。<\/p>\n<p><strong>第八条　债务<\/strong><\/p>\n<ol><li>双方各自以个人名义所负的债务，除用于家庭日常生活外，由负债方自行承担；\n<\/li><li>对外借款、担保，应当事先告知对方。\n<\/li><\/ol>\n<p><strong>第九条　对外效力<\/strong><br>双方确认，本协议只在夫妻之间产生效力。对第三人，以第三人是否知道本协议为准。<\/p>\n<p><strong>第十条　变更<\/strong><br>双方书面一致同意，可变更本协议。<\/p>\n<p><strong>第十一条　争议解决<\/strong><br>协商；协商不成，向＿＿＿＿＿＿人民法院起诉。<\/p>\n<p><strong>第十二条<\/strong><br>本协议一式两份，双方各执一份。修改处须双方签字。<\/p>\n<p>甲方（签字、按手印）：＿＿＿＿＿＿　　乙方（签字、按手印）：＿＿＿＿＿＿<br>签署日期：＿＿年＿＿月＿＿日<\/p>", "text": "# 附录 H　婚内财产协议\n\n> 范本仅供参考。婚内协议要在双方真实自愿的前提下签署，不要用逼迫的方式让对方签字。涉及大额财产，建议各自咨询律师并公证。\n\n---\n\n**婚内财产协议**\n\n甲方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿\n乙方：＿＿＿＿＿＿，身份证号：＿＿＿＿＿＿＿＿＿＿\n\n甲乙双方于＿＿年＿＿月＿＿日登记结婚。为理清婚姻存续期间的财产关系，增进互相信任，减少因财产产生的猜测和矛盾，双方自愿达成如下协议：\n\n**第一条　目的**\n本协议是为了明确财产归属，不是为了解除婚姻关系。\n\n**第二条　财产清单**\n\n| 财产 | 位置 / 账户 | 价值 | 取得时间 | 取得方式 | 本协议约定的归属 |\n|---|---|---|---|---|---|\n| | | | | | 甲个人 / 乙个人 / 共同 |\n\n**第三条　婚后收入**\n自本协议签订之日起：\n1. 甲方的工资、奖金、劳务报酬，归＿＿＿＿＿＿所有；\n2. 乙方的工资、奖金、劳务报酬，归＿＿＿＿＿＿所有；\n3. 经营、投资收益，归＿＿＿＿＿＿所有；\n4. 继承或受赠的财产，遗嘱或赠与合同明确只归一方的，归该方所有。\n\n**第四条　共同账户与日常开支**\n设立共同账户＿＿＿＿＿＿，每月存入＿＿＿元，用于家庭日常开支。\n\n**第五条　重大支出**\n单笔超过＿＿＿元的支出，应当提前商量。\n\n**第六条　房产**\n＿＿＿＿＿＿房屋，归＿＿＿＿＿＿所有，贷款由＿＿＿＿＿＿偿还。\n\n**第七条　家务和照顾家庭的补偿**\n一方因照顾孩子、老人，减少工作，对家庭做出较多贡献的，另一方同意＿＿＿＿＿＿（例如：每月划转＿＿＿元至对方账户，或在离婚时另行补偿＿＿＿元）。\n\n**第八条　债务**\n1. 双方各自以个人名义所负的债务，除用于家庭日常生活外，由负债方自行承担；\n2. 对外借款、担保，应当事先告知对方。\n\n**第九条　对外效力**\n双方确认，本协议只在夫妻之间产生效力。对第三人，以第三人是否知道本协议为准。\n\n**第十条　变更**\n双方书面一致同意，可变更本协议。\n\n**第十一条　争议解决**\n协商；协商不成，向＿＿＿＿＿＿人民法院起诉。\n\n**第十二条**\n本协议一式两份，双方各执一份。修改处须双方签字。\n\n甲方（签字、按手印）：＿＿＿＿＿＿　　乙方（签字、按手印）：＿＿＿＿＿＿\n签署日期：＿＿年＿＿月＿＿日\n"}, {"id": "I-离婚协议书", "title": "附录 I　离婚协议书", "html": "<h2>附录 I　离婚协议书<\/h2>\n<blockquote>范本仅供参考，不能直接套用，每个家庭的情况都不一样。使用前请对照 <a href=\"#/e/086\">第 086 条<\/a> 的十二项审查清单；签署前建议请律师审阅。协议里的每一项，都写到\"执行时不用再猜\"的程度。<\/blockquote>\n<hr>\n<p><strong>离婚协议书<\/strong><\/p>\n<p>男方：＿＿＿＿＿＿，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿＿＿<br>女方：＿＿＿＿＿＿，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿＿＿<\/p>\n<p>双方于＿＿年＿＿月＿＿日登记结婚，婚后生有＿＿子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）。现因＿＿＿＿＿＿，夫妻感情破裂，双方自愿离婚，在平等、自愿、协商一致的基础上，就离婚事项达成如下协议：<\/p>\n<p><strong>第一条　离婚意愿<\/strong><br>双方自愿离婚，双方均具有完全民事行为能力，均确认本协议是真实意思表示。<\/p>\n<p><strong>第二条　子女抚养<\/strong><\/p>\n<ol><li>子女＿＿＿＿＿＿由＿＿＿＿＿＿直接抚养；\n<\/li><li>另一方每月＿＿日前，支付抚养费＿＿＿元，至子女年满十八周岁止。支付方式：转入＿＿＿＿＿＿账户。\n<\/li><li>子女教育费、医疗费等大额支出，按＿＿＿＿＿＿比例分担。大额支出的范围：单笔超过＿＿＿元的。\n<\/li><li>探望：\n<ul><li>每周＿＿＿，＿＿时至＿＿时；\n<\/li><li>节假日：春节、国庆等的安排＿＿＿＿＿＿；\n<\/li><li>寒暑假：＿＿＿＿＿＿；\n<\/li><li>接送方式：＿＿＿＿＿＿，地点：＿＿＿＿＿＿；\n<\/li><\/ul>\n<\/li><li>双方不得在子女面前贬低对方，不得干预对方与子女的正常联系；\n<\/li><li>子女的户口、姓氏、保险、学籍：＿＿＿＿＿＿。\n<\/li><\/ol>\n<p><strong>第三条　房产<\/strong><\/p>\n<ol><li>位于＿＿＿＿＿＿的房屋，产权证号＿＿＿＿＿＿，登记在＿＿＿＿＿＿名下，归＿＿＿＿＿＿所有；\n<\/li><li>获得房产的一方，在＿＿年＿＿月＿＿日前，向另一方支付补偿款人民币＿＿＿元；\n<\/li><li>该房屋尚未还清的贷款，余额＿＿＿元，由＿＿＿＿＿＿承担，银行同意变更借款人的，在＿＿日内办理变更；银行不同意的，由＿＿＿＿＿＿继续还款，并保证对方不因此承担责任；\n<\/li><li>过户时间：自领取离婚证之日起＿＿日内办理完毕；过户产生的税费，由＿＿＿＿＿＿承担；\n<\/li><li>一方不配合办理过户的，应当承担违约责任。\n<\/li><\/ol>\n<p><strong>第四条　车辆<\/strong><br>＿＿＿＿＿＿车辆，车牌号＿＿＿＿＿＿，归＿＿＿＿＿＿所有，过户在＿＿日内完成。<\/p>\n<p><strong>第五条　存款、理财、股票、基金<\/strong><\/p>\n<ol><li>双方名下的存款、理财等，归属如下：＿＿＿＿＿＿（逐项列出）；\n<\/li><li>转账时间：自领取离婚证之日起＿＿日内。\n<\/li><\/ol>\n<p><strong>第六条　股权、公司<\/strong><br>＿＿＿＿＿＿公司的股权，归＿＿＿＿＿＿，对另一方补偿＿＿＿元，在＿＿年＿＿月＿＿日前付清。<\/p>\n<p><strong>第七条　保险、公积金、养老金<\/strong><br>＿＿＿＿＿＿（按协议处理，或各自保留）。<\/p>\n<p><strong>第八条　债务<\/strong><\/p>\n<ol><li>双方确认，共同债务总额＿＿＿元，债权人＿＿＿＿＿＿，由＿＿＿＿＿＿承担；\n<\/li><li>如一方承担了对方应负责的债务，另一方应当在＿＿日内偿还；\n<\/li><li>双方确认，各自的个人债务，由本人承担；\n<\/li><li>除本协议列明的以外，没有其他共同债务。如有，由发生债务的一方承担。\n<\/li><\/ol>\n<p><strong>第九条　其他财产<\/strong><br>家具、家电、贵重物品：归＿＿＿＿＿＿。<\/p>\n<p><strong>第十条　经济补偿<\/strong><br>＿＿＿＿＿＿（如有家务补偿、经济帮助，写明金额与支付方式。没有的写\"无\"）。<\/p>\n<p><strong>第十一条　违约责任<\/strong><br>一方不履行本协议的，应当向对方支付违约金＿＿＿元，并承担对方为主张权利支付的合理费用（包括律师费、诉讼费）。<\/p>\n<p><strong>第十二条　财产披露与兜底<\/strong><\/p>\n<ol><li>双方确认，已经向对方如实披露所有夫妻共同财产和债务；\n<\/li><li>如发现一方隐藏、转移夫妻共同财产，另一方可以另行主张分割，该方应当少分或者不分；\n<\/li><li>本协议签署后发现的、协议中没有处理的共同财产，双方另行协商分割。\n<\/li><\/ol>\n<p><strong>第十三条　生效<\/strong><br>本协议自双方签字之日起成立，自双方领取离婚证之日起生效。<\/p>\n<p><strong>第十四条　其他<\/strong><br>本协议一式三份，双方各执一份，民政部门留存一份。<\/p>\n<p>男方（签字、按手印）：＿＿＿＿＿＿　　女方（签字、按手印）：＿＿＿＿＿＿<br>日期：＿＿年＿＿月＿＿日<\/p>", "text": "# 附录 I　离婚协议书\n\n> 范本仅供参考，不能直接套用，每个家庭的情况都不一样。使用前请对照 第 086 条 的十二项审查清单；签署前建议请律师审阅。协议里的每一项，都写到\"执行时不用再猜\"的程度。\n\n---\n\n**离婚协议书**\n\n男方：＿＿＿＿＿＿，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿＿＿\n女方：＿＿＿＿＿＿，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿＿＿\n\n双方于＿＿年＿＿月＿＿日登记结婚，婚后生有＿＿子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）。现因＿＿＿＿＿＿，夫妻感情破裂，双方自愿离婚，在平等、自愿、协商一致的基础上，就离婚事项达成如下协议：\n\n**第一条　离婚意愿**\n双方自愿离婚，双方均具有完全民事行为能力，均确认本协议是真实意思表示。\n\n**第二条　子女抚养**\n\n1. 子女＿＿＿＿＿＿由＿＿＿＿＿＿直接抚养；\n2. 另一方每月＿＿日前，支付抚养费＿＿＿元，至子女年满十八周岁止。支付方式：转入＿＿＿＿＿＿账户。\n3. 子女教育费、医疗费等大额支出，按＿＿＿＿＿＿比例分担。大额支出的范围：单笔超过＿＿＿元的。\n4. 探望：\n   - 每周＿＿＿，＿＿时至＿＿时；\n   - 节假日：春节、国庆等的安排＿＿＿＿＿＿；\n   - 寒暑假：＿＿＿＿＿＿；\n   - 接送方式：＿＿＿＿＿＿，地点：＿＿＿＿＿＿；\n5. 双方不得在子女面前贬低对方，不得干预对方与子女的正常联系；\n6. 子女的户口、姓氏、保险、学籍：＿＿＿＿＿＿。\n\n**第三条　房产**\n\n1. 位于＿＿＿＿＿＿的房屋，产权证号＿＿＿＿＿＿，登记在＿＿＿＿＿＿名下，归＿＿＿＿＿＿所有；\n2. 获得房产的一方，在＿＿年＿＿月＿＿日前，向另一方支付补偿款人民币＿＿＿元；\n3. 该房屋尚未还清的贷款，余额＿＿＿元，由＿＿＿＿＿＿承担，银行同意变更借款人的，在＿＿日内办理变更；银行不同意的，由＿＿＿＿＿＿继续还款，并保证对方不因此承担责任；\n4. 过户时间：自领取离婚证之日起＿＿日内办理完毕；过户产生的税费，由＿＿＿＿＿＿承担；\n5. 一方不配合办理过户的，应当承担违约责任。\n\n**第四条　车辆**\n＿＿＿＿＿＿车辆，车牌号＿＿＿＿＿＿，归＿＿＿＿＿＿所有，过户在＿＿日内完成。\n\n**第五条　存款、理财、股票、基金**\n1. 双方名下的存款、理财等，归属如下：＿＿＿＿＿＿（逐项列出）；\n2. 转账时间：自领取离婚证之日起＿＿日内。\n\n**第六条　股权、公司**\n＿＿＿＿＿＿公司的股权，归＿＿＿＿＿＿，对另一方补偿＿＿＿元，在＿＿年＿＿月＿＿日前付清。\n\n**第七条　保险、公积金、养老金**\n＿＿＿＿＿＿（按协议处理，或各自保留）。\n\n**第八条　债务**\n1. 双方确认，共同债务总额＿＿＿元，债权人＿＿＿＿＿＿，由＿＿＿＿＿＿承担；\n2. 如一方承担了对方应负责的债务，另一方应当在＿＿日内偿还；\n3. 双方确认，各自的个人债务，由本人承担；\n4. 除本协议列明的以外，没有其他共同债务。如有，由发生债务的一方承担。\n\n**第九条　其他财产**\n家具、家电、贵重物品：归＿＿＿＿＿＿。\n\n**第十条　经济补偿**\n＿＿＿＿＿＿（如有家务补偿、经济帮助，写明金额与支付方式。没有的写\"无\"）。\n\n**第十一条　违约责任**\n一方不履行本协议的，应当向对方支付违约金＿＿＿元，并承担对方为主张权利支付的合理费用（包括律师费、诉讼费）。\n\n**第十二条　财产披露与兜底**\n1. 双方确认，已经向对方如实披露所有夫妻共同财产和债务；\n2. 如发现一方隐藏、转移夫妻共同财产，另一方可以另行主张分割，该方应当少分或者不分；\n3. 本协议签署后发现的、协议中没有处理的共同财产，双方另行协商分割。\n\n**第十三条　生效**\n本协议自双方签字之日起成立，自双方领取离婚证之日起生效。\n\n**第十四条　其他**\n本协议一式三份，双方各执一份，民政部门留存一份。\n\n男方（签字、按手印）：＿＿＿＿＿＿　　女方（签字、按手印）：＿＿＿＿＿＿\n日期：＿＿年＿＿月＿＿日\n"}, {"id": "J-民事起诉状（离婚纠纷）", "title": "附录 J　民事起诉状（离婚纠纷）", "html": "<h2>附录 J　民事起诉状（离婚纠纷）<\/h2>\n<blockquote>范本仅供参考。起诉前对照 <a href=\"#/e/094\">第 094 条<\/a> 至 <a href=\"#/e/096\">第 096 条<\/a>。涉及的诉讼请求，请根据实际情况增删。<\/blockquote>\n<hr>\n<p><strong>民事起诉状<\/strong><\/p>\n<p><strong>原告<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。<\/p>\n<p><strong>被告<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。<\/p>\n<p><strong>案由<\/strong>：离婚纠纷<\/p>\n<p><strong>诉讼请求<\/strong>：<\/p>\n<ol><li>请求判令原告与被告离婚；\n<\/li><li>请求判令婚生子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）由原告直接抚养，被告每月支付抚养费＿＿＿元，至子女年满十八周岁止；被告享有探望权，探望方式为＿＿＿＿＿＿；\n<\/li><li>请求依法分割夫妻共同财产，具体为：\n<br>（1）位于＿＿＿＿＿＿的房屋，归＿＿＿＿＿＿所有，并由＿＿＿＿＿＿向对方支付补偿款＿＿＿元；\n<br>（2）车辆＿＿＿＿＿＿，归＿＿＿＿＿＿所有；\n<br>（3）存款、理财、股票、保险等：＿＿＿＿＿＿；\n<br>（4）其他：＿＿＿＿＿＿；\n<\/li><li>请求依法分担夫妻共同债务：＿＿＿＿＿＿；\n<\/li><li>请求判令被告支付离婚损害赔偿＿＿＿元（如无，可删除）；\n<\/li><li>本案诉讼费用由被告承担。\n<\/li><\/ol>\n<p><strong>事实与理由<\/strong>：<\/p>\n<p>原、被告于＿＿年＿＿月经＿＿＿＿＿＿认识，＿＿年＿＿月＿＿日登记结婚，婚后生有＿子／女＿＿＿＿＿＿。<\/p>\n<p>婚后，双方因＿＿＿＿＿＿（家庭琐事／被告＿＿＿＿＿＿）产生矛盾。＿＿年＿＿月起，双方开始分居，分居时间已满＿＿年＿＿月。其间，原告多次尝试沟通和修复，均无结果。夫妻感情已经破裂，无和好可能。<\/p>\n<p><strong>关于子女抚养<\/strong>：原告长期负责子女的日常照料，具体为＿＿＿＿＿＿（接送、就医、陪伴等）；原告有稳定收入，月收入约＿＿＿元；有固定住所＿＿＿＿＿＿；子女与原告共同生活，关系亲密。原告更有利于子女的健康成长。<\/p>\n<p><strong>关于夫妻共同财产<\/strong>：婚姻存续期间，双方共同取得的财产有＿＿＿＿＿＿，价值约＿＿＿元（详见财产清单）。其中＿＿＿＿＿＿为原告婚前个人财产。婚后共同还贷＿＿＿元。<\/p>\n<p><strong>关于夫妻共同债务<\/strong>：双方有共同债务＿＿＿元，用于＿＿＿＿＿＿。<\/p>\n<p><strong>关于离婚损害赔偿<\/strong>（如有）：被告存在＿＿＿＿＿＿（重婚／与他人同居／家庭暴力／虐待遗弃）的过错，有＿＿＿＿＿＿证据为证。<\/p>\n<p>综上，依据《中华人民共和国民法典》第一千零七十九条、第一千零八十四条、第一千零八十七条、第一千零九十一条等规定，特向贵院提起诉讼，请依法判决。<\/p>\n<p><strong>此致<\/strong><\/p>\n<p>＿＿＿＿＿＿人民法院<\/p>\n<p><strong>具状人（签名）<\/strong>：＿＿＿＿＿＿<br>＿＿年＿＿月＿＿日<\/p>\n<p><strong>附<\/strong>：<\/p>\n<ol><li>起诉状副本＿＿份；\n<\/li><li>身份证明；结婚证；子女出生证明；\n<\/li><li>夫妻感情破裂的证据（分居证明、聊天记录等）；\n<\/li><li>财产清单及证明材料（房产证、银行流水、评估材料等）；\n<\/li><li>子女抚养相关证据；\n<\/li><li>其他证据。\n<\/li><\/ol>", "text": "# 附录 J　民事起诉状（离婚纠纷）\n\n> 范本仅供参考。起诉前对照 第 094 条 至 第 096 条。涉及的诉讼请求，请根据实际情况增删。\n\n---\n\n**民事起诉状**\n\n**原告**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。\n\n**被告**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，汉族，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，联系电话：＿＿＿＿＿＿。\n\n**案由**：离婚纠纷\n\n**诉讼请求**：\n\n1. 请求判令原告与被告离婚；\n2. 请求判令婚生子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）由原告直接抚养，被告每月支付抚养费＿＿＿元，至子女年满十八周岁止；被告享有探望权，探望方式为＿＿＿＿＿＿；\n3. 请求依法分割夫妻共同财产，具体为：\n   （1）位于＿＿＿＿＿＿的房屋，归＿＿＿＿＿＿所有，并由＿＿＿＿＿＿向对方支付补偿款＿＿＿元；\n   （2）车辆＿＿＿＿＿＿，归＿＿＿＿＿＿所有；\n   （3）存款、理财、股票、保险等：＿＿＿＿＿＿；\n   （4）其他：＿＿＿＿＿＿；\n4. 请求依法分担夫妻共同债务：＿＿＿＿＿＿；\n5. 请求判令被告支付离婚损害赔偿＿＿＿元（如无，可删除）；\n6. 本案诉讼费用由被告承担。\n\n**事实与理由**：\n\n原、被告于＿＿年＿＿月经＿＿＿＿＿＿认识，＿＿年＿＿月＿＿日登记结婚，婚后生有＿子／女＿＿＿＿＿＿。\n\n婚后，双方因＿＿＿＿＿＿（家庭琐事／被告＿＿＿＿＿＿）产生矛盾。＿＿年＿＿月起，双方开始分居，分居时间已满＿＿年＿＿月。其间，原告多次尝试沟通和修复，均无结果。夫妻感情已经破裂，无和好可能。\n\n**关于子女抚养**：原告长期负责子女的日常照料，具体为＿＿＿＿＿＿（接送、就医、陪伴等）；原告有稳定收入，月收入约＿＿＿元；有固定住所＿＿＿＿＿＿；子女与原告共同生活，关系亲密。原告更有利于子女的健康成长。\n\n**关于夫妻共同财产**：婚姻存续期间，双方共同取得的财产有＿＿＿＿＿＿，价值约＿＿＿元（详见财产清单）。其中＿＿＿＿＿＿为原告婚前个人财产。婚后共同还贷＿＿＿元。\n\n**关于夫妻共同债务**：双方有共同债务＿＿＿元，用于＿＿＿＿＿＿。\n\n**关于离婚损害赔偿**（如有）：被告存在＿＿＿＿＿＿（重婚／与他人同居／家庭暴力／虐待遗弃）的过错，有＿＿＿＿＿＿证据为证。\n\n综上，依据《中华人民共和国民法典》第一千零七十九条、第一千零八十四条、第一千零八十七条、第一千零九十一条等规定，特向贵院提起诉讼，请依法判决。\n\n**此致**\n\n＿＿＿＿＿＿人民法院\n\n**具状人（签名）**：＿＿＿＿＿＿\n＿＿年＿＿月＿＿日\n\n**附**：\n1. 起诉状副本＿＿份；\n2. 身份证明；结婚证；子女出生证明；\n3. 夫妻感情破裂的证据（分居证明、聊天记录等）；\n4. 财产清单及证明材料（房产证、银行流水、评估材料等）；\n5. 子女抚养相关证据；\n6. 其他证据。\n"}, {"id": "K-人格权侵害禁令申请书", "title": "附录 K　人格权侵害禁令申请书", "html": "<h2>附录 K　人格权侵害禁令申请书<\/h2>\n<blockquote>范本仅供参考。适用于对方抢夺、藏匿未成年子女，阻碍你行使监护、探望权利的情形。申请时需说明情况紧迫，不立即制止会使你的合法权益受到难以弥补的损害，并提供证据。可以先报警，同时申请。<\/blockquote>\n<hr>\n<p><strong>人格权侵害禁令申请书<\/strong><\/p>\n<p><strong>申请人<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>被申请人<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>与申请人的关系<\/strong>：申请人与被申请人是＿＿＿＿＿＿（夫妻／前夫妻／同居关系），婚生子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）。<\/p>\n<p><strong>申请事项<\/strong>：<\/p>\n<ol><li>请求裁定被申请人立即停止藏匿、转移未成年子女＿＿＿＿＿＿的行为；\n<\/li><li>请求裁定被申请人立即将子女送回／告知子女所在位置，并配合申请人与子女正常联系；\n<\/li><li>请求裁定被申请人不得阻碍申请人探望子女；\n<\/li><li>本申请的费用，由被申请人承担。\n<\/li><\/ol>\n<p><strong>事实与理由<\/strong>：<\/p>\n<p>申请人与被申请人于＿＿年＿＿月登记结婚（或：同居），婚后生有子女＿＿＿＿＿＿，现＿＿岁，一直与＿＿＿＿＿＿共同生活。<\/p>\n<p>＿＿年＿＿月＿＿日，被申请人在没有告知申请人、没有经过申请人同意的情况下，将子女带离＿＿＿＿＿＿，至今＿＿日，申请人无法联系到子女，不知道子女所在位置。（具体经过：＿＿＿＿＿＿。）<\/p>\n<p>申请人多次通过＿＿＿＿＿＿（电话、微信、通过对方亲友）要求被申请人告知子女的下落，被申请人均拒绝。申请人已于＿＿年＿＿月＿＿日向＿＿＿＿＿＿派出所报警，报警回执编号＿＿＿＿＿＿。<\/p>\n<p>被申请人的行为，侵害了子女的人身自由和健康成长的权益，侵害了申请人作为监护人（或探望权人）的合法权利。情况紧迫，如不及时制止，子女的上学、就医、人身安全会受到难以弥补的损害。<\/p>\n<p>依据《中华人民共和国民法典》第九百九十七条，《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第十二条的规定，特向贵院申请作出人格权侵害禁令，请依法裁定。<\/p>\n<p><strong>此致<\/strong><\/p>\n<p>＿＿＿＿＿＿人民法院<\/p>\n<p><strong>申请人（签名）<\/strong>：＿＿＿＿＿＿<br>＿＿年＿＿月＿＿日<\/p>\n<p><strong>附<\/strong>：<\/p>\n<ol><li>申请人、被申请人身份证明；\n<\/li><li>结婚证、子女出生证明；\n<\/li><li>报警回执；\n<\/li><li>聊天记录、通话记录；\n<\/li><li>子女在学校的出勤记录，教师的说明；\n<\/li><li>其他证据。\n<\/li><\/ol>", "text": "# 附录 K　人格权侵害禁令申请书\n\n> 范本仅供参考。适用于对方抢夺、藏匿未成年子女，阻碍你行使监护、探望权利的情形。申请时需说明情况紧迫，不立即制止会使你的合法权益受到难以弥补的损害，并提供证据。可以先报警，同时申请。\n\n---\n\n**人格权侵害禁令申请书**\n\n**申请人**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**被申请人**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**与申请人的关系**：申请人与被申请人是＿＿＿＿＿＿（夫妻／前夫妻／同居关系），婚生子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）。\n\n**申请事项**：\n\n1. 请求裁定被申请人立即停止藏匿、转移未成年子女＿＿＿＿＿＿的行为；\n2. 请求裁定被申请人立即将子女送回／告知子女所在位置，并配合申请人与子女正常联系；\n3. 请求裁定被申请人不得阻碍申请人探望子女；\n4. 本申请的费用，由被申请人承担。\n\n**事实与理由**：\n\n申请人与被申请人于＿＿年＿＿月登记结婚（或：同居），婚后生有子女＿＿＿＿＿＿，现＿＿岁，一直与＿＿＿＿＿＿共同生活。\n\n＿＿年＿＿月＿＿日，被申请人在没有告知申请人、没有经过申请人同意的情况下，将子女带离＿＿＿＿＿＿，至今＿＿日，申请人无法联系到子女，不知道子女所在位置。（具体经过：＿＿＿＿＿＿。）\n\n申请人多次通过＿＿＿＿＿＿（电话、微信、通过对方亲友）要求被申请人告知子女的下落，被申请人均拒绝。申请人已于＿＿年＿＿月＿＿日向＿＿＿＿＿＿派出所报警，报警回执编号＿＿＿＿＿＿。\n\n被申请人的行为，侵害了子女的人身自由和健康成长的权益，侵害了申请人作为监护人（或探望权人）的合法权利。情况紧迫，如不及时制止，子女的上学、就医、人身安全会受到难以弥补的损害。\n\n依据《中华人民共和国民法典》第九百九十七条，《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第十二条的规定，特向贵院申请作出人格权侵害禁令，请依法裁定。\n\n**此致**\n\n＿＿＿＿＿＿人民法院\n\n**申请人（签名）**：＿＿＿＿＿＿\n＿＿年＿＿月＿＿日\n\n**附**：\n1. 申请人、被申请人身份证明；\n2. 结婚证、子女出生证明；\n3. 报警回执；\n4. 聊天记录、通话记录；\n5. 子女在学校的出勤记录，教师的说明；\n6. 其他证据。\n"}, {"id": "L-人身安全保护令申请书", "title": "附录 L　人身安全保护令申请书", "html": "<h2>附录 L　人身安全保护令申请书<\/h2>\n<blockquote>范本仅供参考。适用于遭受家庭暴力或面临家庭暴力现实危险的情形。男女均可申请。申请不收费。法院受理后，应当在七十二小时内作出裁定；情况紧急的，二十四小时内。具体办理方式，可咨询当地法院、妇联或报警。<\/blockquote>\n<hr>\n<p><strong>人身安全保护令申请书<\/strong><\/p>\n<p><strong>申请人<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>被申请人<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>与申请人的关系<\/strong>：＿＿＿＿＿＿（夫妻／前夫妻／同居关系／其他家庭成员）。<\/p>\n<p><strong>申请事项<\/strong>：<\/p>\n<p>请求裁定：<\/p>\n<ol><li>禁止被申请人殴打、威胁、恐吓、辱骂申请人及＿＿＿＿＿＿（近亲属）；\n<\/li><li>禁止被申请人跟踪、骚扰、接触申请人及＿＿＿＿＿＿；\n<\/li><li>禁止被申请人在距离申请人住所、工作单位＿＿＿米范围内活动；\n<\/li><li>责令被申请人迁出申请人的住所；（如有需要）\n<\/li><li>其他：＿＿＿＿＿＿。\n<\/li><\/ol>\n<p><strong>事实与理由<\/strong>：<\/p>\n<p>申请人与被申请人于＿＿年＿＿月登记结婚（或：同居），婚后生有＿＿＿＿＿＿。<\/p>\n<p>＿＿年＿＿月＿＿日，被申请人因＿＿＿＿＿＿，对申请人实施了＿＿＿＿＿＿（殴打／威胁／限制人身自由／长期辱骂恐吓）行为，造成申请人＿＿＿＿＿＿（受伤情况）。申请人于当日到＿＿＿＿＿＿医院就诊，诊断为＿＿＿＿＿＿，并向＿＿＿＿＿＿派出所报警，出警记录编号＿＿＿＿＿＿。<\/p>\n<p>此前，被申请人还多次实施类似行为：＿＿＿＿＿＿（时间、经过）。<\/p>\n<p>被申请人的行为，已经构成家庭暴力。申请人担心被申请人继续实施暴力，人身安全面临现实危险。<\/p>\n<p>依据《中华人民共和国反家庭暴力法》第二十三条至第三十三条的规定，特向贵院申请人身安全保护令，请依法裁定。<\/p>\n<p><strong>此致<\/strong><\/p>\n<p>＿＿＿＿＿＿人民法院<\/p>\n<p><strong>申请人（签名）<\/strong>：＿＿＿＿＿＿<br>＿＿年＿＿月＿＿日<\/p>\n<p><strong>附<\/strong>：<\/p>\n<ol><li>申请人、被申请人身份证明；\n<\/li><li>结婚证（或同居证明）；\n<\/li><li>报警回执、出警记录、告诫书；\n<\/li><li>医院病历、验伤报告、伤情照片；\n<\/li><li>威胁的短信、语音、聊天记录；\n<\/li><li>证人证言；\n<\/li><li>其他证据。\n<\/li><\/ol>", "text": "# 附录 L　人身安全保护令申请书\n\n> 范本仅供参考。适用于遭受家庭暴力或面临家庭暴力现实危险的情形。男女均可申请。申请不收费。法院受理后，应当在七十二小时内作出裁定；情况紧急的，二十四小时内。具体办理方式，可咨询当地法院、妇联或报警。\n\n---\n\n**人身安全保护令申请书**\n\n**申请人**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**被申请人**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**与申请人的关系**：＿＿＿＿＿＿（夫妻／前夫妻／同居关系／其他家庭成员）。\n\n**申请事项**：\n\n请求裁定：\n1. 禁止被申请人殴打、威胁、恐吓、辱骂申请人及＿＿＿＿＿＿（近亲属）；\n2. 禁止被申请人跟踪、骚扰、接触申请人及＿＿＿＿＿＿；\n3. 禁止被申请人在距离申请人住所、工作单位＿＿＿米范围内活动；\n4. 责令被申请人迁出申请人的住所；（如有需要）\n5. 其他：＿＿＿＿＿＿。\n\n**事实与理由**：\n\n申请人与被申请人于＿＿年＿＿月登记结婚（或：同居），婚后生有＿＿＿＿＿＿。\n\n＿＿年＿＿月＿＿日，被申请人因＿＿＿＿＿＿，对申请人实施了＿＿＿＿＿＿（殴打／威胁／限制人身自由／长期辱骂恐吓）行为，造成申请人＿＿＿＿＿＿（受伤情况）。申请人于当日到＿＿＿＿＿＿医院就诊，诊断为＿＿＿＿＿＿，并向＿＿＿＿＿＿派出所报警，出警记录编号＿＿＿＿＿＿。\n\n此前，被申请人还多次实施类似行为：＿＿＿＿＿＿（时间、经过）。\n\n被申请人的行为，已经构成家庭暴力。申请人担心被申请人继续实施暴力，人身安全面临现实危险。\n\n依据《中华人民共和国反家庭暴力法》第二十三条至第三十三条的规定，特向贵院申请人身安全保护令，请依法裁定。\n\n**此致**\n\n＿＿＿＿＿＿人民法院\n\n**申请人（签名）**：＿＿＿＿＿＿\n＿＿年＿＿月＿＿日\n\n**附**：\n1. 申请人、被申请人身份证明；\n2. 结婚证（或同居证明）；\n3. 报警回执、出警记录、告诫书；\n4. 医院病历、验伤报告、伤情照片；\n5. 威胁的短信、语音、聊天记录；\n6. 证人证言；\n7. 其他证据。\n"}, {"id": "M-民事起诉状（变更抚养费或抚养关系）", "title": "附录 M　民事起诉状（变更抚养费或抚养关系）", "html": "<h2>附录 M　民事起诉状（变更抚养费或抚养关系）<\/h2>\n<blockquote>范本仅供参考。适用于离婚后，抚养费数额、子女抚养关系需要调整的情形。调低抚养费需要证明负担方收入显著降低或有其他重大变化，对照 <a href=\"#/e/107\">第 107 条<\/a>。<\/blockquote>\n<hr>\n<p><strong>民事起诉状<\/strong><\/p>\n<p><strong>原告<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>被告<\/strong>：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。<\/p>\n<p><strong>案由<\/strong>：变更抚养关系纠纷／抚养费纠纷<\/p>\n<p><strong>诉讼请求<\/strong>（请选择适用的）：<\/p>\n<p>□ 变更抚养费：<\/p>\n<ol><li>请求判令原告每月支付子女＿＿＿＿＿＿的抚养费，由原判决／协议确定的＿＿＿元，变更为＿＿＿元，自＿＿年＿＿月起；\n<\/li><li>本案诉讼费用由被告承担。\n<\/li><\/ol>\n<p>□ 变更抚养关系：<\/p>\n<ol><li>请求变更子女＿＿＿＿＿＿的直接抚养人，由被告变更为原告；\n<\/li><li>变更后，被告每月支付抚养费＿＿＿元（或：不需要支付）；\n<\/li><li>本案诉讼费用由被告承担。\n<\/li><\/ol>\n<p><strong>事实与理由<\/strong>：<\/p>\n<p>原、被告于＿＿年＿＿月登记结婚，＿＿年＿＿月离婚。婚生子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）由＿＿＿＿＿＿直接抚养，＿＿＿＿＿＿每月支付抚养费＿＿＿元。（依据：＿＿＿＿＿＿离婚协议／判决书／调解书，案号＿＿＿＿＿＿）<\/p>\n<p><strong>情形一：因负担方收入显著降低，请求调低抚养费<\/strong><br>＿＿年＿＿月起，原告因＿＿＿＿＿＿（失业／患重病／公司倒闭／收入下降），月收入由＿＿＿元降至＿＿＿元，有＿＿＿＿＿＿证据证明。原告仍然按时支付抚养费，但现收入已不足以负担原定数额，且需自行承担＿＿＿＿＿＿（医疗／生活）的支出。依据子女的实际需要和原告的负担能力，请求将抚养费调整为＿＿＿元。<\/p>\n<p><strong>情形二：因情势变化，请求变更抚养关系<\/strong><br>被告＿＿＿＿＿＿（患严重疾病，无力继续抚养／不尽抚养义务／存在虐待行为／其他情形），子女现已年满八周岁，明确表示愿意随原告生活，原告有稳定收入、固定住所，有能力抚养子女。变更抚养关系有利于子女的健康成长。<\/p>\n<p>依据《中华人民共和国民法典》第一千零八十五条，《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第五十六条的规定，特向贵院提起诉讼，请依法判决。<\/p>\n<p><strong>此致<\/strong><\/p>\n<p>＿＿＿＿＿＿人民法院<\/p>\n<p><strong>具状人（签名）<\/strong>：＿＿＿＿＿＿<br>＿＿年＿＿月＿＿日<\/p>\n<p><strong>附<\/strong>：<\/p>\n<ol><li>原离婚协议书／判决书／调解书；\n<\/li><li>收入变化的证明：劳动合同、解除劳动关系证明、银行流水、社保缴纳记录、病历、诊断证明；\n<\/li><li>抚养费支付记录；\n<\/li><li>子女的生活、教育、医疗支出凭证；\n<\/li><li>其他证据。\n<\/li><\/ol>", "text": "# 附录 M　民事起诉状（变更抚养费或抚养关系）\n\n> 范本仅供参考。适用于离婚后，抚养费数额、子女抚养关系需要调整的情形。调低抚养费需要证明负担方收入显著降低或有其他重大变化，对照 第 107 条。\n\n---\n\n**民事起诉状**\n\n**原告**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**被告**：＿＿＿＿＿＿，男／女，＿＿年＿＿月＿＿日出生，身份证号：＿＿＿＿＿＿＿＿，住址：＿＿＿＿＿＿，电话：＿＿＿＿＿＿。\n\n**案由**：变更抚养关系纠纷／抚养费纠纷\n\n**诉讼请求**（请选择适用的）：\n\n□ 变更抚养费：\n1. 请求判令原告每月支付子女＿＿＿＿＿＿的抚养费，由原判决／协议确定的＿＿＿元，变更为＿＿＿元，自＿＿年＿＿月起；\n2. 本案诉讼费用由被告承担。\n\n□ 变更抚养关系：\n1. 请求变更子女＿＿＿＿＿＿的直接抚养人，由被告变更为原告；\n2. 变更后，被告每月支付抚养费＿＿＿元（或：不需要支付）；\n3. 本案诉讼费用由被告承担。\n\n**事实与理由**：\n\n原、被告于＿＿年＿＿月登记结婚，＿＿年＿＿月离婚。婚生子／女＿＿＿＿＿＿（＿＿年＿＿月＿＿日出生）由＿＿＿＿＿＿直接抚养，＿＿＿＿＿＿每月支付抚养费＿＿＿元。（依据：＿＿＿＿＿＿离婚协议／判决书／调解书，案号＿＿＿＿＿＿）\n\n**情形一：因负担方收入显著降低，请求调低抚养费**\n＿＿年＿＿月起，原告因＿＿＿＿＿＿（失业／患重病／公司倒闭／收入下降），月收入由＿＿＿元降至＿＿＿元，有＿＿＿＿＿＿证据证明。原告仍然按时支付抚养费，但现收入已不足以负担原定数额，且需自行承担＿＿＿＿＿＿（医疗／生活）的支出。依据子女的实际需要和原告的负担能力，请求将抚养费调整为＿＿＿元。\n\n**情形二：因情势变化，请求变更抚养关系**\n被告＿＿＿＿＿＿（患严重疾病，无力继续抚养／不尽抚养义务／存在虐待行为／其他情形），子女现已年满八周岁，明确表示愿意随原告生活，原告有稳定收入、固定住所，有能力抚养子女。变更抚养关系有利于子女的健康成长。\n\n依据《中华人民共和国民法典》第一千零八十五条，《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第五十六条的规定，特向贵院提起诉讼，请依法判决。\n\n**此致**\n\n＿＿＿＿＿＿人民法院\n\n**具状人（签名）**：＿＿＿＿＿＿\n＿＿年＿＿月＿＿日\n\n**附**：\n1. 原离婚协议书／判决书／调解书；\n2. 收入变化的证明：劳动合同、解除劳动关系证明、银行流水、社保缴纳记录、病历、诊断证明；\n3. 抚养费支付记录；\n4. 子女的生活、教育、医疗支出凭证；\n5. 其他证据。\n"}, {"id": "N-证据清单与财产线索清单", "title": "附录 N　证据清单与财产线索清单", "html": "<h2>附录 N　证据清单与财产线索清单<\/h2>\n<blockquote>用法：每个案件一份。证据按时间排序，每份标注\"证明什么\"。财产线索清单用于离婚前后盘点家底。所有证据要保证合法来源，见 <a href=\"#/e/014\">第 014 条<\/a>、<a href=\"#/e/105\">第 105 条<\/a>。<\/blockquote>\n<hr>\n<h3>一、证据清单（模板）<\/h3>\n<p>案由：＿＿＿＿＿＿　提交人：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日<\/p>\n<div class='tw'><table><thead><tr><th>序号<\/th><th>证据名称<\/th><th>形式<\/th><th>来源<\/th><th>页数<\/th><th>证明目的<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>结婚证<\/td><td>原件<\/td><td><\/td><td><\/td><td>证明双方婚姻关系<\/td><\/tr><tr><td>2<\/td><td>银行转账记录（＿＿年＿＿月＿＿日）<\/td><td>银行打印、盖章<\/td><td>本人银行<\/td><td><\/td><td>证明给付＿＿＿元<\/td><\/tr><tr><td>3<\/td><td>微信聊天记录（＿＿年＿＿月＿＿日至＿＿年＿＿月＿＿日）<\/td><td>导出文件+截图，保留原始手机<\/td><td>本人手机<\/td><td><\/td><td>证明款项性质<\/td><\/tr><tr><td>4<\/td><td>录音（＿＿年＿＿月＿＿日）<\/td><td>录音文件+文字整理<\/td><td>本人参与对话<\/td><td><\/td><td>证明＿＿＿＿＿＿<\/td><\/tr><tr><td>5<\/td><td>病历、验伤报告<\/td><td>原件<\/td><td>＿＿医院<\/td><td><\/td><td>证明受伤情况<\/td><\/tr><tr><td>6<\/td><td>报警回执<\/td><td>原件<\/td><td>＿＿派出所<\/td><td><\/td><td>证明报警时间<\/td><\/tr><tr><td>7<\/td><td>证人证言<\/td><td>书面<\/td><td>＿＿＿＿＿＿<\/td><td><\/td><td>证明＿＿＿＿＿＿<\/td><\/tr><tr><td>8<\/td><td>子女就医、接送、学校沟通的记录<\/td><td>照片、截图<\/td><td><\/td><td><\/td><td>证明日常照料情况<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h3>二、证据保存检查表<\/h3>\n<ul><li>☐ 原始手机、原始账号保留，没有卸载应用、清空记录\n<\/li><li>☐ 聊天记录已导出备份，存在至少两个位置\n<\/li><li>☐ 重要证据已做公证（如有必要）\n<\/li><li>☐ 银行流水已到柜台打印并盖章\n<\/li><li>☐ 每份证据标注了时间、来源、证明目的\n<\/li><li>☐ 没有包含非法获取的内容\n<\/li><\/ul>\n<hr>\n<h3>三、财产线索清单（离婚前后盘点用）<\/h3>\n<p>填写人：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日<\/p>\n<h4>1. 不动产<\/h4>\n<div class='tw'><table><thead><tr><th>地址<\/th><th>产权证号<\/th><th>登记人<\/th><th>购买时间<\/th><th>购买价<\/th><th>当前估值<\/th><th>贷款余额<\/th><th>备注<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>2. 车辆<\/h4>\n<div class='tw'><table><thead><tr><th>车牌 / 型号<\/th><th>登记人<\/th><th>购买时间<\/th><th>购买价<\/th><th>当前估值<\/th><th>贷款余额<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>3. 银行账户<\/h4>\n<div class='tw'><table><thead><tr><th>开户行<\/th><th>账号（后四位）<\/th><th>户名<\/th><th>余额<\/th><th>备注（婚前／婚后／来源）<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>4. 理财、基金、股票、数字资产<\/h4>\n<div class='tw'><table><thead><tr><th>平台<\/th><th>账户<\/th><th>持仓<\/th><th>价值<\/th><th>购入时间<\/th><th>资金来源<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>5. 保险<\/h4>\n<div class='tw'><table><thead><tr><th>保险公司<\/th><th>险种<\/th><th>投保人<\/th><th>被保险人<\/th><th>受益人<\/th><th>现金价值<\/th><th>缴费情况<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>6. 公积金、社保、养老账户<\/h4>\n<div class='tw'><table><thead><tr><th>类型<\/th><th>户主<\/th><th>余额／缴存情况<\/th><th>备注<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>7. 股权、合伙、公司<\/h4>\n<div class='tw'><table><thead><tr><th>公司名称<\/th><th>持股人<\/th><th>持股比例<\/th><th>取得时间<\/th><th>出资来源<\/th><th>估值<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>8. 债权<\/h4>\n<div class='tw'><table><thead><tr><th>债务人<\/th><th>金额<\/th><th>期限<\/th><th>凭证<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>9. 债务<\/h4>\n<div class='tw'><table><thead><tr><th>债权人<\/th><th>金额<\/th><th>期限<\/th><th>用途<\/th><th>借款人<\/th><th>担保人<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n<h4>10. 其他<\/h4>\n<div class='tw'><table><thead><tr><th>类别<\/th><th>说明<\/th><th>估值<\/th><\/tr><\/thead><tbody><tr><td>收藏品、贵金属<\/td><td><\/td><td><\/td><\/tr><tr><td>大额现金<\/td><td><\/td><td><\/td><\/tr><tr><td>知识产权、版权<\/td><td><\/td><td><\/td><\/tr><tr><td>其他<\/td><td><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h3>四、盘点提示<\/h3>\n<ul><li>自己名下的信息，自己可以查；对方名下的，通过协商要求对方提供，或在诉讼中申请法院调查、律师调查令。\n<\/li><li>不要通过非法手段获取对方的个人信息。\n<\/li><li>盘点的目的，是确保协议里不遗漏，不是为了\"抓对方的小辫子\"。\n<\/li><\/ul>", "text": "# 附录 N　证据清单与财产线索清单\n\n> 用法：每个案件一份。证据按时间排序，每份标注\"证明什么\"。财产线索清单用于离婚前后盘点家底。所有证据要保证合法来源，见 第 014 条、第 105 条。\n\n---\n\n## 一、证据清单（模板）\n\n案由：＿＿＿＿＿＿　提交人：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日\n\n| 序号 | 证据名称 | 形式 | 来源 | 页数 | 证明目的 |\n|---|---|---|---|---|---|\n| 1 | 结婚证 | 原件 | | | 证明双方婚姻关系 |\n| 2 | 银行转账记录（＿＿年＿＿月＿＿日） | 银行打印、盖章 | 本人银行 | | 证明给付＿＿＿元 |\n| 3 | 微信聊天记录（＿＿年＿＿月＿＿日至＿＿年＿＿月＿＿日） | 导出文件+截图，保留原始手机 | 本人手机 | | 证明款项性质 |\n| 4 | 录音（＿＿年＿＿月＿＿日） | 录音文件+文字整理 | 本人参与对话 | | 证明＿＿＿＿＿＿ |\n| 5 | 病历、验伤报告 | 原件 | ＿＿医院 | | 证明受伤情况 |\n| 6 | 报警回执 | 原件 | ＿＿派出所 | | 证明报警时间 |\n| 7 | 证人证言 | 书面 | ＿＿＿＿＿＿ | | 证明＿＿＿＿＿＿ |\n| 8 | 子女就医、接送、学校沟通的记录 | 照片、截图 | | | 证明日常照料情况 |\n\n---\n\n## 二、证据保存检查表\n\n- [ ] 原始手机、原始账号保留，没有卸载应用、清空记录\n- [ ] 聊天记录已导出备份，存在至少两个位置\n- [ ] 重要证据已做公证（如有必要）\n- [ ] 银行流水已到柜台打印并盖章\n- [ ] 每份证据标注了时间、来源、证明目的\n- [ ] 没有包含非法获取的内容\n\n---\n\n## 三、财产线索清单（离婚前后盘点用）\n\n填写人：＿＿＿＿＿＿　日期：＿＿年＿＿月＿＿日\n\n### 1. 不动产\n\n| 地址 | 产权证号 | 登记人 | 购买时间 | 购买价 | 当前估值 | 贷款余额 | 备注 |\n|---|---|---|---|---|---|---|---|\n\n### 2. 车辆\n\n| 车牌 / 型号 | 登记人 | 购买时间 | 购买价 | 当前估值 | 贷款余额 |\n|---|---|---|---|---|---|\n\n### 3. 银行账户\n\n| 开户行 | 账号（后四位） | 户名 | 余额 | 备注（婚前／婚后／来源） |\n|---|---|---|---|---|\n\n### 4. 理财、基金、股票、数字资产\n\n| 平台 | 账户 | 持仓 | 价值 | 购入时间 | 资金来源 |\n|---|---|---|---|---|---|\n\n### 5. 保险\n\n| 保险公司 | 险种 | 投保人 | 被保险人 | 受益人 | 现金价值 | 缴费情况 |\n|---|---|---|---|---|---|---|\n\n### 6. 公积金、社保、养老账户\n\n| 类型 | 户主 | 余额／缴存情况 | 备注 |\n|---|---|---|---|\n\n### 7. 股权、合伙、公司\n\n| 公司名称 | 持股人 | 持股比例 | 取得时间 | 出资来源 | 估值 |\n|---|---|---|---|---|---|\n\n### 8. 债权\n\n| 债务人 | 金额 | 期限 | 凭证 |\n|---|---|---|---|\n\n### 9. 债务\n\n| 债权人 | 金额 | 期限 | 用途 | 借款人 | 担保人 |\n|---|---|---|---|---|---|\n\n### 10. 其他\n\n| 类别 | 说明 | 估值 |\n|---|---|---|\n| 收藏品、贵金属 | | |\n| 大额现金 | | |\n| 知识产权、版权 | | |\n| 其他 | | |\n\n---\n\n## 四、盘点提示\n\n- 自己名下的信息，自己可以查；对方名下的，通过协商要求对方提供，或在诉讼中申请法院调查、律师调查令。\n- 不要通过非法手段获取对方的个人信息。\n- 盘点的目的，是确保协议里不遗漏，不是为了\"抓对方的小辫子\"。\n"}, {"id": "O-最高法典型案例十三则", "title": "附录 O　最高法典型案例十三则", "html": "<h2>附录 O　最高法典型案例十三则<\/h2>\n<p>这 13 个案例，来自最高人民法院公开发布的三批材料：<\/p>\n<ul><li>2023 年 12 月，涉彩礼纠纷典型案例（案例 O-6 至 O-9）；\n<\/li><li>2025 年 1 月，随婚姻家庭编司法解释（二）发布的婚姻家庭纠纷典型案例（案例 O-10 至 O-13）；\n<\/li><li>2026 年 1 月，第三批涉彩礼纠纷典型案例（案例 O-1 至 O-5）。\n<\/li><\/ul>\n<p>以下均为我对官方材料的转述，不是原文。案例的案情、金额、比例，请以最高人民法院官网（court.gov.cn）发布的原文为准。典型案例用来理解法院的思路，不能直接套用到你的案件。2023 年 12 月的案例是在 2024 年 2 月《彩礼规定》施行之前发布的，只能作为参考。<\/p>\n<hr>\n<h3>一、2026 年 1 月　第三批涉彩礼纠纷典型案例<\/h3>\n<h4>O-1　赵某诉李某等婚约财产纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：2020 年，男方按当地习俗给了 6.6 万元礼金。2021 年 2 月，在办了婚礼、开始同居之后，男方在女方承诺登记结婚的前提下，给了 15 万元用于买车。同年 3 月，双方吵架，女方回了娘家，此后没有登记结婚。\n<\/li><li><strong>处理<\/strong>：法院判决女方返还 17 万多元，约占总额 21.6 万元的八成，扣除了共同生活的开销，并考虑了女方曾经终止妊娠的情况。\n<\/li><li><strong>要点<\/strong>：为了缔结婚姻而给付的购车款、购房款等大额款项，可以按彩礼规则处理。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/010\">第 010 条<\/a>、<a href=\"#/e/041\">第 041 条<\/a>\n<\/li><\/ul>\n<h4>O-2　刘某诉张某婚约财产纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：两人 2022 年网上认识，2023 年 3 月女方搬进男方家，5 月办了婚礼，10 月分开。男方期间多次转账，共 31500 元，其中有 5 笔 520 元，都没写用途；女方也给男方转过 4500 元，还买了被褥、衣服，并交了话费。\n<\/li><li><strong>处理<\/strong>：法院不支持男方要求返还，一分都没有判回。\n<\/li><li><strong>要点<\/strong>：日常消费性支出、表达感情的小额转账，不是彩礼；双方有来有往，是共同生活的开销。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/003\">第 003 条<\/a>、<a href=\"#/e/036\">第 036 条<\/a>\n<\/li><\/ul>\n<h4>O-3　王某诉孙某婚约财产纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：2020 年 1 月经人介绍，男方给了 20 万元彩礼。同年 10 月办了婚礼，开始同居，2021 年 8 月生了一个女儿。双方没有登记，2024 年 10 月分开，女方带着女儿生活。\n<\/li><li><strong>处理<\/strong>：法院不支持返还。理由是双方共同生活近四年，有孩子，彩礼已经部分用于共同生活，女方也承担了照顾孩子的责任。\n<\/li><li><strong>要点<\/strong>：长期同居、共同育儿后，即使没有登记，也不能要求返还彩礼。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/039\">第 039 条<\/a>\n<\/li><\/ul>\n<h4>O-4　郑某诉吴某离婚纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：2024 年 3 月 1 日经媒人介绍认识，3 月 3 日见面，3 月 4 日登记结婚，当天男方给了女方 20 万元。3 月 14 日，女方以出游为由离开，不再回来，4 月 15 日提出离婚。\n<\/li><li><strong>处理<\/strong>：法院判决离婚，并判令女方全额返还 20 万元。理由：共同生活时间极短，没有孩子，彩礼没有被使用，女方拒绝共同生活。\n<\/li><li><strong>要点<\/strong>：登记不等于彩礼的目的已经实现。没有稳定的共同生活和真实的婚姻感情，彩礼可以全额返还。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/017\">第 017 条<\/a>、<a href=\"#/e/039\">第 039 条<\/a>\n<\/li><\/ul>\n<h4>O-5　卢某等诈骗案<\/h4>\n<ul><li><strong>案情<\/strong>：民事案件中发现，一名女子 2021 年至 2024 年间，单独或与母亲一起，以说媒、订婚、送礼、借款等名义，向 15 人骗取钱款：其中 8 人共 63 万多元，另外 7 人共 45 万多元。\n<\/li><li><strong>处理<\/strong>：法院以诈骗罪判处有期徒刑并处罚金，责令退赔被害人的损失，此前的民事判决已经履行的部分，在退赔时折抵。\n<\/li><li><strong>要点<\/strong>：以彩礼名义骗取钱财，可能构成犯罪；之前的民事判决，不阻碍刑事责任的追究。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/017\">第 017 条<\/a>\n<\/li><\/ul>\n<hr>\n<h3>二、2025 年 1 月　婚姻家庭纠纷典型案例<\/h3>\n<h4>O-10　崔某某与陈某某离婚纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：男方婚前买的房，2009 年 2 月（登记结婚约一个月后）把妻子的名字加上了房产证。离婚时，双方估价约 600 万元，妻子主张 250 万元，男方愿意给 100 万元。\n<\/li><li><strong>处理<\/strong>：法院准予离婚，房子判给男方，由男方补偿妻子 120 万元。\n<\/li><li><strong>要点<\/strong>：给配偶加名，可能使房产变成共有、可以在离婚时分割；法院可以把房子判给原所有人，再综合婚姻时间长短、对家庭的贡献、资金来源等因素，判决补偿。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/062\">第 062 条<\/a>\n<\/li><\/ul>\n<h4>O-11　范某某与许某某离婚纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：男方父母 2019 年 12 月全款买了一套房，2020 年 5 月男女双方结婚，2021 年 8 月房子登记到两人名下。离婚时，房子价值 30 万元，没有孩子，女方主张平分。\n<\/li><li><strong>处理<\/strong>：法院判房子归男方，由男方补偿女方 7 万元。理由是父母购房出资的目的是支持小夫妻共同生活，结婚时间短、没有孩子。\n<\/li><li><strong>要点<\/strong>：即使父母出资的房子登记在双方名下，法院也可以根据赠与目的、出资来源、婚姻时间等，把房子判给出资人的子女，并确定合理的补偿。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/061\">第 061 条<\/a>、<a href=\"#/e/062\">第 062 条<\/a>\n<\/li><\/ul>\n<h4>O-12　颜某某申请人格权侵害禁令案<\/h4>\n<ul><li><strong>案情<\/strong>：夫妻 2015 年结婚，2022 年 7 月生下一对双胞胎。2024 年 3 月，丈夫和他的父母、妹妹强行把儿子带到另一个省，多次要求返还被拒绝。\n<\/li><li><strong>处理<\/strong>：法院裁定丈夫在七日内把孩子送回原住所，并禁止再抢夺、藏匿、带离孩子。裁定后，法院还进行了家庭教育指导，丈夫买票把孩子送了回来。\n<\/li><li><strong>要点<\/strong>：父母对未成年子女的监护权受法律保护；对抢夺、藏匿子女的行为，可以申请禁令，快速制止，恢复孩子原来的生活状态。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/109\">第 109 条<\/a>\n<\/li><\/ul>\n<h4>O-13　崔某某与叶某某及高某某赠与合同纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：丈夫高某在婚内与叶某交往，2019 年 3 月至 2023 年 9 月，把夫妻共同财产 73 万元转给叶某，叶某退回了 17 万元。妻子起诉要回全部。叶某主张部分已经花掉。\n<\/li><li><strong>处理<\/strong>：法院认定这些赠与因违背公序良俗而无效，叶某应返还实际收到的款项；\"已经花掉了\"，不是拒绝返还的理由。\n<\/li><li><strong>要点<\/strong>：一方在婚外情中，擅自把夫妻共同财产送给第三者，另一方可以主张赠与无效，要求返还。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/063\">第 063 条<\/a>\n<\/li><\/ul>\n<hr>\n<h3>三、2023 年 12 月　涉彩礼纠纷典型案例（发布于 2024 年 2 月《彩礼规定》施行之前）<\/h3>\n<h4>O-6　王某某与李某某离婚纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：2020 年 9 月登记结婚，男方给了 18.8 万元彩礼，男方家庭经济状况一般。2021 年 4 月，女方终止妊娠；2022 年 2 月，男方起诉离婚并要求返还彩礼。\n<\/li><li><strong>处理<\/strong>：法院判决离婚；认为 18.8 万元与当地生活水平和男方家庭条件相比偏高，判女方返还 5.64 万元，占 30%，考虑了共同生活时间短和女方终止妊娠的情况。\n<\/li><li><strong>要点<\/strong>：共同生活时间，是决定彩礼是否返还、返还多少的重要因素；超出给付方承受能力的彩礼，即使登记了，也可能部分返还。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/038\">第 038 条<\/a>、<a href=\"#/e/039\">第 039 条<\/a>\n<\/li><\/ul>\n<h4>O-7　张某与赵某婚约财产纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：2019 年 2 月开始同居，2020 年 6 月生了儿子，2021 年 1 月办了婚礼，一直没有登记。女方收了 16 万元彩礼。2022 年 8 月分开，男方要求返还 80%，即 12.8 万元。\n<\/li><li><strong>处理<\/strong>：法院驳回，不予返还。理由：双方已经像一家人一样生活三年多，并共同养育孩子，让女方返还不公平。\n<\/li><li><strong>要点<\/strong>：没有登记，但长期同居、办了婚礼、有孩子的，一般不返还彩礼。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/029\">第 029 条<\/a>、<a href=\"#/e/039\">第 039 条<\/a>\n<\/li><\/ul>\n<h4>O-8　刘某与朱某婚约财产纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：2020 年 7 月开始交往，9 月登记结婚，当月男方转给女方 80 万元（备注彩礼）和 26 万元（备注\"五金\"）。两人在不同城市，没有孩子，三个月后协议离婚。男方起诉要求返还 106 万元。\n<\/li><li><strong>处理<\/strong>：法院认定 26 万元的\"五金\"也属于彩礼，因为没有稳定的共同生活，扣除了婚礼筹备、旅游、人情往来等共同开销，判女方返还 80 万元。\n<\/li><li><strong>要点<\/strong>：登记之后，如果婚姻极短、没有稳定的共同生活，法院也会考虑返还；共同开销会被扣除。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/039\">第 039 条<\/a>\n<\/li><\/ul>\n<h4>O-9　张某某与赵某某、赵某、王某婚约财产纠纷案<\/h4>\n<ul><li><strong>案情<\/strong>：2022 年 4 月订婚，男方给女方父母 3.66 万元礼金，9 月又转给女方 13.66 万元彩礼。女方家准备了价值约 1120 元的嫁妆，放在男方家。双方没有登记，没有办婚礼，2022 年 9 月分开。男方起诉要求女方及其父母返还 17.32 万元。\n<\/li><li><strong>处理<\/strong>：法院判决女方返还 13.66 万元中的 12.182 万元（扣除了嫁妆等），女方及其父母共同返还 3.66 万元礼金中的 3.294 万元。\n<\/li><li><strong>要点<\/strong>：收了彩礼或礼金的父母，可以作为共同被告；嫁妆会在返还时扣除。\n<\/li><li><strong>对应条目<\/strong>：<a href=\"#/e/044\">第 044 条<\/a>、<a href=\"#/e/042\">第 042 条<\/a>\n<\/li><\/ul>", "text": "# 附录 O　最高法典型案例十三则\n\n这 13 个案例，来自最高人民法院公开发布的三批材料：\n\n- 2023 年 12 月，涉彩礼纠纷典型案例（案例 O-6 至 O-9）；\n- 2025 年 1 月，随婚姻家庭编司法解释（二）发布的婚姻家庭纠纷典型案例（案例 O-10 至 O-13）；\n- 2026 年 1 月，第三批涉彩礼纠纷典型案例（案例 O-1 至 O-5）。\n\n以下均为我对官方材料的转述，不是原文。案例的案情、金额、比例，请以最高人民法院官网（court.gov.cn）发布的原文为准。典型案例用来理解法院的思路，不能直接套用到你的案件。2023 年 12 月的案例是在 2024 年 2 月《彩礼规定》施行之前发布的，只能作为参考。\n\n---\n\n## 一、2026 年 1 月　第三批涉彩礼纠纷典型案例\n\n### O-1　赵某诉李某等婚约财产纠纷案\n\n- **案情**：2020 年，男方按当地习俗给了 6.6 万元礼金。2021 年 2 月，在办了婚礼、开始同居之后，男方在女方承诺登记结婚的前提下，给了 15 万元用于买车。同年 3 月，双方吵架，女方回了娘家，此后没有登记结婚。\n- **处理**：法院判决女方返还 17 万多元，约占总额 21.6 万元的八成，扣除了共同生活的开销，并考虑了女方曾经终止妊娠的情况。\n- **要点**：为了缔结婚姻而给付的购车款、购房款等大额款项，可以按彩礼规则处理。\n- **对应条目**：第 010 条、第 041 条\n\n### O-2　刘某诉张某婚约财产纠纷案\n\n- **案情**：两人 2022 年网上认识，2023 年 3 月女方搬进男方家，5 月办了婚礼，10 月分开。男方期间多次转账，共 31500 元，其中有 5 笔 520 元，都没写用途；女方也给男方转过 4500 元，还买了被褥、衣服，并交了话费。\n- **处理**：法院不支持男方要求返还，一分都没有判回。\n- **要点**：日常消费性支出、表达感情的小额转账，不是彩礼；双方有来有往，是共同生活的开销。\n- **对应条目**：第 003 条、第 036 条\n\n### O-3　王某诉孙某婚约财产纠纷案\n\n- **案情**：2020 年 1 月经人介绍，男方给了 20 万元彩礼。同年 10 月办了婚礼，开始同居，2021 年 8 月生了一个女儿。双方没有登记，2024 年 10 月分开，女方带着女儿生活。\n- **处理**：法院不支持返还。理由是双方共同生活近四年，有孩子，彩礼已经部分用于共同生活，女方也承担了照顾孩子的责任。\n- **要点**：长期同居、共同育儿后，即使没有登记，也不能要求返还彩礼。\n- **对应条目**：第 039 条\n\n### O-4　郑某诉吴某离婚纠纷案\n\n- **案情**：2024 年 3 月 1 日经媒人介绍认识，3 月 3 日见面，3 月 4 日登记结婚，当天男方给了女方 20 万元。3 月 14 日，女方以出游为由离开，不再回来，4 月 15 日提出离婚。\n- **处理**：法院判决离婚，并判令女方全额返还 20 万元。理由：共同生活时间极短，没有孩子，彩礼没有被使用，女方拒绝共同生活。\n- **要点**：登记不等于彩礼的目的已经实现。没有稳定的共同生活和真实的婚姻感情，彩礼可以全额返还。\n- **对应条目**：第 017 条、第 039 条\n\n### O-5　卢某等诈骗案\n\n- **案情**：民事案件中发现，一名女子 2021 年至 2024 年间，单独或与母亲一起，以说媒、订婚、送礼、借款等名义，向 15 人骗取钱款：其中 8 人共 63 万多元，另外 7 人共 45 万多元。\n- **处理**：法院以诈骗罪判处有期徒刑并处罚金，责令退赔被害人的损失，此前的民事判决已经履行的部分，在退赔时折抵。\n- **要点**：以彩礼名义骗取钱财，可能构成犯罪；之前的民事判决，不阻碍刑事责任的追究。\n- **对应条目**：第 017 条\n\n---\n\n## 二、2025 年 1 月　婚姻家庭纠纷典型案例\n\n### O-10　崔某某与陈某某离婚纠纷案\n\n- **案情**：男方婚前买的房，2009 年 2 月（登记结婚约一个月后）把妻子的名字加上了房产证。离婚时，双方估价约 600 万元，妻子主张 250 万元，男方愿意给 100 万元。\n- **处理**：法院准予离婚，房子判给男方，由男方补偿妻子 120 万元。\n- **要点**：给配偶加名，可能使房产变成共有、可以在离婚时分割；法院可以把房子判给原所有人，再综合婚姻时间长短、对家庭的贡献、资金来源等因素，判决补偿。\n- **对应条目**：第 062 条\n\n### O-11　范某某与许某某离婚纠纷案\n\n- **案情**：男方父母 2019 年 12 月全款买了一套房，2020 年 5 月男女双方结婚，2021 年 8 月房子登记到两人名下。离婚时，房子价值 30 万元，没有孩子，女方主张平分。\n- **处理**：法院判房子归男方，由男方补偿女方 7 万元。理由是父母购房出资的目的是支持小夫妻共同生活，结婚时间短、没有孩子。\n- **要点**：即使父母出资的房子登记在双方名下，法院也可以根据赠与目的、出资来源、婚姻时间等，把房子判给出资人的子女，并确定合理的补偿。\n- **对应条目**：第 061 条、第 062 条\n\n### O-12　颜某某申请人格权侵害禁令案\n\n- **案情**：夫妻 2015 年结婚，2022 年 7 月生下一对双胞胎。2024 年 3 月，丈夫和他的父母、妹妹强行把儿子带到另一个省，多次要求返还被拒绝。\n- **处理**：法院裁定丈夫在七日内把孩子送回原住所，并禁止再抢夺、藏匿、带离孩子。裁定后，法院还进行了家庭教育指导，丈夫买票把孩子送了回来。\n- **要点**：父母对未成年子女的监护权受法律保护；对抢夺、藏匿子女的行为，可以申请禁令，快速制止，恢复孩子原来的生活状态。\n- **对应条目**：第 109 条\n\n### O-13　崔某某与叶某某及高某某赠与合同纠纷案\n\n- **案情**：丈夫高某在婚内与叶某交往，2019 年 3 月至 2023 年 9 月，把夫妻共同财产 73 万元转给叶某，叶某退回了 17 万元。妻子起诉要回全部。叶某主张部分已经花掉。\n- **处理**：法院认定这些赠与因违背公序良俗而无效，叶某应返还实际收到的款项；\"已经花掉了\"，不是拒绝返还的理由。\n- **要点**：一方在婚外情中，擅自把夫妻共同财产送给第三者，另一方可以主张赠与无效，要求返还。\n- **对应条目**：第 063 条\n\n---\n\n## 三、2023 年 12 月　涉彩礼纠纷典型案例（发布于 2024 年 2 月《彩礼规定》施行之前）\n\n### O-6　王某某与李某某离婚纠纷案\n\n- **案情**：2020 年 9 月登记结婚，男方给了 18.8 万元彩礼，男方家庭经济状况一般。2021 年 4 月，女方终止妊娠；2022 年 2 月，男方起诉离婚并要求返还彩礼。\n- **处理**：法院判决离婚；认为 18.8 万元与当地生活水平和男方家庭条件相比偏高，判女方返还 5.64 万元，占 30%，考虑了共同生活时间短和女方终止妊娠的情况。\n- **要点**：共同生活时间，是决定彩礼是否返还、返还多少的重要因素；超出给付方承受能力的彩礼，即使登记了，也可能部分返还。\n- **对应条目**：第 038 条、第 039 条\n\n### O-7　张某与赵某婚约财产纠纷案\n\n- **案情**：2019 年 2 月开始同居，2020 年 6 月生了儿子，2021 年 1 月办了婚礼，一直没有登记。女方收了 16 万元彩礼。2022 年 8 月分开，男方要求返还 80%，即 12.8 万元。\n- **处理**：法院驳回，不予返还。理由：双方已经像一家人一样生活三年多，并共同养育孩子，让女方返还不公平。\n- **要点**：没有登记，但长期同居、办了婚礼、有孩子的，一般不返还彩礼。\n- **对应条目**：第 029 条、第 039 条\n\n### O-8　刘某与朱某婚约财产纠纷案\n\n- **案情**：2020 年 7 月开始交往，9 月登记结婚，当月男方转给女方 80 万元（备注彩礼）和 26 万元（备注\"五金\"）。两人在不同城市，没有孩子，三个月后协议离婚。男方起诉要求返还 106 万元。\n- **处理**：法院认定 26 万元的\"五金\"也属于彩礼，因为没有稳定的共同生活，扣除了婚礼筹备、旅游、人情往来等共同开销，判女方返还 80 万元。\n- **要点**：登记之后，如果婚姻极短、没有稳定的共同生活，法院也会考虑返还；共同开销会被扣除。\n- **对应条目**：第 039 条\n\n### O-9　张某某与赵某某、赵某、王某婚约财产纠纷案\n\n- **案情**：2022 年 4 月订婚，男方给女方父母 3.66 万元礼金，9 月又转给女方 13.66 万元彩礼。女方家准备了价值约 1120 元的嫁妆，放在男方家。双方没有登记，没有办婚礼，2022 年 9 月分开。男方起诉要求女方及其父母返还 17.32 万元。\n- **处理**：法院判决女方返还 13.66 万元中的 12.182 万元（扣除了嫁妆等），女方及其父母共同返还 3.66 万元礼金中的 3.294 万元。\n- **要点**：收了彩礼或礼金的父母，可以作为共同被告；嫁妆会在返还时扣除。\n- **对应条目**：第 044 条、第 042 条\n"}]};
const $ = s => document.querySelector(s);
const app = $('#app'), side = $('#side');
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 数据 ---------- */
const entries = [];
D.chapters.forEach((c, ci) => c.entries.forEach(e => entries.push(Object.assign({ci}, e))));
const byNum = {}; entries.forEach(e => byNum[e.num] = e);
const page = id => D.pages.find(p => p.id === id);
const appx = id => D.apps.find(a => a.id === id);
let grades = store.get('grades', {A:true,B:true,C:true});

/* ---------- 主题 ---------- */
(function(){
  const t = store.get('theme', null);
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx; store.set('theme', nx);
  };
})();

/* ---------- 侧栏 ---------- */
function buildSide(active){
  let h = '<h4>快速入口</h4>';
  h += `<a class="urgent ${active==='p/救急卡'?'on':''}" href="#/p/救急卡">救急卡（八种紧急情况）</a>`;
  h += `<a class="${active==='p/场景速查'?'on':''}" href="#/p/场景速查">场景速查</a>`;
  h += `<a class="${active==='p/话术手册'?'on':''}" href="#/p/话术手册">话术手册</a>`;
  h += `<a class="${active==='p/口诀卡'?'on':''}" href="#/p/口诀卡">口诀卡</a>`;
  h += `<a class="${active==='calc'?'on':''}" href="#/calc">计算器</a>`;
  h += `<a class="${active==='p/序言'?'on':''}" href="#/p/序言">序言与读法</a>`;
  h += '<h4>正文</h4>';
  D.chapters.forEach((c, i) => {
    const short = c.title.replace(/^第.+?章　/, '');
    h += `<a class="${active==='ch/'+i?'on':''}" href="#/ch/${i}">${i+1}. ${esc(short)}</a>`;
  });
  h += '<h4>附录</h4>';
  D.apps.forEach(a => {
    const short = a.title.replace(/^附录 /, '');
    h += `<a class="${active==='a/'+a.id?'on':''}" href="#/a/${encodeURIComponent(a.id)}">${esc(short)}</a>`;
  });
  side.innerHTML = h;
}
$('#menu').onclick = () => side.classList.toggle('open');
side.addEventListener('click', e => { if (e.target.tagName === 'A') side.classList.remove('open'); });

/* ---------- 视图 ---------- */
const badge = g => g ? `<span class="badge ${g}" title="把握度 ${g}">${g}</span>` : '';
function chipsHTML(){
  return '<div class="chips">把握度：' + ['A','B','C'].map(g =>
    `<span class="chip badge ${g} ${grades[g]?'':'off'}" data-g="${g}">${g}</span>`).join('') +
    '<span class="note">A 条文明确　B 各地有差异　C 经验之谈</span></div>';
}
function bindChips(rerender){
  app.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    grades[el.dataset.g] = !grades[el.dataset.g]; store.set('grades', grades); rerender();
  });
}
function rowHTML(e, q){
  const t = q ? hl(esc(e.title), q) : esc(e.title);
  return `<a class="row" href="#/e/${e.num}"><div class="t"><span class="num">${e.num}</span>${badge(e.grade)}${t}</div>` +
         (e.lead ? `<div class="lead">${esc(e.lead)}</div>` : '') + `</a>`;
}
function hl(html, q){
  if (!q) return html;
  q.split(/\s+/).filter(Boolean).forEach(t => {
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    html = html.replace(re, m => `<mark>${m}</mark>`);
  });
  return html;
}

function viewHome(){
  const total = D.total;
  let h = `<div class="hero"><h1>${esc(D.title)}</h1><p class="sub">${esc(D.sub)}</p>
  <p>共 <b>${total}</b> 条建议，${D.chapters.length} 章，${D.apps.length} 份附录。法条核对时点：${esc(D.check)}。<br>
  这本书不教你算计谁，只想让你在出事之前，把规则看清楚。</p>
  <div class="cta">
    <a class="btn primary" href="#/p/救急卡">事情已经发生了：看救急卡</a>
    <a class="btn" href="#/p/场景速查">不知道看哪条：场景速查</a>
    <a class="btn" href="#/calc">算一算：计算器</a>
  </div></div>`;
  h += '<div class="grid">';
  D.chapters.forEach((c, i) => {
    h += `<a class="card" href="#/ch/${i}"><div class="n">第 ${i+1} 章 · ${c.entries.length} 条</div>
      <div><b>${esc(c.title.replace(/^第.+?章　/, ''))}</b></div></a>`;
  });
  h += '</div>';
  h += `<div class="warn">本书是一般性的法律信息，不构成法律意见，不能替代律师对具体案件的分析。法律会修订，各地口径不同，请以官方最新文本和所在地法院的做法为准。</div>`;
  app.innerHTML = h;
  document.title = D.title;
}
function viewChapter(i){
  const c = D.chapters[i]; if (!c) return notFound();
  const draw = () => {
    const list = c.entries.filter(e => grades[e.grade] !== false);
    app.innerHTML = `<div class="crumb"><a href="#/">首页</a> / 第 ${i+1} 章</div><h1>${esc(c.title)}</h1>
      <div class="entry">${c.intro}</div>${chipsHTML()}
      <div class="list card" style="padding:4px 0">${list.map(e => rowHTML(e)).join('') || '<p class="note" style="padding:12px">当前筛选下没有条目。</p>'}</div>`;
    bindChips(draw);
  };
  draw(); document.title = c.title + ' · ' + D.title;
}
function viewEntry(num){
  const e = byNum[num]; if (!e) return notFound();
  const c = D.chapters[e.ci], k = entries.indexOf(e);
  const prev = entries[k-1], next = entries[k+1];
  app.innerHTML = `<div class="crumb"><a href="#/">首页</a> / <a href="#/ch/${e.ci}">${esc(c.title)}</a></div>
    <h1><span class="num" style="color:var(--muted);font-weight:400">${e.num}</span>　${esc(e.title)}</h1>
    <div>${badge(e.grade)}<span class="note">把握度 ${e.grade}</span></div>
    <div class="entry">${e.html}</div>
    <div class="pager">${prev ? `<a href="#/e/${prev.num}"><small>上一条</small>${prev.num}　${esc(prev.title)}</a>` : '<span></span>'}
      ${next ? `<a href="#/e/${next.num}"><small>下一条</small>${next.num}　${esc(next.title)}</a>` : '<span></span>'}</div>
    <footer>本条为一般性法律信息，不构成法律意见；具体案件请咨询执业律师，并以官方最新文本为准。</footer>`;
  document.title = e.num + ' ' + e.title + ' · ' + D.title;
  window.scrollTo(0, 0);
}
function viewPage(id){
  const p = page(id); if (!p) return notFound();
  app.innerHTML = `<div class="entry">${p.html}</div>`; document.title = p.label + ' · ' + D.title; window.scrollTo(0, 0);
}
function viewApp(id){
  const a = appx(id); if (!a) return notFound();
  app.innerHTML = `<div class="crumb"><a href="#/">首页</a> / 附录</div><div class="entry">${a.html}</div>`;
  document.title = a.title + ' · ' + D.title; window.scrollTo(0, 0);
}
function notFound(){ app.innerHTML = '<h1>没有找到</h1><p><a href="#/">回到首页</a></p>'; }

function viewSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const draw = () => {
    const res = [];
    entries.forEach(e => {
      
      if (grades[e.grade] === false) return;
      const hay = e.text.toLowerCase(), ti = e.title.toLowerCase();
      if (!terms.every(t => hay.includes(t))) return;
      let s = 0; terms.forEach(t => { if (ti.includes(t)) s += 10; s += Math.min(5, hay.split(t).length - 1); });
      res.push([s, e]);
    });
    res.sort((a, b) => b[0] - a[0]);
    const extra = [];
    D.pages.concat(D.apps).forEach(p => {
      const hay = (p.text || '').toLowerCase();
      if (terms.every(t => hay.includes(t))) extra.push(p);
    });
    app.innerHTML = `<h1>搜索：${esc(q)}</h1>${chipsHTML()}
      <p class="note">${res.length} 条匹配${extra.length ? '，另有 ' + extra.length + ' 个页面或附录' : ''}</p>
      <div class="list card" style="padding:4px 0">${res.slice(0, 80).map(r => rowHTML(r[1], q)).join('') || '<p class="note" style="padding:12px">没有找到。换个关键词，或看看<a href="#/p/场景速查">场景速查</a>。</p>'}</div>` +
      (extra.length ? '<h3>页面与附录</h3><div class="list card" style="padding:4px 0">' + extra.map(p =>
        `<a class="row" href="#/${p.label ? 'p' : 'a'}/${encodeURIComponent(p.id)}"><div class="t">${esc(p.label || p.title)}</div></a>`).join('') + '</div>' : '');
    bindChips(draw);
  };
  draw(); document.title = '搜索 ' + q + ' · ' + D.title;
}

/* ---------- 计算器 ---------- */
const num = id => { const v = parseFloat(($('#'+id)||{}).value); return isNaN(v) ? null : v; };
const yuan = n => n.toLocaleString('zh-CN', {maximumFractionDigits: 0}) + ' 元';
const fmtDate = d => d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
function addDays(s, n){ const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return d; }
function addYears(s, n){ const d = new Date(s + 'T00:00:00'); d.setFullYear(d.getFullYear() + n); return d; }
function viewCalc(){
  app.innerHTML = `<h1>计算器</h1>
  <p class="sub">所有计算都只在你的浏览器里完成，不上传任何数据。结果是常见口径下的估算，不是法院的判决。</p>

  <div class="card calc" id="c1"><h3 style="margin:0">抚养费（常见标准）</h3>
    <div class="row2"><div><label>负担方月总收入（元）</label><input id="c1a" type="number" inputmode="decimal" placeholder="例：20000"></div>
    <div><label>子女人数</label><select id="c1b"><option value="1">1 个</option><option value="2">2 个及以上</option></select></div></div>
    <div class="out" id="c1o">输入月收入后显示结果。</div>
    <div class="note">依据：解释（一）第 49 条。有固定收入的，一般为月总收入的 20% 至 30%；两个以上子女的，比例可以适当提高，一般不超过月总收入的 50%。无固定收入的，参照年平均收入或同行业平均收入。具体数额由法院结合实际裁量。</div></div>

  <div class="card calc" id="c2"><h3 style="margin:0">离婚案件受理费</h3>
    <div><label>涉及分割的财产总额（万元）</label><input id="c2a" type="number" inputmode="decimal" placeholder="例：100"></div>
    <div class="out" id="c2o">输入财产总额后显示结果。</div>
    <div class="note">依据：《诉讼费用交纳办法》第 13 条。离婚案件每件 50 元至 300 元；涉及财产分割，财产总额不超过 20 万元的不另行交纳，超过 20 万元的部分按 0.5% 交纳。具体以当地法院为准，不含保全费、律师费、评估费。</div></div>

  <div class="card calc" id="c3"><h3 style="margin:0">婚前首付、婚后还贷：补偿款估算</h3>
    <div class="row2"><div><label>购房总价（万元）</label><input id="c3a" type="number" inputmode="decimal" placeholder="100"></div>
    <div><label>婚后夫妻共同偿还的贷款本金（万元）</label><input id="c3b" type="number" inputmode="decimal" placeholder="20"></div></div>
    <div><label>离婚时房屋市场价（万元）</label><input id="c3c" type="number" inputmode="decimal" placeholder="150"></div>
    <div class="out" id="c3o">填写后显示结果。</div>
    <div class="note">常见思路：共同还贷对应的价值 = 共同还贷本金 ÷ 购房总价 × 离婚时市场价；补偿给对方的金额，通常是其一半。这不是法定公式（解释（一）第 78 条只规定了原则），贷款利息是否计入、装修款是否计入购房总价，各地口径不同。</div></div>

  <div class="card calc" id="c4"><h3 style="margin:0">民间借贷利率上限</h3>
    <div><label>合同成立时一年期贷款市场报价利率 LPR（%）</label><input id="c4a" type="number" inputmode="decimal" step="0.01" placeholder="到中国人民银行或全国银行间同业拆借中心网站查当月数值"></div>
    <div class="out" id="c4o">填写后显示结果。</div>
    <div class="note">依据：《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第 25 条。年利率超过合同成立时一年期 LPR 的四倍，超出部分不受保护。LPR 数值请自行查询当时的官方公布值，本工具不内置。</div></div>

  <div class="card calc" id="c5"><h3 style="margin:0">离婚冷静期日期</h3>
    <div><label>登记机关收到离婚申请的日期</label><input id="c5a" type="date"></div>
    <div class="out" id="c5o">选择日期后显示结果。</div>
    <div class="note">依据：《民法典》第 1077 条。自收到申请之日起三十日内，任何一方可撤回；期满后三十日内，双方须亲自申请发给离婚证，否则视为撤回。日期按自然日简单推算，以登记机关为准。</div></div>

  <div class="card calc" id="c6"><h3 style="margin:0">诉讼时效（三年）</h3>
    <div><label>权利人知道或应当知道权利受损害的日期，或还款期限届满日</label><input id="c6a" type="date"></div>
    <div class="out" id="c6o">选择日期后显示结果。</div>
    <div class="note">依据：《民法典》第 188 条。一般诉讼时效三年。时效可能因催收、对方承认、起诉等中断而重新计算，也可能有中止等情形，本工具只做最简单的推算。离婚后发现隐匿财产的，三年自发现之日起算。</div></div>`;
  const r1 = () => { const m = num('c1a'), k = $('#c1b').value, o = $('#c1o');
    if (!m || m <= 0) { o.textContent = '输入月收入后显示结果。'; return; }
    if (k === '1') o.innerHTML = `一个子女：每月约 <b>${yuan(m*.2)}</b> 至 <b>${yuan(m*.3)}</b>`;
    else o.innerHTML = `两个以上子女：比例可适当提高，一般不超过月总收入的 50%，即每月上限约 <b>${yuan(m*.5)}</b>；下限可参考 20%（约 ${yuan(m*.2)}）`; };
  const r2 = () => { const w = num('c2a'), o = $('#c2o'); if (w === null || w < 0) { o.textContent = '输入财产总额后显示结果。'; return; }
    const extra = Math.max(0, w - 20) * 10000 * 0.005;
    o.innerHTML = `约 <b>${yuan(50 + extra)}</b> 至 <b>${yuan(300 + extra)}</b>（基础 50–300 元` + (extra ? `，加上超过 20 万元部分的 0.5% 即 ${yuan(extra)}` : '，财产不超过 20 万元不另交') + '）'; };
  const r3 = () => { const t = num('c3a'), p = num('c3b'), v = num('c3c'), o = $('#c3o');
    if (!t || p === null || !v) { o.textContent = '填写后显示结果。'; return; }
    const part = p / t * v; o.innerHTML = `共同还贷对应的价值约 <b>${part.toFixed(2)} 万元</b>；补偿对方约 <b>${(part/2).toFixed(2)} 万元</b>（${yuan(part/2*10000)}）`; };
  const r4 = () => { const l = num('c4a'), o = $('#c4o'); if (l === null || l < 0) { o.textContent = '填写后显示结果。'; return; }
    o.innerHTML = `年利率上限约 <b>${(l*4).toFixed(2)}%</b>（LPR ${l}% × 4）`; };
  const r5 = () => { const d = $('#c5a').value, o = $('#c5o'); if (!d) { o.textContent = '选择日期后显示结果。'; return; }
    o.innerHTML = `冷静期内（可撤回）：到 <b>${fmtDate(addDays(d, 30))}</b> 前<br>领证窗口：<b>${fmtDate(addDays(d, 30))}</b> 之后，最晚 <b>${fmtDate(addDays(d, 60))}</b>`; };
  const r6 = () => { const d = $('#c6a').value, o = $('#c6o'); if (!d) { o.textContent = '选择日期后显示结果。'; return; }
    const e = addYears(d, 3), left = Math.ceil((e - new Date()) / 864e5);
    o.innerHTML = `三年届满：<b>${fmtDate(e)}</b>　` + (left >= 0 ? `距今还有约 ${left} 天` : `<span style="color:var(--warn)">已超过约 ${-left} 天，对方可能以时效抗辩，请尽快咨询律师</span>`); };
  [['c1a',r1],['c1b',r1],['c2a',r2],['c3a',r3],['c3b',r3],['c3c',r3],['c4a',r4],['c5a',r5],['c6a',r6]]
    .forEach(([id, f]) => $('#'+id).addEventListener('input', f));
  document.title = '计算器 · ' + D.title; window.scrollTo(0, 0);
}

/* ---------- 路由 ---------- */
function route(){
  const h = decodeURIComponent((location.hash || '#/').slice(1));
  const [, kind, arg] = h.match(/^\/([^\/]*)\/?(.*)$/) || [];
  let active = '';
  if (!kind) { viewHome(); }
  else if (kind === 'ch') { viewChapter(+arg); active = 'ch/' + arg; }
  else if (kind === 'e') { viewEntry(arg); const e = byNum[arg]; if (e) active = 'ch/' + e.ci; }
  else if (kind === 'p') { viewPage(arg); active = 'p/' + arg; }
  else if (kind === 'a') { viewApp(arg); active = 'a/' + arg; }
  else if (kind === 'calc') { viewCalc(); active = 'calc'; }
  else if (kind === 's') { viewSearch(arg); }
  else { notFound(); }
  buildSide(active);
}
let t = null;
$('#q').addEventListener('input', e => {
  clearTimeout(t);
  t = setTimeout(() => { const v = e.target.value.trim(); location.hash = v ? '#/s/' + encodeURIComponent(v) : '#/'; }, 250);
});
window.addEventListener('hashchange', route);
route();
</script>
