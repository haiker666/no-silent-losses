《民法典》第 1092 条规定：一方隐藏、转移、变卖、毁损、挥霍夫妻共同财产，或者伪造夫妻共同债务企图侵占另一方财产的，分割时，对该方可以少分或不分；离婚后，另一方发现的，可以向法院提起诉讼，请求再次分割。诉讼时效是三年，从发现之日起算（《婚姻家庭编解释（一）》第 84 条）。\n\n具体有几种情形：发现对方隐藏、转移、变卖、毁损夫妻共同财产，可以另行起诉，请求再次分割，对该方可以少分或不分；发现有遗漏、没处理的共同财产，可以另行起诉分割（第 83 条）；协议因欺诈、胁迫签订的，可以请求撤销。\n\n起诉前要准备：对方隐瞒财产的证据；时间线，什么时候发现的；评估价值。\n\n离婚不是终点，发现之日起的三年内，都有机会补救。所以签协议时，保留\"兜底条款\"，就是保留日后主张的权利。\n\n法律依据：《民法典》第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 83 条、第 84 条。\n\n把握度：A｜法条明确。\n\n"}]}, {"title": "第九章　离婚诉讼", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：官司打的是证据和程序，不是委屈。你有多委屈，法官不看；你拿得出什么，法官才看。<br><br><strong>口诀<\/strong>：按时答辩，证据先行，只说事实；孩子看陪伴，财产看来源。<\/blockquote>\n<p>协议谈不拢，就要走诉讼。这一章讲诉讼离婚的全流程：法定事由，被起诉怎么办，出庭，财产分割，调查与保全，过错赔偿，抚养权，探望权，抢夺子女，费用。<\/p>\n<p>本章不以某一个城市为样本。各地法院在财产分割的口径、抚养权的倾向、判决的尺度上有差异。动手之前，先查你所在地的口径：到所在省、市高级人民法院的官网，搜\"婚姻家庭\"\"离婚案件审理指南\"；看中国裁判文书网和人民法院案例库里的类似案例；咨询当地律师，重点问他们法院对抚养权的倾向、房产补偿的计算口径、保全担保的方式。别拿网上的案例硬套。别人的判决，是别人的故事，你的案子，在你的法院。<\/p>", "entries": [{"num": "094", "title": "法院凭什么判离婚：五个法定理由", "grade": "A", "lead": "不是\"感情没了\"，就一定能判离。要看事由，要看证据。", "html": "<blockquote>不是\"感情没了\"，就一定能判离。要看事由，要看证据。<\/blockquote>\n<p>小葛起诉离婚，理由是\"感情不和\"，但没有任何证据。法院调解无效，判决不准离婚。半年后，他有了分居证明，才再次起诉。<\/p>\n<p>判决离婚，法律要求\"感情确已破裂\"。为了防止草率，《民法典》第 1079 条列了几种典型情形，调解无效的，应当准予离婚：<\/p>\n<p>一、重婚或者与他人同居；<br>二、实施家庭暴力，或者虐待、遗弃家庭成员；<br>三、有赌博、吸毒等恶习，屡教不改；<br>四、因感情不和分居满二年；<br>五、其他导致夫妻感情破裂的情形。<\/p>\n<p>另外：一方被宣告失踪，另一方提起离婚诉讼的，应当准予离婚；经法院判决不准离婚后，双方又分居满一年，一方再次提起离婚诉讼的，应当准予离婚；现役军人的配偶要求离婚，须经军人同意，但军人一方有重大过错的除外（第 1081 条）；女方怀孕期间、分娩后一年内或终止妊娠后六个月内，男方不得提出离婚（第 1082 条），见 <a href=\"#/e/078\">第 078 条<\/a>。<\/p>\n<p>不是列了事由，就必然判离，要有证据。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1079 条、第 1081 条、第 1082 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "法院凭什么判离婚：五个法定理由 \n 不是\"感情没了\"，就一定能判离。要看事由，要看证据。\n\n小葛起诉离婚，理由是\"感情不和\"，但没有任何证据。法院调解无效，判决不准离婚。半年后，他有了分居证明，才再次起诉。\n\n判决离婚，法律要求\"感情确已破裂\"。为了防止草率，《民法典》第 1079 条列了几种典型情形，调解无效的，应当准予离婚：\n\n一、重婚或者与他人同居；\n二、实施家庭暴力，或者虐待、遗弃家庭成员；\n三、有赌博、吸毒等恶习，屡教不改；\n四、因感情不和分居满二年；\n五、其他导致夫妻感情破裂的情形。\n\n另外：一方被宣告失踪，另一方提起离婚诉讼的，应当准予离婚；经法院判决不准离婚后，双方又分居满一年，一方再次提起离婚诉讼的，应当准予离婚；现役军人的配偶要求离婚，须经军人同意，但军人一方有重大过错的除外（第 1081 条）；女方怀孕期间、分娩后一年内或终止妊娠后六个月内，男方不得提出离婚（第 1082 条），见 第 078 条。\n\n不是列了事由，就必然判离，要有证据。\n\n法律依据：《民法典》第 1079 条、第 1081 条、第 1082 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "095", "title": "抓到出轨就能判离？没那么简单", "grade": "A", "lead": "单纯的婚外情，不一定直接判离；第一次起诉，如果对方不同意，常见的结果是\"不准离\"。", "html": "<blockquote>单纯的婚外情，不一定直接判离；第一次起诉，如果对方不同意，常见的结果是\"不准离\"。<\/blockquote>\n<p>小贾拿到妻子出轨的聊天记录，起诉离婚。妻子不同意离婚，并且否认\"同居\"。法院认为：偶尔的婚外情，不等于\"与他人同居\"，感情是否确已破裂，还需要更多证据。判决不准离婚。<\/p>\n<p>要分清两个概念。\"与他人同居\"，指有配偶者与婚外异性，不以夫妻名义，持续、稳定地共同居住（《婚姻家庭编解释（一）》第 2 条）；偶尔的婚外情，不一定构成同居。婚外情是一种过错，可能影响损害赔偿、财产分割；但是否判决离婚，要看感情是否确已破裂，法院会综合判断。<\/p>\n<p>第一次起诉，如果对方不同意离婚，又没有明确的法定事由，法院可能判决不准离婚；判决不准离婚后，如果双方又分居满一年，一方再次起诉，应当准予离婚。实务中常说的\"半年后再诉\"，是各地法院对再次起诉时间间隔的做法，法律规定的是\"分居满一年\"，各地做法不一，待核实。<\/p>\n<p>起诉前，评估证据，尤其是：同居的证据：租房合同、水电、邻居证言、共同出入记录；家暴的证据；分居的证据：开始时间、持续时间。<\/p>\n<p>要做好准备：第一次可能不判。同时，把分居的事实固定下来，为将来再次起诉做准备。第一次起诉没判离，不是输了，是路还没走完。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1079 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 2 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确；实务是 B。<\/p>", "text": "抓到出轨就能判离？没那么简单 \n 单纯的婚外情，不一定直接判离；第一次起诉，如果对方不同意，常见的结果是\"不准离\"。\n\n小贾拿到妻子出轨的聊天记录，起诉离婚。妻子不同意离婚，并且否认\"同居\"。法院认为：偶尔的婚外情，不等于\"与他人同居\"，感情是否确已破裂，还需要更多证据。判决不准离婚。\n\n要分清两个概念。\"与他人同居\"，指有配偶者与婚外异性，不以夫妻名义，持续、稳定地共同居住（《婚姻家庭编解释（一）》第 2 条）；偶尔的婚外情，不一定构成同居。婚外情是一种过错，可能影响损害赔偿、财产分割；但是否判决离婚，要看感情是否确已破裂，法院会综合判断。\n\n第一次起诉，如果对方不同意离婚，又没有明确的法定事由，法院可能判决不准离婚；判决不准离婚后，如果双方又分居满一年，一方再次起诉，应当准予离婚。实务中常说的\"半年后再诉\"，是各地法院对再次起诉时间间隔的做法，法律规定的是\"分居满一年\"，各地做法不一，待核实。\n\n起诉前，评估证据，尤其是：同居的证据：租房合同、水电、邻居证言、共同出入记录；家暴的证据；分居的证据：开始时间、持续时间。\n\n要做好准备：第一次可能不判。同时，把分居的事实固定下来，为将来再次起诉做准备。第一次起诉没判离，不是输了，是路还没走完。\n\n法律依据：《民法典》第 1079 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 2 条。\n\n把握度：A｜法条明确；实务是 B。\n\n"}, {"num": "096", "title": "离婚官司从头走到尾：流程和时间表", "grade": "C", "lead": "立案、调解、举证、开庭、判决，每一步都有时间点。通常要三到六个月。", "html": "<blockquote>立案、调解、举证、开庭、判决，每一步都有时间点。通常要三到六个月。<\/blockquote>\n<p>小郑 3 月 1 日网上立案，3 月 15 日接到调解通知，4 月 10 日调解不成转入审理，5 月 20 日开庭，6 月 25 日拿到一审判决。判决后 15 天内没有上诉，判决生效。<\/p>\n<p>第一步，<strong>起诉前准备<\/strong>：起诉状（附录 J）、身份证明、结婚证、证据清单（附录 N）、子女出生证明、财产清单。<\/p>\n<p>第二步，<strong>立案<\/strong>：向被告住所地或经常居住地法院起诉（《民事诉讼法》第 22 条）；现在很多法院可以网上立案。<\/p>\n<p>第三步，<strong>诉前调解<\/strong>：很多法院会先组织调解，成功的出调解书；调解不成，进入审理。<\/p>\n<p>第四步，<strong>送达<\/strong>：法院向被告送达起诉状，被告有举证和答辩的期限。<\/p>\n<p>第五步，<strong>举证期限<\/strong>：在法院指定的期限内提交证据，不要等到开庭才提交。逾期提交，可能被不予采纳，或被训诫、罚款。<\/p>\n<p>第六步，<strong>开庭<\/strong>：法庭调查、法庭辩论、最后陈述。客观陈述事实，不情绪化。<\/p>\n<p>第七步，<strong>判决<\/strong>：书面判决。可以在 15 日内提起上诉（第 171 条）。<\/p>\n<p>第八步，<strong>执行<\/strong>：对方不履行的，申请强制执行，见 <a href=\"#/e/112\">第 112 条<\/a>。<\/p>\n<p>时间线：简易程序一般三个月内审结，普通程序一般六个月内审结；涉及财产分割、抚养权争议大的，可能更长。费用见 <a href=\"#/e/110\">第 110 条<\/a>。<\/p>\n<p>官司，就是一张时间表。错过一个节点，有时候就是不可逆的。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》第 22 条、第 171 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》；《民事诉讼法》关于审理期限的规定。；无。<\/p>\n<p><strong>把握度<\/strong>：C｜流程明确；时间是 B。<\/p>", "text": "离婚官司从头走到尾：流程和时间表 \n 立案、调解、举证、开庭、判决，每一步都有时间点。通常要三到六个月。\n\n小郑 3 月 1 日网上立案，3 月 15 日接到调解通知，4 月 10 日调解不成转入审理，5 月 20 日开庭，6 月 25 日拿到一审判决。判决后 15 天内没有上诉，判决生效。\n\n第一步，起诉前准备：起诉状（附录 J）、身份证明、结婚证、证据清单（附录 N）、子女出生证明、财产清单。\n\n第二步，立案：向被告住所地或经常居住地法院起诉（《民事诉讼法》第 22 条）；现在很多法院可以网上立案。\n\n第三步，诉前调解：很多法院会先组织调解，成功的出调解书；调解不成，进入审理。\n\n第四步，送达：法院向被告送达起诉状，被告有举证和答辩的期限。\n\n第五步，举证期限：在法院指定的期限内提交证据，不要等到开庭才提交。逾期提交，可能被不予采纳，或被训诫、罚款。\n\n第六步，开庭：法庭调查、法庭辩论、最后陈述。客观陈述事实，不情绪化。\n\n第七步，判决：书面判决。可以在 15 日内提起上诉（第 171 条）。\n\n第八步，执行：对方不履行的，申请强制执行，见 第 112 条。\n\n时间线：简易程序一般三个月内审结，普通程序一般六个月内审结；涉及财产分割、抚养权争议大的，可能更长。费用见 第 110 条。\n\n官司，就是一张时间表。错过一个节点，有时候就是不可逆的。\n\n法律依据：《民事诉讼法》第 22 条、第 171 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》；《民事诉讼法》关于审理期限的规定。；无。\n\n把握度：C｜流程明确；时间是 B。\n\n"}, {"num": "097", "title": "收到法院的起诉状和传票：被告第一周怎么做", "grade": "A", "lead": "被起诉不是末日。最糟糕的做法，是不理、不去、不答辩。", "html": "<blockquote>被起诉不是末日。最糟糕的做法，是不理、不去、不答辩。<\/blockquote>\n<p>小岑在家里收到法院寄来的离婚起诉状，他认为\"我不同意离婚，不理它就行\"。结果他没有答辩，没有出庭，法院缺席审理，按照对方的主张判决了抚养权和财产分割，他事后想上诉，已经晚了。<\/p>\n<p>被告收到起诉状，第一周这样做：<\/p>\n<p><strong>第一，别扔，别拒收。<\/strong> 拍照留存。拒收，也可能被视为已送达。<\/p>\n<p><strong>第二，看清楚三样东西。<\/strong> 起诉状副本：对方的诉讼请求、事实和理由；举证通知书：举证期限；开庭传票：开庭的时间和地点。<\/p>\n<p><strong>第三，15 天内答辩。<\/strong> 被告收到起诉状副本之日起十五日内，提交答辩状（《民事诉讼法》第 128 条）。不答辩，不影响审理，但你失去了陈述的机会。<\/p>\n<p><strong>第四，找律师，或至少咨询一次。<\/strong> 重点问：对方的请求是否合理，自己的证据够不够。<\/p>\n<p><strong>第五，整理你的证据。<\/strong> 财产清单、对方有过错的证据（合法取得）、你照顾孩子的证据、收入证明，见附录 N。<\/p>\n<p><strong>第六，考虑反诉。<\/strong> 被告有权提起反诉（第 54 条）：对方请求离婚，你同意离婚，但对财产、抚养有不同意见，可以提出自己的诉讼请求；你想要对方赔偿的，可以反诉。<\/p>\n<p><strong>第七，按时出庭。<\/strong> 被告无正当理由拒不到庭，法院可以缺席判决（第 147 条）；原告无正当理由拒不到庭，可以按撤诉处理（第 146 条）。有特殊情况，提前向法院书面说明，申请延期。<\/p>\n<p><strong>第八，保持沟通。<\/strong> 和对方有协商的可能，也不要放弃。调解成功，往往好于判决。<\/p>\n<p><strong>第九，保护自己。<\/strong> 不要因为被起诉，而转移财产、藏匿孩子，这些行为在诉讼中会对你不利。<\/p>\n<p><strong>可以这样写<\/strong>（答辩状的开头）：<\/p>\n<ul><li>\"答辩人（被告）×××，针对原告 ××× 的诉讼请求，现答辩如下：（一）是否同意离婚：同意／不同意，理由是……（二）关于子女抚养：……（三）关于财产分割：……\"\n<\/li><\/ul>\n<p>不理它，它不会消失，只会按对方的版本走完。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》第 128 条（被告收到起诉状副本之日起十五日内提出答辩状）、第 54 条（被告有权提起反诉）、第 147 条（被告无正当理由拒不到庭，可以缺席判决）、第 146 条（原告无正当理由拒不到庭，可以按撤诉处理）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "收到法院的起诉状和传票：被告第一周怎么做 \n 被起诉不是末日。最糟糕的做法，是不理、不去、不答辩。\n\n小岑在家里收到法院寄来的离婚起诉状，他认为\"我不同意离婚，不理它就行\"。结果他没有答辩，没有出庭，法院缺席审理，按照对方的主张判决了抚养权和财产分割，他事后想上诉，已经晚了。\n\n被告收到起诉状，第一周这样做：\n\n第一，别扔，别拒收。 拍照留存。拒收，也可能被视为已送达。\n\n第二，看清楚三样东西。 起诉状副本：对方的诉讼请求、事实和理由；举证通知书：举证期限；开庭传票：开庭的时间和地点。\n\n第三，15 天内答辩。 被告收到起诉状副本之日起十五日内，提交答辩状（《民事诉讼法》第 128 条）。不答辩，不影响审理，但你失去了陈述的机会。\n\n第四，找律师，或至少咨询一次。 重点问：对方的请求是否合理，自己的证据够不够。\n\n第五，整理你的证据。 财产清单、对方有过错的证据（合法取得）、你照顾孩子的证据、收入证明，见附录 N。\n\n第六，考虑反诉。 被告有权提起反诉（第 54 条）：对方请求离婚，你同意离婚，但对财产、抚养有不同意见，可以提出自己的诉讼请求；你想要对方赔偿的，可以反诉。\n\n第七，按时出庭。 被告无正当理由拒不到庭，法院可以缺席判决（第 147 条）；原告无正当理由拒不到庭，可以按撤诉处理（第 146 条）。有特殊情况，提前向法院书面说明，申请延期。\n\n第八，保持沟通。 和对方有协商的可能，也不要放弃。调解成功，往往好于判决。\n\n第九，保护自己。 不要因为被起诉，而转移财产、藏匿孩子，这些行为在诉讼中会对你不利。\n\n可以这样写（答辩状的开头）：\n\n \"答辩人（被告）×××，针对原告 ××× 的诉讼请求，现答辩如下：（一）是否同意离婚：同意／不同意，理由是……（二）关于子女抚养：……（三）关于财产分割：……\"\n\n不理它，它不会消失，只会按对方的版本走完。\n\n法律依据：《民事诉讼法》第 128 条（被告收到起诉状副本之日起十五日内提出答辩状）、第 54 条（被告有权提起反诉）、第 147 条（被告无正当理由拒不到庭，可以缺席判决）、第 146 条（原告无正当理由拒不到庭，可以按撤诉处理）。\n\n把握度：A｜法条明确。\n\n"}, {"num": "098", "title": "出庭怎么说：法庭上的十件事", "grade": "C", "lead": "法庭上，清晰、克制、围绕事实，比任何\"演技\"都有用。", "html": "<blockquote>法庭上，清晰、克制、围绕事实，比任何\"演技\"都有用。<\/blockquote>\n<p>小董开庭时一直打断对方，情绪激动，法官多次提醒。他后来冷静下来，一件一件陈述事实、提交证据，法官的态度明显缓和。<\/p>\n<p>法庭上赢的，是冷静的人。十件事，提前准备好：<\/p>\n<ol><li><strong>提前到<\/strong>：带身份证、传票、授权委托书（如果有律师）、证据原件。\n<\/li><li><strong>手机静音<\/strong>：未经许可，不得录音录像。\n<\/li><li><strong>听清问题再回答<\/strong>：法官问什么答什么，不跑题，不抢话。\n<\/li><li><strong>只说事实<\/strong>：时间、金额、经过，有证据的拿证据；不确定的说\"不确定\"。\n<\/li><li><strong>不攻击对方<\/strong>：就事论事，不人身攻击。\n<\/li><li><strong>质证<\/strong>：对对方提交的证据，说\"真实性、合法性、关联性\"有没有异议，异议的理由要具体。\n<\/li><li><strong>孩子相关的事<\/strong>：说你对孩子做了什么，要具体：接送、陪伴、就医、教育。不要空泛地说\"我爱孩子\"。\n<\/li><li><strong>调解<\/strong>：法官询问是否同意调解时，认真考虑。调解不是认输。\n<\/li><li><strong>最后陈述<\/strong>：简短、清晰，重复你最核心的两三个请求。\n<\/li><li><strong>庭后<\/strong>：按时领取文书，在上诉期内，决定是否上诉。\n<\/li><\/ol>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"对这份证据的真实性没有异议，但关联性有异议，理由是……\"\n<\/li><li>\"我不清楚这个情况，没有证据，我不确定。\"\n<\/li><li>\"请求法院判决由我直接抚养孩子，理由有三点：第一……第二……第三……\"\n<\/li><\/ul>\n<p>情绪失控，是庭审中最容易发生的问题。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》关于开庭审理的规定。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "出庭怎么说：法庭上的十件事 \n 法庭上，清晰、克制、围绕事实，比任何\"演技\"都有用。\n\n小董开庭时一直打断对方，情绪激动，法官多次提醒。他后来冷静下来，一件一件陈述事实、提交证据，法官的态度明显缓和。\n\n法庭上赢的，是冷静的人。十件事，提前准备好：\n\n1. 提前到：带身份证、传票、授权委托书（如果有律师）、证据原件。\n2. 手机静音：未经许可，不得录音录像。\n3. 听清问题再回答：法官问什么答什么，不跑题，不抢话。\n4. 只说事实：时间、金额、经过，有证据的拿证据；不确定的说\"不确定\"。\n5. 不攻击对方：就事论事，不人身攻击。\n6. 质证：对对方提交的证据，说\"真实性、合法性、关联性\"有没有异议，异议的理由要具体。\n7. 孩子相关的事：说你对孩子做了什么，要具体：接送、陪伴、就医、教育。不要空泛地说\"我爱孩子\"。\n8. 调解：法官询问是否同意调解时，认真考虑。调解不是认输。\n9. 最后陈述：简短、清晰，重复你最核心的两三个请求。\n10. 庭后：按时领取文书，在上诉期内，决定是否上诉。\n\n可以这样说：\n\n \"对这份证据的真实性没有异议，但关联性有异议，理由是……\"\n \"我不清楚这个情况，没有证据，我不确定。\"\n \"请求法院判决由我直接抚养孩子，理由有三点：第一……第二……第三……\"\n\n情绪失控，是庭审中最容易发生的问题。\n\n法律依据：《民事诉讼法》关于开庭审理的规定。\n\n把握度：C｜经验做法。\n\n"}, {"num": "099", "title": "对方就是不离、躲着不见、拖着不签：怎么办", "grade": "A", "lead": "对方不配合，不等于你被困住了。协议走不通，就走诉讼。", "html": "<blockquote>对方不配合，不等于你被困住了。协议走不通，就走诉讼。<\/blockquote>\n<p>小师想协议离婚，对方既不同意，也不见面，拖了一年。他起诉后，法院先调解，对方没有出庭，法院通过公告送达，之后依法审理。<\/p>\n<p>第一，先明确意愿：书面告知对方你要离婚，留存证据，微信、短信、快递。第二，对方不同意协议离婚：只能起诉离婚。第三，对方躲着不见：诉讼中，法院有送达的程序，包括电子送达、邮寄送达、公告送达。第四，第一次起诉，对方不同意：可能判不准离婚，之后分居满一年可再次起诉，见 <a href=\"#/e/095\">第 095 条<\/a>。第五，把分居固定下来：开始的时间、地点、证据，租房合同、聊天记录。第六，长期分居：分居满二年，也是法定的判离事由。第七，同时保护财产：对方拖延期间，如果有转移财产的迹象，可以申请保全，见 <a href=\"#/e/102\">第 102 条<\/a>。<\/p>\n<p>不要用极端的方式：不要通过威胁、跟踪、骚扰，逼对方同意。<\/p>\n<p>对方耗得起，你也得有路。拖，不是对方的权利。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1079 条；《民事诉讼法》关于送达的规定。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确；个案时间较长。<\/p>", "text": "对方就是不离、躲着不见、拖着不签：怎么办 \n 对方不配合，不等于你被困住了。协议走不通，就走诉讼。\n\n小师想协议离婚，对方既不同意，也不见面，拖了一年。他起诉后，法院先调解，对方没有出庭，法院通过公告送达，之后依法审理。\n\n第一，先明确意愿：书面告知对方你要离婚，留存证据，微信、短信、快递。第二，对方不同意协议离婚：只能起诉离婚。第三，对方躲着不见：诉讼中，法院有送达的程序，包括电子送达、邮寄送达、公告送达。第四，第一次起诉，对方不同意：可能判不准离婚，之后分居满一年可再次起诉，见 第 095 条。第五，把分居固定下来：开始的时间、地点、证据，租房合同、聊天记录。第六，长期分居：分居满二年，也是法定的判离事由。第七，同时保护财产：对方拖延期间，如果有转移财产的迹象，可以申请保全，见 第 102 条。\n\n不要用极端的方式：不要通过威胁、跟踪、骚扰，逼对方同意。\n\n对方耗得起，你也得有路。拖，不是对方的权利。\n\n法律依据：《民法典》第 1079 条；《民事诉讼法》关于送达的规定。\n\n把握度：A｜法条明确；个案时间较长。\n\n"}, {"num": "100", "title": "家产不是对半分：法官怎么分", "grade": "A", "lead": "法院先看协议，协议没有，就按财产的具体情况，照顾子女、女方和无过错方权益来判。", "html": "<blockquote>法院先看协议，协议没有，就按财产的具体情况，照顾子女、女方和无过错方权益来判。<\/blockquote>\n<p>夫妻共同财产 300 万，双方都有工作，有一个 5 岁的孩子，女方直接抚养。法院分割时，会考虑：财产的来源、谁照顾孩子、有没有过错、各自对家庭的贡献。最终各自分得的比例，不一定是五五开。<\/p>\n<p>《民法典》第 1087 条：离婚时，夫妻共同财产由双方协议处理；协议不成的，由法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决。<\/p>\n<p>法院通常考虑的因素：<\/p>\n<ul><li><strong>财产来源<\/strong>，谁出了钱，什么时候出的\n<\/li><li><strong>对家庭的贡献<\/strong>，包括经济贡献、家务、照顾孩子\n<\/li><li><strong>子女抚养<\/strong>，谁直接抚养\n<\/li><li><strong>过错<\/strong>，重婚、同居、家暴、遗弃等\n<\/li><li><strong>生产生活的实际需要<\/strong>\n<\/li><\/ul>\n<p>实务中，一般共同财产的均等分割是起点，具体比例看以上因素调整。几种特殊情形：<\/p>\n<ul><li>一方有隐匿、转移、变卖、毁损、挥霍共同财产的，可以少分或不分，见 <a href=\"#/e/103\">第 103 条<\/a>\n<\/li><li>房产的分割，看产权登记、出资来源、贷款情况，见 <a href=\"#/e/060\">第 060 条<\/a>、<a href=\"#/e/061\">第 061 条<\/a>\n<\/li><li>股权、公司，见 <a href=\"#/e/064\">第 064 条<\/a>\n<\/li><li>个人财产，不分割\n<\/li><li>一方对另一方在家庭中承担更多义务的补偿，见 <a href=\"#/e/076\">第 076 条<\/a>\n<\/li><li>一方经济困难的帮助，见 <a href=\"#/e/111\">第 111 条<\/a>\n<\/li><\/ul>\n<p>\"照顾女方、子女、无过错方\"，是裁量的价值导向，不是对半之外的必然倾斜。不是对半，也不是你的全部。法官只问：谁出的，谁贡献的，谁有错，谁带孩子。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1087 条、第 1088 条、第 1090 条。<\/p>\n<p><strong>把握度<\/strong>：A｜原则明确；具体比例是 B。<\/p>", "text": "家产不是对半分：法官怎么分 \n 法院先看协议，协议没有，就按财产的具体情况，照顾子女、女方和无过错方权益来判。\n\n夫妻共同财产 300 万，双方都有工作，有一个 5 岁的孩子，女方直接抚养。法院分割时，会考虑：财产的来源、谁照顾孩子、有没有过错、各自对家庭的贡献。最终各自分得的比例，不一定是五五开。\n\n《民法典》第 1087 条：离婚时，夫妻共同财产由双方协议处理；协议不成的，由法院根据财产的具体情况，按照照顾子女、女方和无过错方权益的原则判决。\n\n法院通常考虑的因素：\n\n 财产来源，谁出了钱，什么时候出的\n 对家庭的贡献，包括经济贡献、家务、照顾孩子\n 子女抚养，谁直接抚养\n 过错，重婚、同居、家暴、遗弃等\n 生产生活的实际需要\n\n实务中，一般共同财产的均等分割是起点，具体比例看以上因素调整。几种特殊情形：\n\n 一方有隐匿、转移、变卖、毁损、挥霍共同财产的，可以少分或不分，见 第 103 条\n 房产的分割，看产权登记、出资来源、贷款情况，见 第 060 条、第 061 条\n 股权、公司，见 第 064 条\n 个人财产，不分割\n 一方对另一方在家庭中承担更多义务的补偿，见 第 076 条\n 一方经济困难的帮助，见 第 111 条\n\n\"照顾女方、子女、无过错方\"，是裁量的价值导向，不是对半之外的必然倾斜。不是对半，也不是你的全部。法官只问：谁出的，谁贡献的，谁有错，谁带孩子。\n\n法律依据：《民法典》第 1087 条、第 1088 条、第 1090 条。\n\n把握度：A｜原则明确；具体比例是 B。\n\n"}, {"num": "101", "title": "怀疑对方藏钱：合法的查法有哪些", "grade": "A", "lead": "怀疑对方有未披露的资产，可以通过诉讼中的财产调查来查，而不是自己用非法手段。", "html": "<blockquote>怀疑对方有未披露的资产，可以通过诉讼中的财产调查来查，而不是自己用非法手段。<\/blockquote>\n<p>小余怀疑妻子名下有他不知道的账户。他没有去偷看，而是委托律师，在诉讼中向法院申请调查令，到几家银行调取了妻子名下的账户信息，找到了一个有 40 万的账户。<\/p>\n<p><strong>自己能查的<\/strong>：自己名下的账户、房产、车辆、保险。对方的信息，不能私自获取。<\/p>\n<p><strong>在诉讼中<\/strong>：向法院申请调查取证，法院向银行、不动产登记中心、证券公司等调取；律师可以向法院申请调查令，持令到银行等调取对方名下的财产信息；对方持有的重要证据，比如银行流水、账本，可以申请法院责令对方提交，对方无正当理由不提交的，法院可以推定你的主张成立（《民事诉讼法解释》第 112 条）。<\/p>\n<p><strong>线索的来源<\/strong>：家庭共同生活中看到的账单、合同、快递、短信；共同账户的流水；对方的经营情况、公司公示信息；子女教育、保险、出行相关的支出。<\/p>\n<p><strong>不要做<\/strong>：不要偷对方的手机密码、网银密码；不要雇用\"调查公司\"获取对方的个人信息。这些做法违法，所获得的证据可能被排除，见 <a href=\"#/e/014\">第 014 条<\/a>。<\/p>\n<p>找得到的，才分得到。但别用违法的方式去找。调查令的使用，各地法院规定有差异。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》第 67 条；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 112 条（书证提出命令）、第 106 条；《刑法》第 253 条之一。<\/p>\n<p><strong>把握度<\/strong>：A｜原则明确；具体办理是 B。<\/p>", "text": "怀疑对方藏钱：合法的查法有哪些 \n 怀疑对方有未披露的资产，可以通过诉讼中的财产调查来查，而不是自己用非法手段。\n\n小余怀疑妻子名下有他不知道的账户。他没有去偷看，而是委托律师，在诉讼中向法院申请调查令，到几家银行调取了妻子名下的账户信息，找到了一个有 40 万的账户。\n\n自己能查的：自己名下的账户、房产、车辆、保险。对方的信息，不能私自获取。\n\n在诉讼中：向法院申请调查取证，法院向银行、不动产登记中心、证券公司等调取；律师可以向法院申请调查令，持令到银行等调取对方名下的财产信息；对方持有的重要证据，比如银行流水、账本，可以申请法院责令对方提交，对方无正当理由不提交的，法院可以推定你的主张成立（《民事诉讼法解释》第 112 条）。\n\n线索的来源：家庭共同生活中看到的账单、合同、快递、短信；共同账户的流水；对方的经营情况、公司公示信息；子女教育、保险、出行相关的支出。\n\n不要做：不要偷对方的手机密码、网银密码；不要雇用\"调查公司\"获取对方的个人信息。这些做法违法，所获得的证据可能被排除，见 第 014 条。\n\n找得到的，才分得到。但别用违法的方式去找。调查令的使用，各地法院规定有差异。\n\n法律依据：《民事诉讼法》第 67 条；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 112 条（书证提出命令）、第 106 条；《刑法》第 253 条之一。\n\n把握度：A｜原则明确；具体办理是 B。\n\n"}, {"num": "102", "title": "财产保全：先冻住，再打官司（也别冻错了）", "grade": "A", "lead": "担心对方在诉讼期间转移财产，可以向法院申请保全；申请人要提供担保，错了要赔。", "html": "<blockquote>担心对方在诉讼期间转移财产，可以向法院申请保全；申请人要提供担保，错了要赔。<\/blockquote>\n<p>小钟起诉离婚，发现对方正准备卖房。他向法院申请保全，提供了保险公司的保全责任险，法院查封了房产。对方无法出售，之后进入正常的财产分割。<\/p>\n<p><strong>什么时候申请<\/strong>：起诉时或诉讼中（《民事诉讼法》第 103 条）；情况紧急的，也可以在起诉前申请，必须提供担保，法院应当在四十八小时内作出裁定，采取保全措施后三十日内不起诉的，法院会解除保全（第 104 条）。<\/p>\n<p><strong>申请什么<\/strong>：冻结银行账户，查封房产车辆，冻结股权。保全的范围，以请求的范围为限，不得超出。<\/p>\n<p><strong>担保<\/strong>：申请人一般要提供担保，比如保证金、保险公司的保全责任险、担保公司担保。担保金额通常和保全的金额相关，各地有差异。<\/p>\n<p><strong>申请错误的后果<\/strong>：申请有错误的，申请人要赔偿被申请人因保全所遭受的损失。<\/p>\n<p><strong>对方的反制<\/strong>：被保全方可以提供担保，请求解除保全。<strong>自己被保全时<\/strong>：账户被冻结，影响生活或经营的，可以向法院申请解除、变更，提供担保或说明理由。<\/p>\n<p><strong>保全费<\/strong>，按保全的财产数额分段收取：不超过 1000 元的 30 元；1000 元至 10 万元的部分按 1%；超过 10 万元的部分按 0.5%；最多不超过 5000 元（《诉讼费用交纳办法》第 14 条）。例如保全 100 万元：30 + 990 + 4500 = 5520 元，封顶按 5000 元收。另有担保费用。<\/p>\n<p>冻结是把双刃剑。你不冻，对方可能转；你乱冻，要赔。不要为了施压而申请保全。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》第 103 条、第 104 条；《诉讼费用交纳办法》；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "财产保全：先冻住，再打官司（也别冻错了） \n 担心对方在诉讼期间转移财产，可以向法院申请保全；申请人要提供担保，错了要赔。\n\n小钟起诉离婚，发现对方正准备卖房。他向法院申请保全，提供了保险公司的保全责任险，法院查封了房产。对方无法出售，之后进入正常的财产分割。\n\n什么时候申请：起诉时或诉讼中（《民事诉讼法》第 103 条）；情况紧急的，也可以在起诉前申请，必须提供担保，法院应当在四十八小时内作出裁定，采取保全措施后三十日内不起诉的，法院会解除保全（第 104 条）。\n\n申请什么：冻结银行账户，查封房产车辆，冻结股权。保全的范围，以请求的范围为限，不得超出。\n\n担保：申请人一般要提供担保，比如保证金、保险公司的保全责任险、担保公司担保。担保金额通常和保全的金额相关，各地有差异。\n\n申请错误的后果：申请有错误的，申请人要赔偿被申请人因保全所遭受的损失。\n\n对方的反制：被保全方可以提供担保，请求解除保全。自己被保全时：账户被冻结，影响生活或经营的，可以向法院申请解除、变更，提供担保或说明理由。\n\n保全费，按保全的财产数额分段收取：不超过 1000 元的 30 元；1000 元至 10 万元的部分按 1%；超过 10 万元的部分按 0.5%；最多不超过 5000 元（《诉讼费用交纳办法》第 14 条）。例如保全 100 万元：30 + 990 + 4500 = 5520 元，封顶按 5000 元收。另有担保费用。\n\n冻结是把双刃剑。你不冻，对方可能转；你乱冻，要赔。不要为了施压而申请保全。\n\n法律依据：《民事诉讼法》第 103 条、第 104 条；《诉讼费用交纳办法》；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》。\n\n把握度：A｜法条明确。\n\n"}, {"num": "103", "title": "转移财产：对方做了怎么办，你自己千万别做", "grade": "A", "lead": "对方转移财产，你可以举证，请求少分或不分；自己绝对不要这么做，一旦被认定，你要承担代价。", "html": "<blockquote>对方转移财产，你可以举证，请求少分或不分；自己绝对不要这么做，一旦被认定，你要承担代价。<\/blockquote>\n<p>小卓在离婚前三个月，把 50 万转给了表哥，\"借款\"。离婚时，妻子在流水里发现了，请求法院少分或不分。法院审查借条、聊天，认定是转移，他分得的比例大幅下降。<\/p>\n<p><strong>如果是对方这么做<\/strong>。迹象有：短期内大额转账、赠与、低价出售，虚假债务，虚假借条。收集证据：流水，合同，转账凭证，通过诉讼中的调查获取。法律后果：一方有隐藏、转移、变卖、毁损、挥霍夫妻共同财产，或伪造夫妻共同债务企图侵占另一方财产的，分割时可以少分或不分；离婚后发现的，可以另行起诉再次分割，时效三年；赠与第三方，与重婚、同居、婚外情有关的，可以主张违背公序良俗而无效（《民法典》第 1092 条；《婚姻家庭编解释（二）》第 7 条）。<\/p>\n<p><strong>如果是你自己<\/strong>。不要在婚姻出现危机、被诉离婚前，突击转移财产；不要伪造债务、签虚假借条；不要通过\"假离婚\"\"假买卖\"来转移。被认定的后果：分割时少分或不分；相关民事行为无效；严重的，可能涉及虚假诉讼、伪造证据的行政、刑事责任（《刑法》第 307 条之一虚假诉讼罪）。<\/p>\n<p>以为转移了就没事？在诉讼中，大额异常转账，很容易被发现。转移财产是一步险棋：赢了也得不到，输了赔得更多。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1066 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 7 条；《刑法》第 307 条之一（虚假诉讼罪）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "转移财产：对方做了怎么办，你自己千万别做 \n 对方转移财产，你可以举证，请求少分或不分；自己绝对不要这么做，一旦被认定，你要承担代价。\n\n小卓在离婚前三个月，把 50 万转给了表哥，\"借款\"。离婚时，妻子在流水里发现了，请求法院少分或不分。法院审查借条、聊天，认定是转移，他分得的比例大幅下降。\n\n如果是对方这么做。迹象有：短期内大额转账、赠与、低价出售，虚假债务，虚假借条。收集证据：流水，合同，转账凭证，通过诉讼中的调查获取。法律后果：一方有隐藏、转移、变卖、毁损、挥霍夫妻共同财产，或伪造夫妻共同债务企图侵占另一方财产的，分割时可以少分或不分；离婚后发现的，可以另行起诉再次分割，时效三年；赠与第三方，与重婚、同居、婚外情有关的，可以主张违背公序良俗而无效（《民法典》第 1092 条；《婚姻家庭编解释（二）》第 7 条）。\n\n如果是你自己。不要在婚姻出现危机、被诉离婚前，突击转移财产；不要伪造债务、签虚假借条；不要通过\"假离婚\"\"假买卖\"来转移。被认定的后果：分割时少分或不分；相关民事行为无效；严重的，可能涉及虚假诉讼、伪造证据的行政、刑事责任（《刑法》第 307 条之一虚假诉讼罪）。\n\n以为转移了就没事？在诉讼中，大额异常转账，很容易被发现。转移财产是一步险棋：赢了也得不到，输了赔得更多。\n\n法律依据：《民法典》第 1066 条、第 1092 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 7 条；《刑法》第 307 条之一（虚假诉讼罪）。\n\n把握度：A｜法条明确。\n\n"}, {"num": "104", "title": "离婚损害赔偿：能赔什么，能赔多少", "grade": "A", "lead": "只有无过错方可以主张；过错限于法条列出的几种；赔偿金额通常不会特别高。", "html": "<blockquote>只有无过错方可以主张；过错限于法条列出的几种；赔偿金额通常不会特别高。<\/blockquote>\n<p>小曹的妻子长期与他人同居，他在离婚诉讼中提出了损害赔偿，提供了租房合同、监控、邻居证言。法院认定属于\"与他人同居\"，支持了赔偿，但金额不高。<\/p>\n<p>《民法典》第 1091 条：有下列情形之一，导致离婚的，无过错方有权请求损害赔偿：重婚；与他人同居；实施家庭暴力；虐待、遗弃家庭成员；有其他重大过错。赔偿包括物质损害赔偿和精神损害赔偿。双方都有过错的，不支持。<\/p>\n<p>几个要点：<\/p>\n<p><strong>时机。<\/strong> 诉讼离婚，作为原告的无过错方，应当在离婚诉讼的同时提出；作为被告的无过错方，如果不同意离婚、也想要求赔偿，可以另行起诉；协议离婚后，无过错方可以请求赔偿，但离婚协议中已经放弃的除外；判决不准离婚的，不支持赔偿请求；婚姻存续期间，不能单独起诉赔偿（《婚姻家庭编解释（一）》第 86 条至第 90 条）。<\/p>\n<p><strong>金额。<\/strong> 没有固定标准，要看过错程度、造成的损害、当地的收入水平，一般不会特别高。<\/p>\n<p><strong>证据。<\/strong> 重婚、同居、家暴的证据，见 <a href=\"#/e/105\">第 105 条<\/a>。<\/p>\n<p>要证明的，是\"法条列出的过错\"。一般的感情不忠、争吵、冷淡，不在其中。赔偿不是出气，是对法定过错的认定。别期待太高。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1091 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 86 条至第 90 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；数额是 B。<\/p>", "text": "离婚损害赔偿：能赔什么，能赔多少 \n 只有无过错方可以主张；过错限于法条列出的几种；赔偿金额通常不会特别高。\n\n小曹的妻子长期与他人同居，他在离婚诉讼中提出了损害赔偿，提供了租房合同、监控、邻居证言。法院认定属于\"与他人同居\"，支持了赔偿，但金额不高。\n\n《民法典》第 1091 条：有下列情形之一，导致离婚的，无过错方有权请求损害赔偿：重婚；与他人同居；实施家庭暴力；虐待、遗弃家庭成员；有其他重大过错。赔偿包括物质损害赔偿和精神损害赔偿。双方都有过错的，不支持。\n\n几个要点：\n\n时机。 诉讼离婚，作为原告的无过错方，应当在离婚诉讼的同时提出；作为被告的无过错方，如果不同意离婚、也想要求赔偿，可以另行起诉；协议离婚后，无过错方可以请求赔偿，但离婚协议中已经放弃的除外；判决不准离婚的，不支持赔偿请求；婚姻存续期间，不能单独起诉赔偿（《婚姻家庭编解释（一）》第 86 条至第 90 条）。\n\n金额。 没有固定标准，要看过错程度、造成的损害、当地的收入水平，一般不会特别高。\n\n证据。 重婚、同居、家暴的证据，见 第 105 条。\n\n要证明的，是\"法条列出的过错\"。一般的感情不忠、争吵、冷淡，不在其中。赔偿不是出气，是对法定过错的认定。别期待太高。\n\n法律依据：《民法典》第 1091 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 86 条至第 90 条。\n\n把握度：A｜规则明确；数额是 B。\n\n"}, {"num": "105", "title": "抓过错证据：怎么收才合法", "grade": "A", "lead": "证据要合法、完整、可验证。偷拍偷录、侵入他人空间，证据可能不被采纳，自己还要担责。", "html": "<blockquote>证据要合法、完整、可验证。偷拍偷录、侵入他人空间，证据可能不被采纳，自己还要担责。<\/blockquote>\n<p>小冉想证明妻子\"同居\"。他没有跟踪，而是收集：妻子主动发给他的聊天、租房合同上妻子的签名（对方曾经发给他）、共同的物业缴费记录，并申请法院调取小区的门禁记录。<\/p>\n<p><strong>可以收集的<\/strong>：<\/p>\n<ul><li>对方主动发给你的聊天、语音、照片\n<\/li><li>你参与的通话录音、面谈录音\n<\/li><li>共同生活的场所里，你自己合法持有的监控、门禁、账单\n<\/li><li>家暴相关：报警回执、病历、验伤报告、告诫书、邻居证言\n<\/li><li>同居相关：租房合同、物业记录、水电气记录、快递、公共场所的合法拍摄\n<\/li><li>对方自愿写下的承认书、保证书，见 <a href=\"#/e/082\">第 082 条<\/a>\n<\/li><li>对重要的聊天记录、网页、录音做公证\n<\/li><\/ul>\n<p><strong>不要做的<\/strong>：<\/p>\n<ul><li>偷装定位器、窃听器、摄像头\n<\/li><li>破解对方的手机、云盘、社交账号\n<\/li><li>闯入他人住所偷拍\n<\/li><li>用胁迫的手段逼对方写保证书\n<\/li><li>买卖对方的个人信息\n<\/li><\/ul>\n<p><strong>怎么保存<\/strong>：保留原始载体；备份到两处以上；每份证据标注时间、来源、证明什么。<\/p>\n<p>有的证据，来源不合法，价值很高，也不能用，且你可能被追究责任。详见 <a href=\"#/e/014\">第 014 条<\/a>。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 106 条；《民法典》第 1032 条；《刑法》第 253 条之一、第 284 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "抓过错证据：怎么收才合法 \n 证据要合法、完整、可验证。偷拍偷录、侵入他人空间，证据可能不被采纳，自己还要担责。\n\n小冉想证明妻子\"同居\"。他没有跟踪，而是收集：妻子主动发给他的聊天、租房合同上妻子的签名（对方曾经发给他）、共同的物业缴费记录，并申请法院调取小区的门禁记录。\n\n可以收集的：\n\n 对方主动发给你的聊天、语音、照片\n 你参与的通话录音、面谈录音\n 共同生活的场所里，你自己合法持有的监控、门禁、账单\n 家暴相关：报警回执、病历、验伤报告、告诫书、邻居证言\n 同居相关：租房合同、物业记录、水电气记录、快递、公共场所的合法拍摄\n 对方自愿写下的承认书、保证书，见 第 082 条\n 对重要的聊天记录、网页、录音做公证\n\n不要做的：\n\n 偷装定位器、窃听器、摄像头\n 破解对方的手机、云盘、社交账号\n 闯入他人住所偷拍\n 用胁迫的手段逼对方写保证书\n 买卖对方的个人信息\n\n怎么保存：保留原始载体；备份到两处以上；每份证据标注时间、来源、证明什么。\n\n有的证据，来源不合法，价值很高，也不能用，且你可能被追究责任。详见 第 014 条。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 106 条；《民法典》第 1032 条；《刑法》第 253 条之一、第 284 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "106", "title": "争抚养权：法官看的是这几样，不看性别", "grade": "A", "lead": "看对孩子最有利，不看性别。两周岁以下一般随母亲；八周岁以上要听孩子的意见。", "html": "<blockquote>看对孩子最有利，不看性别。两周岁以下一般随母亲；八周岁以上要听孩子的意见。<\/blockquote>\n<p>小戴的孩子 4 岁，他长期负责接送、就医、陪伴，有稳定收入和固定住所，妻子经常出差。他把这些事一件一件整理成证据：接送记录、幼儿园老师的证言、儿科就诊记录。法院最终判孩子随他生活。<\/p>\n<p><strong>基本原则<\/strong>：以子女利益最大化为判断标准，不以性别为决定因素（《民法典》第 1084 条）。<\/p>\n<p><strong>不满两周岁的孩子<\/strong>：一般由母亲直接抚养。父亲可以主张的例外：母亲患有久治不愈的传染性疾病或其他严重疾病，子女不宜与其共同生活；母亲有抚养条件，不尽抚养义务，而父亲要求子女随其生活；因其他原因，子女确不宜随母亲生活（《婚姻家庭编解释（一）》第 44 条）。<\/p>\n<p><strong>两周岁以上、八周岁以下<\/strong>：双方都要求直接抚养的，综合考虑，下列情形可以优先考虑：<\/p>\n<ul><li>已做绝育手术或因其他原因丧失生育能力的一方\n<\/li><li>子女随其生活时间较长，改变生活环境对子女健康成长明显不利\n<\/li><li>一方没有其他子女，而另一方有其他子女\n<\/li><li>子女随祖父母或外祖父母共同生活多年，且祖父母或外祖父母要求并有能力帮助照顾孙子女\n<\/li><li>其他有利于子女成长的因素（第 46 条）\n<\/li><\/ul>\n<p><strong>一方有这些情形，优先考虑由另一方直接抚养<\/strong>（针对两周岁以上子女，《婚姻家庭编解释（二）》第 14 条）：<\/p>\n<ul><li>实施家庭暴力，或虐待、遗弃家庭成员\n<\/li><li>有赌博、吸毒等恶习\n<\/li><li>重婚、与他人同居或其他严重违反夫妻忠实义务的情形\n<\/li><li>抢夺、藏匿未成年子女，且另一方不存在上述情形的\n<\/li><li>其他不利于未成年子女身心健康的情形\n<\/li><\/ul>\n<p><strong>八周岁以上<\/strong>：要尊重子女的真实意愿。<\/p>\n<p>父亲怎么争取？举证的方向：长期、稳定地照料孩子：接送、就医、陪伴、教育的记录；稳定收入、固定住所；自身没有不良嗜好；有可以帮助照顾孩子的家人；对方不适宜抚养的证据；孩子本人的意愿（适当，不诱导）。日常的陪伴记录，是最有力的证据。不要等到诉讼才开始，见 <a href=\"#/e/120\">第 120 条<\/a>。<\/p>\n<p>不要在诉讼期间，通过各种手段拉拢孩子，对孩子灌输对另一方的敌意，这会让法院认为你不适宜抚养。法官不看谁更爱孩子，看谁更适合带孩子。适合，靠的是日常。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1084 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 44 条至第 48 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 14 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；结果是 B。<\/p>", "text": "争抚养权：法官看的是这几样，不看性别 \n 看对孩子最有利，不看性别。两周岁以下一般随母亲；八周岁以上要听孩子的意见。\n\n小戴的孩子 4 岁，他长期负责接送、就医、陪伴，有稳定收入和固定住所，妻子经常出差。他把这些事一件一件整理成证据：接送记录、幼儿园老师的证言、儿科就诊记录。法院最终判孩子随他生活。\n\n基本原则：以子女利益最大化为判断标准，不以性别为决定因素（《民法典》第 1084 条）。\n\n不满两周岁的孩子：一般由母亲直接抚养。父亲可以主张的例外：母亲患有久治不愈的传染性疾病或其他严重疾病，子女不宜与其共同生活；母亲有抚养条件，不尽抚养义务，而父亲要求子女随其生活；因其他原因，子女确不宜随母亲生活（《婚姻家庭编解释（一）》第 44 条）。\n\n两周岁以上、八周岁以下：双方都要求直接抚养的，综合考虑，下列情形可以优先考虑：\n\n 已做绝育手术或因其他原因丧失生育能力的一方\n 子女随其生活时间较长，改变生活环境对子女健康成长明显不利\n 一方没有其他子女，而另一方有其他子女\n 子女随祖父母或外祖父母共同生活多年，且祖父母或外祖父母要求并有能力帮助照顾孙子女\n 其他有利于子女成长的因素（第 46 条）\n\n一方有这些情形，优先考虑由另一方直接抚养（针对两周岁以上子女，《婚姻家庭编解释（二）》第 14 条）：\n\n 实施家庭暴力，或虐待、遗弃家庭成员\n 有赌博、吸毒等恶习\n 重婚、与他人同居或其他严重违反夫妻忠实义务的情形\n 抢夺、藏匿未成年子女，且另一方不存在上述情形的\n 其他不利于未成年子女身心健康的情形\n\n八周岁以上：要尊重子女的真实意愿。\n\n父亲怎么争取？举证的方向：长期、稳定地照料孩子：接送、就医、陪伴、教育的记录；稳定收入、固定住所；自身没有不良嗜好；有可以帮助照顾孩子的家人；对方不适宜抚养的证据；孩子本人的意愿（适当，不诱导）。日常的陪伴记录，是最有力的证据。不要等到诉讼才开始，见 第 120 条。\n\n不要在诉讼期间，通过各种手段拉拢孩子，对孩子灌输对另一方的敌意，这会让法院认为你不适宜抚养。法官不看谁更爱孩子，看谁更适合带孩子。适合，靠的是日常。\n\n法律依据：《民法典》第 1084 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 44 条至第 48 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 14 条。\n\n把握度：A｜规则明确；结果是 B。\n\n"}, {"num": "107", "title": "抚养费怎么算，什么时候能改", "grade": "A", "lead": "抚养费有大致的比例，收入变化大的，可以请求调整；但调低，要证明重大变化。", "html": "<blockquote>抚养费有大致的比例，收入变化大的，可以请求调整；但调低，要证明重大变化。<\/blockquote>\n<p>小郝月收入原来是 2 万，抚养费每月 5000。后来公司倒闭，他失业半年，收入降为 0，他向法院请求调低抚养费，提供了失业证明、社保中断记录和银行流水。法院结合实际调整。<\/p>\n<p><strong>标准<\/strong>：按负担方月总收入的 20% 至 30%；有两个以上子女的，可适当提高，一般不超过 50%。无固定收入的，以年平均收入，或同行业平均收入计算。范围包括生活费、教育费、医疗费。<\/p>\n<p><strong>可以请求增加<\/strong>：原定数额不足以维持当地实际生活水平；子女患病、上学，实际需要增加；负担方收入明显增加。<\/p>\n<p><strong>可以请求调低<\/strong>：负担方收入显著降低，比如失业、重病；举证：失业证明、病历、收入下降的流水。单纯\"我不想付\"，不被支持。<\/p>\n<p><strong>变更抚养关系<\/strong>：直接抚养一方患有严重疾病或因伤残等无力继续抚养子女；与子女共同生活的一方不尽抚养义务，或有虐待子女行为；未成年子女已满八周岁，愿意随另一方生活，该方有抚养能力；其他确有变更必要的情形（《婚姻家庭编解释（一）》第 56 条）。起诉状范本见附录 M。<\/p>\n<p>已经写在协议或判决里的抚养费，不能因为\"对方不让我见孩子\"而停止支付。这是两件事，分别处理。不是想少给，就能少给。要么事实变了，要么证据在。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1085 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 49 条、第 56 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "抚养费怎么算，什么时候能改 \n 抚养费有大致的比例，收入变化大的，可以请求调整；但调低，要证明重大变化。\n\n小郝月收入原来是 2 万，抚养费每月 5000。后来公司倒闭，他失业半年，收入降为 0，他向法院请求调低抚养费，提供了失业证明、社保中断记录和银行流水。法院结合实际调整。\n\n标准：按负担方月总收入的 20% 至 30%；有两个以上子女的，可适当提高，一般不超过 50%。无固定收入的，以年平均收入，或同行业平均收入计算。范围包括生活费、教育费、医疗费。\n\n可以请求增加：原定数额不足以维持当地实际生活水平；子女患病、上学，实际需要增加；负担方收入明显增加。\n\n可以请求调低：负担方收入显著降低，比如失业、重病；举证：失业证明、病历、收入下降的流水。单纯\"我不想付\"，不被支持。\n\n变更抚养关系：直接抚养一方患有严重疾病或因伤残等无力继续抚养子女；与子女共同生活的一方不尽抚养义务，或有虐待子女行为；未成年子女已满八周岁，愿意随另一方生活，该方有抚养能力；其他确有变更必要的情形（《婚姻家庭编解释（一）》第 56 条）。起诉状范本见附录 M。\n\n已经写在协议或判决里的抚养费，不能因为\"对方不让我见孩子\"而停止支付。这是两件事，分别处理。不是想少给，就能少给。要么事实变了，要么证据在。\n\n法律依据：《民法典》第 1085 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 49 条、第 56 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "108", "title": "探望权：约定、执行、中止，一次说清", "grade": "A", "lead": "没有直接抚养孩子的一方，有权探望。对方阻碍，可以申请法院协助；探望有不适宜的情形，可以中止。", "html": "<blockquote>没有直接抚养孩子的一方，有权探望。对方阻碍，可以申请法院协助；探望有不适宜的情形，可以中止。<\/blockquote>\n<p>小庞每月应探望孩子两次，前妻总以各种理由阻拦。他保留了每次被拒绝的记录，向法院申请强制执行。法院可以对拒不协助的人采取罚款、拘留，但不能强制孩子去探望。<\/p>\n<p><strong>怎么约定<\/strong>：写清楚时间，每周几、几点到几点，节假日、寒暑假；地点；接送方式。不要写\"随时探望\"。判决没有涉及的探望权，可以单独起诉。<\/p>\n<p><strong>对方阻碍怎么办<\/strong>：先协商；协商不成，可以向法院申请强制执行，法院可以对拒不履行协助义务的人采取罚款、拘留等强制措施；但法院不能强制孩子本人去探望，也不能强制交付孩子；保留阻碍探望的证据，在后续变更抚养权的诉讼中有用（《婚姻家庭编解释（一）》第 65 条至第 68 条）。<\/p>\n<p><strong>什么时候中止<\/strong>：探望人有严重影响孩子身心健康的情形，比如家暴、虐待、吸毒；子女、直接抚养人、其他监护人，可以请求中止；中止的事由消失后，应当恢复（《民法典》第 1086 条）。<\/p>\n<p>探望权和抚养费，是两件事，不能因为对方不让探望，就不付抚养费。探望是孩子的权利，也是你的。别让它变成战场，也不要强行抢夺、带走孩子，见 <a href=\"#/e/109\">第 109 条<\/a>。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1086 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 65 条至第 68 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "探望权：约定、执行、中止，一次说清 \n 没有直接抚养孩子的一方，有权探望。对方阻碍，可以申请法院协助；探望有不适宜的情形，可以中止。\n\n小庞每月应探望孩子两次，前妻总以各种理由阻拦。他保留了每次被拒绝的记录，向法院申请强制执行。法院可以对拒不协助的人采取罚款、拘留，但不能强制孩子去探望。\n\n怎么约定：写清楚时间，每周几、几点到几点，节假日、寒暑假；地点；接送方式。不要写\"随时探望\"。判决没有涉及的探望权，可以单独起诉。\n\n对方阻碍怎么办：先协商；协商不成，可以向法院申请强制执行，法院可以对拒不履行协助义务的人采取罚款、拘留等强制措施；但法院不能强制孩子本人去探望，也不能强制交付孩子；保留阻碍探望的证据，在后续变更抚养权的诉讼中有用（《婚姻家庭编解释（一）》第 65 条至第 68 条）。\n\n什么时候中止：探望人有严重影响孩子身心健康的情形，比如家暴、虐待、吸毒；子女、直接抚养人、其他监护人，可以请求中止；中止的事由消失后，应当恢复（《民法典》第 1086 条）。\n\n探望权和抚养费，是两件事，不能因为对方不让探望，就不付抚养费。探望是孩子的权利，也是你的。别让它变成战场，也不要强行抢夺、带走孩子，见 第 109 条。\n\n法律依据：《民法典》第 1086 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 65 条至第 68 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "109", "title": "对方把孩子藏起来了：怎么办，千万别硬抢", "grade": "A", "lead": "一方私自带走、藏匿孩子，另一方可以申请人格权侵害禁令或人身安全保护令；抢孩子的一方，在抚养权争夺中会吃亏。", "html": "<blockquote>一方私自带走、藏匿孩子，另一方可以申请人格权侵害禁令或人身安全保护令；抢孩子的一方，在抚养权争夺中会吃亏。<\/blockquote>\n<p>小颜的丈夫和公婆趁她不在，把两岁的孩子带到了外地，拒绝返回。她立即报警，同时向法院申请人格权侵害禁令。法院裁定限期送回，并禁止再次带走。<\/p>\n<p>最高人民法院 2025 年 1 月公布的案例：一对夫妻有一对双胞胎，2024 年 3 月，丈夫及其父母、妹妹强行把儿子带到外省，之后拒绝返还。母亲申请人格权侵害禁令，法院裁定丈夫在七日内把孩子送回原住所，并禁止再次抢夺、藏匿。见附录 O 案例 O-12。<\/p>\n<p><strong>如果孩子被对方带走、藏匿<\/strong>：立即报警，保存证据：聊天记录、孩子最后的位置、对方的行为；向法院申请人格权侵害禁令或人身安全保护令（《民法典》第 997 条；《婚姻家庭编解释（二）》第 12 条），禁止对方隐匿、转移孩子，禁令可以较快作出；离婚诉讼前，夫妻分居期间，一方抢夺、藏匿孩子，另一方可以请求法院暂时确定孩子的抚养事宜（第 13 条）；在离婚案件里，抢夺、藏匿孩子，是对抚养权判断不利的因素（第 14 条），见 <a href=\"#/e/106\">第 106 条<\/a>。申请书范本见附录 K。<\/p>\n<p><strong>如果你想带孩子<\/strong>：不要私下抢夺；不要在没有协议的情况下，把孩子长期带走，拒绝让对方探望；通过法律途径主张。你认为对方不适合抚养，以对方有家暴、虐待、吸毒等为由，通过法律途径主张变更抚养关系，而不是私自带走。<\/p>\n<p>孩子不是财产，不能被\"占有\"。抢孩子，是在抚养权上给自己扣分。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 997 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 12 条至第 14 条；《反家庭暴力法》。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "对方把孩子藏起来了：怎么办，千万别硬抢 \n 一方私自带走、藏匿孩子，另一方可以申请人格权侵害禁令或人身安全保护令；抢孩子的一方，在抚养权争夺中会吃亏。\n\n小颜的丈夫和公婆趁她不在，把两岁的孩子带到了外地，拒绝返回。她立即报警，同时向法院申请人格权侵害禁令。法院裁定限期送回，并禁止再次带走。\n\n最高人民法院 2025 年 1 月公布的案例：一对夫妻有一对双胞胎，2024 年 3 月，丈夫及其父母、妹妹强行把儿子带到外省，之后拒绝返还。母亲申请人格权侵害禁令，法院裁定丈夫在七日内把孩子送回原住所，并禁止再次抢夺、藏匿。见附录 O 案例 O12。\n\n如果孩子被对方带走、藏匿：立即报警，保存证据：聊天记录、孩子最后的位置、对方的行为；向法院申请人格权侵害禁令或人身安全保护令（《民法典》第 997 条；《婚姻家庭编解释（二）》第 12 条），禁止对方隐匿、转移孩子，禁令可以较快作出；离婚诉讼前，夫妻分居期间，一方抢夺、藏匿孩子，另一方可以请求法院暂时确定孩子的抚养事宜（第 13 条）；在离婚案件里，抢夺、藏匿孩子，是对抚养权判断不利的因素（第 14 条），见 第 106 条。申请书范本见附录 K。\n\n如果你想带孩子：不要私下抢夺；不要在没有协议的情况下，把孩子长期带走，拒绝让对方探望；通过法律途径主张。你认为对方不适合抚养，以对方有家暴、虐待、吸毒等为由，通过法律途径主张变更抚养关系，而不是私自带走。\n\n孩子不是财产，不能被\"占有\"。抢孩子，是在抚养权上给自己扣分。\n\n法律依据：《民法典》第 997 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 12 条至第 14 条；《反家庭暴力法》。\n\n把握度：A｜法条明确。\n\n"}, {"num": "110", "title": "打一场离婚官司，到底要花多少钱", "grade": "A", "lead": "诉讼费本身不多，真正的支出是律师费、评估费和时间。", "html": "<blockquote>诉讼费本身不多，真正的支出是律师费、评估费和时间。<\/blockquote>\n<p>夫妻共同财产 100 万。案件受理费：离婚每件 50 元至 300 元；财产超过 20 万的部分，按 0.5% 交纳，也就是 80 万 × 0.5% = 4000 元；合计约 4050 元至 4300 元。如果申请保全，保全费另算。网页版有计算器。<\/p>\n<p><strong>案件受理费<\/strong>：离婚案件，每件交纳 50 元至 300 元；涉及财产分割，财产总额不超过 20 万元的，不另行交纳；超过 20 万元的部分，按 0.5% 交纳（《诉讼费用交纳办法》第 13 条）。具体以当地法院和最新的办法为准。<\/p>\n<p><strong>财产保全费<\/strong>：不超过 1000 元的 30 元，1000 元至 10 万元的部分 1%，超过 10 万元的部分 0.5%，最多 5000 元。<\/p>\n<p><strong>评估、鉴定费<\/strong>：房产、股权评估，亲子鉴定，各地、各机构不同。<\/p>\n<p><strong>律师费<\/strong>：按小时、按件、按标的比例、风险代理，各有不同；离婚案件，律师费几千元到几万元，看复杂程度和地区；书面约定收费方式。<\/p>\n<p><strong>时间成本和隐性成本<\/strong>：每次开庭、取证、沟通；情绪，工作，孩子。<\/p>\n<p>怎么降低成本？先协商、调解；证据自己提前整理；符合条件的，可以申请法律援助；争议不大的部分，达成一致，缩小争议范围。<\/p>\n<p>诉讼费是小头，时间和情绪才是大头。<\/p>\n<p><strong>法律依据<\/strong>：《诉讼费用交纳办法》第 13 条。<\/p>\n<p><strong>把握度<\/strong>：A｜诉讼费规则明确；律师费是 B。<\/p>", "text": "打一场离婚官司，到底要花多少钱 \n 诉讼费本身不多，真正的支出是律师费、评估费和时间。\n\n夫妻共同财产 100 万。案件受理费：离婚每件 50 元至 300 元；财产超过 20 万的部分，按 0.5% 交纳，也就是 80 万 × 0.5% = 4000 元；合计约 4050 元至 4300 元。如果申请保全，保全费另算。网页版有计算器。\n\n案件受理费：离婚案件，每件交纳 50 元至 300 元；涉及财产分割，财产总额不超过 20 万元的，不另行交纳；超过 20 万元的部分，按 0.5% 交纳（《诉讼费用交纳办法》第 13 条）。具体以当地法院和最新的办法为准。\n\n财产保全费：不超过 1000 元的 30 元，1000 元至 10 万元的部分 1%，超过 10 万元的部分 0.5%，最多 5000 元。\n\n评估、鉴定费：房产、股权评估，亲子鉴定，各地、各机构不同。\n\n律师费：按小时、按件、按标的比例、风险代理，各有不同；离婚案件，律师费几千元到几万元，看复杂程度和地区；书面约定收费方式。\n\n时间成本和隐性成本：每次开庭、取证、沟通；情绪，工作，孩子。\n\n怎么降低成本？先协商、调解；证据自己提前整理；符合条件的，可以申请法律援助；争议不大的部分，达成一致，缩小争议范围。\n\n诉讼费是小头，时间和情绪才是大头。\n\n法律依据：《诉讼费用交纳办法》第 13 条。\n\n把握度：A｜诉讼费规则明确；律师费是 B。\n\n"}, {"num": "111", "title": "离婚还要\"补偿\"和\"帮助\"：出钱的一方要提前知道", "grade": "A", "lead": "离婚时，一方承担了更多家庭义务，可以请求补偿；一方生活困难，另一方有能力的，应当给予适当帮助。", "html": "<blockquote>离婚时，一方承担了更多家庭义务，可以请求补偿；一方生活困难，另一方有能力的，应当给予适当帮助。<\/blockquote>\n<p>小褚的前妻在离婚时身患重病、没有工作，主张经济帮助。法院结合小褚的财产状况，判决他一次性给予一笔帮助，金额与他的负担能力相符。<\/p>\n<p>两种钱，要分清：<\/p>\n<p><strong>家务劳动补偿<\/strong>，见 <a href=\"#/e/076\">第 076 条<\/a>。<\/p>\n<p><strong>经济帮助。<\/strong> 离婚时，如果一方生活困难，有负担能力的另一方应当给予适当帮助；具体办法由双方协议，协议不成，由法院判决（《民法典》第 1090 条）。《婚姻家庭编解释（二）》第 22 条明确：一方因年老、残疾、重病等原因生活困难的，可以请求有负担能力的另一方给予适当帮助；法院会结合另一方的财产状况，决定是否支持。<\/p>\n<p>判断标准：是否\"生活困难\"，以当地基本生活保障水平为参考；帮助的方式，一次性给付，定期给付，提供住房居住；帮助的数额，与支付方的负担能力相符。<\/p>\n<p><strong>作为支付方<\/strong>：评估自己的负担能力；在协议或诉讼中，争取明确期限、总额、方式；要求对方提供困难的证据。<strong>作为请求方<\/strong>：证明自己的困难：收入、病历、残疾证明、居住状况；证明对方有负担能力。<\/p>\n<p>这里的\"帮助\"，针对的是真实的困难，不是一般的生活水平下降。该给的钱，要清楚给多少、给多久、怎么给。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1088 条、第 1090 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 21 条、第 22 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；数额是 B。<\/p>", "text": "离婚还要\"补偿\"和\"帮助\"：出钱的一方要提前知道 \n 离婚时，一方承担了更多家庭义务，可以请求补偿；一方生活困难，另一方有能力的，应当给予适当帮助。\n\n小褚的前妻在离婚时身患重病、没有工作，主张经济帮助。法院结合小褚的财产状况，判决他一次性给予一笔帮助，金额与他的负担能力相符。\n\n两种钱，要分清：\n\n家务劳动补偿，见 第 076 条。\n\n经济帮助。 离婚时，如果一方生活困难，有负担能力的另一方应当给予适当帮助；具体办法由双方协议，协议不成，由法院判决（《民法典》第 1090 条）。《婚姻家庭编解释（二）》第 22 条明确：一方因年老、残疾、重病等原因生活困难的，可以请求有负担能力的另一方给予适当帮助；法院会结合另一方的财产状况，决定是否支持。\n\n判断标准：是否\"生活困难\"，以当地基本生活保障水平为参考；帮助的方式，一次性给付，定期给付，提供住房居住；帮助的数额，与支付方的负担能力相符。\n\n作为支付方：评估自己的负担能力；在协议或诉讼中，争取明确期限、总额、方式；要求对方提供困难的证据。作为请求方：证明自己的困难：收入、病历、残疾证明、居住状况；证明对方有负担能力。\n\n这里的\"帮助\"，针对的是真实的困难，不是一般的生活水平下降。该给的钱，要清楚给多少、给多久、怎么给。\n\n法律依据：《民法典》第 1088 条、第 1090 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 21 条、第 22 条。\n\n把握度：A｜规则明确；数额是 B。\n\n"}]}, {"title": "第十章　离婚之后", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：证书拿到手，只是一半；落到过户和执行，才算完。离婚后的日子，是另一场长期的事。<br><br><strong>口诀<\/strong>：该过户的过户，该执行的执行，该清的账清；孩子的事，当成合作项目。<\/blockquote>\n<p>离婚证或判决书拿到手，事情还没有完。财产要过户，协议要履行，孩子的安排要落实；有人会再婚，也要为下一段关系做好准备。<\/p>", "entries": [{"num": "112", "title": "判了不给、签了不给：怎么执行，欠着有什么后果", "grade": "A", "lead": "对方不履行，可以申请强制执行；自己不履行，同样会被执行，还会影响信用和出行。", "html": "<blockquote>对方不履行，可以申请强制执行；自己不履行，同样会被执行，还会影响信用和出行。<\/blockquote>\n<p>小周的前夫离婚后拒付抚养费，已拖欠 8 个月。小周拿着生效的调解书去法院申请强制执行，法院查询了前夫名下的账户，冻结并扣划了拖欠的部分，并将他纳入失信被执行人名单。<\/p>\n<p><strong>如果你是权利人。<\/strong> 判决书、调解书生效后，对方不履行的，可以向法院申请强制执行。离婚协议，一般不能直接申请强制执行，可以起诉要求履行，拿到判决后再执行；协议经过公证并赋予强制执行效力的，可以直接申请执行。申请执行的期间是二年，从法律文书规定履行期间的最后一日起算（《民事诉讼法》第 250 条）。执行措施有：查询、冻结、扣划存款；查封、拍卖房产车辆；限制高消费；纳入失信被执行人名单。你提供对方的财产线索，会提高执行效率。<\/p>\n<p><strong>如果你是义务人。<\/strong> 有能力不履行，会被限制高消费，列入失信名单，限制出境；有能力执行而拒不执行，情节严重的，可能构成拒不执行判决、裁定罪（《刑法》第 313 条）；履行确有困难的，及时与对方沟通，向法院申请分期履行，并提供证据；抚养费的拖欠，也可以执行。<\/p>\n<p>不要以为\"离婚协议签了，对方不给，也没办法\"。办法有，但要走程序。判决是一张纸，执行才是钱。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》执行编；《刑法》第 313 条；《最高人民法院关于公布失信被执行人名单信息的若干规定》。<\/p>\n<p><strong>把握度<\/strong>：A｜程序明确。<\/p>", "text": "判了不给、签了不给：怎么执行，欠着有什么后果 \n 对方不履行，可以申请强制执行；自己不履行，同样会被执行，还会影响信用和出行。\n\n小周的前夫离婚后拒付抚养费，已拖欠 8 个月。小周拿着生效的调解书去法院申请强制执行，法院查询了前夫名下的账户，冻结并扣划了拖欠的部分，并将他纳入失信被执行人名单。\n\n如果你是权利人。 判决书、调解书生效后，对方不履行的，可以向法院申请强制执行。离婚协议，一般不能直接申请强制执行，可以起诉要求履行，拿到判决后再执行；协议经过公证并赋予强制执行效力的，可以直接申请执行。申请执行的期间是二年，从法律文书规定履行期间的最后一日起算（《民事诉讼法》第 250 条）。执行措施有：查询、冻结、扣划存款；查封、拍卖房产车辆；限制高消费；纳入失信被执行人名单。你提供对方的财产线索，会提高执行效率。\n\n如果你是义务人。 有能力不履行，会被限制高消费，列入失信名单，限制出境；有能力执行而拒不执行，情节严重的，可能构成拒不执行判决、裁定罪（《刑法》第 313 条）；履行确有困难的，及时与对方沟通，向法院申请分期履行，并提供证据；抚养费的拖欠，也可以执行。\n\n不要以为\"离婚协议签了，对方不给，也没办法\"。办法有，但要走程序。判决是一张纸，执行才是钱。\n\n法律依据：《民事诉讼法》执行编；《刑法》第 313 条；《最高人民法院关于公布失信被执行人名单信息的若干规定》。\n\n把握度：A｜程序明确。\n\n"}, {"num": "113", "title": "拿到离婚证以后：九件事，三个月办完", "grade": "A", "lead": "协议写得再好，不过户，就是一张纸。离婚后三个月内，把该过的户、该转的账、该变更的信息，全部办完。", "html": "<blockquote>协议写得再好，不过户，就是一张纸。离婚后三个月内，把该过的户、该转的账、该变更的信息，全部办完。<\/blockquote>\n<p>小鲁离婚时，协议写好了房子归他，对方补偿 20 万。他没有立即办过户，也没有催对方转款。一年后，对方再婚，房子的事再次起了争议。<\/p>\n<p>九件事：<\/p>\n<ol><li><strong>房产<\/strong>：到不动产登记中心办理过户。有贷款的，先联系银行，是否同意变更借款人，或提前还清，见 <a href=\"#/e/088\">第 088 条<\/a>。税费：契税、个人所得税、增值税等，夫妻之间因离婚发生的房产权属变更，税费政策各地有差异，办理前向税务部门确认，待核实；\n<\/li><li><strong>车辆<\/strong>：到车管所办理过户；\n<\/li><li><strong>存款、理财、股票<\/strong>：按协议转账，保留凭证；\n<\/li><li><strong>保险<\/strong>：变更投保人、受益人；\n<\/li><li><strong>公积金、社保<\/strong>：各自账户的处理；\n<\/li><li><strong>子女<\/strong>：户口、姓氏、学籍、医保；抚养费账户设置；探望的安排落地；\n<\/li><li><strong>各类账户和证件<\/strong>：共同账户销户；银行卡、支付宝、微信绑定的共同卡；联名的保险、账户；\n<\/li><li><strong>债务<\/strong>：共同债务按协议由谁还，并通知债权人；联名信用卡的处理；\n<\/li><li><strong>个人安全<\/strong>：更换门锁密码、银行卡密码、手机密码，清除共享定位。\n<\/li><\/ol>\n<p>不动产物权的变动，以登记为准（《民法典》第 209 条）。协议约定了，没过户，法律上还是对方的。九件事，三个月，办完，才算真的离了。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 209 条（不动产物权登记生效）、第 224 条；《契税法》。<\/p>\n<p><strong>把握度<\/strong>：A｜登记规则明确；税费是 B。<\/p>", "text": "拿到离婚证以后：九件事，三个月办完 \n 协议写得再好，不过户，就是一张纸。离婚后三个月内，把该过的户、该转的账、该变更的信息，全部办完。\n\n小鲁离婚时，协议写好了房子归他，对方补偿 20 万。他没有立即办过户，也没有催对方转款。一年后，对方再婚，房子的事再次起了争议。\n\n九件事：\n\n1. 房产：到不动产登记中心办理过户。有贷款的，先联系银行，是否同意变更借款人，或提前还清，见 第 088 条。税费：契税、个人所得税、增值税等，夫妻之间因离婚发生的房产权属变更，税费政策各地有差异，办理前向税务部门确认，待核实；\n2. 车辆：到车管所办理过户；\n3. 存款、理财、股票：按协议转账，保留凭证；\n4. 保险：变更投保人、受益人；\n5. 公积金、社保：各自账户的处理；\n6. 子女：户口、姓氏、学籍、医保；抚养费账户设置；探望的安排落地；\n7. 各类账户和证件：共同账户销户；银行卡、支付宝、微信绑定的共同卡；联名的保险、账户；\n8. 债务：共同债务按协议由谁还，并通知债权人；联名信用卡的处理；\n9. 个人安全：更换门锁密码、银行卡密码、手机密码，清除共享定位。\n\n不动产物权的变动，以登记为准（《民法典》第 209 条）。协议约定了，没过户，法律上还是对方的。九件事，三个月，办完，才算真的离了。\n\n法律依据：《民法典》第 209 条（不动产物权登记生效）、第 224 条；《契税法》。\n\n把握度：A｜登记规则明确；税费是 B。\n\n"}, {"num": "114", "title": "离婚后怎么和前任一起养孩子", "grade": "C", "lead": "夫妻关系结束了，父母关系没有。把孩子的事，当成一个\"合作项目\"来做。", "html": "<blockquote>夫妻关系结束了，父母关系没有。把孩子的事，当成一个\"合作项目\"来做。<\/blockquote>\n<p>小米和前妻约定：孩子的事只在一个固定的微信群里沟通，只谈孩子；每个月第一个周日交接；孩子的大额花费，提前一周通知。运行半年，两个人几乎没有再吵过。<\/p>\n<p>沟通只谈孩子，用文字、固定的渠道，避免情绪化。交接简单：固定的时间、地点；有冲突时，在公共场所，第三方交接。孩子的大事一起商量：升学、医疗、搬家、出国。不在孩子面前说对方的坏话，也不把孩子当传话筒。新伴侣：在孩子面前介绍新伴侣，要循序渐进，先和前任沟通。抚养费按时支付，保留凭证。尊重对方的规则：在对方家里的规则，只要不危害孩子，就不干涉。孩子的情绪：情绪波动、成绩下滑，可能是适应离婚的反应，必要时找儿童心理咨询。出现冲突，先暂停，必要时通过调解员、律师，或申请法院介入，不在孩子面前吵。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"关于孩子下学期的兴趣班，我想听听你的意见，你有空时我们在群里说一下。\"\n<\/li><li>\"这周六的接送我有点事，能不能提前一天？我可以多补一次。\"\n<\/li><\/ul>\n<p>不要把对前任的怨气，转移到孩子身上。离婚后的合作，是你能给孩子的最好的礼物。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1084 条、第 1086 条；《未成年人保护法》。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "离婚后怎么和前任一起养孩子 \n 夫妻关系结束了，父母关系没有。把孩子的事，当成一个\"合作项目\"来做。\n\n小米和前妻约定：孩子的事只在一个固定的微信群里沟通，只谈孩子；每个月第一个周日交接；孩子的大额花费，提前一周通知。运行半年，两个人几乎没有再吵过。\n\n沟通只谈孩子，用文字、固定的渠道，避免情绪化。交接简单：固定的时间、地点；有冲突时，在公共场所，第三方交接。孩子的大事一起商量：升学、医疗、搬家、出国。不在孩子面前说对方的坏话，也不把孩子当传话筒。新伴侣：在孩子面前介绍新伴侣，要循序渐进，先和前任沟通。抚养费按时支付，保留凭证。尊重对方的规则：在对方家里的规则，只要不危害孩子，就不干涉。孩子的情绪：情绪波动、成绩下滑，可能是适应离婚的反应，必要时找儿童心理咨询。出现冲突，先暂停，必要时通过调解员、律师，或申请法院介入，不在孩子面前吵。\n\n可以这样说：\n\n \"关于孩子下学期的兴趣班，我想听听你的意见，你有空时我们在群里说一下。\"\n \"这周六的接送我有点事，能不能提前一天？我可以多补一次。\"\n\n不要把对前任的怨气，转移到孩子身上。离婚后的合作，是你能给孩子的最好的礼物。\n\n法律依据：《民法典》第 1084 条、第 1086 条；《未成年人保护法》。\n\n把握度：C｜经验做法。\n\n"}, {"num": "115", "title": "再婚之前先想清：财产、孩子、赡养、继承，四条线", "grade": "A", "lead": "再婚的复杂度，通常高于初婚。财产、子女、赡养、继承四条线，婚前都要谈清。", "html": "<blockquote>再婚的复杂度，通常高于初婚。财产、子女、赡养、继承四条线，婚前都要谈清。<\/blockquote>\n<p>小黄离异，有一个 8 岁的孩子；对方也离异，有两套房。婚前他们谈了：各自的房子归各自；孩子的抚养费各自负担；新家庭的开销按收入比例；双方都立了遗嘱，指定自己的财产留给自己的子女。<\/p>\n<p><strong>财产<\/strong>：前一段婚姻的财产，分割处理完毕，没有遗留问题；各自婚前的财产清单；签婚前协议，见 <a href=\"#/e/053\">第 053 条<\/a>；对方有前婚遗留的债务，要核实。<\/p>\n<p><strong>子女<\/strong>：对前一段婚姻子女的抚养费、探望，继续履行，再婚之后，这份义务不会减少；新家庭里，对继子女的态度和责任，婚前说清；新生的子女，和已有子女之间的财产、关注的平衡；继父母与继子女的关系，见 <a href=\"#/e/117\">第 117 条<\/a>。<\/p>\n<p><strong>赡养<\/strong>：双方各自的父母；子女是否成年，是否需要继续负担。<\/p>\n<p><strong>继承<\/strong>：再婚后，配偶、前婚子女、新生子女，都是第一顺序继承人（《民法典》第 1127 条）；如果要对遗产有特殊安排，要订立遗嘱，见 <a href=\"#/e/116\">第 116 条<\/a>。<\/p>\n<p><strong>住房<\/strong>：再婚后的住所，谁的房子；对方是否有居住权，是否需要约定。<\/p>\n<p>不要急于在没有处理完前一段关系的所有问题前，就再婚。再婚，是新的开始，不是旧账的延续。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1061 条（夫妻互相继承遗产）、第 1127 条（法定继承顺序）、第 1065 条。<\/p>\n<p><strong>把握度<\/strong>：A｜继承顺序明确；具体做法是 C。<\/p>", "text": "再婚之前先想清：财产、孩子、赡养、继承，四条线 \n 再婚的复杂度，通常高于初婚。财产、子女、赡养、继承四条线，婚前都要谈清。\n\n小黄离异，有一个 8 岁的孩子；对方也离异，有两套房。婚前他们谈了：各自的房子归各自；孩子的抚养费各自负担；新家庭的开销按收入比例；双方都立了遗嘱，指定自己的财产留给自己的子女。\n\n财产：前一段婚姻的财产，分割处理完毕，没有遗留问题；各自婚前的财产清单；签婚前协议，见 第 053 条；对方有前婚遗留的债务，要核实。\n\n子女：对前一段婚姻子女的抚养费、探望，继续履行，再婚之后，这份义务不会减少；新家庭里，对继子女的态度和责任，婚前说清；新生的子女，和已有子女之间的财产、关注的平衡；继父母与继子女的关系，见 第 117 条。\n\n赡养：双方各自的父母；子女是否成年，是否需要继续负担。\n\n继承：再婚后，配偶、前婚子女、新生子女，都是第一顺序继承人（《民法典》第 1127 条）；如果要对遗产有特殊安排，要订立遗嘱，见 第 116 条。\n\n住房：再婚后的住所，谁的房子；对方是否有居住权，是否需要约定。\n\n不要急于在没有处理完前一段关系的所有问题前，就再婚。再婚，是新的开始，不是旧账的延续。\n\n法律依据：《民法典》第 1061 条（夫妻互相继承遗产）、第 1127 条（法定继承顺序）、第 1065 条。\n\n把握度：A｜继承顺序明确；具体做法是 C。\n\n"}, {"num": "116", "title": "立遗嘱、买保险：让财产按你的意思传下去", "grade": "A", "lead": "没有遗嘱，遗产按法定继承走。想让财产只给自己的孩子，要提前安排。", "html": "<blockquote>没有遗嘱，遗产按法定继承走。想让财产只给自己的孩子，要提前安排。<\/blockquote>\n<p>小闻有一套 200 万的房子，想留给自己的儿子。他没有立遗嘱。去世后，法定继承人包括妻子、儿子、父母，房子被几人分割，儿子只得到一部分。<\/p>\n<p><strong>遗产范围<\/strong>：个人合法财产。夫妻共同财产，先析产，配偶先分得一半，另一半才是遗产（《民法典》第 1153 条）。<\/p>\n<p><strong>法定继承顺序<\/strong>：第一顺序是配偶、子女、父母；第二顺序是兄弟姐妹、祖父母、外祖父母。<\/p>\n<p><strong>遗嘱<\/strong>：形式有自书、代书、打印、录音录像、口头（紧急情况）、公证。自书遗嘱，由遗嘱人亲笔书写、签名、注明年月日；代书、打印、录音录像遗嘱，要有两个以上无利害关系的见证人；公证遗嘱，效力和保存更稳妥。<\/p>\n<p><strong>遗嘱的内容<\/strong>：具体的财产名称、位置；继承人；明确\"该财产只归某某个人所有，不属于其夫妻共同财产\"。这最后一句很关键：子女继承的财产，遗嘱明确只归一方的，是个人财产；没有明确的，可能被视为夫妻共同财产。<\/p>\n<p><strong>必留份<\/strong>：遗嘱应当为缺乏劳动能力又没有生活来源的继承人，保留必要的遗产份额（第 1141 条）。<\/p>\n<p><strong>保险<\/strong>：保险金如果指定了受益人，一般不作为遗产处理，而是归受益人。可以用于传承安排，细节要咨询专业人员。<\/p>\n<p>遗嘱要定期更新。财产变化、家庭关系变化后，旧遗嘱可能不再合适。财产该留给谁，要自己说。不说，法律替你说。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1063 条、第 1123 条、第 1127 条、第 1133 条至第 1142 条、第 1153 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "立遗嘱、买保险：让财产按你的意思传下去 \n 没有遗嘱，遗产按法定继承走。想让财产只给自己的孩子，要提前安排。\n\n小闻有一套 200 万的房子，想留给自己的儿子。他没有立遗嘱。去世后，法定继承人包括妻子、儿子、父母，房子被几人分割，儿子只得到一部分。\n\n遗产范围：个人合法财产。夫妻共同财产，先析产，配偶先分得一半，另一半才是遗产（《民法典》第 1153 条）。\n\n法定继承顺序：第一顺序是配偶、子女、父母；第二顺序是兄弟姐妹、祖父母、外祖父母。\n\n遗嘱：形式有自书、代书、打印、录音录像、口头（紧急情况）、公证。自书遗嘱，由遗嘱人亲笔书写、签名、注明年月日；代书、打印、录音录像遗嘱，要有两个以上无利害关系的见证人；公证遗嘱，效力和保存更稳妥。\n\n遗嘱的内容：具体的财产名称、位置；继承人；明确\"该财产只归某某个人所有，不属于其夫妻共同财产\"。这最后一句很关键：子女继承的财产，遗嘱明确只归一方的，是个人财产；没有明确的，可能被视为夫妻共同财产。\n\n必留份：遗嘱应当为缺乏劳动能力又没有生活来源的继承人，保留必要的遗产份额（第 1141 条）。\n\n保险：保险金如果指定了受益人，一般不作为遗产处理，而是归受益人。可以用于传承安排，细节要咨询专业人员。\n\n遗嘱要定期更新。财产变化、家庭关系变化后，旧遗嘱可能不再合适。财产该留给谁，要自己说。不说，法律替你说。\n\n法律依据：《民法典》第 1062 条、第 1063 条、第 1123 条、第 1127 条、第 1133 条至第 1142 条、第 1153 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "117", "title": "继父母和继子女：什么时候要养，什么时候不用", "grade": "A", "lead": "继父母和继子女之间，有没有\"父母子女\"的权利义务，取决于有没有形成抚养教育关系。", "html": "<blockquote>继父母和继子女之间，有没有\"父母子女\"的权利义务，取决于有没有形成抚养教育关系。<\/blockquote>\n<p>小郭再婚时，对方的孩子 5 岁。他把孩子养到 18 岁，教育、生活费都出。十年后，他和孩子的母亲离婚。法律上，他和孩子之间，是否还有父母子女的关系，要看是否\"受其抚养教育\"，以及是否办过收养手续。<\/p>\n<p>《民法典》第 1072 条：继父母与继子女之间，不得虐待或者歧视；继父或者继母和受其抚养教育的继子女之间的权利义务关系，适用关于父母子女关系的规定。<\/p>\n<p>\"受其抚养教育\"，要综合考虑共同生活的时间长短，继父或继母对继子女是否实际进行了抚养教育，包括生活照料、教育、费用。<\/p>\n<p>继父母与生父母离婚后，《婚姻家庭编解释（二）》第 18 条、第 19 条的规则是：继父母与继子女的关系，一般随之终止，例外是已经通过收养手续成为养父母，或者双方仍然共同生活；继父母受继子女长期抚养、生活困难的，如果继父或继母曾经受其抚养教育，成年继子女在其有需要时，应当给付赡养费，除非该继父或继母，曾对继子女有虐待或遗弃行为。<\/p>\n<p>再婚的家庭，如果希望形成稳定的亲子关系，可以考虑办理收养手续。养了，才有义务；没养，就没有。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1072 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 18 条、第 19 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "继父母和继子女：什么时候要养，什么时候不用 \n 继父母和继子女之间，有没有\"父母子女\"的权利义务，取决于有没有形成抚养教育关系。\n\n小郭再婚时，对方的孩子 5 岁。他把孩子养到 18 岁，教育、生活费都出。十年后，他和孩子的母亲离婚。法律上，他和孩子之间，是否还有父母子女的关系，要看是否\"受其抚养教育\"，以及是否办过收养手续。\n\n《民法典》第 1072 条：继父母与继子女之间，不得虐待或者歧视；继父或者继母和受其抚养教育的继子女之间的权利义务关系，适用关于父母子女关系的规定。\n\n\"受其抚养教育\"，要综合考虑共同生活的时间长短，继父或继母对继子女是否实际进行了抚养教育，包括生活照料、教育、费用。\n\n继父母与生父母离婚后，《婚姻家庭编解释（二）》第 18 条、第 19 条的规则是：继父母与继子女的关系，一般随之终止，例外是已经通过收养手续成为养父母，或者双方仍然共同生活；继父母受继子女长期抚养、生活困难的，如果继父或继母曾经受其抚养教育，成年继子女在其有需要时，应当给付赡养费，除非该继父或继母，曾对继子女有虐待或遗弃行为。\n\n再婚的家庭，如果希望形成稳定的亲子关系，可以考虑办理收养手续。养了，才有义务；没养，就没有。\n\n法律依据：《民法典》第 1072 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 18 条、第 19 条。\n\n把握度：A｜法条明确。\n\n"}]}, {"title": "第十一章　已婚男性生存指南", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：最好的护身符，是选对人，做对事，照顾好自己。法条护得住财产，护不住日子。<br><br><strong>口诀<\/strong>：选人看模式，做事留余地，在场比给钱重要，撑不住的时候找人说。<\/blockquote>\n<p>前面十章，讲的是规则和风险。这一章回到更长的时间尺度：怎么选人，怎么平衡事业和家庭，怎么做父亲，怎么照顾自己的情绪，以及一段关系结束了，人生怎么继续。<\/p>", "entries": [{"num": "118", "title": "择偶：婚姻的底色，从选人那天就定了", "grade": "C", "lead": "婚姻里大部分矛盾，婚前就有苗头。看价值观和长期行为模式，别看单次表现。", "html": "<blockquote>婚姻里大部分矛盾，婚前就有苗头。看价值观和长期行为模式，别看单次表现。<\/blockquote>\n<p>小秦的前女友，每次遇到问题的第一反应都是\"你该怎么补偿我\"。他后来才发现，这不是某一次的情绪，而是她处理所有冲突的方式。下一个伴侣，他换了一个标准：不看对方说什么，看对方遇到分歧时怎么做。<\/p>\n<p>择偶，不是寻找完美的人，而是寻找在这几件事上，价值观能达成共识的人：钱，孩子，父母，工作，冲突怎么处理。<\/p>\n<p><strong>看行为的稳定性<\/strong>：遇到分歧，是协商，还是回避、指责；遇到压力，是承担，还是转嫁；对钱，是计划，还是冲动；对家人朋友，是尊重，还是控制。<\/p>\n<p><strong>看对待你的方式，也看对待别人的方式<\/strong>：对服务员，对父母，对前任。<\/p>\n<p><strong>看透明度<\/strong>：对重大信息的披露，愿不愿意。<strong>看边界<\/strong>：对自己的原生家庭，是否有清晰的边界。<\/p>\n<p>不要试图在婚后改造对方。成年人的底层观念、消费模式、情绪处理方式，很难短期改变。婚前识别对方的底线，判断双方解决冲突的方式，比婚后反复磨合，成本低得多。单次的争吵不能定性，持续稳定的模式，才是底色。<\/p>\n<p>最后，<strong>同样也要自查<\/strong>：你自己在这五件事上，是什么样的人？先看领证前的十个红灯，见 <a href=\"#/e/049\">第 049 条<\/a>。选对人，比后面所有招数都管用。<\/p>\n<p><strong>法律依据<\/strong>：无直接条文。<\/p>\n<p><strong>把握度<\/strong>：C｜经验判断。<\/p>", "text": "择偶：婚姻的底色，从选人那天就定了 \n 婚姻里大部分矛盾，婚前就有苗头。看价值观和长期行为模式，别看单次表现。\n\n小秦的前女友，每次遇到问题的第一反应都是\"你该怎么补偿我\"。他后来才发现，这不是某一次的情绪，而是她处理所有冲突的方式。下一个伴侣，他换了一个标准：不看对方说什么，看对方遇到分歧时怎么做。\n\n择偶，不是寻找完美的人，而是寻找在这几件事上，价值观能达成共识的人：钱，孩子，父母，工作，冲突怎么处理。\n\n看行为的稳定性：遇到分歧，是协商，还是回避、指责；遇到压力，是承担，还是转嫁；对钱，是计划，还是冲动；对家人朋友，是尊重，还是控制。\n\n看对待你的方式，也看对待别人的方式：对服务员，对父母，对前任。\n\n看透明度：对重大信息的披露，愿不愿意。看边界：对自己的原生家庭，是否有清晰的边界。\n\n不要试图在婚后改造对方。成年人的底层观念、消费模式、情绪处理方式，很难短期改变。婚前识别对方的底线，判断双方解决冲突的方式，比婚后反复磨合，成本低得多。单次的争吵不能定性，持续稳定的模式，才是底色。\n\n最后，同样也要自查：你自己在这五件事上，是什么样的人？先看领证前的十个红灯，见 第 049 条。选对人，比后面所有招数都管用。\n\n法律依据：无直接条文。\n\n把握度：C｜经验判断。\n\n"}, {"num": "119", "title": "事业越做越大，家别散了：时间、钱、风险怎么隔", "grade": "C", "lead": "事业成功不等于婚姻成功。时间要留给家庭，风险要和家庭隔离。", "html": "<blockquote>事业成功不等于婚姻成功。时间要留给家庭，风险要和家庭隔离。<\/blockquote>\n<p>小苏创业十年，公司做到了 5000 万，家里的关系却几乎破裂：他每周在家吃饭不到两次。他意识到后，开始固定每周三晚上回家，每月一天只陪孩子。关系慢慢回暖。<\/p>\n<p>事业发展需要投入大量的时间和精力，很容易挤压家庭陪伴。很多人专注事业，忽略家庭沟通，等事业稳定了，婚姻已经破裂。三样东西，要分开管：<\/p>\n<p><strong>时间<\/strong>：固定一个家庭沟通时间，每周至少一次，雷打不动；重大决策提前沟通：换工作、创业、搬家、大额投资；避免长期缺席：孩子的重要节点，家人的生日、住院。<\/p>\n<p><strong>钱<\/strong>：个人经营、创业与家庭账户分开；对外借款、担保，提前和配偶沟通；公司的债务，不让它无限延伸到家庭；必要时，通过婚内协议或婚前协议，明确经营性资产的归属。<\/p>\n<p><strong>风险<\/strong>：经营性风险（诉讼、债务、担保）和家庭资产尽量分开；保险：重大疾病、意外、人寿，保障家庭的基本盘；不要以家庭房产为公司融资提供抵押，除非有充分的评估。<\/p>\n<p>事业低谷期，要把情况告诉家人，不要隐瞒。隐瞒债务、亏损，往往是婚姻出现裂痕的开始。以\"为了这个家\"为理由，忽略了家庭本身的需要，是最常见的自我欺骗。事业是你的，家也是你的，别让一个压垮另一个。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1064 条；《公司法》第 23 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "事业越做越大，家别散了：时间、钱、风险怎么隔 \n 事业成功不等于婚姻成功。时间要留给家庭，风险要和家庭隔离。\n\n小苏创业十年，公司做到了 5000 万，家里的关系却几乎破裂：他每周在家吃饭不到两次。他意识到后，开始固定每周三晚上回家，每月一天只陪孩子。关系慢慢回暖。\n\n事业发展需要投入大量的时间和精力，很容易挤压家庭陪伴。很多人专注事业，忽略家庭沟通，等事业稳定了，婚姻已经破裂。三样东西，要分开管：\n\n时间：固定一个家庭沟通时间，每周至少一次，雷打不动；重大决策提前沟通：换工作、创业、搬家、大额投资；避免长期缺席：孩子的重要节点，家人的生日、住院。\n\n钱：个人经营、创业与家庭账户分开；对外借款、担保，提前和配偶沟通；公司的债务，不让它无限延伸到家庭；必要时，通过婚内协议或婚前协议，明确经营性资产的归属。\n\n风险：经营性风险（诉讼、债务、担保）和家庭资产尽量分开；保险：重大疾病、意外、人寿，保障家庭的基本盘；不要以家庭房产为公司融资提供抵押，除非有充分的评估。\n\n事业低谷期，要把情况告诉家人，不要隐瞒。隐瞒债务、亏损，往往是婚姻出现裂痕的开始。以\"为了这个家\"为理由，忽略了家庭本身的需要，是最常见的自我欺骗。事业是你的，家也是你的，别让一个压垮另一个。\n\n法律依据：《民法典》第 1064 条；《公司法》第 23 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "120", "title": "做个在场的父亲：陪伴也是最好的证据", "grade": "C", "lead": "父亲的角色，核心是持续陪伴，不是只提供物质。陪伴也是日后法律上最有力的证据。", "html": "<blockquote>父亲的角色，核心是持续陪伴，不是只提供物质。陪伴也是日后法律上最有力的证据。<\/blockquote>\n<p>小窦每周六全天陪孩子，周三接孩子放学，每次孩子生病他都去医院。三年后，夫妻离婚，他争取孩子的抚养权。幼儿园老师、儿科医生、小区邻居，都愿意证明他是\"常来的那个爸爸\"。<\/p>\n<p>亲子关系的核心，是持续稳定的陪伴，不是单纯的物质供给。高质量的陪伴，不在于单次时间很长，而在于稳定、持续。<\/p>\n<p>做到这几点：固定的陪伴时间，每天、每周的，哪怕每次短，也要持续；参与关键事务：接送、体检、疫苗、家长会、兴趣班、住院；熟悉孩子，知道孩子的老师、朋友、喜好、习惯。<\/p>\n<p><strong>记录<\/strong>不是为了\"收集证据\"，而是自然留存：照片，家长群的沟通，就医记录，接送记录。这些在抚养权纠纷里，会成为重要的证据，见 <a href=\"#/e/106\">第 106 条<\/a>。<\/p>\n<p>离婚之后：按约定探望；抚养费按时支付，保留凭证；不在孩子面前贬低对方；不把孩子当传话筒；对孩子的情绪变化，保持关注。<\/p>\n<p><strong>和孩子谈离婚<\/strong>：简单，真诚，不推责任。告诉孩子：这不是你的错；爸爸妈妈都爱你；你的生活安排是怎样的。<\/p>\n<p><strong>可以这样说<\/strong>（对孩子）：<\/p>\n<ul><li>\"爸爸妈妈决定不住在一起了，这不是你的错。爸爸和妈妈都很爱你，这一点不会变。以后你有一些时间和妈妈住，一些时间和爸爸住，我们会提前告诉你。\"\n<\/li><\/ul>\n<p>不要在孩子面前和对方争吵、贬低对方，这会伤害孩子，也会在诉讼里对你不利。做一个\"常在的\"父亲，比做一个\"给钱的\"父亲，难，也值。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1084 条、第 1086 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "做个在场的父亲：陪伴也是最好的证据 \n 父亲的角色，核心是持续陪伴，不是只提供物质。陪伴也是日后法律上最有力的证据。\n\n小窦每周六全天陪孩子，周三接孩子放学，每次孩子生病他都去医院。三年后，夫妻离婚，他争取孩子的抚养权。幼儿园老师、儿科医生、小区邻居，都愿意证明他是\"常来的那个爸爸\"。\n\n亲子关系的核心，是持续稳定的陪伴，不是单纯的物质供给。高质量的陪伴，不在于单次时间很长，而在于稳定、持续。\n\n做到这几点：固定的陪伴时间，每天、每周的，哪怕每次短，也要持续；参与关键事务：接送、体检、疫苗、家长会、兴趣班、住院；熟悉孩子，知道孩子的老师、朋友、喜好、习惯。\n\n记录不是为了\"收集证据\"，而是自然留存：照片，家长群的沟通，就医记录，接送记录。这些在抚养权纠纷里，会成为重要的证据，见 第 106 条。\n\n离婚之后：按约定探望；抚养费按时支付，保留凭证；不在孩子面前贬低对方；不把孩子当传话筒；对孩子的情绪变化，保持关注。\n\n和孩子谈离婚：简单，真诚，不推责任。告诉孩子：这不是你的错；爸爸妈妈都爱你；你的生活安排是怎样的。\n\n可以这样说（对孩子）：\n\n \"爸爸妈妈决定不住在一起了，这不是你的错。爸爸和妈妈都很爱你，这一点不会变。以后你有一些时间和妈妈住，一些时间和爸爸住，我们会提前告诉你。\"\n\n不要在孩子面前和对方争吵、贬低对方，这会伤害孩子，也会在诉讼里对你不利。做一个\"常在的\"父亲，比做一个\"给钱的\"父亲，难，也值。\n\n法律依据：《民法典》第 1084 条、第 1086 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "121", "title": "打官司、办离婚的日子里，先照顾好你自己", "grade": "C", "lead": "婚恋纠纷期间，情绪问题比法律问题来得更早，也更容易被忽视。男性尤其倾向于不说，不求助。", "html": "<blockquote>婚恋纠纷期间，情绪问题比法律问题来得更早，也更容易被忽视。男性尤其倾向于不说，不求助。<\/blockquote>\n<p>小范在离婚诉讼的半年里，失眠、酗酒、工作失误频出，他一直觉得\"自己撑得住\"。一次酒后与对方冲突，被报警，才发现情绪已经影响了他的判断。后来他去看了心理门诊，状态才慢慢恢复。<\/p>\n<p>先认识信号：失眠，食欲变化，长期情绪低落；工作无法集中；酗酒，依赖药物；出现自责、绝望，\"不如算了\"的想法。<\/p>\n<p>日常的自我照顾：固定作息，运动；保持和朋友的联系；限制酒精；减少反复翻看对方的社交账号和聊天记录。<\/p>\n<p>专业支持：当地的精神卫生中心、综合医院的心理科、心理门诊；有资质的心理咨询师；全国统一心理援助热线 12356，公益、免费，2025 年 5 月 1 日前已在全国 31 个省份开通，主要提供心理疏导和危机干预；需要系统诊断和治疗，要去专业的精神卫生机构。有自伤、自杀的想法，或身边的人有，立刻拨打 110、120，或到最近医院的急诊。<\/p>\n<p>对身边遇到类似情况的朋友，主动问一句：\"你最近怎么样？\"不评判，不劝\"想开点\"，陪着，必要时帮他联系专业支持。在诉讼期间，不在情绪最低的时候做决定，把重要的决定放在状态较稳定的时候，找一个可以说话的人。<\/p>\n<p>\"男人不能示弱\"，不是事实。求助不是示弱。你不是铁打的，撑不住的时候，找个人说。<\/p>\n<p><strong>法律依据<\/strong>：《精神卫生法》。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "打官司、办离婚的日子里，先照顾好你自己 \n 婚恋纠纷期间，情绪问题比法律问题来得更早，也更容易被忽视。男性尤其倾向于不说，不求助。\n\n小范在离婚诉讼的半年里，失眠、酗酒、工作失误频出，他一直觉得\"自己撑得住\"。一次酒后与对方冲突，被报警，才发现情绪已经影响了他的判断。后来他去看了心理门诊，状态才慢慢恢复。\n\n先认识信号：失眠，食欲变化，长期情绪低落；工作无法集中；酗酒，依赖药物；出现自责、绝望，\"不如算了\"的想法。\n\n日常的自我照顾：固定作息，运动；保持和朋友的联系；限制酒精；减少反复翻看对方的社交账号和聊天记录。\n\n专业支持：当地的精神卫生中心、综合医院的心理科、心理门诊；有资质的心理咨询师；全国统一心理援助热线 12356，公益、免费，2025 年 5 月 1 日前已在全国 31 个省份开通，主要提供心理疏导和危机干预；需要系统诊断和治疗，要去专业的精神卫生机构。有自伤、自杀的想法，或身边的人有，立刻拨打 110、120，或到最近医院的急诊。\n\n对身边遇到类似情况的朋友，主动问一句：\"你最近怎么样？\"不评判，不劝\"想开点\"，陪着，必要时帮他联系专业支持。在诉讼期间，不在情绪最低的时候做决定，把重要的决定放在状态较稳定的时候，找一个可以说话的人。\n\n\"男人不能示弱\"，不是事实。求助不是示弱。你不是铁打的，撑不住的时候，找个人说。\n\n法律依据：《精神卫生法》。\n\n把握度：C｜经验做法。\n\n"}, {"num": "122", "title": "找律师、找法援、找调解：怎么找，怎么不被坑", "grade": "C", "lead": "找人要看资质、看经验、看收费方式、看沟通是否清晰。免费渠道可以先用。越是靠让你焦虑来卖东西的，越要先捂紧钱包。", "html": "<blockquote>找人要看资质、看经验、看收费方式、看沟通是否清晰。免费渠道可以先用。越是靠让你焦虑来卖东西的，越要先捂紧钱包。<\/blockquote>\n<p>小施第一次咨询律师，带了一页纸：时间线、财产清单、证据清单、他想要的结果、想问的 5 个问题。律师用了 40 分钟，给了他一个清晰的方向，他后来决定自己先做一轮协商，而不是直接起诉。<\/p>\n<p><strong>免费渠道<\/strong>：12348 全国法律援助热线；当地法律援助中心，符合经济困难条件，可以申请；法院诉讼服务中心，咨询程序性问题；司法所、人民调解委员会，调解婚姻纠纷；公证处，财产协议的公证。<\/p>\n<p><strong>找律师<\/strong>：查执业证，司法部\"中国法律服务网\"、当地律协；看专业方向，是否做过婚姻家事案件，最好在本地有办案经验；第一次咨询，准备好时间线、财产清单、证据、想要的结果；收费方式，按小时、按件、按标的比例、风险代理，书面约定。<\/p>\n<p>第一次咨询，可以问五个问题：按我现在的情况，你觉得可能的结果大概是什么？我手里的证据，哪些有用，还缺什么？如果我自己先协商，要注意什么？整个流程大概要多久，总共多少费用？你觉得我最大的风险在哪里？<\/p>\n<p><strong>调解<\/strong>：成本低，速度快，关系伤害小，可以优先试；调解协议可以申请司法确认，具有强制执行力（《人民调解法》第 33 条）。<\/p>\n<p><strong>警惕被收割<\/strong>。网上卖\"男性婚姻秘籍\"\"离婚攻略\"的，很多是靠制造焦虑来赚钱：先看有没有可核对的法条；看是不是把情绪当结论，大量使用\"毒打\"\"净身出户\"\"必须让对方付出代价\"之类的词；承诺\"包赢\"；要求先交大额的\"咨询费\"\"资料费\"；风险代理比例过高的，要看清合同里\"胜诉\"的定义。不是所有付费资料都没价值，判断标准是：能不能逐条核对依据。<\/p>\n<p>对律师，要诚实：披露所有事实，包括对你不利的。不要因为担心\"丢人\"，而不对律师说实话。找对人，比找贵人重要。<\/p>\n<p><strong>法律依据<\/strong>：《律师法》；《法律援助法》；《人民调解法》第 33 条（司法确认）。；《律师服务收费管理办法》；《民法典》第 509 条（诚实信用）。<\/p>\n<p><strong>把握度<\/strong>：C｜渠道明确；选择建议是 C。<\/p>", "text": "找律师、找法援、找调解：怎么找，怎么不被坑 \n 找人要看资质、看经验、看收费方式、看沟通是否清晰。免费渠道可以先用。越是靠让你焦虑来卖东西的，越要先捂紧钱包。\n\n小施第一次咨询律师，带了一页纸：时间线、财产清单、证据清单、他想要的结果、想问的 5 个问题。律师用了 40 分钟，给了他一个清晰的方向，他后来决定自己先做一轮协商，而不是直接起诉。\n\n免费渠道：12348 全国法律援助热线；当地法律援助中心，符合经济困难条件，可以申请；法院诉讼服务中心，咨询程序性问题；司法所、人民调解委员会，调解婚姻纠纷；公证处，财产协议的公证。\n\n找律师：查执业证，司法部\"中国法律服务网\"、当地律协；看专业方向，是否做过婚姻家事案件，最好在本地有办案经验；第一次咨询，准备好时间线、财产清单、证据、想要的结果；收费方式，按小时、按件、按标的比例、风险代理，书面约定。\n\n第一次咨询，可以问五个问题：按我现在的情况，你觉得可能的结果大概是什么？我手里的证据，哪些有用，还缺什么？如果我自己先协商，要注意什么？整个流程大概要多久，总共多少费用？你觉得我最大的风险在哪里？\n\n调解：成本低，速度快，关系伤害小，可以优先试；调解协议可以申请司法确认，具有强制执行力（《人民调解法》第 33 条）。\n\n警惕被收割。网上卖\"男性婚姻秘籍\"\"离婚攻略\"的，很多是靠制造焦虑来赚钱：先看有没有可核对的法条；看是不是把情绪当结论，大量使用\"毒打\"\"净身出户\"\"必须让对方付出代价\"之类的词；承诺\"包赢\"；要求先交大额的\"咨询费\"\"资料费\"；风险代理比例过高的，要看清合同里\"胜诉\"的定义。不是所有付费资料都没价值，判断标准是：能不能逐条核对依据。\n\n对律师，要诚实：披露所有事实，包括对你不利的。不要因为担心\"丢人\"，而不对律师说实话。找对人，比找贵人重要。\n\n法律依据：《律师法》；《法律援助法》；《人民调解法》第 33 条（司法确认）。；《律师服务收费管理办法》；《民法典》第 509 条（诚实信用）。\n\n把握度：C｜渠道明确；选择建议是 C。\n\n"}, {"num": "123", "title": "离婚了，人生没完", "grade": "C", "lead": "一段关系结束，是一件事，不是对一个人整体价值的判决。", "html": "<blockquote>一段关系结束，是一件事，不是对一个人整体价值的判决。<\/blockquote>\n<p>小秦离婚后的第一年，工作、健康、关系都差。第二年，他开始每周跑步、每月见一次朋友、每周末陪孩子。第三年，他重新有了稳定的生活，也慢慢有了新的关系。<\/p>\n<p>怎么走出来？<\/p>\n<p><strong>接受损失。<\/strong> 钱，时间，感情，都是真实的损失。允许自己难过一段时间。<\/p>\n<p><strong>回看，不是追责。<\/strong> 这一段关系里，你学到了什么：你的边界在哪里，你的盲区在哪里，你需要什么。<\/p>\n<p><strong>守住底线。<\/strong> 法律的底线：不违法，不报复；人格的底线：不贬低自己，也不贬低对方。<\/p>\n<p><strong>重建生活。<\/strong> 工作，健康，朋友，兴趣；和孩子的关系；财务重新规划。<\/p>\n<p><strong>关于下一段关系。<\/strong> 不要关上心门，也不用急着开启；带着对规则的认识，而不是带着对对方的怀疑，去开始。<\/p>\n<p>真诚与理性，可以同时存在。善意不需要裸奔，真诚可以搭配自我保护。别急着给这段经历下结论，给自己留出时间。<\/p>\n<p>输了一段关系，不等于输了一生。<\/p>\n<p><strong>法律依据<\/strong>：无直接条文，属于经验判断。<\/p>\n<p><strong>把握度<\/strong>：C｜经验判断。<\/p>", "text": "离婚了，人生没完 \n 一段关系结束，是一件事，不是对一个人整体价值的判决。\n\n小秦离婚后的第一年，工作、健康、关系都差。第二年，他开始每周跑步、每月见一次朋友、每周末陪孩子。第三年，他重新有了稳定的生活，也慢慢有了新的关系。\n\n怎么走出来？\n\n接受损失。 钱，时间，感情，都是真实的损失。允许自己难过一段时间。\n\n回看，不是追责。 这一段关系里，你学到了什么：你的边界在哪里，你的盲区在哪里，你需要什么。\n\n守住底线。 法律的底线：不违法，不报复；人格的底线：不贬低自己，也不贬低对方。\n\n重建生活。 工作，健康，朋友，兴趣；和孩子的关系；财务重新规划。\n\n关于下一段关系。 不要关上心门，也不用急着开启；带着对规则的认识，而不是带着对对方的怀疑，去开始。\n\n真诚与理性，可以同时存在。善意不需要裸奔，真诚可以搭配自我保护。别急着给这段经历下结论，给自己留出时间。\n\n输了一段关系，不等于输了一生。\n\n法律依据：无直接条文，属于经验判断。\n\n把握度：C｜经验判断。\n\n"}]}], "pages": [{"id": "序言", "label": "序言", "html": "<h2>序言：吃了亏，为什么总是说不出口<\/h2>\n<p>这本书写给一类人：在恋爱里愿意付出，在婚姻里愿意负责，从来没想过自己会走到法庭上的普通男人。<\/p>\n<p>他们不坏，也不傻。可是转了钱，备注写的是\"爱你\"，分手后法院问这是借的还是送的，说不清。同居五年，以为财产自然是共同的，分开才知道法律上没有这回事。婚前买的房，婚后一起还了几年贷款，离婚时要补偿对方一笔钱，事先没人告诉过他。吵了一架被报警，才发现手里没有一份能证明自己的东西。<\/p>\n<p>等事情发生了，才第一次翻法条。<\/p>\n<h3>为什么这样的人，总在吃亏<\/h3>\n<p>不是因为他们运气差。常见的原因有三个。<\/p>\n<p><strong>第一，没人教过。<\/strong> 钱的性质怎么分，同居和婚姻的财产规则有什么不同，哪些举动会碰上刑法，这些在学校里没有，在家里也没有。这是信息差，不是人品问题。<\/p>\n<p><strong>第二，开不了口。<\/strong> 谈钱像不信任，留证据像算计，提协议像\"还没结婚就防着我\"。于是什么都靠口头和默契，一旦翻脸，口头约定在法庭上是空的。<\/p>\n<p><strong>第三，一句话把人堵住了：男人就该多承担。<\/strong> 这句话从恋爱渗到离婚。转账时不好意思写字据，因为\"男人哪能斤斤计较\"；被打了不好意思报警，因为\"说出去丢人\"；被冤枉了不知道向谁说，因为\"你一个男人\"；吃了亏也不好意思讲，因为\"大丈夫\"。<\/p>\n<p>承担是一种美德，但承担不等于不看规则。一个人可以大方，同时看得清楚。<\/p>\n<p>吃了亏，说不出口，就成了<strong>哑巴亏<\/strong>。这本书想做的，是让你在出事之前，就把规则看清楚，不吃这种亏。<\/p>\n<h3>先说清楚三件事<\/h3>\n<p><strong>一、法律不替谁撑腰，也不替谁设坑。<\/strong> 绝大多数规则是对等的：夫妻共同财产、共同债务、家暴、彩礼返还、扶养义务，男女适用同一套。但有几处，法律有明文的不同，你应该提前知道：<\/p>\n<div class='tw'><table><thead><tr><th>规则<\/th><th>内容<\/th><th>哪一篇<\/th><\/tr><\/thead><tbody><tr><td>两周岁以下的孩子<\/td><td>原则上由母亲直接抚养，父亲有例外情形可以争取<\/td><td><a href=\"#/e/106\">第 106 条<\/a><\/td><\/tr><tr><td>怀孕期间的离婚<\/td><td>女方怀孕期间、分娩后一年内、终止妊娠后六个月内，男方不能提出离婚（有例外）<\/td><td><a href=\"#/e/078\">第 078 条<\/a><\/td><\/tr><tr><td>离婚时的财产<\/td><td>法院分割时\"照顾子女、女方和无过错方权益\"，这是价值导向，不是固定倾斜<\/td><td><a href=\"#/e/100\">第 100 条<\/a><\/td><\/tr><tr><td>强奸罪<\/td><td>被害人是妇女；强制猥亵罪不限性别<\/td><td><a href=\"#/e/018\">第 018 条<\/a><\/td><\/tr><tr><td>家庭暴力<\/td><td>不分性别，男性同样受保护<\/td><td><a href=\"#/e/026\">第 026 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>二、吃亏常常不是因为理亏，是因为没证据。<\/strong> 法院审案，不看谁更委屈，只看谁拿得出东西。所以这本书里，\"怎么留证据\"出现的次数，比\"怎么吵赢\"多得多。<\/p>\n<p><strong>三、自保不是算计。<\/strong> 这本书不教转移财产，不教藏钱，不教诬告和威胁。那些做法法院一查一个准，最后吃亏的是做的人。它教的是：识别风险、保存证据、走合法的路，并且告诉你，哪些看着像自保的做法，其实会让你吃大亏。<\/p>\n<h3>这本书想让你做到什么<\/h3>\n<ul><li>转账之前，知道这笔钱会被当成什么，并且留得下证据；\n<\/li><li>领证之前，知道要问哪些问题，签哪些协议，怎么开口；\n<\/li><li>出事之时，知道先做什么，千万别做什么；\n<\/li><li>官司面前，知道法官看什么，你手里该有什么；\n<\/li><li>以及，无论结局怎样，都还是一个能好好生活、好好爱人的人。\n<\/li><\/ul>\n<h3>怎么用<\/h3>\n<p><strong>事情已经发生了，没时间读。<\/strong> 先翻《救急卡》，八种紧急情况，每种只有三栏：现在立刻做、千万别做、接着看哪几篇。<\/p>\n<p><strong>不知道该看哪一篇。<\/strong> 翻《场景速查》，按阶段和遭遇找。<\/p>\n<p><strong>想系统地读。<\/strong> 先背<a href=\"#/e/001\">第 001 条<\/a>那四句话，再按阶段挑着读。这本书是备选清单，不是任务清单，没人需要把每一条都做完。<\/p>\n<ul><li>还在恋爱：第一、二、三章\n<\/li><li>准备结婚：第四、五、六章。婚前沟通问卷和婚前协议，是性价比最高的两张纸\n<\/li><li>已经结婚：第六、七章，再看第八章的\"婚姻亮红灯\"\n<\/li><li>正在离婚：第八、九、十章，配合附录里的文书模板\n<\/li><\/ul>\n<h3>每一篇长什么样<\/h3>\n<p>每一篇是一篇文章：开头一句话点破结论，接着常常用一个例子讲清楚这件事，再讲规则和道理、具体怎么做，最后落一个判断。末尾有两行固定的页脚：<\/p>\n<div class='tw'><table><thead><tr><th>页脚<\/th><th>说的是什么<\/th><\/tr><\/thead><tbody><tr><td>法律依据<\/td><td>法条、司法解释的名称和条号。想核对的，可以直接去查<\/td><\/tr><tr><td>把握度<\/td><td>A、B、C 三档，见下文<\/td><\/tr><\/tbody><\/table><\/div>\n<p>文章里还有三样东西，值得说明：<\/p>\n<ul><li><strong>用\"小林\"\"小周\"这类名字讲的例子<\/strong>：人物和金额是我虚构的，只为说明规则，不对应真实的人。\n<\/li><li><strong>\"可以这样说\"<\/strong>：可以直接用的话、可以照着写的文字。全书的这类话术，汇总在《话术手册》里。\n<\/li><li><strong>真实案例<\/strong>：只来自最高人民法院公开发布的材料，一共 13 个，集中在附录 O，文章里相关的位置，会直接写明。\n<\/li><\/ul>\n<p>每一章开头，还有一段\"这一章想让你想明白的事\"和一句口诀。全书的口诀合成一页，是《口诀卡》。<\/p>\n<h4>\"把握度\"怎么看<\/h4>\n<p>法律问题不像医学，没有\"随机对照试验\"。这里的把握度，看的是结论有多稳：<\/p>\n<ul><li><strong>A：条文明确。<\/strong> 法条或司法解释有明文规定，结论基本不看地区。\n<\/li><li><strong>B：实务主流，各地不同。<\/strong> 条文只定了原则，比例、金额、口径由法院裁量，不同法院可能判得不一样。\n<\/li><li><strong>C：经验之谈。<\/strong> 不是法律规定，是为了少踩坑总结的做法。\n<\/li><\/ul>\n<p>标了 A，不等于你一定赢。它只是说，规则本身是明确的，结果还要看你有没有证据。<\/p>\n<h4>关于\"待核实\"<\/h4>\n<p>书里的法条，以 2026 年 10 月为核对时点。有些细节，我没能在官方文本里核对到，就直接写了\"待核实\"，不凭记忆写。<\/p>\n<h3>几句提醒<\/h3>\n<ul><li>法会修订，各地法院口径不同。动手之前，到最高人民法院官网、国家法律法规数据库查一下最新条文，再问问本地的律师。\n<\/li><li>书里的金额、期限，以官方当时公布的为准。\n<\/li><li>刑事案件、金额大的案件、孩子抚养的案件，直接找执业律师。<a href=\"#/e/122\">第 122 条<\/a> 写了怎么找。\n<\/li><li>如遇紧急危险，先拨 110、120。\n<\/li><li>书里任何一篇，都不该让你去做违法的事。如果哪一篇读起来像是在让你这么做，那是我写得不够清楚。请以\"不违法\"为前提理解。\n<\/li><\/ul>\n<p>法律不会因为性别偏向谁，但不懂规则的人，常常吃亏。看清了规则，不会毁掉感情。它只是让你的真诚，有一个更稳的底座。<\/p>", "text": "# 序言：吃了亏，为什么总是说不出口\n\n这本书写给一类人：在恋爱里愿意付出，在婚姻里愿意负责，从来没想过自己会走到法庭上的普通男人。\n\n他们不坏，也不傻。可是转了钱，备注写的是\"爱你\"，分手后法院问这是借的还是送的，说不清。同居五年，以为财产自然是共同的，分开才知道法律上没有这回事。婚前买的房，婚后一起还了几年贷款，离婚时要补偿对方一笔钱，事先没人告诉过他。吵了一架被报警，才发现手里没有一份能证明自己的东西。\n\n等事情发生了，才第一次翻法条。\n\n## 为什么这样的人，总在吃亏\n\n不是因为他们运气差。常见的原因有三个。\n\n**第一，没人教过。** 钱的性质怎么分，同居和婚姻的财产规则有什么不同，哪些举动会碰上刑法，这些在学校里没有，在家里也没有。这是信息差，不是人品问题。\n\n**第二，开不了口。** 谈钱像不信任，留证据像算计，提协议像\"还没结婚就防着我\"。于是什么都靠口头和默契，一旦翻脸，口头约定在法庭上是空的。\n\n**第三，一句话把人堵住了：男人就该多承担。** 这句话从恋爱渗到离婚。转账时不好意思写字据，因为\"男人哪能斤斤计较\"；被打了不好意思报警，因为\"说出去丢人\"；被冤枉了不知道向谁说，因为\"你一个男人\"；吃了亏也不好意思讲，因为\"大丈夫\"。\n\n承担是一种美德，但承担不等于不看规则。一个人可以大方，同时看得清楚。\n\n吃了亏，说不出口，就成了**哑巴亏**。这本书想做的，是让你在出事之前，就把规则看清楚，不吃这种亏。\n\n## 先说清楚三件事\n\n**一、法律不替谁撑腰，也不替谁设坑。** 绝大多数规则是对等的：夫妻共同财产、共同债务、家暴、彩礼返还、扶养义务，男女适用同一套。但有几处，法律有明文的不同，你应该提前知道：\n\n| 规则 | 内容 | 哪一篇 |\n|---|---|---|\n| 两周岁以下的孩子 | 原则上由母亲直接抚养，父亲有例外情形可以争取 | 第 106 条 |\n| 怀孕期间的离婚 | 女方怀孕期间、分娩后一年内、终止妊娠后六个月内，男方不能提出离婚（有例外） | 第 078 条 |\n| 离婚时的财产 | 法院分割时\"照顾子女、女方和无过错方权益\"，这是价值导向，不是固定倾斜 | 第 100 条 |\n| 强奸罪 | 被害人是妇女；强制猥亵罪不限性别 | 第 018 条 |\n| 家庭暴力 | 不分性别，男性同样受保护 | 第 026 条 |\n\n**二、吃亏常常不是因为理亏，是因为没证据。** 法院审案，不看谁更委屈，只看谁拿得出东西。所以这本书里，\"怎么留证据\"出现的次数，比\"怎么吵赢\"多得多。\n\n**三、自保不是算计。** 这本书不教转移财产，不教藏钱，不教诬告和威胁。那些做法法院一查一个准，最后吃亏的是做的人。它教的是：识别风险、保存证据、走合法的路，并且告诉你，哪些看着像自保的做法，其实会让你吃大亏。\n\n## 这本书想让你做到什么\n\n- 转账之前，知道这笔钱会被当成什么，并且留得下证据；\n- 领证之前，知道要问哪些问题，签哪些协议，怎么开口；\n- 出事之时，知道先做什么，千万别做什么；\n- 官司面前，知道法官看什么，你手里该有什么；\n- 以及，无论结局怎样，都还是一个能好好生活、好好爱人的人。\n\n## 怎么用\n\n**事情已经发生了，没时间读。** 先翻《救急卡》，八种紧急情况，每种只有三栏：现在立刻做、千万别做、接着看哪几篇。\n\n**不知道该看哪一篇。** 翻《场景速查》，按阶段和遭遇找。\n\n**想系统地读。** 先背第 001 条那四句话，再按阶段挑着读。这本书是备选清单，不是任务清单，没人需要把每一条都做完。\n\n- 还在恋爱：第一、二、三章\n- 准备结婚：第四、五、六章。婚前沟通问卷和婚前协议，是性价比最高的两张纸\n- 已经结婚：第六、七章，再看第八章的\"婚姻亮红灯\"\n- 正在离婚：第八、九、十章，配合附录里的文书模板\n\n## 每一篇长什么样\n\n每一篇是一篇文章：开头一句话点破结论，接着常常用一个例子讲清楚这件事，再讲规则和道理、具体怎么做，最后落一个判断。末尾有两行固定的页脚：\n\n| 页脚 | 说的是什么 |\n|---|---|\n| 法律依据 | 法条、司法解释的名称和条号。想核对的，可以直接去查 |\n| 把握度 | A、B、C 三档，见下文 |\n\n文章里还有三样东西，值得说明：\n\n- **用\"小林\"\"小周\"这类名字讲的例子**：人物和金额是我虚构的，只为说明规则，不对应真实的人。\n- **\"可以这样说\"**：可以直接用的话、可以照着写的文字。全书的这类话术，汇总在《话术手册》里。\n- **真实案例**：只来自最高人民法院公开发布的材料，一共 13 个，集中在附录 O，文章里相关的位置，会直接写明。\n\n每一章开头，还有一段\"这一章想让你想明白的事\"和一句口诀。全书的口诀合成一页，是《口诀卡》。\n\n### \"把握度\"怎么看\n\n法律问题不像医学，没有\"随机对照试验\"。这里的把握度，看的是结论有多稳：\n\n- **A：条文明确。** 法条或司法解释有明文规定，结论基本不看地区。\n- **B：实务主流，各地不同。** 条文只定了原则，比例、金额、口径由法院裁量，不同法院可能判得不一样。\n- **C：经验之谈。** 不是法律规定，是为了少踩坑总结的做法。\n\n标了 A，不等于你一定赢。它只是说，规则本身是明确的，结果还要看你有没有证据。\n\n### 关于\"待核实\"\n\n书里的法条，以 2026 年 10 月为核对时点。有些细节，我没能在官方文本里核对到，就直接写了\"待核实\"，不凭记忆写。\n\n## 几句提醒\n\n- 法会修订，各地法院口径不同。动手之前，到最高人民法院官网、国家法律法规数据库查一下最新条文，再问问本地的律师。\n- 书里的金额、期限，以官方当时公布的为准。\n- 刑事案件、金额大的案件、孩子抚养的案件，直接找执业律师。第 122 条 写了怎么找。\n- 如遇紧急危险，先拨 110、120。\n- 书里任何一篇，都不该让你去做违法的事。如果哪一篇读起来像是在让你这么做，那是我写得不够清楚。请以\"不违法\"为前提理解。\n\n法律不会因为性别偏向谁，但不懂规则的人，常常吃亏。看清了规则，不会毁掉感情。它只是让你的真诚，有一个更稳的底座。\n"}, {"id": "救急卡", "label": "救急卡", "html": "<h2>救急卡：八种紧急情况，先看这个<\/h2>\n<p>事情已经发生了，没有时间从头读。每张卡只有三栏：现在立刻做、千万别做、接着看哪几条。<\/p>\n<hr>\n<h3>一、警察来电话了，或者被带到派出所<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>问清楚：哪个单位、什么案由、需要你做什么；要求出示证件。\n<\/li><li>马上联系律师，或让家人帮忙联系。没有律师，拨 12348。\n<\/li><li>只说你确定的事实，不确定的说\"不确定\"。\n<\/li><li>笔录没看完不签；有错的当场要求更正。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>删除聊天记录、销毁手机里的东西；\n<\/li><li>私下联系对方\"商量一下\"、转钱让对方撤案；\n<\/li><li>为了早点出来，承认没做过的事。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/021\">第 021 条<\/a>、<a href=\"#/e/020\">第 020 条<\/a>、<a href=\"#/e/018\">第 018 条<\/a><\/p>\n<hr>\n<h3>二、被人拿隐私、照片、\"报警\"威胁要钱<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>截图、录屏、保存对方所有的威胁内容，并备份。\n<\/li><li>不转账、不答应任何条件。\n<\/li><li>报警，把证据交给警方。\n<\/li><li>平台上有传播的，向平台投诉，要求删除。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>转钱\"了事\"（对方往往会加码）；\n<\/li><li>用同样的方式反过来威胁对方；\n<\/li><li>在群里、朋友圈公开回应。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/023\">第 023 条<\/a>、<a href=\"#/e/027\">第 027 条<\/a>、<a href=\"#/e/024\">第 024 条<\/a><\/p>\n<hr>\n<h3>三、遭遇家庭暴力（男女都一样）<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>先保证安全：离开现场，去亲友家或公共场所。\n<\/li><li>报警，要求出警记录和告诫书。\n<\/li><li>去医院验伤，保留病历、照片、验伤报告。\n<\/li><li>保存聊天记录、威胁语音、监控。\n<\/li><li>向法院申请人身安全保护令，法院应在 72 小时内作出裁定。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>反击到对方受重伤；\n<\/li><li>因为\"男人被打丢人\"就忍着、不留证据。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/026\">第 026 条<\/a>、<a href=\"#/e/077\">第 077 条<\/a>，申请书范本见附录 L<\/p>\n<hr>\n<h3>四、孩子被对方带走、藏起来了<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>立即报警，告诉警方孩子被带走的时间、经过、最后的位置。\n<\/li><li>保存聊天记录、通话记录、孩子学校的出勤记录。\n<\/li><li>向法院申请人格权侵害禁令，说明情况紧迫。\n<\/li><li>联系律师。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>自己冲到对方家里抢孩子；\n<\/li><li>同样把孩子藏起来；\n<\/li><li>在孩子面前和对方争吵。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/109\">第 109 条<\/a>、<a href=\"#/e/106\">第 106 条<\/a>，申请书范本见附录 K<\/p>\n<hr>\n<h3>五、发现对方在转移、变卖财产<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>保存你看到的转账记录、合同、聊天。\n<\/li><li>马上咨询律师：是否可以申请财产保全（冻结账户、查封房产）。\n<\/li><li>核对房产、车辆的登记信息，看有没有变动。\n<\/li><li>暂时不要转移自己的财产，也不要签任何文件。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>偷对方的手机、网银密码；\n<\/li><li>自己也跟着转移财产。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/103\">第 103 条<\/a>、<a href=\"#/e/102\">第 102 条<\/a>、<a href=\"#/e/101\">第 101 条<\/a>、<a href=\"#/e/063\">第 063 条<\/a><\/p>\n<hr>\n<h3>六、收到法院的起诉状、传票<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>拍照留存，别扔、别拒收。\n<\/li><li>看清楚：诉讼请求、举证期限、开庭时间。\n<\/li><li>15 天内准备答辩，必要时找律师。\n<\/li><li>整理你的证据：财产清单、孩子照顾的记录、收入证明。\n<\/li><li>按时出庭。有特殊情况，提前书面向法院说明。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>不理、不去、不答辩（可能缺席判决）；\n<\/li><li>突击转移财产、藏匿孩子。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/097\">第 097 条<\/a>、<a href=\"#/e/098\">第 098 条<\/a>、<a href=\"#/e/100\">第 100 条<\/a>、<a href=\"#/e/106\">第 106 条<\/a><\/p>\n<hr>\n<h3>七、刚发现对方出轨<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>先不动手、不摔东西、不发朋友圈、不通知对方的父母和单位。\n<\/li><li>把你合法看到的内容截图保存。\n<\/li><li>给自己找一个可以说话的人。\n<\/li><li>一周内咨询律师，再决定下一步。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>偷看、破解对方手机；\n<\/li><li>跟踪、公开曝光；\n<\/li><li>冲动之下签任何文件。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/081\">第 081 条<\/a>、<a href=\"#/e/105\">第 105 条<\/a>、<a href=\"#/e/104\">第 104 条<\/a>、<a href=\"#/e/063\">第 063 条<\/a><\/p>\n<hr>\n<h3>八、刚转了一笔大钱，什么凭证都没留<\/h3>\n<p><strong>现在立刻做<\/strong><\/p>\n<ol><li>马上保存转账记录（银行回单、微信或支付宝账单）。\n<\/li><li>在聊天里补一句文字，说明用途，请对方回复确认。\n<\/li><li>把所有相关聊天记录导出备份，不要删。\n<\/li><li>如果是为结婚给付，补一次文字沟通，让对方确认这笔钱是彩礼或结婚用途。\n<\/li><\/ol>\n<p><strong>千万别做<\/strong><\/p>\n<ul><li>事后伪造聊天记录或借条；\n<\/li><li>威胁对方。\n<\/li><\/ul>\n<p><strong>接着看<\/strong>：<a href=\"#/e/009\">第 009 条<\/a>、<a href=\"#/e/013\">第 013 条<\/a>、<a href=\"#/e/010\">第 010 条<\/a>、<a href=\"#/e/007\">第 007 条<\/a><\/p>", "text": "# 救急卡：八种紧急情况，先看这个\n\n事情已经发生了，没有时间从头读。每张卡只有三栏：现在立刻做、千万别做、接着看哪几条。\n\n---\n\n## 一、警察来电话了，或者被带到派出所\n\n**现在立刻做**\n\n1. 问清楚：哪个单位、什么案由、需要你做什么；要求出示证件。\n2. 马上联系律师，或让家人帮忙联系。没有律师，拨 12348。\n3. 只说你确定的事实，不确定的说\"不确定\"。\n4. 笔录没看完不签；有错的当场要求更正。\n\n**千万别做**\n\n- 删除聊天记录、销毁手机里的东西；\n- 私下联系对方\"商量一下\"、转钱让对方撤案；\n- 为了早点出来，承认没做过的事。\n\n**接着看**：第 021 条、第 020 条、第 018 条\n\n---\n\n## 二、被人拿隐私、照片、\"报警\"威胁要钱\n\n**现在立刻做**\n\n1. 截图、录屏、保存对方所有的威胁内容，并备份。\n2. 不转账、不答应任何条件。\n3. 报警，把证据交给警方。\n4. 平台上有传播的，向平台投诉，要求删除。\n\n**千万别做**\n\n- 转钱\"了事\"（对方往往会加码）；\n- 用同样的方式反过来威胁对方；\n- 在群里、朋友圈公开回应。\n\n**接着看**：第 023 条、第 027 条、第 024 条\n\n---\n\n## 三、遭遇家庭暴力（男女都一样）\n\n**现在立刻做**\n\n1. 先保证安全：离开现场，去亲友家或公共场所。\n2. 报警，要求出警记录和告诫书。\n3. 去医院验伤，保留病历、照片、验伤报告。\n4. 保存聊天记录、威胁语音、监控。\n5. 向法院申请人身安全保护令，法院应在 72 小时内作出裁定。\n\n**千万别做**\n\n- 反击到对方受重伤；\n- 因为\"男人被打丢人\"就忍着、不留证据。\n\n**接着看**：第 026 条、第 077 条，申请书范本见附录 L\n\n---\n\n## 四、孩子被对方带走、藏起来了\n\n**现在立刻做**\n\n1. 立即报警，告诉警方孩子被带走的时间、经过、最后的位置。\n2. 保存聊天记录、通话记录、孩子学校的出勤记录。\n3. 向法院申请人格权侵害禁令，说明情况紧迫。\n4. 联系律师。\n\n**千万别做**\n\n- 自己冲到对方家里抢孩子；\n- 同样把孩子藏起来；\n- 在孩子面前和对方争吵。\n\n**接着看**：第 109 条、第 106 条，申请书范本见附录 K\n\n---\n\n## 五、发现对方在转移、变卖财产\n\n**现在立刻做**\n\n1. 保存你看到的转账记录、合同、聊天。\n2. 马上咨询律师：是否可以申请财产保全（冻结账户、查封房产）。\n3. 核对房产、车辆的登记信息，看有没有变动。\n4. 暂时不要转移自己的财产，也不要签任何文件。\n\n**千万别做**\n\n- 偷对方的手机、网银密码；\n- 自己也跟着转移财产。\n\n**接着看**：第 103 条、第 102 条、第 101 条、第 063 条\n\n---\n\n## 六、收到法院的起诉状、传票\n\n**现在立刻做**\n\n1. 拍照留存，别扔、别拒收。\n2. 看清楚：诉讼请求、举证期限、开庭时间。\n3. 15 天内准备答辩，必要时找律师。\n4. 整理你的证据：财产清单、孩子照顾的记录、收入证明。\n5. 按时出庭。有特殊情况，提前书面向法院说明。\n\n**千万别做**\n\n- 不理、不去、不答辩（可能缺席判决）；\n- 突击转移财产、藏匿孩子。\n\n**接着看**：第 097 条、第 098 条、第 100 条、第 106 条\n\n---\n\n## 七、刚发现对方出轨\n\n**现在立刻做**\n\n1. 先不动手、不摔东西、不发朋友圈、不通知对方的父母和单位。\n2. 把你合法看到的内容截图保存。\n3. 给自己找一个可以说话的人。\n4. 一周内咨询律师，再决定下一步。\n\n**千万别做**\n\n- 偷看、破解对方手机；\n- 跟踪、公开曝光；\n- 冲动之下签任何文件。\n\n**接着看**：第 081 条、第 105 条、第 104 条、第 063 条\n\n---\n\n## 八、刚转了一笔大钱，什么凭证都没留\n\n**现在立刻做**\n\n1. 马上保存转账记录（银行回单、微信或支付宝账单）。\n2. 在聊天里补一句文字，说明用途，请对方回复确认。\n3. 把所有相关聊天记录导出备份，不要删。\n4. 如果是为结婚给付，补一次文字沟通，让对方确认这笔钱是彩礼或结婚用途。\n\n**千万别做**\n\n- 事后伪造聊天记录或借条；\n- 威胁对方。\n\n**接着看**：第 009 条、第 013 条、第 010 条、第 007 条\n"}, {"id": "场景速查", "label": "场景速查", "html": "<h2>场景速查：我现在遇到的是……<\/h2>\n<p>按你所处的阶段找。每一行给出最该先看的几条。<\/p>\n<h3>恋爱中<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>不知道从哪儿学起<\/td><td><a href=\"#/e/001\">第 001 条<\/a>、<a href=\"#/e/004\">第 004 条<\/a><\/td><\/tr><tr><td>要给对方转一笔大钱<\/td><td><a href=\"#/e/002\">第 002 条<\/a>、<a href=\"#/e/009\">第 009 条<\/a><\/td><\/tr><tr><td>对方开口借钱<\/td><td><a href=\"#/e/011\">第 011 条<\/a>、<a href=\"#/e/005\">第 005 条<\/a><\/td><\/tr><tr><td>对方总在要钱，还施压<\/td><td><a href=\"#/e/005\">第 005 条<\/a>、<a href=\"#/e/006\">第 006 条<\/a><\/td><\/tr><tr><td>想知道分手后能不能要回钱<\/td><td><a href=\"#/e/003\">第 003 条<\/a>、<a href=\"#/e/007\">第 007 条<\/a><\/td><\/tr><tr><td>怀疑对方是骗子<\/td><td><a href=\"#/e/017\">第 017 条<\/a>、<a href=\"#/e/040\">第 040 条<\/a><\/td><\/tr><tr><td>吵架后被报警、怕被诬告<\/td><td><a href=\"#/e/020\">第 020 条<\/a>、<a href=\"#/e/019\">第 019 条<\/a>、<a href=\"#/e/021\">第 021 条<\/a><\/td><\/tr><tr><td>被拿私密照片威胁<\/td><td><a href=\"#/e/023\">第 023 条<\/a>、<a href=\"#/e/027\">第 027 条<\/a><\/td><\/tr><tr><td>想收集证据<\/td><td><a href=\"#/e/014\">第 014 条<\/a>、<a href=\"#/e/013\">第 013 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>同居、有孩子了<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>同居几年，想知道财产怎么算<\/td><td><a href=\"#/e/029\">第 029 条<\/a>、<a href=\"#/e/031\">第 031 条<\/a><\/td><\/tr><tr><td>一起买房买车<\/td><td><a href=\"#/e/030\">第 030 条<\/a><\/td><\/tr><tr><td>没领证，孩子出生了<\/td><td><a href=\"#/e/032\">第 032 条<\/a>、<a href=\"#/e/034\">第 034 条<\/a><\/td><\/tr><tr><td>怀疑孩子不是自己的<\/td><td><a href=\"#/e/033\">第 033 条<\/a><\/td><\/tr><tr><td>同居分手<\/td><td><a href=\"#/e/035\">第 035 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>订婚、谈彩礼<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>要给或要收彩礼<\/td><td><a href=\"#/e/036\">第 036 条<\/a>、<a href=\"#/e/037\">第 037 条<\/a>、<a href=\"#/e/043\">第 043 条<\/a><\/td><\/tr><tr><td>对方要价太高<\/td><td><a href=\"#/e/040\">第 040 条<\/a>、<a href=\"#/e/043\">第 043 条<\/a><\/td><\/tr><tr><td>给对方买车买房首付<\/td><td><a href=\"#/e/041\">第 041 条<\/a><\/td><\/tr><tr><td>婚事不成，想要回彩礼<\/td><td><a href=\"#/e/038\">第 038 条<\/a>、<a href=\"#/e/039\">第 039 条<\/a>、<a href=\"#/e/044\">第 044 条<\/a><\/td><\/tr><tr><td>被要求退彩礼<\/td><td><a href=\"#/e/039\">第 039 条<\/a>、<a href=\"#/e/042\">第 042 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>准备结婚<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>想提婚前协议，不知道怎么开口<\/td><td><a href=\"#/e/051\">第 051 条<\/a>、<a href=\"#/e/052\">第 052 条<\/a><\/td><\/tr><tr><td>想自己写婚前协议<\/td><td><a href=\"#/e/053\">第 053 条<\/a><\/td><\/tr><tr><td>想知道对方有没有结过婚、有没有债<\/td><td><a href=\"#/e/046\">第 046 条<\/a>、<a href=\"#/e/047\">第 047 条<\/a><\/td><\/tr><tr><td>想去做婚检<\/td><td><a href=\"#/e/045\">第 045 条<\/a><\/td><\/tr><tr><td>想问清双方的婚后规划<\/td><td><a href=\"#/e/050\">第 050 条<\/a><\/td><\/tr><tr><td>觉得对方有些地方不对劲<\/td><td><a href=\"#/e/049\">第 049 条<\/a><\/td><\/tr><tr><td>想知道登记要带什么<\/td><td><a href=\"#/e/055\">第 055 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>已经结婚<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>想系统地保护家庭财产<\/td><td><a href=\"#/e/069\">第 069 条<\/a><\/td><\/tr><tr><td>想保护婚前财产<\/td><td><a href=\"#/e/057\">第 057 条<\/a>、<a href=\"#/e/059\">第 059 条<\/a><\/td><\/tr><tr><td>父母出钱买房<\/td><td><a href=\"#/e/061\">第 061 条<\/a><\/td><\/tr><tr><td>想给对方加房产证<\/td><td><a href=\"#/e/062\">第 062 条<\/a><\/td><\/tr><tr><td>对方背着我借钱<\/td><td><a href=\"#/e/066\">第 066 条<\/a><\/td><\/tr><tr><td>对方打赏、赌博、乱花钱<\/td><td><a href=\"#/e/067\">第 067 条<\/a><\/td><\/tr><tr><td>我创业，担心离婚分公司<\/td><td><a href=\"#/e/064\">第 064 条<\/a><\/td><\/tr><tr><td>吵架总是同一个套路<\/td><td><a href=\"#/e/071\">第 071 条<\/a>、<a href=\"#/e/070\">第 070 条<\/a><\/td><\/tr><tr><td>对生孩子有分歧<\/td><td><a href=\"#/e/072\">第 072 条<\/a><\/td><\/tr><tr><td>对方家人持续要钱要房<\/td><td><a href=\"#/e/075\">第 075 条<\/a>、<a href=\"#/e/074\">第 074 条<\/a><\/td><\/tr><tr><td>被家暴，或被指控家暴<\/td><td><a href=\"#/e/026\">第 026 条<\/a>、<a href=\"#/e/077\">第 077 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>婚姻出问题了<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>发现对方出轨<\/td><td><a href=\"#/e/081\">第 081 条<\/a>、<a href=\"#/e/105\">第 105 条<\/a><\/td><\/tr><tr><td>感觉不对劲，想做准备<\/td><td><a href=\"#/e/080\">第 080 条<\/a>、<a href=\"#/e/083\">第 083 条<\/a><\/td><\/tr><tr><td>对方转移财产<\/td><td><a href=\"#/e/103\">第 103 条<\/a>、<a href=\"#/e/102\">第 102 条<\/a><\/td><\/tr><tr><td>想协议离婚<\/td><td><a href=\"#/e/085\">第 085 条<\/a>、<a href=\"#/e/086\">第 086 条<\/a>、<a href=\"#/e/084\">第 084 条<\/a><\/td><\/tr><tr><td>房子有房贷怎么离<\/td><td><a href=\"#/e/060\">第 060 条<\/a>、<a href=\"#/e/088\">第 088 条<\/a><\/td><\/tr><tr><td>想\"假离婚\"<\/td><td><a href=\"#/e/090\">第 090 条<\/a><\/td><\/tr><tr><td>对方不同意离婚、躲着我<\/td><td><a href=\"#/e/099\">第 099 条<\/a>、<a href=\"#/e/094\">第 094 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>离婚官司<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>收到起诉状<\/td><td><a href=\"#/e/097\">第 097 条<\/a><\/td><\/tr><tr><td>想起诉离婚<\/td><td><a href=\"#/e/094\">第 094 条<\/a>、<a href=\"#/e/096\">第 096 条<\/a>、<a href=\"#/e/110\">第 110 条<\/a><\/td><\/tr><tr><td>要出庭了<\/td><td><a href=\"#/e/098\">第 098 条<\/a><\/td><\/tr><tr><td>争孩子<\/td><td><a href=\"#/e/106\">第 106 条<\/a>、<a href=\"#/e/120\">第 120 条<\/a>、<a href=\"#/e/109\">第 109 条<\/a><\/td><\/tr><tr><td>抚养费怎么算<\/td><td><a href=\"#/e/107\">第 107 条<\/a>、<a href=\"#/e/089\">第 089 条<\/a><\/td><\/tr><tr><td>财产怎么分<\/td><td><a href=\"#/e/100\">第 100 条<\/a>、<a href=\"#/e/101\">第 101 条<\/a><\/td><\/tr><tr><td>要求对方赔偿<\/td><td><a href=\"#/e/104\">第 104 条<\/a><\/td><\/tr><tr><td>对方要求我补偿或帮助<\/td><td><a href=\"#/e/076\">第 076 条<\/a>、<a href=\"#/e/111\">第 111 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h3>离婚之后<\/h3>\n<div class='tw'><table><thead><tr><th>我遇到的事<\/th><th>先看<\/th><\/tr><\/thead><tbody><tr><td>对方不履行判决或协议<\/td><td><a href=\"#/e/112\">第 112 条<\/a><\/td><\/tr><tr><td>离婚证拿到手了，该办什么<\/td><td><a href=\"#/e/113\">第 113 条<\/a><\/td><\/tr><tr><td>离婚后发现对方藏了财产<\/td><td><a href=\"#/e/093\">第 093 条<\/a><\/td><\/tr><tr><td>和前任一起养孩子<\/td><td><a href=\"#/e/114\">第 114 条<\/a>、<a href=\"#/e/108\">第 108 条<\/a><\/td><\/tr><tr><td>再婚<\/td><td><a href=\"#/e/115\">第 115 条<\/a>、<a href=\"#/e/117\">第 117 条<\/a>、<a href=\"#/e/116\">第 116 条<\/a><\/td><\/tr><tr><td>心里很难受<\/td><td><a href=\"#/e/121\">第 121 条<\/a>、<a href=\"#/e/123\">第 123 条<\/a><\/td><\/tr><\/tbody><\/table><\/div>", "text": "# 场景速查：我现在遇到的是……\n\n按你所处的阶段找。每一行给出最该先看的几条。\n\n## 恋爱中\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 不知道从哪儿学起 | 第 001 条、第 004 条 |\n| 要给对方转一笔大钱 | 第 002 条、第 009 条 |\n| 对方开口借钱 | 第 011 条、第 005 条 |\n| 对方总在要钱，还施压 | 第 005 条、第 006 条 |\n| 想知道分手后能不能要回钱 | 第 003 条、第 007 条 |\n| 怀疑对方是骗子 | 第 017 条、第 040 条 |\n| 吵架后被报警、怕被诬告 | 第 020 条、第 019 条、第 021 条 |\n| 被拿私密照片威胁 | 第 023 条、第 027 条 |\n| 想收集证据 | 第 014 条、第 013 条 |\n\n## 同居、有孩子了\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 同居几年，想知道财产怎么算 | 第 029 条、第 031 条 |\n| 一起买房买车 | 第 030 条 |\n| 没领证，孩子出生了 | 第 032 条、第 034 条 |\n| 怀疑孩子不是自己的 | 第 033 条 |\n| 同居分手 | 第 035 条 |\n\n## 订婚、谈彩礼\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 要给或要收彩礼 | 第 036 条、第 037 条、第 043 条 |\n| 对方要价太高 | 第 040 条、第 043 条 |\n| 给对方买车买房首付 | 第 041 条 |\n| 婚事不成，想要回彩礼 | 第 038 条、第 039 条、第 044 条 |\n| 被要求退彩礼 | 第 039 条、第 042 条 |\n\n## 准备结婚\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 想提婚前协议，不知道怎么开口 | 第 051 条、第 052 条 |\n| 想自己写婚前协议 | 第 053 条 |\n| 想知道对方有没有结过婚、有没有债 | 第 046 条、第 047 条 |\n| 想去做婚检 | 第 045 条 |\n| 想问清双方的婚后规划 | 第 050 条 |\n| 觉得对方有些地方不对劲 | 第 049 条 |\n| 想知道登记要带什么 | 第 055 条 |\n\n## 已经结婚\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 想系统地保护家庭财产 | 第 069 条 |\n| 想保护婚前财产 | 第 057 条、第 059 条 |\n| 父母出钱买房 | 第 061 条 |\n| 想给对方加房产证 | 第 062 条 |\n| 对方背着我借钱 | 第 066 条 |\n| 对方打赏、赌博、乱花钱 | 第 067 条 |\n| 我创业，担心离婚分公司 | 第 064 条 |\n| 吵架总是同一个套路 | 第 071 条、第 070 条 |\n| 对生孩子有分歧 | 第 072 条 |\n| 对方家人持续要钱要房 | 第 075 条、第 074 条 |\n| 被家暴，或被指控家暴 | 第 026 条、第 077 条 |\n\n## 婚姻出问题了\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 发现对方出轨 | 第 081 条、第 105 条 |\n| 感觉不对劲，想做准备 | 第 080 条、第 083 条 |\n| 对方转移财产 | 第 103 条、第 102 条 |\n| 想协议离婚 | 第 085 条、第 086 条、第 084 条 |\n| 房子有房贷怎么离 | 第 060 条、第 088 条 |\n| 想\"假离婚\" | 第 090 条 |\n| 对方不同意离婚、躲着我 | 第 099 条、第 094 条 |\n\n## 离婚官司\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 收到起诉状 | 第 097 条 |\n| 想起诉离婚 | 第 094 条、第 096 条、第 110 条 |\n| 要出庭了 | 第 098 条 |\n| 争孩子 | 第 106 条、第 120 条、第 109 条 |\n| 抚养费怎么算 | 第 107 条、第 089 条 |\n| 财产怎么分 | 第 100 条、第 101 条 |\n| 要求对方赔偿 | 第 104 条 |\n| 对方要求我补偿或帮助 | 第 076 条、第 111 条 |\n\n## 离婚之后\n\n| 我遇到的事 | 先看 |\n|---|---|\n| 对方不履行判决或协议 | 第 112 条 |\n| 离婚证拿到手了，该办什么 | 第 113 条 |\n| 离婚后发现对方藏了财产 | 第 093 条 |\n| 和前任一起养孩子 | 第 114 条、第 108 条 |\n| 再婚 | 第 115 条、第 117 条、第 116 条 |\n| 心里很难受 | 第 121 条、第 123 条 |\n"}, {"id": "口诀卡", "label": "口诀卡", "html": "<h2>口诀卡：一页纸，把全书背下来<\/h2>\n<blockquote>先背这四句：<strong>先分性质，先留痕，人身优先，冲动不决。<\/strong> 详见 <a href=\"#/e/001\">第 001 条<\/a>。<\/blockquote>\n<div class='tw'><table><thead><tr><th>章<\/th><th>这一章想让你想明白的事<\/th><th>口诀<\/th><\/tr><\/thead><tbody><tr><td>第一章 恋爱里的钱<\/td><td>恋爱里的钱，\"心意\"和\"证据\"要分开记账。钱的性质，不是你心里想的，是证据能证明的。<\/td><td>一看性质，二留字据，三防违法，四不冲动；小钱当心意，大钱要说明，借钱写借条，为婚留原话。<\/td><\/tr><tr><td>第二章 红线与保命<\/td><td>刑事风险不来自\"坏\"，来自\"上头\"和\"说不清\"。钱输了可以再要，刑事案子来了，几乎没有回头路。<\/td><td>不动手，不威胁，不传私密；醉酒不亲密，吵架先走开；被问话，先找律师。<\/td><\/tr><tr><td>第三章 同居与孩子<\/td><td>没领证，财产按出资算；有了孩子，义务按血缘算。同居是自由，不是婚姻。<\/td><td>同居不共有，出资看流水；生了就要养，验亲走正路。<\/td><\/tr><tr><td>第四章 彩礼纠纷<\/td><td>彩礼是\"为结婚给的钱\"，能不能退，看这笔钱的目的实现了没有。谈得明白，给得明白，才退得明白。<\/td><td>一看登记，二看同居，三看孩子，四看金额。<\/td><\/tr><tr><td>第五章 婚前准备<\/td><td>婚前花的是谈话的功夫，省的是婚后的官司。全书性价比最高的一章。<\/td><td>问清人，问清钱，问清未来，再谈协议；红灯三个以上，先别领证。<\/td><\/tr><tr><td>第六章 共同财产和婚内协议<\/td><td>婚后的钱，默认是\"我们的\"。想让它不是，要写下来，要分开放。<\/td><td>婚后所得共，婚前财产私；混了说不清，写了才算数。<\/td><\/tr><tr><td>第七章 读懂另一半<\/td><td>日子过不好，多半不是法律问题，是规则和沟通问题。法律面前，夫妻地位平等、义务对等；网上的极端口号，多数不是法律规则。<\/td><td>事实先于评价，大事先商量，吵架有边界。<\/td><\/tr><tr><td>第八章 离婚协议<\/td><td>离婚协议，是你这辈子签的最贵的一份合同。签字之前，每一项都要写到\"执行时不用再猜\"。<\/td><td>先盘家底，再谈条件，写到不用猜；冷静期里别提前过户。<\/td><\/tr><tr><td>第九章 离婚诉讼<\/td><td>官司打的是证据和程序，不是委屈。你有多委屈，法官不看；你拿得出什么，法官才看。<\/td><td>按时答辩，证据先行，只说事实；孩子看陪伴，财产看来源。<\/td><\/tr><tr><td>第十章 离婚之后<\/td><td>证书拿到手，只是一半；落到过户和执行，才算完。离婚后的日子，是另一场长期的事。<\/td><td>该过户的过户，该执行的执行，该清的账清；孩子的事，当成合作项目。<\/td><\/tr><tr><td>第十一章 已婚男性生存指南<\/td><td>最好的护身符，是选对人，做对事，照顾好自己。法条护得住财产，护不住日子。<\/td><td>选人看模式，做事留余地，在场比给钱重要，撑不住的时候找人说。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>背不下来也没关系。遇到事，先翻<a href=\"救急卡.md\">救急卡<\/a>。<\/p>", "text": "# 口诀卡：一页纸，把全书背下来\n\n> 先背这四句：**先分性质，先留痕，人身优先，冲动不决。** 详见 第 001 条。\n\n| 章 | 这一章想让你想明白的事 | 口诀 |\n|---|---|---|\n| 第一章 恋爱里的钱 | 恋爱里的钱，\"心意\"和\"证据\"要分开记账。钱的性质，不是你心里想的，是证据能证明的。 | 一看性质，二留字据，三防违法，四不冲动；小钱当心意，大钱要说明，借钱写借条，为婚留原话。 |\n| 第二章 红线与保命 | 刑事风险不来自\"坏\"，来自\"上头\"和\"说不清\"。钱输了可以再要，刑事案子来了，几乎没有回头路。 | 不动手，不威胁，不传私密；醉酒不亲密，吵架先走开；被问话，先找律师。 |\n| 第三章 同居与孩子 | 没领证，财产按出资算；有了孩子，义务按血缘算。同居是自由，不是婚姻。 | 同居不共有，出资看流水；生了就要养，验亲走正路。 |\n| 第四章 彩礼纠纷 | 彩礼是\"为结婚给的钱\"，能不能退，看这笔钱的目的实现了没有。谈得明白，给得明白，才退得明白。 | 一看登记，二看同居，三看孩子，四看金额。 |\n| 第五章 婚前准备 | 婚前花的是谈话的功夫，省的是婚后的官司。全书性价比最高的一章。 | 问清人，问清钱，问清未来，再谈协议；红灯三个以上，先别领证。 |\n| 第六章 共同财产和婚内协议 | 婚后的钱，默认是\"我们的\"。想让它不是，要写下来，要分开放。 | 婚后所得共，婚前财产私；混了说不清，写了才算数。 |\n| 第七章 读懂另一半 | 日子过不好，多半不是法律问题，是规则和沟通问题。法律面前，夫妻地位平等、义务对等；网上的极端口号，多数不是法律规则。 | 事实先于评价，大事先商量，吵架有边界。 |\n| 第八章 离婚协议 | 离婚协议，是你这辈子签的最贵的一份合同。签字之前，每一项都要写到\"执行时不用再猜\"。 | 先盘家底，再谈条件，写到不用猜；冷静期里别提前过户。 |\n| 第九章 离婚诉讼 | 官司打的是证据和程序，不是委屈。你有多委屈，法官不看；你拿得出什么，法官才看。 | 按时答辩，证据先行，只说事实；孩子看陪伴，财产看来源。 |\n| 第十章 离婚之后 | 证书拿到手，只是一半；落到过户和执行，才算完。离婚后的日子，是另一场长期的事。 | 该过户的过户，该执行的执行，该清的账清；孩子的事，当成合作项目。 |\n| 第十一章 已婚男性生存指南 | 最好的护身符，是选对人，做对事，照顾好自己。法条护得住财产，护不住日子。 | 选人看模式，做事留余地，在场比给钱重要，撑不住的时候找人说。 |\n\n背不下来也没关系。遇到事，先翻[救急卡](救急卡.md)。\n"}, {"id": "话术手册", "label": "话术手册", "html": "<h2>话术手册：可以直接说、直接写的话<\/h2>\n<blockquote>这是全书所有\"可以这样说\"的汇总，按章排列，每段后面标了出处。照着说，别照着念：把名字、金额、日期换成你自己的。<br>话术只是一个起点。对方情绪激动、涉及威胁或人身安全的时候，先保证安全，再谈话术。<\/blockquote>\n<h3>第一章　恋爱里的钱<\/h3>\n<h5>对方总在要钱：是真有需要，还是在拿捏你（<a href=\"#/e/005\">第 005 条<\/a>）<\/h5>\n<ul><li>\"每月我可以拿出 2000 元给你应急，超过的部分我给不了。你要用大额，告诉我是做什么，我们一起想办法。\"\n<\/li><\/ul>\n<h5>\"你不给我就去死\"：怎么回应，才不被拖下水（<a href=\"#/e/006\">第 006 条<\/a>）<\/h5>\n<ul><li>\"我很担心你，现在你的安全最重要。我先联系你家人来陪你，我们都冷静一下，钱和分手的事，等你稳定了再谈。\"\n<\/li><\/ul>\n<h5>分手后要钱：先说，再发函，最后起诉（<a href=\"#/e/007\">第 007 条<\/a>）<\/h5>\n<ul><li>\"× 年 × 月 × 日，我转给你 8 万元，我们当时说好是用来办婚礼的。现在婚事不办了，请你在 × 月 × 日前退回。如果你有不同看法，请告诉我。\"\n<\/li><\/ul>\n<h5>不肯付出的关系：什么时候该止损（<a href=\"#/e/008\">第 008 条<\/a>）<\/h5>\n<ul><li>\"我们平时吃饭轮流买单，大额的东西提前商量，借钱写个借条，这样我们都轻松，好吗？\"\n<\/li><\/ul>\n<h5>转账备注写\"爱你\"，这钱可能就要不回来（<a href=\"#/e/009\">第 009 条<\/a>）<\/h5>\n<ul><li>借款：\"这笔 3 万我借你，下个月 30 号前还我，可以吗？\"（等对方回复\"可以\"\"好\"）\n<\/li><li>为结婚：\"这 10 万是我们说好的婚礼和彩礼用的钱，婚事办成就算数，办不成就退给我，你确认一下？\"\n<\/li><li>代偿：\"你那张卡我先替你还了，4000 块，这个月底你转给我。\"\n<\/li><\/ul>\n<h5>大额转账，怎么证明是\"为了结婚\"才给的（<a href=\"#/e/010\">第 010 条<\/a>）<\/h5>\n<ul><li>\"× 年 × 月 × 日，我给你转了 20 万，我们当时说好是用来办婚礼的。现在婚事办不成，请你按照我们的约定退还。你有不同意见，请说明。\"\n<\/li><\/ul>\n<h5>恋人借钱，借条怎么写才不怕翻脸（<a href=\"#/e/011\">第 011 条<\/a>）<\/h5>\n<ul><li>\"你要借的这 3 万，我们写个简单的借条吧，不是不信任你，是怕以后我们自己都记不清。写上还款日期就行。\"\n<\/li><\/ul>\n<h5>替对方还了信用卡和网贷，分手后能要回来吗（<a href=\"#/e/012\">第 012 条<\/a>）<\/h5>\n<ul><li>\"你那张卡 6 万我先替你还了，我们说好，你从下个月开始每月还我 5000，还清为止。你回复一下。\"\n<\/li><\/ul>\n<h5>吵到最凶的时候：不转账，不签字，不认错（<a href=\"#/e/015\">第 015 条<\/a>）<\/h5>\n<ul><li>\"我听到你说的了，我现在情绪也不太好，我们明天上午再谈，好吗？\"\n<\/li><li>\"这件事我需要和家人商量一下，之后给你答复。\"\n<\/li><li>\"我不会在这种状态下做决定，也不会签任何东西。\"\n<\/li><\/ul>\n<h5>三年一过，钱就难要了（<a href=\"#/e/016\">第 016 条<\/a>）<\/h5>\n<ul><li>\"×× 你好，你于 2022 年 3 月向我借款 2 万元，约定 2022 年 9 月 30 日归还，至今未还。请于 ×× 月 ×× 日前还清。本信息作为正式催收，请你确认收到。\"\n<\/li><\/ul>\n<h3>第二章　红线与保命<\/h3>\n<h5>接到警察电话，前二十四小时怎么走（<a href=\"#/e/021\">第 021 条<\/a>）<\/h5>\n<ul><li>\"我愿意配合，但我需要先联系律师，律师到场之前，我不回答。\"\n<\/li><li>\"这个笔录我没有看完，我看完再签。\"\n<\/li><li>\"这一句不是我的意思，请改成……\"\n<\/li><\/ul>\n<h5>\"不给钱我就报警\"：什么时候从讨债变成敲诈（<a href=\"#/e/023\">第 023 条<\/a>）<\/h5>\n<ul><li>\"你这样要求我付钱，我不会同意。我会把我们的聊天记录交给警方处理。\"（说完后，务必把记录交出去，不要只是说说。）\n<\/li><\/ul>\n<h3>第三章　同居与孩子<\/h3>\n<h5>同居一起买房买车，出资和约定一个都别漏（<a href=\"#/e/030\">第 030 条<\/a>）<\/h5>\n<ul><li>\"我们一起买这套房，写个简单的协议吧：首付 30 万，你出 10 万、我出 20 万，登记在我名下，将来如果分开，我按你出的份额补偿你。\"\n<\/li><\/ul>\n<h5>孩子是不是亲生的，怎么验才合法（<a href=\"#/e/033\">第 033 条<\/a>）<\/h5>\n<ul><li>\"我想和你一起去做一个正规的亲子鉴定，为了孩子，也为了我们都放心。我们一起去，这样结果大家都认。\"\n<\/li><\/ul>\n<h3>第四章　彩礼纠纷<\/h3>\n<h5>给彩礼，别给现金（<a href=\"#/e/037\">第 037 条<\/a>）<\/h5>\n<ul><li>\"订婚的这笔 18 万，我们家是按当地的规矩给的，转到您账上。我们把这个写一下，万一以后有变化，彼此都有依据，您看行吗？\"\n<\/li><\/ul>\n<h5>漫天要价，算不算\"借婚姻要钱\"（<a href=\"#/e/040\">第 040 条<\/a>）<\/h5>\n<ul><li>\"我们家能拿出 15 万，这是我们的上限，再多我们确实拿不出。如果你们觉得不够，我们再商量别的办法，或者我们都再想想。\"\n<\/li><\/ul>\n<h3>第五章　婚前准备<\/h3>\n<h5>婚检：不是走形式，是保住你的知情权（<a href=\"#/e/045\">第 045 条<\/a>）<\/h5>\n<ul><li>\"我们结婚前去做个婚检吧，我们都做，你的我不看你的隐私细节，只是为了我们都放心。\"\n<\/li><\/ul>\n<h5>看钱怎么花，也看家怎么过（<a href=\"#/e/048\">第 048 条<\/a>）<\/h5>\n<ul><li>\"我们结婚前，把各自的收入、存款和负债都摊开来看一下，不是互相审查，是为了一起做个婚后的预算，你觉得呢？\"\n<\/li><\/ul>\n<h5>怎么开口提婚前协议：最难的是第一句（<a href=\"#/e/051\">第 051 条<\/a>）<\/h5>\n<ul><li>\"我想跟你聊一件事，不是不信任你，是我觉得我们结婚前，把钱和房的事都想清楚，以后能少很多吵架。\"\n<\/li><li>\"我先把我的情况都摊开：我有一套婚前买的房，贷款还有 40 万，存款 20 万。你也把你的情况告诉我，我们各自找个律师看看，一起定一份。\"\n<\/li><li>\"如果你觉得有哪一条不舒服，我们可以一起改。这份协议对我们两个人都适用。\"\n<\/li><\/ul>\n<h3>第六章　共同财产和婚内协议<\/h3>\n<h5>爸妈出钱买房，算谁的（<a href=\"#/e/061\">第 061 条<\/a>）<\/h5>\n<ul><li>\"我们夫妻二人，于 ×× 年 × 月 × 日，向儿子 ××× 转账 60 万元，用于购买位于 ×× 的房屋。该笔款项系我们对儿子 ××× 个人的赠与，不属于其夫妻共同财产。\"（签字、日期）\n<\/li><\/ul>\n<h3>第七章　读懂另一半<\/h3>\n<h5>\"家里不讲理\"：怎么把吵架变成商量（<a href=\"#/e/071\">第 071 条<\/a>）<\/h5>\n<ul><li>\"我们先停一下。我现在也有情绪，明天晚上吃完饭我们再聊这件事，好吗？\"\n<\/li><li>\"你说我 PUA 你，我想知道具体是哪句话、哪件事，我们就这件事聊。\"\n<\/li><li>\"我们约定一下：吵架的时候，不提离婚，也不翻旧账，行吗？\"\n<\/li><\/ul>\n<h5>钱和态度：家里的账怎么记才不吵（<a href=\"#/e/073\">第 073 条<\/a>）<\/h5>\n<ul><li>\"我们每季度花半小时，把家里的账对一下，不是查你，是我们一起看看钱花到哪了，以后有什么要调整的。\"\n<\/li><\/ul>\n<h5>对方家人持续要钱、要房、要你表态：边界怎么设（<a href=\"#/e/075\">第 075 条<\/a>）<\/h5>\n<ul><li>\"妈，这个事我和 ×× 商量一下，周末给您答复。\"\n<\/li><li>\"我们能支持 2 万，一次性的。你们看这样行不行？如果不够，我们也再想想办法。\"\n<\/li><li>对配偶：\"我们定一个双方家里都适用的规则，好吗？每年每边最多多少，超出的我们商量。\"\n<\/li><\/ul>\n<h3>第八章　离婚协议<\/h3>\n<h5>发现对方出轨：第一周该做什么，不该做什么（<a href=\"#/e/081\">第 081 条<\/a>）<\/h5>\n<ul><li>\"我已经知道这件事了。我现在不想吵，也不想做任何决定。我们都先冷静几天，之后找时间好好谈，我也会找律师了解我的权利。\"\n<\/li><\/ul>\n<h5>对方写的\"保证书\"\"认错书\"有用吗（<a href=\"#/e/082\">第 082 条<\/a>）<\/h5>\n<ul><li>\"我们都先冷静一下。我想把你的承诺写下来，不是为了逼你，是为了我们以后都有依据。\"\n<\/li><li>\"这份东西我先拿回去看看，明天再给你答复。\"（被要求写的一方）\n<\/li><\/ul>\n<h5>离婚谈判怎么谈：底线、让步顺序、
