const D = {"title": "不吃哑巴亏指南——男性婚恋护身之书", "sub": "恋爱转账、彩礼、婚前协议、婚后财产、离婚官司、抚养权、刑事红线。写给那些愿意付出，却总是吃了亏说不出口的男人。", "total": 123, "check": "2026 年 10 月", "chapters": [{"title": "第一章　恋爱里的钱", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：恋爱里的钱，\"心意\"和\"证据\"要分开记账。钱的性质，不是你心里想的，是证据能证明的。<br><br><strong>口诀<\/strong>：一看性质，二留字据，三防违法，四不冲动；小钱当心意，大钱要说明，借钱写借条，为婚留原话。<\/blockquote>\n<p>书里用\"小林\"\"小周\"这类名字讲的例子，都是虚构的，只为说明规则，人名和金额不对应真实案件。真实案例只来自最高人民法院公开发布的材料，汇总在附录 O。<\/p>", "entries": [{"num": "001", "title": "婚恋四句话：先分性质，先留痕，人身优先，冲动不决", "grade": "C", "lead": "全书的规则看起来很多，归根到底，就是这四句话。遇到婚恋里的钱和麻烦，先拿它们对照一遍。", "html": "<blockquote>全书的规则看起来很多，归根到底，就是这四句话。遇到婚恋里的钱和麻烦，先拿它们对照一遍。<\/blockquote>\n<p>很多男人在婚恋里吃的亏，不是输在没道理，而是输在四个环节：钱的性质没分清，证据没留，人身风险没防，情绪最高的时候做了决定。把这四个环节守住，就守住了大半。<\/p>\n<p><strong>第一，先分性质。<\/strong> 一笔钱，是送的、借的，还是彩礼，还是共同出资？这件事不看你心里怎么想，看双方通过转账、聊天、协议表达出来的意思。转之前想清楚，见 <a href=\"#/e/002\">第 002 条<\/a>。<\/p>\n<p><strong>第二，先留痕。<\/strong> 备注写清楚，对方的确认留下来，记录能导出、能核对。法院审案的规则是\"谁主张，谁举证\"，你说是借，就得你来证明。见 <a href=\"#/e/009\">第 009 条<\/a>、<a href=\"#/e/013\">第 013 条<\/a>。<\/p>\n<p><strong>第三，人身优先。<\/strong> 钱输了，可以打官司要；刑事指控来了，对档案、职业、家庭的影响，几乎没法挽回。不动手，不威胁，不传私密，醉酒和争吵时不发生亲密行为。见 <a href=\"#/e/022\">第 022 条<\/a>、<a href=\"#/e/018\">第 018 条<\/a>。被问话，先找律师，见 <a href=\"#/e/021\">第 021 条<\/a>。<\/p>\n<p><strong>第四，冲动不决。<\/strong> 吵得最凶、被威胁、愧疚到极点的时候，不转账，不签字，不认错。见 <a href=\"#/e/015\">第 015 条<\/a>。<\/p>\n<p>举个例子：小赖给女友转了 6 万，备注写的\"爱你\"。吵架那天，对方要他\"拿 10 万证明你爱我\"，他当场认了错，又转了 4 万。分手后他想要回来，才发现：钱的性质没人说过，吵架时的聊天，反倒成了对方的证据。这四句话，他一句都没做到。<\/p>\n<p>知道不等于做到，最难的是第四句，因为情绪上来的时候，人是想不起它的。不妨把这四句话，写在手机的备忘录里。<\/p>\n<p><strong>法律依据<\/strong>：这是对全书规则的归纳，不对应单独的法条。具体依据见上面各条。<\/p>\n<p><strong>把握度<\/strong>：C｜对全书规则的归纳。<\/p>", "text": "婚恋四句话：先分性质，先留痕，人身优先，冲动不决 \n 全书的规则看起来很多，归根到底，就是这四句话。遇到婚恋里的钱和麻烦，先拿它们对照一遍。\n\n很多男人在婚恋里吃的亏，不是输在没道理，而是输在四个环节：钱的性质没分清，证据没留，人身风险没防，情绪最高的时候做了决定。把这四个环节守住，就守住了大半。\n\n第一，先分性质。 一笔钱，是送的、借的，还是彩礼，还是共同出资？这件事不看你心里怎么想，看双方通过转账、聊天、协议表达出来的意思。转之前想清楚，见 第 002 条。\n\n第二，先留痕。 备注写清楚，对方的确认留下来，记录能导出、能核对。法院审案的规则是\"谁主张，谁举证\"，你说是借，就得你来证明。见 第 009 条、第 013 条。\n\n第三，人身优先。 钱输了，可以打官司要；刑事指控来了，对档案、职业、家庭的影响，几乎没法挽回。不动手，不威胁，不传私密，醉酒和争吵时不发生亲密行为。见 第 022 条、第 018 条。被问话，先找律师，见 第 021 条。\n\n第四，冲动不决。 吵得最凶、被威胁、愧疚到极点的时候，不转账，不签字，不认错。见 第 015 条。\n\n举个例子：小赖给女友转了 6 万，备注写的\"爱你\"。吵架那天，对方要他\"拿 10 万证明你爱我\"，他当场认了错，又转了 4 万。分手后他想要回来，才发现：钱的性质没人说过，吵架时的聊天，反倒成了对方的证据。这四句话，他一句都没做到。\n\n知道不等于做到，最难的是第四句，因为情绪上来的时候，人是想不起它的。不妨把这四句话，写在手机的备忘录里。\n\n法律依据：这是对全书规则的归纳，不对应单独的法条。具体依据见上面各条。\n\n把握度：C｜对全书规则的归纳。\n\n"}, {"num": "002", "title": "一笔钱，到底是送的、借的，还是彩礼", "grade": "A", "lead": "同样转 5 万，是\"送\"、是\"借\"还是\"彩礼\"，结果天差地别。", "html": "<blockquote>同样转 5 万，是\"送\"、是\"借\"还是\"彩礼\"，结果天差地别。<\/blockquote>\n<p>小林给女友转了 5 万，备注\"爱你\"。半年后分手，他说是借的，对方说是送的。法院问他：有借条吗？说过要还吗？没有。这笔钱，大概率被认定为赠与，要不回来。<\/p>\n<p>法律上，一笔钱的性质只有这几种：<\/p>\n<p><strong>赠与<\/strong>：自愿给，不要求回报。给出去，一般就收不回了。《民法典》第 657 条以下规定的就是这个。<\/p>\n<p><strong>借款<\/strong>：约定了要还。借钱的事，不因为对方是恋人就不成立。《民法典》第 667 条以下。<\/p>\n<p><strong>彩礼<\/strong>：按当地习俗，以结婚为目的给付的较大金额的钱物。结婚不成，可能退。<\/p>\n<p><strong>共同出资<\/strong>：一起买房、买车，按出资和约定算。<\/p>\n<p>这几种的后果完全不同，所以转钱之前，先在心里问自己一句：将来要证明它是什么，我手里有什么？答不上来，就先补一句书面确认再转。<\/p>\n<p>要特别注意：恋爱关系，不影响借款成立，也不等于转账就是借款。看的是双方的意思表示，不是关系有多亲密。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 657 条至第 666 条（赠与合同）、第 667 条至第 680 条（借款合同）；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 1 条、第 3 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确，难点在举证。<\/p>", "text": "一笔钱，到底是送的、借的，还是彩礼 \n 同样转 5 万，是\"送\"、是\"借\"还是\"彩礼\"，结果天差地别。\n\n小林给女友转了 5 万，备注\"爱你\"。半年后分手，他说是借的，对方说是送的。法院问他：有借条吗？说过要还吗？没有。这笔钱，大概率被认定为赠与，要不回来。\n\n法律上，一笔钱的性质只有这几种：\n\n赠与：自愿给，不要求回报。给出去，一般就收不回了。《民法典》第 657 条以下规定的就是这个。\n\n借款：约定了要还。借钱的事，不因为对方是恋人就不成立。《民法典》第 667 条以下。\n\n彩礼：按当地习俗，以结婚为目的给付的较大金额的钱物。结婚不成，可能退。\n\n共同出资：一起买房、买车，按出资和约定算。\n\n这几种的后果完全不同，所以转钱之前，先在心里问自己一句：将来要证明它是什么，我手里有什么？答不上来，就先补一句书面确认再转。\n\n要特别注意：恋爱关系，不影响借款成立，也不等于转账就是借款。看的是双方的意思表示，不是关系有多亲密。\n\n法律依据：《民法典》第 657 条至第 666 条（赠与合同）、第 667 条至第 680 条（借款合同）；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 1 条、第 3 条。\n\n把握度：A｜法条明确，难点在举证。\n\n"}, {"num": "003", "title": "恋爱中男人花的六种钱，哪些能要回来", "grade": "A", "lead": "吃饭、电影、520、生日礼物，要不回来；大额的、有\"结婚\"前提的、明确是借的，才有机会。", "html": "<blockquote>吃饭、电影、520、生日礼物，要不回来；大额的、有\"结婚\"前提的、明确是借的，才有机会。<\/blockquote>\n<p>小周和女友分手后，想把一年里的开销要回来：吃饭 1 万、旅游 2 万、转账 5 万。法院逐笔看：吃饭、旅游是恋爱的日常消费，不支持；那 5 万有借款聊天记录，支持。最后他只拿回 5 万。<\/p>\n<p>恋爱里的钱，大致分六类：<\/p>\n<p>第一类，<strong>日常共同消费<\/strong>，吃饭、电影、短途出行。法院认为这是维系感情的自愿开支，不能事后翻账。<\/p>\n<p>第二类，<strong>节日生日礼物和小额红包<\/strong>，520、1314 这类。属于表达感情的赠与，给了就是给了。<\/p>\n<p>第三类，<strong>没有说明的小额转账<\/strong>，零花钱、请客。同样视为赠与。<\/p>\n<p>第四类，<strong>以结婚为目的的大额给付<\/strong>，大额转账、贵重首饰、购车款。有机会要回，但要证明\"为了结婚\"，见 <a href=\"#/e/010\">第 010 条<\/a>。<\/p>\n<p>第五类，<strong>明确约定的借款<\/strong>，有借条或聊天确认。借贷关系独立于恋爱，能要。<\/p>\n<p>第六类，<strong>替对方还的债<\/strong>，信用卡、网贷。能不能要，看你当时说的是\"借\"还是\"帮\"，见 <a href=\"#/e/012\">第 012 条<\/a>。<\/p>\n<p>最高人民法院 2026 年 1 月公布的一个案例，很能说明问题：一对网上认识的男女，同居期间男方多次转账，共 31500 元，其中有五笔 520 元，都没写用途；女方也给男方转过钱，还给家里买了日用品。法院认定这些是共同生活的开销，一分也没判退。见附录 O 案例 O-2。<\/p>\n<p>法院会逐笔区分，不是\"恋爱期间花的钱，都能追回\"。所以在花每一笔钱之前，先想想它属于哪一类，值不值得花，花了之后能不能认账。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 657 条、第 667 条；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 3 条（节日、生日等场合价值不大的礼物礼金、日常消费性支出，不属于彩礼）。<\/p>\n<p><strong>把握度<\/strong>：A｜分类有明文；具体金额的认定是 B。<\/p>", "text": "恋爱中男人花的六种钱，哪些能要回来 \n 吃饭、电影、520、生日礼物，要不回来；大额的、有\"结婚\"前提的、明确是借的，才有机会。\n\n小周和女友分手后，想把一年里的开销要回来：吃饭 1 万、旅游 2 万、转账 5 万。法院逐笔看：吃饭、旅游是恋爱的日常消费，不支持；那 5 万有借款聊天记录，支持。最后他只拿回 5 万。\n\n恋爱里的钱，大致分六类：\n\n第一类，日常共同消费，吃饭、电影、短途出行。法院认为这是维系感情的自愿开支，不能事后翻账。\n\n第二类，节日生日礼物和小额红包，520、1314 这类。属于表达感情的赠与，给了就是给了。\n\n第三类，没有说明的小额转账，零花钱、请客。同样视为赠与。\n\n第四类，以结婚为目的的大额给付，大额转账、贵重首饰、购车款。有机会要回，但要证明\"为了结婚\"，见 第 010 条。\n\n第五类，明确约定的借款，有借条或聊天确认。借贷关系独立于恋爱，能要。\n\n第六类，替对方还的债，信用卡、网贷。能不能要，看你当时说的是\"借\"还是\"帮\"，见 第 012 条。\n\n最高人民法院 2026 年 1 月公布的一个案例，很能说明问题：一对网上认识的男女，同居期间男方多次转账，共 31500 元，其中有五笔 520 元，都没写用途；女方也给男方转过钱，还给家里买了日用品。法院认定这些是共同生活的开销，一分也没判退。见附录 O 案例 O2。\n\n法院会逐笔区分，不是\"恋爱期间花的钱，都能追回\"。所以在花每一笔钱之前，先想想它属于哪一类，值不值得花，花了之后能不能认账。\n\n法律依据：《民法典》第 657 条、第 667 条；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 3 条（节日、生日等场合价值不大的礼物礼金、日常消费性支出，不属于彩礼）。\n\n把握度：A｜分类有明文；具体金额的认定是 B。\n\n"}, {"num": "004", "title": "恋爱里最容易吃亏的四种思维，你占几个", "grade": "C", "lead": "吃亏的人，往往不是运气差，而是思维里有几个固定的盲区。先看自己，再看对方。", "html": "<blockquote>吃亏的人，往往不是运气差，而是思维里有几个固定的盲区。先看自己，再看对方。<\/blockquote>\n<p>小彭和三任女友，都是同一个结局：他愿意付出，不愿意谈钱，转账从不写用途，对方提出新的需求，他从不问用途，也不设上限。分手后，三次都是他想要回钱、拿不出证据。他以为是\"遇人不淑\"，其实每一次，他的做法都一样。<\/p>\n<p>亲密关系里的纠纷，不全是\"对方的问题\"。有一类人，思维模式会不断放大风险。他们不是性格有缺陷，只是对亲密关系里的风险，缺少认知。<\/p>\n<p><strong>第一种，情感优先，排斥一切风险思考。<\/strong> 一动心，就把法律和财产边界全部搁置，觉得谈钱就是不信任。转账不问用途，不留字据，全靠\"我信你\"。<\/p>\n<p><strong>第二种，边界模糊，习惯性兜底。<\/strong> 对方的债务、消费、开支，习惯性全部承接，不分\"我愿意付出\"和\"我有义务承担\"，没有上限。<\/p>\n<p><strong>第三种，轻信口头，轻视书面。<\/strong> 觉得写下来太生分。婚约承诺、钱款约定，全停在口头，一旦对方否认，什么都拿不出来。<\/p>\n<p><strong>第四种，情绪主导，不会止损。<\/strong> 发现异常，舍不得前期投入，\"再坚持一下就好了\"，沉没成本越堆越高。<\/p>\n<p>下面八句话，符合几句，记几分：<\/p>\n<ol><li>我觉得提\"写个借条\"\"留个说明\"会伤感情。\n<\/li><li>我转账的时候，很少问对方钱具体用来做什么。\n<\/li><li>我很难对对方的新要求说\"不\"。\n<\/li><li>对方的网贷、信用卡、日常开销，我常常顺手替他（她）补上。\n<\/li><li>重要的约定，我们基本是口头说的。\n<\/li><li>我发现一段关系里有问题，但总觉得\"再等等\"。\n<\/li><li>对方情绪激动的时候，我常常先认错、先让步。\n<\/li><li>我从来没有给自己定过\"这个月最多愿意付出多少\"。\n<\/li><\/ol>\n<p>0 到 2 分，风险意识不错；3 到 5 分，有明显的盲区，转账前多停一分钟；6 到 8 分，你很容易被动吃亏，从今天起每次转账写用途，设一个月度上限，重要约定一律文字确认。<\/p>\n<p>这份自测不是要给你贴标签，更不是说\"都是你的错\"。对方如果有欺诈、勒索，责任在对方。它只是让你少给别人可乘之机。能改的，永远是自己的习惯。<\/p>\n<p><strong>法律依据<\/strong>：无直接条文，属于经验判断。<\/p>\n<p><strong>把握度<\/strong>：C｜经验判断。<\/p>", "text": "恋爱里最容易吃亏的四种思维，你占几个 \n 吃亏的人，往往不是运气差，而是思维里有几个固定的盲区。先看自己，再看对方。\n\n小彭和三任女友，都是同一个结局：他愿意付出，不愿意谈钱，转账从不写用途，对方提出新的需求，他从不问用途，也不设上限。分手后，三次都是他想要回钱、拿不出证据。他以为是\"遇人不淑\"，其实每一次，他的做法都一样。\n\n亲密关系里的纠纷，不全是\"对方的问题\"。有一类人，思维模式会不断放大风险。他们不是性格有缺陷，只是对亲密关系里的风险，缺少认知。\n\n第一种，情感优先，排斥一切风险思考。 一动心，就把法律和财产边界全部搁置，觉得谈钱就是不信任。转账不问用途，不留字据，全靠\"我信你\"。\n\n第二种，边界模糊，习惯性兜底。 对方的债务、消费、开支，习惯性全部承接，不分\"我愿意付出\"和\"我有义务承担\"，没有上限。\n\n第三种，轻信口头，轻视书面。 觉得写下来太生分。婚约承诺、钱款约定，全停在口头，一旦对方否认，什么都拿不出来。\n\n第四种，情绪主导，不会止损。 发现异常，舍不得前期投入，\"再坚持一下就好了\"，沉没成本越堆越高。\n\n下面八句话，符合几句，记几分：\n\n1. 我觉得提\"写个借条\"\"留个说明\"会伤感情。\n2. 我转账的时候，很少问对方钱具体用来做什么。\n3. 我很难对对方的新要求说\"不\"。\n4. 对方的网贷、信用卡、日常开销，我常常顺手替他（她）补上。\n5. 重要的约定，我们基本是口头说的。\n6. 我发现一段关系里有问题，但总觉得\"再等等\"。\n7. 对方情绪激动的时候，我常常先认错、先让步。\n8. 我从来没有给自己定过\"这个月最多愿意付出多少\"。\n\n0 到 2 分，风险意识不错；3 到 5 分，有明显的盲区，转账前多停一分钟；6 到 8 分，你很容易被动吃亏，从今天起每次转账写用途，设一个月度上限，重要约定一律文字确认。\n\n这份自测不是要给你贴标签，更不是说\"都是你的错\"。对方如果有欺诈、勒索，责任在对方。它只是让你少给别人可乘之机。能改的，永远是自己的习惯。\n\n法律依据：无直接条文，属于经验判断。\n\n把握度：C｜经验判断。\n\n"}, {"num": "005", "title": "对方总在要钱：是真有需要，还是在拿捏你", "grade": "C", "lead": "看三件事：是不是平等沟通，有没有施压或威胁，是不是单向、持续、不断加码。", "html": "<blockquote>看三件事：是不是平等沟通，有没有施压或威胁，是不是单向、持续、不断加码。<\/blockquote>\n<p>小乔的女友每月都有\"急用钱\"：房租、父母看病、朋友借款……一年下来转了 18 万。他一问用途，对方就说\"你不信任我\"。后来他才发现，钱根本没用在她说的地方。<\/p>\n<p>情绪勒索和财产索取，常常结伴出现。它不会一上来就威胁，往往包装在情感话语里：你不给这笔钱，就是不爱我；你不愿意付出，就是没有诚意；你要是拒绝，我会崩溃；这件事你不满足我，我就去找你的亲友、单位。<\/p>\n<p>怎么区分正常的诉求和勒索？核心判断标准有三条：<\/p>\n<p><strong>第一，是不是建立在平等沟通之上。<\/strong> 正常需求可以谈，有用途，有计划；勒索式的需求，常常没有清单，没有用途，没有上限。<\/p>\n<p><strong>第二，有没有用威胁、施压作为手段。<\/strong> 曝光隐私、造谣、自伤，都属于。<\/p>\n<p><strong>第三，是不是单向、持续、不断加码。<\/strong><\/p>\n<p>遇到这种情况，第一原则：不要在情绪高压下仓促转账。人在愧疚、恐慌里做的资金决定，事后最容易出纠纷。先暂停回应，给自己一个冷静的时间。<\/p>\n<p>第二，文字沟通保持客观，不要为了安抚对方，承认没有发生的事实。聊天记录会被保存，以后可能成为对方主张权利、甚至制造指控的证据。<\/p>\n<p>第三，给自己定个上限：每月我愿意付出多少，一次性最多多少。超出，就停下来。<\/p>\n<p>第四，如果对方以曝光隐私、造谣、自伤相威胁索取财物，保留聊天记录和录音，必要时报警，见 <a href=\"#/e/023\">第 023 条<\/a>。<\/p>\n<p>最后要说的是：不要把对方的情绪崩溃，当成自己的责任。你可以共情她的情绪，但不必用持续付钱的方式，替她承接全部的情绪压力。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"每月我可以拿出 2000 元给你应急，超过的部分我给不了。你要用大额，告诉我是做什么，我们一起想办法。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1042 条第 1 款；《刑法》第 274 条（敲诈勒索罪）。<\/p>\n<p><strong>把握度<\/strong>：C｜判断标准是经验；法条是 A。<\/p>", "text": "对方总在要钱：是真有需要，还是在拿捏你 \n 看三件事：是不是平等沟通，有没有施压或威胁，是不是单向、持续、不断加码。\n\n小乔的女友每月都有\"急用钱\"：房租、父母看病、朋友借款……一年下来转了 18 万。他一问用途，对方就说\"你不信任我\"。后来他才发现，钱根本没用在她说的地方。\n\n情绪勒索和财产索取，常常结伴出现。它不会一上来就威胁，往往包装在情感话语里：你不给这笔钱，就是不爱我；你不愿意付出，就是没有诚意；你要是拒绝，我会崩溃；这件事你不满足我，我就去找你的亲友、单位。\n\n怎么区分正常的诉求和勒索？核心判断标准有三条：\n\n第一，是不是建立在平等沟通之上。 正常需求可以谈，有用途，有计划；勒索式的需求，常常没有清单，没有用途，没有上限。\n\n第二，有没有用威胁、施压作为手段。 曝光隐私、造谣、自伤，都属于。\n\n第三，是不是单向、持续、不断加码。\n\n遇到这种情况，第一原则：不要在情绪高压下仓促转账。人在愧疚、恐慌里做的资金决定，事后最容易出纠纷。先暂停回应，给自己一个冷静的时间。\n\n第二，文字沟通保持客观，不要为了安抚对方，承认没有发生的事实。聊天记录会被保存，以后可能成为对方主张权利、甚至制造指控的证据。\n\n第三，给自己定个上限：每月我愿意付出多少，一次性最多多少。超出，就停下来。\n\n第四，如果对方以曝光隐私、造谣、自伤相威胁索取财物，保留聊天记录和录音，必要时报警，见 第 023 条。\n\n最后要说的是：不要把对方的情绪崩溃，当成自己的责任。你可以共情她的情绪，但不必用持续付钱的方式，替她承接全部的情绪压力。\n\n可以这样说：\n\n \"每月我可以拿出 2000 元给你应急，超过的部分我给不了。你要用大额，告诉我是做什么，我们一起想办法。\"\n\n法律依据：《民法典》第 1042 条第 1 款；《刑法》第 274 条（敲诈勒索罪）。\n\n把握度：C｜判断标准是经验；法条是 A。\n\n"}, {"num": "006", "title": "\"你不给我就去死\"：怎么回应，才不被拖下水", "grade": "C", "lead": "共情对方的情绪，不等于为对方的情绪负责。有自伤风险，要找专业的人，不是转账。", "html": "<blockquote>共情对方的情绪，不等于为对方的情绪负责。有自伤风险，要找专业的人，不是转账。<\/blockquote>\n<p>小萧提分手，对方说\"你要是走，我就从楼上跳下去\"。他心软，转了 5 万，也不敢分手。后来类似的话，成了每次谈条件时的固定开场。<\/p>\n<p>遇到这种话，先要分清两件事：<strong>她的安全<\/strong>，和<strong>她的要求<\/strong>。<\/p>\n<p>对于安全，认真对待：不争辩，不指责，说\"我听到了，我很担心你\"；把注意力放在安全上，联系对方的家人或朋友，请他们陪伴；情况紧急，拨打 110、120。这是做人的底线，和保护自己并不冲突。<\/p>\n<p>对于要求，不谈：不在这种状态下谈钱，谈分手条件，签字，做承诺。等她稳定了，再谈。<\/p>\n<p>如果她反复用同样的手段换钱、换让步，保留记录。法律上，以自伤相威胁索财，一般不直接等于敲诈勒索，但在协议效力上，可能构成\"胁迫\"，《民法典》第 150 条允许撤销在胁迫下作出的意思表示。具体要看情节。<\/p>\n<p>你自己也需要一个出口：朋友、心理咨询、热线，见 <a href=\"#/e/121\">第 121 条<\/a>。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我很担心你，现在你的安全最重要。我先联系你家人来陪你，我们都冷静一下，钱和分手的事，等你稳定了再谈。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 150 条（胁迫）；《刑法》第 274 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "\"你不给我就去死\"：怎么回应，才不被拖下水 \n 共情对方的情绪，不等于为对方的情绪负责。有自伤风险，要找专业的人，不是转账。\n\n小萧提分手，对方说\"你要是走，我就从楼上跳下去\"。他心软，转了 5 万，也不敢分手。后来类似的话，成了每次谈条件时的固定开场。\n\n遇到这种话，先要分清两件事：她的安全，和她的要求。\n\n对于安全，认真对待：不争辩，不指责，说\"我听到了，我很担心你\"；把注意力放在安全上，联系对方的家人或朋友，请他们陪伴；情况紧急，拨打 110、120。这是做人的底线，和保护自己并不冲突。\n\n对于要求，不谈：不在这种状态下谈钱，谈分手条件，签字，做承诺。等她稳定了，再谈。\n\n如果她反复用同样的手段换钱、换让步，保留记录。法律上，以自伤相威胁索财，一般不直接等于敲诈勒索，但在协议效力上，可能构成\"胁迫\"，《民法典》第 150 条允许撤销在胁迫下作出的意思表示。具体要看情节。\n\n你自己也需要一个出口：朋友、心理咨询、热线，见 第 121 条。\n\n可以这样说：\n\n \"我很担心你，现在你的安全最重要。我先联系你家人来陪你，我们都冷静一下，钱和分手的事，等你稳定了再谈。\"\n\n法律依据：《民法典》第 150 条（胁迫）；《刑法》第 274 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "007", "title": "分手后要钱：先说，再发函，最后起诉", "grade": "A", "lead": "每一步都是在留证据，也是在给对方留余地。", "html": "<blockquote>每一步都是在留证据，也是在给对方留余地。<\/blockquote>\n<p>小宋要回 8 万元。第一步，他给对方发了条复述事实的微信；两周没回应，他寄了一封书面函；再等两周，他去法院起诉。整个过程里，每一条沟通都成了证据，对方后来在法庭上很难否认。<\/p>\n<p>分手之后，对方占着大额钱款不还，维权分三步。<\/p>\n<p><strong>第一步，协商。<\/strong> 全程用文字，不要只打电话。复述事实：什么时候转账、多少钱、当初约定了什么、现在请对方在什么时间前退回。把对话原样留存，不要删减。<\/p>\n<p><strong>第二步，书面催告或律师函。<\/strong> 自己用快递寄出并留存，或请律师发出。<\/p>\n<p><strong>第三步，起诉。<\/strong> 起诉前先评估：证据够不够，对方有没有可执行的财产，值不值得花时间。案由一般是\"婚约财产纠纷\"\"赠与合同纠纷\"或\"民间借贷纠纷\"，看事实。有调解机会的，可以先申请法院诉前调解。<\/p>\n<p>证据怎么备？转账凭证（银行流水、支付宝微信账单）；能证明钱款用途的聊天记录；购买贵重物品的订单、发票；对方的身份信息。<\/p>\n<p>要提醒一句：起诉之后，法院有可能认定这笔钱是日常赠与，那就不会支持返还。证据是否充分，直接决定结果。所以起诉前，把材料理一遍，客观评估，再决定是否立案。<\/p>\n<p>协商时不要威胁、辱骂，协商记录也会成为证据。<\/p>\n<p><strong>可以这样说<\/strong>（第一步的微信）：<\/p>\n<ul><li>\"× 年 × 月 × 日，我转给你 8 万元，我们当时说好是用来办婚礼的。现在婚事不办了，请你在 × 月 × 日前退回。如果你有不同看法，请告诉我。\"\n<\/li><\/ul>\n<p><strong>附件<\/strong>：起诉状见附录 C，证据清单见附录 N。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》；《诉讼费用交纳办法》；《民法典》第 188 条。<\/p>\n<p><strong>把握度<\/strong>：A｜流程明确；结果取决于证据。<\/p>", "text": "分手后要钱：先说，再发函，最后起诉 \n 每一步都是在留证据，也是在给对方留余地。\n\n小宋要回 8 万元。第一步，他给对方发了条复述事实的微信；两周没回应，他寄了一封书面函；再等两周，他去法院起诉。整个过程里，每一条沟通都成了证据，对方后来在法庭上很难否认。\n\n分手之后，对方占着大额钱款不还，维权分三步。\n\n第一步，协商。 全程用文字，不要只打电话。复述事实：什么时候转账、多少钱、当初约定了什么、现在请对方在什么时间前退回。把对话原样留存，不要删减。\n\n第二步，书面催告或律师函。 自己用快递寄出并留存，或请律师发出。\n\n第三步，起诉。 起诉前先评估：证据够不够，对方有没有可执行的财产，值不值得花时间。案由一般是\"婚约财产纠纷\"\"赠与合同纠纷\"或\"民间借贷纠纷\"，看事实。有调解机会的，可以先申请法院诉前调解。\n\n证据怎么备？转账凭证（银行流水、支付宝微信账单）；能证明钱款用途的聊天记录；购买贵重物品的订单、发票；对方的身份信息。\n\n要提醒一句：起诉之后，法院有可能认定这笔钱是日常赠与，那就不会支持返还。证据是否充分，直接决定结果。所以起诉前，把材料理一遍，客观评估，再决定是否立案。\n\n协商时不要威胁、辱骂，协商记录也会成为证据。\n\n可以这样说（第一步的微信）：\n\n \"× 年 × 月 × 日，我转给你 8 万元，我们当时说好是用来办婚礼的。现在婚事不办了，请你在 × 月 × 日前退回。如果你有不同看法，请告诉我。\"\n\n附件：起诉状见附录 C，证据清单见附录 N。\n\n法律依据：《民事诉讼法》；《诉讼费用交纳办法》；《民法典》第 188 条。\n\n把握度：A｜流程明确；结果取决于证据。\n\n"}, {"num": "008", "title": "不肯付出的关系：什么时候该止损", "grade": "C", "lead": "付出意识，不是要求一比一摊钱。是看这段关系里，有没有双向的投入。", "html": "<blockquote>付出意识，不是要求一比一摊钱。是看这段关系里，有没有双向的投入。<\/blockquote>\n<p>付出，可以是钱，也可以是时间、精力和照顾。所谓\"没有付出意识\"，不是说对方花得少，而是这几种状态：所有开销长期由你一方承担，对方持续接受，极少主动投入；你提出对等分担，对方用\"男人就该多承担\"之类的话堵回去；对方只在需要索取的时候主动联系，你陷入困难，对方没有任何实质支持。<\/p>\n<p>这样的关系，很难长久。一个人持续消耗，另一个人持续索取。等你无力继续供给，矛盾就会集中爆发。别指望靠持续的付出，去改变对方的观念。消费习惯，对亲密关系的认知，很难在短期内改变。<\/p>\n<p>怎么做呢？<\/p>\n<p>第一，先谈规则，再谈钱：日常开销怎么分，大额怎么办，是否有共同账户。<\/p>\n<p>第二，设上限：给自己定一个\"我愿意付出\"的月度额度。<\/p>\n<p>第三，看近六个月：谁付了多少，提出对等分担，对方是接受、回避，还是指责。<\/p>\n<p>第四，看困境时的支持：你遇到困难的时候，对方有没有真的在。<\/p>\n<p>如果一段关系长期完全单向，对方又不接受任何调整，那是关系的问题，不是你\"不够好\"的问题。要认真评估这段关系的长期可行性。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们平时吃饭轮流买单，大额的东西提前商量，借钱写个借条，这样我们都轻松，好吗？\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 657 条、第 667 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "不肯付出的关系：什么时候该止损 \n 付出意识，不是要求一比一摊钱。是看这段关系里，有没有双向的投入。\n\n付出，可以是钱，也可以是时间、精力和照顾。所谓\"没有付出意识\"，不是说对方花得少，而是这几种状态：所有开销长期由你一方承担，对方持续接受，极少主动投入；你提出对等分担，对方用\"男人就该多承担\"之类的话堵回去；对方只在需要索取的时候主动联系，你陷入困难，对方没有任何实质支持。\n\n这样的关系，很难长久。一个人持续消耗，另一个人持续索取。等你无力继续供给，矛盾就会集中爆发。别指望靠持续的付出，去改变对方的观念。消费习惯，对亲密关系的认知，很难在短期内改变。\n\n怎么做呢？\n\n第一，先谈规则，再谈钱：日常开销怎么分，大额怎么办，是否有共同账户。\n\n第二，设上限：给自己定一个\"我愿意付出\"的月度额度。\n\n第三，看近六个月：谁付了多少，提出对等分担，对方是接受、回避，还是指责。\n\n第四，看困境时的支持：你遇到困难的时候，对方有没有真的在。\n\n如果一段关系长期完全单向，对方又不接受任何调整，那是关系的问题，不是你\"不够好\"的问题。要认真评估这段关系的长期可行性。\n\n可以这样说：\n\n \"我们平时吃饭轮流买单，大额的东西提前商量，借钱写个借条，这样我们都轻松，好吗？\"\n\n法律依据：《民法典》第 657 条、第 667 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "009", "title": "转账备注写\"爱你\"，这钱可能就要不回来", "grade": "A", "lead": "备注和聊天记录，是法院最先翻的两样东西。一句\"收到，月底还你\"，比一百句\"我会对你好\"都管用。", "html": "<blockquote>备注和聊天记录，是法院最先翻的两样东西。一句\"收到，月底还你\"，比一百句\"我会对你好\"都管用。<\/blockquote>\n<p>小周借给同居的女友 3 万应急。他在微信转账备注写\"借款\"，同时发了一句\"借你 3 万，下月底还\"，对方回了\"好的，下月底还你\"。后来分手，对方不认账，他把这段对话截图连同转账记录一起交给法院，很快胜诉。<\/p>\n<p>打官司的规则是：谁主张，谁举证。你说是借，你就要证明；对方说是送，对方不用证明。所以证据的负担，永远压在要钱的一方身上。<\/p>\n<p>具体怎么写？<\/p>\n<p>借款：备注写\"借款\"，聊天里让对方回复确认金额和还款时间。<\/p>\n<p>为结婚给付：聊天里写清用途，让对方回复。<\/p>\n<p>替对方还债：写明\"我替你还，之后你还给我\"。<\/p>\n<p>另外三条禁忌：不要用只能口头说清的方式，比如当面给现金、电话里说；不要把备注写成\"爱你\"\"红包\"\"520\"，这类备注会被当作赠与的证据；确认要具体，只有一句\"我会还的\"，没有金额、期限，证明力很弱。<\/p>\n<p>还有一条，是最高人民法院关于民间借贷的规定里明确的：只有转账凭证，借款人说那是还旧债，要由借款人来举证；但出借人仍然要证明借贷关系成立。意思是，转账只能证明钱到了对方账上，证明不了这是\"借\"。所以那一行字，不能省。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>借款：\"这笔 3 万我借你，下个月 30 号前还我，可以吗？\"（等对方回复\"可以\"\"好\"）\n<\/li><li>为结婚：\"这 10 万是我们说好的婚礼和彩礼用的钱，婚事办成就算数，办不成就退给我，你确认一下？\"\n<\/li><li>代偿：\"你那张卡我先替你还了，4000 块，这个月底你转给我。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民事诉讼法》第 67 条（谁主张，谁举证）；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 90 条；《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第 16 条（仅凭转账凭证主张借款的，出借人仍要证明借贷关系成立）。<\/p>\n<p><strong>把握度<\/strong>：A｜举证规则明确；话术属于经验做法。<\/p>", "text": "转账备注写\"爱你\"，这钱可能就要不回来 \n 备注和聊天记录，是法院最先翻的两样东西。一句\"收到，月底还你\"，比一百句\"我会对你好\"都管用。\n\n小周借给同居的女友 3 万应急。他在微信转账备注写\"借款\"，同时发了一句\"借你 3 万，下月底还\"，对方回了\"好的，下月底还你\"。后来分手，对方不认账，他把这段对话截图连同转账记录一起交给法院，很快胜诉。\n\n打官司的规则是：谁主张，谁举证。你说是借，你就要证明；对方说是送，对方不用证明。所以证据的负担，永远压在要钱的一方身上。\n\n具体怎么写？\n\n借款：备注写\"借款\"，聊天里让对方回复确认金额和还款时间。\n\n为结婚给付：聊天里写清用途，让对方回复。\n\n替对方还债：写明\"我替你还，之后你还给我\"。\n\n另外三条禁忌：不要用只能口头说清的方式，比如当面给现金、电话里说；不要把备注写成\"爱你\"\"红包\"\"520\"，这类备注会被当作赠与的证据；确认要具体，只有一句\"我会还的\"，没有金额、期限，证明力很弱。\n\n还有一条，是最高人民法院关于民间借贷的规定里明确的：只有转账凭证，借款人说那是还旧债，要由借款人来举证；但出借人仍然要证明借贷关系成立。意思是，转账只能证明钱到了对方账上，证明不了这是\"借\"。所以那一行字，不能省。\n\n可以这样说：\n\n 借款：\"这笔 3 万我借你，下个月 30 号前还我，可以吗？\"（等对方回复\"可以\"\"好\"）\n 为结婚：\"这 10 万是我们说好的婚礼和彩礼用的钱，婚事办成就算数，办不成就退给我，你确认一下？\"\n 代偿：\"你那张卡我先替你还了，4000 块，这个月底你转给我。\"\n\n法律依据：《民事诉讼法》第 67 条（谁主张，谁举证）；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 90 条；《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第 16 条（仅凭转账凭证主张借款的，出借人仍要证明借贷关系成立）。\n\n把握度：A｜举证规则明确；话术属于经验做法。\n\n"}, {"num": "010", "title": "大额转账，怎么证明是\"为了结婚\"才给的", "grade": "B", "lead": "关键证据不是转账记录，而是\"为了结婚\"这几个字，对方有没有认可过。", "html": "<blockquote>关键证据不是转账记录，而是\"为了结婚\"这几个字，对方有没有认可过。<\/blockquote>\n<p>小郭在订婚前给对方转了 20 万，聊天里有一句\"这钱用来办婚礼，咱们 10 月办\"，对方回了\"好\"。后来婚没办成，这几句话，成了他主张返还的核心证据。<\/p>\n<p>最高人民法院 2026 年 1 月公布的一个案例：一名男子在婚礼后同居，女方承诺登记结婚，他转了 15 万元用于买车，后来双方没有登记。法院把这笔购车款，按彩礼的规则来处理，并结合共同生活、女方终止妊娠等情况，判决返还了大部分。见附录 O 案例 O-1。<\/p>\n<p>那怎么证明\"为了结婚\"？<\/p>\n<p>第一，找聊天里的原话：\"等我们结婚\"\"这钱用来办婚礼\"\"买婚房\"。<\/p>\n<p>第二，找对方的回应：\"好\"\"谢谢，会用在婚礼上\"。<\/p>\n<p>第三，看时间线：转账是否发生在谈婚论嫁、见家长、订婚前后。<\/p>\n<p>第四，看当地习俗：有没有媒人、双方家长的参与，家长的证言可以作为辅助。<\/p>\n<p>如果这些你现在手里都没有，千万不要事后找对方\"补写\"。可以在协商的沟通里，用文字复述事实，看对方是否认可。<\/p>\n<p>单纯有转账记录，没有任何跟结婚相关的文字，很容易被认定为一般赠与。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"× 年 × 月 × 日，我给你转了 20 万，我们当时说好是用来办婚礼的。现在婚事办不成，请你按照我们的约定退还。你有不同意见，请说明。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1042 条第 1 款（禁止借婚姻索取财物）；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 3 条、第 6 条；《民事诉讼法》第 67 条。<\/p>\n<p><strong>把握度<\/strong>：B｜法院认定要看证据，各地有差异。<\/p>", "text": "大额转账，怎么证明是\"为了结婚\"才给的 \n 关键证据不是转账记录，而是\"为了结婚\"这几个字，对方有没有认可过。\n\n小郭在订婚前给对方转了 20 万，聊天里有一句\"这钱用来办婚礼，咱们 10 月办\"，对方回了\"好\"。后来婚没办成，这几句话，成了他主张返还的核心证据。\n\n最高人民法院 2026 年 1 月公布的一个案例：一名男子在婚礼后同居，女方承诺登记结婚，他转了 15 万元用于买车，后来双方没有登记。法院把这笔购车款，按彩礼的规则来处理，并结合共同生活、女方终止妊娠等情况，判决返还了大部分。见附录 O 案例 O1。\n\n那怎么证明\"为了结婚\"？\n\n第一，找聊天里的原话：\"等我们结婚\"\"这钱用来办婚礼\"\"买婚房\"。\n\n第二，找对方的回应：\"好\"\"谢谢，会用在婚礼上\"。\n\n第三，看时间线：转账是否发生在谈婚论嫁、见家长、订婚前后。\n\n第四，看当地习俗：有没有媒人、双方家长的参与，家长的证言可以作为辅助。\n\n如果这些你现在手里都没有，千万不要事后找对方\"补写\"。可以在协商的沟通里，用文字复述事实，看对方是否认可。\n\n单纯有转账记录，没有任何跟结婚相关的文字，很容易被认定为一般赠与。\n\n可以这样说：\n\n \"× 年 × 月 × 日，我给你转了 20 万，我们当时说好是用来办婚礼的。现在婚事办不成，请你按照我们的约定退还。你有不同意见，请说明。\"\n\n法律依据：《民法典》第 1042 条第 1 款（禁止借婚姻索取财物）；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 3 条、第 6 条；《民事诉讼法》第 67 条。\n\n把握度：B｜法院认定要看证据，各地有差异。\n\n"}, {"num": "011", "title": "恋人借钱，借条怎么写才不怕翻脸", "grade": "A", "lead": "借条不用复杂，要素齐全就行：谁借谁、多少钱、什么时候还。", "html": "<blockquote>借条不用复杂，要素齐全就行：谁借谁、多少钱、什么时候还。<\/blockquote>\n<p>女友开口借 3 万，小孙不好意思要借条。半年后分手，对方说\"那是你送我的\"。他手里只有转账记录，没有任何说明。后来他才明白，当初写一张三行的借条，就够了。<\/p>\n<p>借条写这几项：出借人、借款人、金额、借款日期、还款日期、是否有利息、双方签字和身份证号。附录 B 有范本。<\/p>\n<p>不好意思写借条，就转账时备注\"借款\"，在聊天里让对方回复确认。金额大的，走银行转账，不走现金。<\/p>\n<p>关于利息：自然人之间借款，没有约定利息或约定不明的，法院不支持利息。约定了的，年利率不能超过合同成立时一年期贷款市场报价利率（LPR）的四倍，超过的部分不受保护。网页版有利率上限计算器，输入当时的 LPR 就能算。<\/p>\n<p>不要因为\"恋人\"就省略约定。对方否认借款时，只有转账记录不够，你还要证明那是\"借\"，而不是\"送\"。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"你要借的这 3 万，我们写个简单的借条吧，不是不信任你，是怕以后我们自己都记不清。写上还款日期就行。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 668 条、第 669 条、第 680 条；《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第 24 条（自然人之间借款，利息没有约定或约定不明的，不支持利息）、第 25 条（利率上限）、第 16 条（只有转账凭证，借款人说是还旧债的，要由借款人举证；但出借人仍要证明借贷关系成立）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "恋人借钱，借条怎么写才不怕翻脸 \n 借条不用复杂，要素齐全就行：谁借谁、多少钱、什么时候还。\n\n女友开口借 3 万，小孙不好意思要借条。半年后分手，对方说\"那是你送我的\"。他手里只有转账记录，没有任何说明。后来他才明白，当初写一张三行的借条，就够了。\n\n借条写这几项：出借人、借款人、金额、借款日期、还款日期、是否有利息、双方签字和身份证号。附录 B 有范本。\n\n不好意思写借条，就转账时备注\"借款\"，在聊天里让对方回复确认。金额大的，走银行转账，不走现金。\n\n关于利息：自然人之间借款，没有约定利息或约定不明的，法院不支持利息。约定了的，年利率不能超过合同成立时一年期贷款市场报价利率（LPR）的四倍，超过的部分不受保护。网页版有利率上限计算器，输入当时的 LPR 就能算。\n\n不要因为\"恋人\"就省略约定。对方否认借款时，只有转账记录不够，你还要证明那是\"借\"，而不是\"送\"。\n\n可以这样说：\n\n \"你要借的这 3 万，我们写个简单的借条吧，不是不信任你，是怕以后我们自己都记不清。写上还款日期就行。\"\n\n法律依据：《民法典》第 668 条、第 669 条、第 680 条；《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第 24 条（自然人之间借款，利息没有约定或约定不明的，不支持利息）、第 25 条（利率上限）、第 16 条（只有转账凭证，借款人说是还旧债的，要由借款人举证；但出借人仍要证明借贷关系成立）。\n\n把握度：A｜法条明确。\n\n"}, {"num": "012", "title": "替对方还了信用卡和网贷，分手后能要回来吗", "grade": "B", "lead": "能不能要，看你当时说的是\"借\"，还是\"帮\"。", "html": "<blockquote>能不能要，看你当时说的是\"借\"，还是\"帮\"。<\/blockquote>\n<p>小曹替女友还了 6 万网贷。聊天里他写的是\"我先帮你还掉，你以后还我\"。分手后他起诉，凭这句话，法院认定为借款。另一个人写的是\"这点钱算我的，不用还\"，那就是赠与，要不回来。<\/p>\n<p>这里的关键是你当时的意思表示。有聊天写明\"先帮你还，之后你还我\"，属于借款；有聊天说\"不用还了\"\"算我送你\"，属于赠与。没有明确说法的，法院要结合双方关系、金额大小、事后有没有提过还款来综合判断。网贷平台的还款记录、对方事后有没有还过钱，也是参考。<\/p>\n<p>以后再遇到这种事，转账之前先写下：\"代为偿还，之后返还我\"，让对方确认。<\/p>\n<p>对方的债务如果是赌博、违法借贷产生的，要特别谨慎。这类债务本身，法律上不受保护。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"你那张卡 6 万我先替你还了，我们说好，你从下个月开始每月还我 5000，还清为止。你回复一下。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 524 条（第三人代为履行）、第 657 条；《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实。<\/p>", "text": "替对方还了信用卡和网贷，分手后能要回来吗 \n 能不能要，看你当时说的是\"借\"，还是\"帮\"。\n\n小曹替女友还了 6 万网贷。聊天里他写的是\"我先帮你还掉，你以后还我\"。分手后他起诉，凭这句话，法院认定为借款。另一个人写的是\"这点钱算我的，不用还\"，那就是赠与，要不回来。\n\n这里的关键是你当时的意思表示。有聊天写明\"先帮你还，之后你还我\"，属于借款；有聊天说\"不用还了\"\"算我送你\"，属于赠与。没有明确说法的，法院要结合双方关系、金额大小、事后有没有提过还款来综合判断。网贷平台的还款记录、对方事后有没有还过钱，也是参考。\n\n以后再遇到这种事，转账之前先写下：\"代为偿还，之后返还我\"，让对方确认。\n\n对方的债务如果是赌博、违法借贷产生的，要特别谨慎。这类债务本身，法律上不受保护。\n\n可以这样说：\n\n \"你那张卡 6 万我先替你还了，我们说好，你从下个月开始每月还我 5000，还清为止。你回复一下。\"\n\n法律依据：《民法典》第 524 条（第三人代为履行）、第 657 条；《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》。\n\n把握度：B｜依个案事实。\n\n"}, {"num": "013", "title": "证据怎么存：从截图到公证", "grade": "A", "lead": "法院不看你有多委屈，只看你拿出了什么。证据有高低，同样一件事，证据强的赢。", "html": "<blockquote>法院不看你有多委屈，只看你拿出了什么。证据有高低，同样一件事，证据强的赢。<\/blockquote>\n<p>两个人都说对方欠自己钱。甲拿的是一张手机截图，乙拿的是对方亲笔签名的借条和银行流水。法院信谁，不难猜。<\/p>\n<p>证据按证明力，从强到弱，大致是：书面协议、借条、对方签名或盖章的材料；银行流水、支付平台账单；聊天记录、邮件、语音，保留原始手机和账号；截图、录屏；证人证言；自己的陈述。<\/p>\n<p><strong>怎么保存：<\/strong><\/p>\n<p>银行流水，到开户行柜台，或用手机银行申请电子回单和交易流水，需要纸质盖章的，带身份证去柜台打印，加盖银行业务章。<\/p>\n<p>微信支付的\"账单\"里，有下载账单、开具证明的功能，可以选用途为\"用于证明资金流水\"。支付宝的账单里，有\"开具交易流水证明\"的功能，生成带电子签章的 PDF。界面和菜单名称会随版本变化，以实际为准。<\/p>\n<p>聊天记录，保留原始手机，不要换机，不要卸载微信；重要的对话，用\"聊天记录迁移与备份\"功能备份到电脑；想更稳，找公证处做\"电子数据保全公证\"，公证员现场操作你的手机，把对话和转账页面固定下来，费用通常几百到两三千元。<\/p>\n<p>截图要截出对方的头像、昵称、日期和时间，连续截，不要跳；在一个文档里按时间排好，每张标注\"证明什么\"。<\/p>\n<p>录音和视频，保留原始文件，另存一份，不要剪辑。提交时，附上文字整理。<\/p>\n<p>最容易栽的地方，是被对方质疑真实性，才发现手机已经换了，聊天已经被对方删了。所以这些事，要提前做，别等到打官司。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》第 66 条（证据种类）；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 116 条（电子数据）；《最高人民法院关于民事诉讼证据的若干规定》第 14 条、第 15 条。；《民事诉讼法》第 66 条；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 116 条。<\/p>\n<p><strong>把握度<\/strong>：A｜证据种类明确；公证费用各地不同。<\/p>", "text": "证据怎么存：从截图到公证 \n 法院不看你有多委屈，只看你拿出了什么。证据有高低，同样一件事，证据强的赢。\n\n两个人都说对方欠自己钱。甲拿的是一张手机截图，乙拿的是对方亲笔签名的借条和银行流水。法院信谁，不难猜。\n\n证据按证明力，从强到弱，大致是：书面协议、借条、对方签名或盖章的材料；银行流水、支付平台账单；聊天记录、邮件、语音，保留原始手机和账号；截图、录屏；证人证言；自己的陈述。\n\n怎么保存：\n\n银行流水，到开户行柜台，或用手机银行申请电子回单和交易流水，需要纸质盖章的，带身份证去柜台打印，加盖银行业务章。\n\n微信支付的\"账单\"里，有下载账单、开具证明的功能，可以选用途为\"用于证明资金流水\"。支付宝的账单里，有\"开具交易流水证明\"的功能，生成带电子签章的 PDF。界面和菜单名称会随版本变化，以实际为准。\n\n聊天记录，保留原始手机，不要换机，不要卸载微信；重要的对话，用\"聊天记录迁移与备份\"功能备份到电脑；想更稳，找公证处做\"电子数据保全公证\"，公证员现场操作你的手机，把对话和转账页面固定下来，费用通常几百到两三千元。\n\n截图要截出对方的头像、昵称、日期和时间，连续截，不要跳；在一个文档里按时间排好，每张标注\"证明什么\"。\n\n录音和视频，保留原始文件，另存一份，不要剪辑。提交时，附上文字整理。\n\n最容易栽的地方，是被对方质疑真实性，才发现手机已经换了，聊天已经被对方删了。所以这些事，要提前做，别等到打官司。\n\n法律依据：《民事诉讼法》第 66 条（证据种类）；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 116 条（电子数据）；《最高人民法院关于民事诉讼证据的若干规定》第 14 条、第 15 条。；《民事诉讼法》第 66 条；《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 116 条。\n\n把握度：A｜证据种类明确；公证费用各地不同。\n\n"}, {"num": "014", "title": "想收集证据，先别让自己违法", "grade": "A", "lead": "证据要合法取得。非法取得的证据，不仅用不了，还可能让你自己吃官司。", "html": "<blockquote>证据要合法取得。非法取得的证据，不仅用不了，还可能让你自己吃官司。<\/blockquote>\n<p>阿强怀疑妻子有外遇，在她车里装了定位器，又趁她睡着用她的指纹解锁手机，翻聊天记录。拿到的东西，法院不予采纳；妻子反过来以侵犯隐私报了警。他从原告，变成了被追责的人。<\/p>\n<p>最高人民法院关于民事诉讼的司法解释第 106 条明确：以严重侵害他人合法权益、违反法律禁止性规定或者严重违背公序良俗的方法形成或获取的证据，不能作为认定案件事实的根据。<\/p>\n<p><strong>可以做的：<\/strong> 自己参与的对话，自己录音；保存对方主动发给你的微信、短信、邮件；自己账户、自己设备上留下的记录；申请法院调取、申请调查令，由法院或律师依法去查；报警后由警方调取。<\/p>\n<p><strong>不要做的：<\/strong> 破解对方的手机、邮箱、网盘密码；在对方的车里、家里装定位器、窃听器、摄像头，尤其是私密空间；趁对方睡着，用对方的指纹、人脸解锁手机；向\"调查公司\"购买对方的开房记录、定位、通话记录。<\/p>\n<p>这几条越线，轻的是证据被排除，重的可能涉及侵犯公民个人信息罪（《刑法》第 253 条之一）、非法使用窃听窃照专用器材罪（第 284 条），还有隐私权的民事责任。<\/p>\n<p>网上常说\"录音合法\"。准确地说：自己参与的对话录音，通常可以作为证据；偷录别人之间的对话，在私密空间偷拍偷录，风险很高。<\/p>\n<p>想\"抓住\"对方的心情我懂，但违法取证，最后输的常常是你自己。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 106 条（以严重侵害他人合法权益、违反法律禁止性规定或者严重违背公序良俗的方法形成或者获取的证据，不得作为认定案件事实的根据）；《刑法》第 253 条之一（侵犯公民个人信息罪）、第 284 条（非法使用窃听、窃照专用器材罪）；《个人信息保护法》；《民法典》第 1032 条（隐私权）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "想收集证据，先别让自己违法 \n 证据要合法取得。非法取得的证据，不仅用不了，还可能让你自己吃官司。\n\n阿强怀疑妻子有外遇，在她车里装了定位器，又趁她睡着用她的指纹解锁手机，翻聊天记录。拿到的东西，法院不予采纳；妻子反过来以侵犯隐私报了警。他从原告，变成了被追责的人。\n\n最高人民法院关于民事诉讼的司法解释第 106 条明确：以严重侵害他人合法权益、违反法律禁止性规定或者严重违背公序良俗的方法形成或获取的证据，不能作为认定案件事实的根据。\n\n可以做的： 自己参与的对话，自己录音；保存对方主动发给你的微信、短信、邮件；自己账户、自己设备上留下的记录；申请法院调取、申请调查令，由法院或律师依法去查；报警后由警方调取。\n\n不要做的： 破解对方的手机、邮箱、网盘密码；在对方的车里、家里装定位器、窃听器、摄像头，尤其是私密空间；趁对方睡着，用对方的指纹、人脸解锁手机；向\"调查公司\"购买对方的开房记录、定位、通话记录。\n\n这几条越线，轻的是证据被排除，重的可能涉及侵犯公民个人信息罪（《刑法》第 253 条之一）、非法使用窃听窃照专用器材罪（第 284 条），还有隐私权的民事责任。\n\n网上常说\"录音合法\"。准确地说：自己参与的对话录音，通常可以作为证据；偷录别人之间的对话，在私密空间偷拍偷录，风险很高。\n\n想\"抓住\"对方的心情我懂，但违法取证，最后输的常常是你自己。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民事诉讼法〉的解释》第 106 条（以严重侵害他人合法权益、违反法律禁止性规定或者严重违背公序良俗的方法形成或者获取的证据，不得作为认定案件事实的根据）；《刑法》第 253 条之一（侵犯公民个人信息罪）、第 284 条（非法使用窃听、窃照专用器材罪）；《个人信息保护法》；《民法典》第 1032 条（隐私权）。\n\n把握度：A｜法条明确。\n\n"}, {"num": "015", "title": "吵到最凶的时候：不转账，不签字，不认错", "grade": "C", "lead": "情绪最高的时候做的决定，事后最容易变成对你不利的证据。", "html": "<blockquote>情绪最高的时候做的决定，事后最容易变成对你不利的证据。<\/blockquote>\n<p>吵架时，对方说\"你不转 10 万，我们就完了\"。小李为了稳住，当场转了，还在聊天里写\"都是我的错，我愿意补偿\"。后来这段话，成了对方起诉时的证据。<\/p>\n<p>情绪最高的时候，人最不理性，也最容易说出对自己不利的话。这个时候要做的只有一件事：<strong>暂停<\/strong>。<\/p>\n<p>回一句：\"我需要想一想，明天回复你。\"不转账，不签任何文件，不写任何书面的\"承认\"。不要为了安抚对方，在聊天里承认没发生过的事实。<\/p>\n<p>对方以自伤、曝光、报警相威胁，保留聊天记录和录音。对方出现明显自伤风险，联系对方家人，或拨打 110、120。这和保护自己并不冲突。<\/p>\n<p>事后你想主张\"当时是被胁迫的\"，需要证据，难度不低，所以最好的办法，是当时就别签。《民法典》第 147 条到第 151 条确实规定了，因重大误解、欺诈、胁迫、显失公平作出的意思表示，可以请求撤销，但那是事后补救，成本高，不确定。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我听到你说的了，我现在情绪也不太好，我们明天上午再谈，好吗？\"\n<\/li><li>\"这件事我需要和家人商量一下，之后给你答复。\"\n<\/li><li>\"我不会在这种状态下做决定，也不会签任何东西。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 147 条至第 151 条（重大误解、欺诈、胁迫、显失公平的撤销）；《民事诉讼法》第 67 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法，法条只是兜底。<\/p>", "text": "吵到最凶的时候：不转账，不签字，不认错 \n 情绪最高的时候做的决定，事后最容易变成对你不利的证据。\n\n吵架时，对方说\"你不转 10 万，我们就完了\"。小李为了稳住，当场转了，还在聊天里写\"都是我的错，我愿意补偿\"。后来这段话，成了对方起诉时的证据。\n\n情绪最高的时候，人最不理性，也最容易说出对自己不利的话。这个时候要做的只有一件事：暂停。\n\n回一句：\"我需要想一想，明天回复你。\"不转账，不签任何文件，不写任何书面的\"承认\"。不要为了安抚对方，在聊天里承认没发生过的事实。\n\n对方以自伤、曝光、报警相威胁，保留聊天记录和录音。对方出现明显自伤风险，联系对方家人，或拨打 110、120。这和保护自己并不冲突。\n\n事后你想主张\"当时是被胁迫的\"，需要证据，难度不低，所以最好的办法，是当时就别签。《民法典》第 147 条到第 151 条确实规定了，因重大误解、欺诈、胁迫、显失公平作出的意思表示，可以请求撤销，但那是事后补救，成本高，不确定。\n\n可以这样说：\n\n \"我听到你说的了，我现在情绪也不太好，我们明天上午再谈，好吗？\"\n \"这件事我需要和家人商量一下，之后给你答复。\"\n \"我不会在这种状态下做决定，也不会签任何东西。\"\n\n法律依据：《民法典》第 147 条至第 151 条（重大误解、欺诈、胁迫、显失公平的撤销）；《民事诉讼法》第 67 条。\n\n把握度：C｜经验做法，法条只是兜底。\n\n"}, {"num": "016", "title": "三年一过，钱就难要了", "grade": "A", "lead": "权利不会永远等你。大多数民事权利，三年不主张，就失去了胜诉的保障。", "html": "<blockquote>权利不会永远等你。大多数民事权利，三年不主张，就失去了胜诉的保障。<\/blockquote>\n<p>2022 年 3 月，小赵借给朋友 2 万，约定 9 月 30 日还。到 2025 年 10 月 1 日，三年已过。他想起去起诉，对方抗辩说\"已过时效\"，法院支持了对方。<\/p>\n<p>《民法典》第 188 条规定：向法院请求保护民事权利的诉讼时效期间是三年，从权利人知道或应当知道权利受到损害，以及义务人之日起算；有约定还款日期的，从还款期限届满之日起算。<\/p>\n<p>时间过了，不是权利消灭，而是对方可以拿\"时效已过\"来抗辩。对方不抗辩，法院不会主动适用。但这不是你拖延的理由。<\/p>\n<p>那想让时效\"重新开始\"，怎么办？可以通过书面催收、让对方书面承认欠款、起诉等方式，让时效中断（第 195 条），并保留证据。离婚后发现对方隐藏、转移财产，三年自发现之日起算，见 <a href=\"#/e/093\">第 093 条<\/a>。网页版有时效计算器。<\/p>\n<p><strong>可以这样说<\/strong>（书面催收）：<\/p>\n<ul><li>\"×× 你好，你于 2022 年 3 月向我借款 2 万元，约定 2022 年 9 月 30 日归还，至今未还。请于 ×× 月 ×× 日前还清。本信息作为正式催收，请你确认收到。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 188 条（三年诉讼时效）、第 195 条（时效中断）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 84 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "三年一过，钱就难要了 \n 权利不会永远等你。大多数民事权利，三年不主张，就失去了胜诉的保障。\n\n2022 年 3 月，小赵借给朋友 2 万，约定 9 月 30 日还。到 2025 年 10 月 1 日，三年已过。他想起去起诉，对方抗辩说\"已过时效\"，法院支持了对方。\n\n《民法典》第 188 条规定：向法院请求保护民事权利的诉讼时效期间是三年，从权利人知道或应当知道权利受到损害，以及义务人之日起算；有约定还款日期的，从还款期限届满之日起算。\n\n时间过了，不是权利消灭，而是对方可以拿\"时效已过\"来抗辩。对方不抗辩，法院不会主动适用。但这不是你拖延的理由。\n\n那想让时效\"重新开始\"，怎么办？可以通过书面催收、让对方书面承认欠款、起诉等方式，让时效中断（第 195 条），并保留证据。离婚后发现对方隐藏、转移财产，三年自发现之日起算，见 第 093 条。网页版有时效计算器。\n\n可以这样说（书面催收）：\n\n \"×× 你好，你于 2022 年 3 月向我借款 2 万元，约定 2022 年 9 月 30 日归还，至今未还。请于 ×× 月 ×× 日前还清。本信息作为正式催收，请你确认收到。\"\n\n法律依据：《民法典》第 188 条（三年诉讼时效）、第 195 条（时效中断）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 84 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "017", "title": "以结婚为名骗钱：婚托、杀猪盘、闪婚骗彩礼", "grade": "A", "lead": "以结婚为名骗钱，是诈骗，不是\"感情纠纷\"。被骗的男性，同样有权报警。", "html": "<blockquote>以结婚为名骗钱，是诈骗，不是\"感情纠纷\"。被骗的男性，同样有权报警。<\/blockquote>\n<p>最高人民法院 2026 年 1 月公布的案例中，有一名女子，2021 年到 2024 年间，以说媒、订婚、送礼、借款等名义，从 15 人手中拿走共 100 多万元，被判诈骗罪，责令退赔。另一个案例里，一对男女经媒人介绍，三天内登记结婚，男方当天给付 20 万元彩礼，女方十天后离开，拒绝共同生活，法院判决离婚，全额返还。见附录 O 案例 O-4、O-5。<\/p>\n<p>常见的套路有四种：网恋对象很快表达感情，引导你到某个投资平台；相亲后快速订婚，收取彩礼后拒绝结婚、拒绝返还；婚介机构收取高额服务费，提供虚假对象（婚托）；多次与不同对象\"闪婚\"，收彩礼。<\/p>\n<p>发现了，怎么办？<\/p>\n<p>第一，立刻停止转账，保存聊天记录、转账记录、对方的账号和平台信息。<\/p>\n<p>第二，报警。可以到派出所报案，或拨打 110；涉及境外平台、虚拟货币的，同时通过国家反诈中心 App 举报，向警方说明资金流向。<\/p>\n<p>第三，已经支付彩礼的，除了民事返还，还可以通过刑事途径追究，《刑法》第 266 条是诈骗罪。<\/p>\n<p>别因为觉得丢脸就不报案。觉得丢脸，是骗子最大的帮手。诈骗案件追回的时间窗口很短，越早越好。<\/p>\n<p><strong>法律依据<\/strong>：《刑法》第 266 条（诈骗罪）；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 2 条；《反电信网络诈骗法》。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确；追回结果难说。<\/p>", "text": "以结婚为名骗钱：婚托、杀猪盘、闪婚骗彩礼 \n 以结婚为名骗钱，是诈骗，不是\"感情纠纷\"。被骗的男性，同样有权报警。\n\n最高人民法院 2026 年 1 月公布的案例中，有一名女子，2021 年到 2024 年间，以说媒、订婚、送礼、借款等名义，从 15 人手中拿走共 100 多万元，被判诈骗罪，责令退赔。另一个案例里，一对男女经媒人介绍，三天内登记结婚，男方当天给付 20 万元彩礼，女方十天后离开，拒绝共同生活，法院判决离婚，全额返还。见附录 O 案例 O4、O5。\n\n常见的套路有四种：网恋对象很快表达感情，引导你到某个投资平台；相亲后快速订婚，收取彩礼后拒绝结婚、拒绝返还；婚介机构收取高额服务费，提供虚假对象（婚托）；多次与不同对象\"闪婚\"，收彩礼。\n\n发现了，怎么办？\n\n第一，立刻停止转账，保存聊天记录、转账记录、对方的账号和平台信息。\n\n第二，报警。可以到派出所报案，或拨打 110；涉及境外平台、虚拟货币的，同时通过国家反诈中心 App 举报，向警方说明资金流向。\n\n第三，已经支付彩礼的，除了民事返还，还可以通过刑事途径追究，《刑法》第 266 条是诈骗罪。\n\n别因为觉得丢脸就不报案。觉得丢脸，是骗子最大的帮手。诈骗案件追回的时间窗口很短，越早越好。\n\n法律依据：《刑法》第 266 条（诈骗罪）；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》第 2 条；《反电信网络诈骗法》。\n\n把握度：A｜法条明确；追回结果难说。\n\n"}]}, {"title": "第二章　红线与保命", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：刑事风险不来自\"坏\"，来自\"上头\"和\"说不清\"。钱输了可以再要，刑事案子来了，几乎没有回头路。<br><br><strong>口诀<\/strong>：不动手，不威胁，不传私密；醉酒不亲密，吵架先走开；被问话，先找律师。<\/blockquote>\n<p>这一章讲的是风险识别，不是教你怎么\"拿捏\"对方。书里提到的任何场景，都以\"不违法、不伤害他人\"为前提。<\/p>", "entries": [{"num": "018", "title": "订了婚，也不等于\"同意\"", "grade": "A", "lead": "有婚约、同居、恋爱关系，都不是性行为的免责牌。每一次，都要双方清醒、自愿。", "html": "<blockquote>有婚约、同居、恋爱关系，都不是性行为的免责牌。每一次，都要双方清醒、自愿。<\/blockquote>\n<p>订婚当晚，双方都喝了酒。男方认为\"都订婚了，没问题\"；女方事后说自己当时不愿意，报了警。男方这才发现，他拿不出任何东西，能说明对方当时是自愿的。<\/p>\n<p>很多人以为，订了婚、谈着恋爱，性行为就自然是\"同意\"的。这是一个要命的误区。<\/p>\n<p>婚约不等于婚姻，更不等于放弃性自主的权利。《刑法》第 236 条规定的强奸罪，是以暴力、胁迫或者其他手段，违背妇女意志，强行发生性关系。这里的关键是\"违背意志\"，和两个人是什么关系，没有关系。订了婚、同居了、有感情，只要发生行为的当时，对方不愿意，依然可能构成犯罪。另外，强奸罪的被害人是妇女，强制猥亵罪（第 237 条）的被害人不限性别。<\/p>\n<p>这并不是说，只要对方事后报案，就一定定罪。刑事案件，要有完整的证据链：行为前后的聊天，现场环境，有没有反抗和伤痕，报案的时间，双方陈述有没有矛盾。法院不会只凭一方的说法定案。<\/p>\n<p>那你该怎么做？<\/p>\n<p>第一，每一次亲密行为前，确认对方清醒，没有醉酒，没有被胁迫。<\/p>\n<p>第二，对方明确拒绝、沉默回避、情绪抗拒的时候，立刻停下来，不要继续推进。<\/p>\n<p>第三，不要用\"我们都订婚了\"\"你是我女朋友\"作为继续的理由。<\/p>\n<p>第四，争吵、分手谈判期间，不发生亲密行为；对方醉酒、昏睡、精神状态异常时，不发生亲密行为。<\/p>\n<p>这几条，没有例外。婚姻关系存续期间的相关问题，司法实践里有复杂情形，同样不要把婚姻关系当作理由。<\/p>\n<p><strong>法律依据<\/strong>：《刑法》第 236 条（强奸罪，以暴力、胁迫或者其他手段违背妇女意志）；第 237 条（强制猥亵罪）；《民法典》第 1010 条（禁止性骚扰）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "订了婚，也不等于\"同意\" \n 有婚约、同居、恋爱关系，都不是性行为的免责牌。每一次，都要双方清醒、自愿。\n\n订婚当晚，双方都喝了酒。男方认为\"都订婚了，没问题\"；女方事后说自己当时不愿意，报了警。男方这才发现，他拿不出任何东西，能说明对方当时是自愿的。\n\n很多人以为，订了婚、谈着恋爱，性行为就自然是\"同意\"的。这是一个要命的误区。\n\n婚约不等于婚姻，更不等于放弃性自主的权利。《刑法》第 236 条规定的强奸罪，是以暴力、胁迫或者其他手段，违背妇女意志，强行发生性关系。这里的关键是\"违背意志\"，和两个人是什么关系，没有关系。订了婚、同居了、有感情，只要发生行为的当时，对方不愿意，依然可能构成犯罪。另外，强奸罪的被害人是妇女，强制猥亵罪（第 237 条）的被害人不限性别。\n\n这并不是说，只要对方事后报案，就一定定罪。刑事案件，要有完整的证据链：行为前后的聊天，现场环境，有没有反抗和伤痕，报案的时间，双方陈述有没有矛盾。法院不会只凭一方的说法定案。\n\n那你该怎么做？\n\n第一，每一次亲密行为前，确认对方清醒，没有醉酒，没有被胁迫。\n\n第二，对方明确拒绝、沉默回避、情绪抗拒的时候，立刻停下来，不要继续推进。\n\n第三，不要用\"我们都订婚了\"\"你是我女朋友\"作为继续的理由。\n\n第四，争吵、分手谈判期间，不发生亲密行为；对方醉酒、昏睡、精神状态异常时，不发生亲密行为。\n\n这几条，没有例外。婚姻关系存续期间的相关问题，司法实践里有复杂情形，同样不要把婚姻关系当作理由。\n\n法律依据：《刑法》第 236 条（强奸罪，以暴力、胁迫或者其他手段违背妇女意志）；第 237 条（强制猥亵罪）；《民法典》第 1010 条（禁止性骚扰）。\n\n把握度：A｜法条明确。\n\n"}, {"num": "019", "title": "最容易被冤枉的六种场合", "grade": "C", "lead": "风险高的，不是\"坏人\"，而是证据模糊的时刻。提前识别，提前避开。", "html": "<blockquote>风险高的，不是\"坏人\"，而是证据模糊的时刻。提前识别，提前避开。<\/blockquote>\n<p>聚会后两人都喝多了，回到住处。第二天，双方对\"谁先主动\"的回忆完全不同，没有任何记录能证明谁说的对。<\/p>\n<p>梳理司法实践，有六类场景，被指控的风险明显高于一般交往。这不是说对方一定会诬告，而是一旦出现分歧，你手里的证据最弱：<\/p>\n<p><strong>第一，饮酒后。<\/strong> 双方都喝酒，对当时意愿的回忆很容易有分歧。酒精还会削弱判断力，事后很难证明对方当时是自愿的。<\/p>\n<p><strong>第二，激烈争吵之后。<\/strong> 气话、情绪化的言论，之后可能被引用。吵架后先分开冷静。<\/p>\n<p><strong>第三，分手谈判期间。<\/strong> 涉及财产、补偿的谈判，有人会用报案当筹码。这个时候，全程用文字沟通，不单独见面。<\/p>\n<p><strong>第四，对话模糊。<\/strong> 对亲密行为只口头说\"可以吧\"，没有别的迹象。以清晰、清醒的同意为准。<\/p>\n<p><strong>第五，一方情绪或精神状态不稳。<\/strong> 不要继续推进。<\/p>\n<p><strong>第六，在对方家里或第三方环境。<\/strong> 对方的情绪容易被他人影响。尽量避免。<\/p>\n<p>这些场合下的\"风险\"，不是要你防着对方，而是提醒你：把事情做在\"说得清\"的地方，才是保护双方。<\/p>\n<p><strong>法律依据<\/strong>：《刑法》第 236 条、第 237 条；《刑事诉讼法》第 55 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验判断。<\/p>", "text": "最容易被冤枉的六种场合 \n 风险高的，不是\"坏人\"，而是证据模糊的时刻。提前识别，提前避开。\n\n聚会后两人都喝多了，回到住处。第二天，双方对\"谁先主动\"的回忆完全不同，没有任何记录能证明谁说的对。\n\n梳理司法实践，有六类场景，被指控的风险明显高于一般交往。这不是说对方一定会诬告，而是一旦出现分歧，你手里的证据最弱：\n\n第一，饮酒后。 双方都喝酒，对当时意愿的回忆很容易有分歧。酒精还会削弱判断力，事后很难证明对方当时是自愿的。\n\n第二，激烈争吵之后。 气话、情绪化的言论，之后可能被引用。吵架后先分开冷静。\n\n第三，分手谈判期间。 涉及财产、补偿的谈判，有人会用报案当筹码。这个时候，全程用文字沟通，不单独见面。\n\n第四，对话模糊。 对亲密行为只口头说\"可以吧\"，没有别的迹象。以清晰、清醒的同意为准。\n\n第五，一方情绪或精神状态不稳。 不要继续推进。\n\n第六，在对方家里或第三方环境。 对方的情绪容易被他人影响。尽量避免。\n\n这些场合下的\"风险\"，不是要你防着对方，而是提醒你：把事情做在\"说得清\"的地方，才是保护双方。\n\n法律依据：《刑法》第 236 条、第 237 条；《刑事诉讼法》第 55 条。\n\n把握度：C｜经验判断。\n\n"}, {"num": "020", "title": "被人冤枉了，先稳住，再留证，别私下\"谈\"", "grade": "A", "lead": "自证清白，比预防难得多。先保全证据，再通过律师沟通，不要自己去找对方谈。", "html": "<blockquote>自证清白，比预防难得多。先保全证据，再通过律师沟通，不要自己去找对方谈。<\/blockquote>\n<p>小方和女友分手谈补偿，对方提出要 30 万，否则\"就去报警说你强迫我\"。他吓得想转账了事，朋友劝他先找律师。他保留了全部聊天记录，对方的威胁，后来反倒成了对其不利的证据。<\/p>\n<p>被冤枉的人，往往做错两件事：自己先慌了，然后私下去\"谈\"。<\/p>\n<p>被诬告，要冷静地做这几件事：<\/p>\n<p>第一，保全全部相关证据：聊天记录、语音、通话记录、转账记录、行程、监控、门禁、酒店记录、证人。<\/p>\n<p>第二，梳理时间线：事前、事中、事后，每个节点有什么记录。<\/p>\n<p>第三，<strong>不要私下联系对方协商撤案，不要转账\"了事\"<\/strong>。大额转账，可能被理解成默认的表示。<\/p>\n<p>第四，通过律师，向办案机关提交证据材料和意见。<\/p>\n<p>第五，对方确属诬告的，通过律师评估：是否构成诬告陷害罪（《刑法》第 243 条），是否提起名誉权诉讼（《民法典》第 1024 条）。但反制需要充分的证据，证据不足时，反告可能无效，甚至被认为是在施压。<\/p>\n<p>要提醒一句：不要自己去找对方\"谈判\"，也不要发消息威胁。这些行为本身，可能被认定为干扰证据，或者制造新的纠纷。<\/p>\n<p><strong>法律依据<\/strong>：《刑法》第 243 条（诬告陷害罪）；《刑事诉讼法》第 55 条（重证据，不轻信口供）；《民法典》第 1024 条（名誉权）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确；策略属于经验做法。<\/p>", "text": "被人冤枉了，先稳住，再留证，别私下\"谈\" \n 自证清白，比预防难得多。先保全证据，再通过律师沟通，不要自己去找对方谈。\n\n小方和女友分手谈补偿，对方提出要 30 万，否则\"就去报警说你强迫我\"。他吓得想转账了事，朋友劝他先找律师。他保留了全部聊天记录，对方的威胁，后来反倒成了对其不利的证据。\n\n被冤枉的人，往往做错两件事：自己先慌了，然后私下去\"谈\"。\n\n被诬告，要冷静地做这几件事：\n\n第一，保全全部相关证据：聊天记录、语音、通话记录、转账记录、行程、监控、门禁、酒店记录、证人。\n\n第二，梳理时间线：事前、事中、事后，每个节点有什么记录。\n\n第三，不要私下联系对方协商撤案，不要转账\"了事\"。大额转账，可能被理解成默认的表示。\n\n第四，通过律师，向办案机关提交证据材料和意见。\n\n第五，对方确属诬告的，通过律师评估：是否构成诬告陷害罪（《刑法》第 243 条），是否提起名誉权诉讼（《民法典》第 1024 条）。但反制需要充分的证据，证据不足时，反告可能无效，甚至被认为是在施压。\n\n要提醒一句：不要自己去找对方\"谈判\"，也不要发消息威胁。这些行为本身，可能被认定为干扰证据，或者制造新的纠纷。\n\n法律依据：《刑法》第 243 条（诬告陷害罪）；《刑事诉讼法》第 55 条（重证据，不轻信口供）；《民法典》第 1024 条（名誉权）。\n\n把握度：A｜法条明确；策略属于经验做法。\n\n"}, {"num": "021", "title": "接到警察电话，前二十四小时怎么走", "grade": "A", "lead": "不要自己扛。第一时间找律师，说话只说事实，不签看不懂的东西。", "html": "<blockquote>不要自己扛。第一时间找律师，说话只说事实，不签看不懂的东西。<\/blockquote>\n<p>小袁接到派出所电话，说有人报案，让他\"过来说一下情况\"。他觉得自己没做什么，就独自去了，没有律师在场，笔录里留了一些含糊的话，之后被反复引用。<\/p>\n<p>很多人觉得\"我没做，就不需要律师\"。询问阶段的口供，会被反复使用，第一次笔录往往最关键。<\/p>\n<p>第一，先问清楚：哪个单位、什么案由、需要你做什么。要求出示证件，看清传唤文书。<\/p>\n<p>第二，马上联系律师，或让家人帮你联系。没有律师，可以拨 12348 求助法律援助。<\/p>\n<p>第三，接受询问时，说你知道的事实；不确定的，说\"不确定\"；不要猜测，不要为了脱身而承认没做过的事。<\/p>\n<p>第四，笔录看清楚再签字，有错误要求更正，不同意的，写明\"以上与我说的不符\"。<\/p>\n<p>第五，不要销毁、删除手机里的聊天记录，不要私下与对方串供，也不要去威胁、劝说对方撤案。<\/p>\n<p>要知道你的权利：刑事传唤、拘传持续时间，一般不超过十二小时；案情特别重大、复杂，需要采取拘留、逮捕措施的，不超过二十四小时（《刑事诉讼法》第 119 条）。犯罪嫌疑人自第一次被讯问或者被采取强制措施之日起，有权委托辩护人（第 34 条），不得强迫任何人证实自己有罪（第 52 条），讯问笔录要交你核对、签名（第 122 条）。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我愿意配合，但我需要先联系律师，律师到场之前，我不回答。\"\n<\/li><li>\"这个笔录我没有看完，我看完再签。\"\n<\/li><li>\"这一句不是我的意思，请改成……\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《刑事诉讼法》第 34 条（委托辩护人）、第 119 条（拘传、传唤时限）、第 52 条（不得强迫自证其罪）、第 122 条（笔录核对）；《治安管理处罚法》。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "接到警察电话，前二十四小时怎么走 \n 不要自己扛。第一时间找律师，说话只说事实，不签看不懂的东西。\n\n小袁接到派出所电话，说有人报案，让他\"过来说一下情况\"。他觉得自己没做什么，就独自去了，没有律师在场，笔录里留了一些含糊的话，之后被反复引用。\n\n很多人觉得\"我没做，就不需要律师\"。询问阶段的口供，会被反复使用，第一次笔录往往最关键。\n\n第一，先问清楚：哪个单位、什么案由、需要你做什么。要求出示证件，看清传唤文书。\n\n第二，马上联系律师，或让家人帮你联系。没有律师，可以拨 12348 求助法律援助。\n\n第三，接受询问时，说你知道的事实；不确定的，说\"不确定\"；不要猜测，不要为了脱身而承认没做过的事。\n\n第四，笔录看清楚再签字，有错误要求更正，不同意的，写明\"以上与我说的不符\"。\n\n第五，不要销毁、删除手机里的聊天记录，不要私下与对方串供，也不要去威胁、劝说对方撤案。\n\n要知道你的权利：刑事传唤、拘传持续时间，一般不超过十二小时；案情特别重大、复杂，需要采取拘留、逮捕措施的，不超过二十四小时（《刑事诉讼法》第 119 条）。犯罪嫌疑人自第一次被讯问或者被采取强制措施之日起，有权委托辩护人（第 34 条），不得强迫任何人证实自己有罪（第 52 条），讯问笔录要交你核对、签名（第 122 条）。\n\n可以这样说：\n\n \"我愿意配合，但我需要先联系律师，律师到场之前，我不回答。\"\n \"这个笔录我没有看完，我看完再签。\"\n \"这一句不是我的意思，请改成……\"\n\n法律依据：《刑事诉讼法》第 34 条（委托辩护人）、第 119 条（拘传、传唤时限）、第 52 条（不得强迫自证其罪）、第 122 条（笔录核对）；《治安管理处罚法》。\n\n把握度：A｜法条明确。\n\n"}, {"num": "022", "title": "吵架上头，最容易碰上的九个罪名", "grade": "A", "lead": "矛盾上头时，几个动作最容易越线。知道线在哪里，才能不踩。", "html": "<blockquote>矛盾上头时，几个动作最容易越线。知道线在哪里，才能不踩。<\/blockquote>\n<p>小贾和前女友分手后，把她的私密照片发给了两个朋友，说\"让你们看看她是什么人\"。他以为只是私下发，其实已经涉嫌违法。<\/p>\n<p>情侣、夫妻之间的矛盾，不是\"私事\"这么简单。一旦行为碰到刑法的边界，不会因为曾经相爱就免责。感情纠纷里最常见的九个罪名：<\/p>\n<ol><li><strong>故意伤害罪<\/strong>（《刑法》第 234 条）：打架致对方轻伤及以上。\n<\/li><li><strong>非法拘禁罪<\/strong>（第 238 条）：不让对方离开房间、车辆。\n<\/li><li><strong>非法侵入住宅罪<\/strong>（第 245 条）：分手后强行闯入对方住处。\n<\/li><li><strong>敲诈勒索罪<\/strong>（第 274 条）：拿私密照片、隐私威胁索钱。\n<\/li><li><strong>侮辱罪、诽谤罪<\/strong>（第 246 条）：编造并在网络、群里散布。\n<\/li><li><strong>侵犯公民个人信息罪<\/strong>（第 253 条之一）：买卖、窃取对方的行踪、通话、开房记录。\n<\/li><li><strong>传播淫秽物品罪等<\/strong>（第 364 条）：传播他人私密影像。\n<\/li><li><strong>重婚罪<\/strong>（第 258 条）：有配偶而再婚，或与他人以夫妻名义同居。\n<\/li><li><strong>虐待罪、遗弃罪<\/strong>（第 260 条、第 261 条）：对家庭成员长期虐待、遗弃。\n<\/li><\/ol>\n<p>另外，轻微的殴打、辱骂、威胁、偷拍，可能构成治安违法，要被拘留、罚款。<\/p>\n<p>一旦涉刑，影响的是档案、职业、家庭，几乎不可逆。矛盾上头的那十秒，可能决定后面的十年。情绪失控时，先走开，是最便宜的保险。<\/p>\n<p><strong>法律依据<\/strong>：上表所列《刑法》条文；《治安管理处罚法》。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "吵架上头，最容易碰上的九个罪名 \n 矛盾上头时，几个动作最容易越线。知道线在哪里，才能不踩。\n\n小贾和前女友分手后，把她的私密照片发给了两个朋友，说\"让你们看看她是什么人\"。他以为只是私下发，其实已经涉嫌违法。\n\n情侣、夫妻之间的矛盾，不是\"私事\"这么简单。一旦行为碰到刑法的边界，不会因为曾经相爱就免责。感情纠纷里最常见的九个罪名：\n\n1. 故意伤害罪（《刑法》第 234 条）：打架致对方轻伤及以上。\n2. 非法拘禁罪（第 238 条）：不让对方离开房间、车辆。\n3. 非法侵入住宅罪（第 245 条）：分手后强行闯入对方住处。\n4. 敲诈勒索罪（第 274 条）：拿私密照片、隐私威胁索钱。\n5. 侮辱罪、诽谤罪（第 246 条）：编造并在网络、群里散布。\n6. 侵犯公民个人信息罪（第 253 条之一）：买卖、窃取对方的行踪、通话、开房记录。\n7. 传播淫秽物品罪等（第 364 条）：传播他人私密影像。\n8. 重婚罪（第 258 条）：有配偶而再婚，或与他人以夫妻名义同居。\n9. 虐待罪、遗弃罪（第 260 条、第 261 条）：对家庭成员长期虐待、遗弃。\n\n另外，轻微的殴打、辱骂、威胁、偷拍，可能构成治安违法，要被拘留、罚款。\n\n一旦涉刑，影响的是档案、职业、家庭，几乎不可逆。矛盾上头的那十秒，可能决定后面的十年。情绪失控时，先走开，是最便宜的保险。\n\n法律依据：上表所列《刑法》条文；《治安管理处罚法》。\n\n把握度：A｜法条明确。\n\n"}, {"num": "023", "title": "\"不给钱我就报警\"：什么时候从讨债变成敲诈", "grade": "B", "lead": "正当地主张权利，和威胁索财，中间有一条线：要的数额与权利是否相称，手段是否合法。", "html": "<blockquote>正当地主张权利，和威胁索财，中间有一条线：要的数额与权利是否相称，手段是否合法。<\/blockquote>\n<p>小葛被前任威胁：\"不给 10 万，我就把你的事发给你们公司。\"他保留了聊天记录，报了警。对方以曝光相要挟、反复要钱，已经涉嫌敲诈勒索，警方立案调查。<\/p>\n<p><strong>如果你是被威胁的一方。<\/strong> 保留全部聊天记录和录音；不要仓促转账，转账之后，对方往往会提出更高的要求；把证据交给警方，说明对方以曝光、报案为手段索取财物；通过律师沟通。<\/p>\n<p><strong>如果你是想主张权利的一方。<\/strong> 主张合法的权利，比如要求返还确属自己的钱，可以；但不要以\"否则我就去你单位闹\"\"否则我发朋友圈\"相威胁，不要提出远超实际损失的金额，用起诉、报警等合法渠道，不用恐吓的方式。<\/p>\n<p>对方确实有违法行为，不代表你可以用\"报案\"去换钱。实践中，对\"以揭发违法事实相要挟\"的情形，通常要看索要的数额与实际权利是否相称，手段是否正当，具体界限，要律师判断。<\/p>\n<p>理在你这边的时候，更要走正路。一句威胁，就可能让你从有理变成无理。<\/p>\n<p><strong>可以这样说<\/strong>（被威胁时）：<\/p>\n<ul><li>\"你这样要求我付钱，我不会同意。我会把我们的聊天记录交给警方处理。\"（说完后，务必把记录交出去，不要只是说说。）\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《刑法》第 274 条；《民法典》第 150 条。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案判断。<\/p>", "text": "\"不给钱我就报警\"：什么时候从讨债变成敲诈 \n 正当地主张权利，和威胁索财，中间有一条线：要的数额与权利是否相称，手段是否合法。\n\n小葛被前任威胁：\"不给 10 万，我就把你的事发给你们公司。\"他保留了聊天记录，报了警。对方以曝光相要挟、反复要钱，已经涉嫌敲诈勒索，警方立案调查。\n\n如果你是被威胁的一方。 保留全部聊天记录和录音；不要仓促转账，转账之后，对方往往会提出更高的要求；把证据交给警方，说明对方以曝光、报案为手段索取财物；通过律师沟通。\n\n如果你是想主张权利的一方。 主张合法的权利，比如要求返还确属自己的钱，可以；但不要以\"否则我就去你单位闹\"\"否则我发朋友圈\"相威胁，不要提出远超实际损失的金额，用起诉、报警等合法渠道，不用恐吓的方式。\n\n对方确实有违法行为，不代表你可以用\"报案\"去换钱。实践中，对\"以揭发违法事实相要挟\"的情形，通常要看索要的数额与实际权利是否相称，手段是否正当，具体界限，要律师判断。\n\n理在你这边的时候，更要走正路。一句威胁，就可能让你从有理变成无理。\n\n可以这样说（被威胁时）：\n\n \"你这样要求我付钱，我不会同意。我会把我们的聊天记录交给警方处理。\"（说完后，务必把记录交出去，不要只是说说。）\n\n法律依据：《刑法》第 274 条；《民法典》第 150 条。\n\n把握度：B｜依个案判断。\n\n"}, {"num": "024", "title": "私密照片和视频：拍、存、发的三条线", "grade": "A", "lead": "拍的时候要双方同意；存的时候要有安全意识；任何时候，都不能用来威胁或传播。", "html": "<blockquote>拍的时候要双方同意；存的时候要有安全意识；任何时候，都不能用来威胁或传播。<\/blockquote>\n<p>两个人恋爱时拍过私密视频，一直存在云盘里。分手后一方的账号被盗，视频泄露。虽然不是他本人传播的，但对方受到了很大的伤害，他后悔当初没有分手时就删除。<\/p>\n<p>第一条线：<strong>拍<\/strong>。不偷拍。偷拍他人隐私部位或性行为，可能违法犯罪。双方同意拍摄，也要分别妥善保存，设置密码。<\/p>\n<p>第二条线：<strong>存<\/strong>。分手后，对方要求删除的，主动删除，并告知。手机、云盘有备份的，注意云端共享相册、自动同步的风险。<\/p>\n<p>第三条线：<strong>发<\/strong>。任何时候，不用来威胁、索要钱财，不发给第三方，不发到网上。涉及《刑法》第 364 条、第 253 条之一、第 274 条，还有《治安管理处罚法》和《民法典》第 1032 条到第 1034 条规定的隐私和个人信息保护。<\/p>\n<p>即使最初是对方同意拍摄，传播也需要对方同意。<\/p>\n<p>你自己的私密影像被对方威胁时，保留证据，立即报警，见 <a href=\"#/e/027\">第 027 条<\/a>。拍的时候是恋人，删的时候别当仇人。分手那天，第一件事就是删。<\/p>\n<p><strong>法律依据<\/strong>：《刑法》第 364 条、第 253 条之一、第 274 条；《治安管理处罚法》；《民法典》第 1032 条、第 1033 条、第 1034 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "私密照片和视频：拍、存、发的三条线 \n 拍的时候要双方同意；存的时候要有安全意识；任何时候，都不能用来威胁或传播。\n\n两个人恋爱时拍过私密视频，一直存在云盘里。分手后一方的账号被盗，视频泄露。虽然不是他本人传播的，但对方受到了很大的伤害，他后悔当初没有分手时就删除。\n\n第一条线：拍。不偷拍。偷拍他人隐私部位或性行为，可能违法犯罪。双方同意拍摄，也要分别妥善保存，设置密码。\n\n第二条线：存。分手后，对方要求删除的，主动删除，并告知。手机、云盘有备份的，注意云端共享相册、自动同步的风险。\n\n第三条线：发。任何时候，不用来威胁、索要钱财，不发给第三方，不发到网上。涉及《刑法》第 364 条、第 253 条之一、第 274 条，还有《治安管理处罚法》和《民法典》第 1032 条到第 1034 条规定的隐私和个人信息保护。\n\n即使最初是对方同意拍摄，传播也需要对方同意。\n\n你自己的私密影像被对方威胁时，保留证据，立即报警，见 第 027 条。拍的时候是恋人，删的时候别当仇人。分手那天，第一件事就是删。\n\n法律依据：《刑法》第 364 条、第 253 条之一、第 274 条；《治安管理处罚法》；《民法典》第 1032 条、第 1033 条、第 1034 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "025", "title": "吵架动了手：拘留、坐牢，还是正当防卫", "grade": "A", "lead": "动手的那一刻，你通常就输了。即使对方先动手，也要看你的反应有没有超过必要限度。", "html": "<blockquote>动手的那一刻，你通常就输了。即使对方先动手，也要看你的反应有没有超过必要限度。<\/blockquote>\n<p>争吵中，对方推了小钱一把，他回手一拳，对方摔倒，头撞在桌角，造成轻伤。他原本是\"被推\"，却成了伤害的一方。<\/p>\n<p>一旦感觉情绪失控，先离开现场，去公共场所，或者回自己的住处。<\/p>\n<p>对方先动手，保护自己，避开伤害，不要反击到对方受重伤。同时做三件事：报警，留存报警回执；去医院，保留诊断证明、病历、票据；拍现场照片和伤情照片。<\/p>\n<p>轻微殴打，一般是治安处罚；造成轻伤以上，是刑事犯罪（《刑法》第 234 条）。正当防卫（第 20 条）要求：面对正在进行的不法侵害，采取必要限度内的防卫。明显超过必要限度，造成重大损害的，是防卫过当。\"轻微伤\"\"轻伤\"的鉴定标准不同，不要自己判断，以法医鉴定为准。<\/p>\n<p>吵架动了手，输的往往是先出手的那一个，也是把\"受害者\"位置让出去的那一个。<\/p>\n<p><strong>法律依据<\/strong>：《刑法》第 20 条（正当防卫）、第 234 条；《治安管理处罚法》；《民法典》第 1179 条（人身损害赔偿）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确；具体伤情看鉴定。<\/p>", "text": "吵架动了手：拘留、坐牢，还是正当防卫 \n 动手的那一刻，你通常就输了。即使对方先动手，也要看你的反应有没有超过必要限度。\n\n争吵中，对方推了小钱一把，他回手一拳，对方摔倒，头撞在桌角，造成轻伤。他原本是\"被推\"，却成了伤害的一方。\n\n一旦感觉情绪失控，先离开现场，去公共场所，或者回自己的住处。\n\n对方先动手，保护自己，避开伤害，不要反击到对方受重伤。同时做三件事：报警，留存报警回执；去医院，保留诊断证明、病历、票据；拍现场照片和伤情照片。\n\n轻微殴打，一般是治安处罚；造成轻伤以上，是刑事犯罪（《刑法》第 234 条）。正当防卫（第 20 条）要求：面对正在进行的不法侵害，采取必要限度内的防卫。明显超过必要限度，造成重大损害的，是防卫过当。\"轻微伤\"\"轻伤\"的鉴定标准不同，不要自己判断，以法医鉴定为准。\n\n吵架动了手，输的往往是先出手的那一个，也是把\"受害者\"位置让出去的那一个。\n\n法律依据：《刑法》第 20 条（正当防卫）、第 234 条；《治安管理处罚法》；《民法典》第 1179 条（人身损害赔偿）。\n\n把握度：A｜法条明确；具体伤情看鉴定。\n\n"}, {"num": "026", "title": "男人被打了，别忍", "grade": "A", "lead": "家庭暴力的受害者不限性别。男性被打、被虐待，同样受法律保护。", "html": "<blockquote>家庭暴力的受害者不限性别。男性被打、被虐待，同样受法律保护。<\/blockquote>\n<p>小苏被妻子多次抓伤、用物品砸伤，他觉得\"男人被打说出去丢人\"，一直忍着，也没留任何证据。后来妻子反过来说他家暴，他拿不出任何自己被打的证据。<\/p>\n<p>《反家庭暴力法》第 2 条规定，家庭暴力是指家庭成员之间以殴打、捆绑、残害、限制人身自由，以及经常性谩骂、恐吓等方式，实施的身体、精神等侵害行为。法条里没有\"男性不适用\"这一条。家庭成员以外共同生活的人之间的暴力，参照适用（第 37 条），同居的人也在内。<\/p>\n<p>男人被打，怎么办？<\/p>\n<p>第一，先保证安全。离开现场，到亲友家，或者公共场所。<\/p>\n<p>第二，报警，要求出警，并出具告诫书（第 16 条）或受理回执。<\/p>\n<p>第三，去医院验伤，留存病历、照片、验伤报告。<\/p>\n<p>第四，保存聊天记录、威胁语音、邻居证言、监控。<\/p>\n<p>第五，申请人身安全保护令：向法院提出，法院应当在 72 小时内作出裁定，情况紧急的 24 小时内（第 28 条）；有效期不超过六个月，可以申请延长（第 30 条）。申请书范本见附录 L。<\/p>\n<p>家暴的证据，也可以用在离婚诉讼里，作为过错、损害赔偿的依据。<\/p>\n<p>很多人担心\"反击会被说成互殴\"。保护自己的时候，尽量以避让为主，同时保留证据。男人被打，不丢人。丢人的是为了面子，把自己的证据全丢了。<\/p>\n<p><strong>法律依据<\/strong>：《反家庭暴力法》第 2 条（家庭暴力定义）、第 16 条（公安机关可出具告诫书）、第 23 条至第 33 条（人身安全保护令，第 28 条：72 小时内作出，紧急的 24 小时内）、第 37 条（家庭成员以外共同生活的人之间的暴力，参照适用）；《民法典》第 1042 条第 3 款、第 1079 条、第 1091 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 1 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "男人被打了，别忍 \n 家庭暴力的受害者不限性别。男性被打、被虐待，同样受法律保护。\n\n小苏被妻子多次抓伤、用物品砸伤，他觉得\"男人被打说出去丢人\"，一直忍着，也没留任何证据。后来妻子反过来说他家暴，他拿不出任何自己被打的证据。\n\n《反家庭暴力法》第 2 条规定，家庭暴力是指家庭成员之间以殴打、捆绑、残害、限制人身自由，以及经常性谩骂、恐吓等方式，实施的身体、精神等侵害行为。法条里没有\"男性不适用\"这一条。家庭成员以外共同生活的人之间的暴力，参照适用（第 37 条），同居的人也在内。\n\n男人被打，怎么办？\n\n第一，先保证安全。离开现场，到亲友家，或者公共场所。\n\n第二，报警，要求出警，并出具告诫书（第 16 条）或受理回执。\n\n第三，去医院验伤，留存病历、照片、验伤报告。\n\n第四，保存聊天记录、威胁语音、邻居证言、监控。\n\n第五，申请人身安全保护令：向法院提出，法院应当在 72 小时内作出裁定，情况紧急的 24 小时内（第 28 条）；有效期不超过六个月，可以申请延长（第 30 条）。申请书范本见附录 L。\n\n家暴的证据，也可以用在离婚诉讼里，作为过错、损害赔偿的依据。\n\n很多人担心\"反击会被说成互殴\"。保护自己的时候，尽量以避让为主，同时保留证据。男人被打，不丢人。丢人的是为了面子，把自己的证据全丢了。\n\n法律依据：《反家庭暴力法》第 2 条（家庭暴力定义）、第 16 条（公安机关可出具告诫书）、第 23 条至第 33 条（人身安全保护令，第 28 条：72 小时内作出，紧急的 24 小时内）、第 37 条（家庭成员以外共同生活的人之间的暴力，参照适用）；《民法典》第 1042 条第 3 款、第 1079 条、第 1091 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 1 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "027", "title": "被偷拍、被曝光、被网暴", "grade": "A", "lead": "先固定证据，再要求删除，再报警和起诉。三步并行，不要等。", "html": "<blockquote>先固定证据，再要求删除，再报警和起诉。三步并行，不要等。<\/blockquote>\n<p>小邱发现前任在朋友群里发了他的私人信息和编造的\"黑料\"。他先把页面截图、做了公证，再向平台投诉，同时向派出所报案，并委托律师起诉名誉侵权。<\/p>\n<p>第一步，固定证据：截图要含完整的页面、网址、账号、时间；重要内容做公证，或使用可信的时间戳服务。<\/p>\n<p>第二步，向平台投诉，要求删除、封号，保留投诉记录。<\/p>\n<p>第三步，向公安机关报案：侮辱、诽谤、敲诈勒索、侵犯公民个人信息（《刑法》第 246 条、第 274 条、第 253 条之一）。<\/p>\n<p>第四步，民事起诉：名誉权、隐私权，请求停止侵害、删除、赔礼道歉、赔偿（《民法典》第 1024 条、第 1032 条、第 1034 条、第 995 条）。涉及私密影像传播的，还可以依据《个人信息保护法》，请求平台删除。<\/p>\n<p>不要用同样的方式\"反击\"，容易让自己也担责。别想着\"删了就没事\"：该留的先留，该删的让平台删，该告的就告。时间长了，平台数据会被清除，越早固定，越有效。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1024 条、第 1032 条、第 1034 条、第 995 条（人格权保护的请求权）；《个人信息保护法》；《刑法》第 246 条、第 253 条之一、第 274 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "被偷拍、被曝光、被网暴 \n 先固定证据，再要求删除，再报警和起诉。三步并行，不要等。\n\n小邱发现前任在朋友群里发了他的私人信息和编造的\"黑料\"。他先把页面截图、做了公证，再向平台投诉，同时向派出所报案，并委托律师起诉名誉侵权。\n\n第一步，固定证据：截图要含完整的页面、网址、账号、时间；重要内容做公证，或使用可信的时间戳服务。\n\n第二步，向平台投诉，要求删除、封号，保留投诉记录。\n\n第三步，向公安机关报案：侮辱、诽谤、敲诈勒索、侵犯公民个人信息（《刑法》第 246 条、第 274 条、第 253 条之一）。\n\n第四步，民事起诉：名誉权、隐私权，请求停止侵害、删除、赔礼道歉、赔偿（《民法典》第 1024 条、第 1032 条、第 1034 条、第 995 条）。涉及私密影像传播的，还可以依据《个人信息保护法》，请求平台删除。\n\n不要用同样的方式\"反击\"，容易让自己也担责。别想着\"删了就没事\"：该留的先留，该删的让平台删，该告的就告。时间长了，平台数据会被清除，越早固定，越有效。\n\n法律依据：《民法典》第 1024 条、第 1032 条、第 1034 条、第 995 条（人格权保护的请求权）；《个人信息保护法》；《刑法》第 246 条、第 253 条之一、第 274 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "028", "title": "同一件事，报警、起诉还是调解：先分清三条线", "grade": "A", "lead": "遇到事，先问：这是民事、行政，还是刑事？走错了线，白费力气。", "html": "<blockquote>遇到事，先问：这是民事、行政，还是刑事？走错了线，白费力气。<\/blockquote>\n<p>小吴被前女友威胁：\"不给 5 万，就把你的私密照片发出去。\"他一开始想找律师打官司，其实这是敲诈勒索，应该先报警。<\/p>\n<p>同一件事，可能涉及三条线：<\/p>\n<p><strong>民事<\/strong>：要钱、返还、财产分割、抚养。先协商、调解，不成找法院。<\/p>\n<p><strong>行政<\/strong>：轻微打架、侮辱、偷拍等治安违法。找派出所，走治安案件。<\/p>\n<p><strong>刑事<\/strong>：诈骗、敲诈勒索、故意伤害、强奸、诬告。报警，由公安立案。<\/p>\n<p>判断要点：有人身伤害、威胁、欺诈、非法拘禁的，先报警；只是钱的归属，走民事；同一件事，可能先行政后刑事，也可能刑民交叉；有人以刑事相威胁来要钱，要特别小心，见 <a href=\"#/e/023\">第 023 条<\/a>。<\/p>\n<p>不要用\"我要报警\"当成讨价还价的筹码，可能构成敲诈勒索；也不要因为怕麻烦，就不报警，错过取证的窗口。<\/p>\n<p><strong>法律依据<\/strong>：《刑法》；《治安管理处罚法》；《民事诉讼法》。<\/p>\n<p><strong>把握度<\/strong>：A｜三条线的划分明确。<\/p>", "text": "同一件事，报警、起诉还是调解：先分清三条线 \n 遇到事，先问：这是民事、行政，还是刑事？走错了线，白费力气。\n\n小吴被前女友威胁：\"不给 5 万，就把你的私密照片发出去。\"他一开始想找律师打官司，其实这是敲诈勒索，应该先报警。\n\n同一件事，可能涉及三条线：\n\n民事：要钱、返还、财产分割、抚养。先协商、调解，不成找法院。\n\n行政：轻微打架、侮辱、偷拍等治安违法。找派出所，走治安案件。\n\n刑事：诈骗、敲诈勒索、故意伤害、强奸、诬告。报警，由公安立案。\n\n判断要点：有人身伤害、威胁、欺诈、非法拘禁的，先报警；只是钱的归属，走民事；同一件事，可能先行政后刑事，也可能刑民交叉；有人以刑事相威胁来要钱，要特别小心，见 第 023 条。\n\n不要用\"我要报警\"当成讨价还价的筹码，可能构成敲诈勒索；也不要因为怕麻烦，就不报警，错过取证的窗口。\n\n法律依据：《刑法》；《治安管理处罚法》；《民事诉讼法》。\n\n把握度：A｜三条线的划分明确。\n\n"}]}, {"title": "第三章　同居与孩子", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：没领证，财产按出资算；有了孩子，义务按血缘算。同居是自由，不是婚姻。<br><br><strong>口诀<\/strong>：同居不共有，出资看流水；生了就要养，验亲走正路。<\/blockquote>\n<p>同居是最常见的\"介于恋爱和婚姻之间\"的状态。大家最容易有一个错觉：在一起久了，财产就自然是共同的。法律不是这样规定的。<\/p>", "entries": [{"num": "029", "title": "同居几年，也不是夫妻", "grade": "A", "lead": "没领结婚证，就没有\"夫妻共同财产\"这回事。各自挣的归各自，共同出资的按出资算。", "html": "<blockquote>没领结婚证，就没有\"夫妻共同财产\"这回事。各自挣的归各自，共同出资的按出资算。<\/blockquote>\n<p>小乐和女友同居五年，一起付房租、一起生活。分开时，他以为家里的家具、电器、存款都\"对半分\"。结果发现：各自的工资归各自；共同买的冰箱、沙发，按各自出了多少钱算；没有\"一人一半\"这种默认规则。<\/p>\n<p>婚姻的财产规则，也就是夫妻共同财产制，是国家为\"婚姻共同体\"设计的。没有登记，就没有进入这套制度，只能回到普通的民事规则：谁出钱，谁有份；有约定，按约定。<\/p>\n<p>具体按《婚姻家庭编解释（二）》第 4 条：<\/p>\n<p>第一，有协议，先按协议。书面的同居财产协议，是最有效的依据。<\/p>\n<p>第二，没有协议：各自的劳动所得、继承所得，归各自所有；共同出资购置的财产，以各自出资比例为基础，综合考虑共同生活情况、有没有共同子女、各自的贡献来划分；一方单独出资、登记在自己名下的，归自己，但另一方如果有出资，可以主张。<\/p>\n<p>同居期间的转账，参照恋爱赠与的规则，见 <a href=\"#/e/003\">第 003 条<\/a>。<\/p>\n<p>同居解除，不会像离婚那样，自动分割所有财产。争议只能另行提起民事诉讼，自己举证出资。同居时间再长，也不会自然变成\"事实婚姻\"：1994 年 2 月 1 日之前已符合结婚实质要件的，按事实婚姻处理；之后的，应当补办登记，没补办的，按同居关系处理（《婚姻家庭编解释（一）》第 7 条）。<\/p>\n<p>最高人民法院 2023 年 12 月公布的一个案例：一对男女没有登记，但按习俗办了婚礼，同居三年多，有一个孩子，男方分手后要求返还 16 万元彩礼的八成，法院没有支持，认为双方已经形成长期的共同生活，彩礼的目的在很大程度上已经实现。见附录 O 案例 O-7。<\/p>\n<p>同居是自由。自由的好处是没人管你，代价是没人替你分。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 3 条（解除同居关系的诉讼受理范围）；同解释第 7 条（1994 年 2 月 1 日之前已符合结婚实质要件的，按事实婚姻处理；之后的，应当补办登记，未补办的按同居关系处理）。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "同居几年，也不是夫妻 \n 没领结婚证，就没有\"夫妻共同财产\"这回事。各自挣的归各自，共同出资的按出资算。\n\n小乐和女友同居五年，一起付房租、一起生活。分开时，他以为家里的家具、电器、存款都\"对半分\"。结果发现：各自的工资归各自；共同买的冰箱、沙发，按各自出了多少钱算；没有\"一人一半\"这种默认规则。\n\n婚姻的财产规则，也就是夫妻共同财产制，是国家为\"婚姻共同体\"设计的。没有登记，就没有进入这套制度，只能回到普通的民事规则：谁出钱，谁有份；有约定，按约定。\n\n具体按《婚姻家庭编解释（二）》第 4 条：\n\n第一，有协议，先按协议。书面的同居财产协议，是最有效的依据。\n\n第二，没有协议：各自的劳动所得、继承所得，归各自所有；共同出资购置的财产，以各自出资比例为基础，综合考虑共同生活情况、有没有共同子女、各自的贡献来划分；一方单独出资、登记在自己名下的，归自己，但另一方如果有出资，可以主张。\n\n同居期间的转账，参照恋爱赠与的规则，见 第 003 条。\n\n同居解除，不会像离婚那样，自动分割所有财产。争议只能另行提起民事诉讼，自己举证出资。同居时间再长，也不会自然变成\"事实婚姻\"：1994 年 2 月 1 日之前已符合结婚实质要件的，按事实婚姻处理；之后的，应当补办登记，没补办的，按同居关系处理（《婚姻家庭编解释（一）》第 7 条）。\n\n最高人民法院 2023 年 12 月公布的一个案例：一对男女没有登记，但按习俗办了婚礼，同居三年多，有一个孩子，男方分手后要求返还 16 万元彩礼的八成，法院没有支持，认为双方已经形成长期的共同生活，彩礼的目的在很大程度上已经实现。见附录 O 案例 O7。\n\n同居是自由。自由的好处是没人管你，代价是没人替你分。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 3 条（解除同居关系的诉讼受理范围）；同解释第 7 条（1994 年 2 月 1 日之前已符合结婚实质要件的，按事实婚姻处理；之后的，应当补办登记，未补办的按同居关系处理）。\n\n把握度：A｜法条明确。\n\n"}, {"num": "030", "title": "同居一起买房买车，出资和约定一个都别漏", "grade": "B", "lead": "出资比例要写明，登记的名字要和出资相匹配，或者有协议。", "html": "<blockquote>出资比例要写明，登记的名字要和出资相匹配，或者有协议。<\/blockquote>\n<p>小易和女友同居时买了一套 100 万的房。首付 30 万，他出 20 万、她出 10 万，登记在他名下，口头说\"以后一起还贷\"。分手时，女方说\"我也出了钱，房子应该有我一份\"。两个人都拿不出任何书面约定。<\/p>\n<p>买房买车这样的大事，不能是\"以后再说\"的事。<\/p>\n<p>购买之前，签一份书面协议，写明：总价、首付、贷款；谁出多少，资金来源；登记在谁名下，或共有的比例；将来分手怎么处理，一方留住的，补偿多少；贷款怎么继续还。<\/p>\n<p>所有出资都走银行转账，备注\"购房款\"\"首付\"。房产共有登记，要注意是\"按份共有\"还是\"共同共有\"，并写明份额。登记在对方名下、自己也出了钱的，保存转账凭证和书面约定，以便分手时主张返还或确权。<\/p>\n<p>共同出资、没有约定的，法院以出资比例为基础。出资不留痕，份额就很难证明。贷款的借款人、还款人，要和出资记录一致。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们一起买这套房，写个简单的协议吧：首付 30 万，你出 10 万、我出 20 万，登记在我名下，将来如果分开，我按你出的份额补偿你。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 298 条至第 309 条（共有）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实。<\/p>", "text": "同居一起买房买车，出资和约定一个都别漏 \n 出资比例要写明，登记的名字要和出资相匹配，或者有协议。\n\n小易和女友同居时买了一套 100 万的房。首付 30 万，他出 20 万、她出 10 万，登记在他名下，口头说\"以后一起还贷\"。分手时，女方说\"我也出了钱，房子应该有我一份\"。两个人都拿不出任何书面约定。\n\n买房买车这样的大事，不能是\"以后再说\"的事。\n\n购买之前，签一份书面协议，写明：总价、首付、贷款；谁出多少，资金来源；登记在谁名下，或共有的比例；将来分手怎么处理，一方留住的，补偿多少；贷款怎么继续还。\n\n所有出资都走银行转账，备注\"购房款\"\"首付\"。房产共有登记，要注意是\"按份共有\"还是\"共同共有\"，并写明份额。登记在对方名下、自己也出了钱的，保存转账凭证和书面约定，以便分手时主张返还或确权。\n\n共同出资、没有约定的，法院以出资比例为基础。出资不留痕，份额就很难证明。贷款的借款人、还款人，要和出资记录一致。\n\n可以这样说：\n\n \"我们一起买这套房，写个简单的协议吧：首付 30 万，你出 10 万、我出 20 万，登记在我名下，将来如果分开，我按你出的份额补偿你。\"\n\n法律依据：《民法典》第 298 条至第 309 条（共有）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条。\n\n把握度：B｜依个案事实。\n\n"}, {"num": "031", "title": "同居协议：趁感情好，把丑话说在前头", "grade": "A", "lead": "同居协议是为了在关系变化时，不用靠回忆打官司。", "html": "<blockquote>同居协议是为了在关系变化时，不用靠回忆打官司。<\/blockquote>\n<p>小雷和女友同居前，一起列了一张表：各自存款多少、房租怎么分、谁买什么东西、将来分手怎么算。两人花了一个晚上，写了一页纸，各自签字。后来分手，只用了十分钟，就把账算清了。<\/p>\n<p>同居协议包括这些内容：双方身份信息和同居的起始时间；财产清单，各自婚前或同居前的大额资产；共同购置财产的出资比例与归属；日常开销怎么分；债务，各自的各自承担，共同的按比例；解除同居时的财产处理方式；如有子女，抚养、探望的初步安排；违约责任；双方签字、日期。<\/p>\n<p>要注意的是：子女的最终抚养安排，以子女利益最大化为准，协议不能完全限制；不要写违反法律强制性规定或公序良俗的条款，比如\"分手必须赔偿某某金额\"这类惩罚性的条款，效力存在争议。<\/p>\n<p>感情最好的时候，是写这份协议最合适的时候。<\/p>\n<p><strong>附件<\/strong>：同居财产协议、分手财产分割协议和子女抚养协议，见附录 E。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 464 条（合同的定义）、第 143 条（民事法律行为有效条件）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法律依据明确；具体写法属于经验。<\/p>", "text": "同居协议：趁感情好，把丑话说在前头 \n 同居协议是为了在关系变化时，不用靠回忆打官司。\n\n小雷和女友同居前，一起列了一张表：各自存款多少、房租怎么分、谁买什么东西、将来分手怎么算。两人花了一个晚上，写了一页纸，各自签字。后来分手，只用了十分钟，就把账算清了。\n\n同居协议包括这些内容：双方身份信息和同居的起始时间；财产清单，各自婚前或同居前的大额资产；共同购置财产的出资比例与归属；日常开销怎么分；债务，各自的各自承担，共同的按比例；解除同居时的财产处理方式；如有子女，抚养、探望的初步安排；违约责任；双方签字、日期。\n\n要注意的是：子女的最终抚养安排，以子女利益最大化为准，协议不能完全限制；不要写违反法律强制性规定或公序良俗的条款，比如\"分手必须赔偿某某金额\"这类惩罚性的条款，效力存在争议。\n\n感情最好的时候，是写这份协议最合适的时候。\n\n附件：同居财产协议、分手财产分割协议和子女抚养协议，见附录 E。\n\n法律依据：《民法典》第 464 条（合同的定义）、第 143 条（民事法律行为有效条件）；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条。\n\n把握度：A｜法律依据明确；具体写法属于经验。\n\n"}, {"num": "032", "title": "没领证，孩子也要养", "grade": "A", "lead": "孩子是谁的，抚养义务就是谁的，和领没领证无关。", "html": "<blockquote>孩子是谁的，抚养义务就是谁的，和领没领证无关。<\/blockquote>\n<p>小冯和女友同居期间生了一个孩子，分手后女方带孩子。他月收入 2 万，想知道抚养费要付多少。<\/p>\n<p>法律的规定很明确：非婚生子女，和婚生子女享有同等的权利，任何人不得加以危害和歧视（《民法典》第 1071 条）。不直接抚养孩子的一方，要负担抚养费，直到孩子成年；孩子不能独立生活的，继续负担。<\/p>\n<p>抚养费怎么算？《婚姻家庭编解释（一）》第 49 条：有固定收入的，一般按负担方月总收入的 20% 至 30% 确定；有两个以上子女的，比例可以适当提高，但一般不超过月总收入的 50%；无固定收入的，参照上一年度或者当地同行业的平均收入。小冯月收入 2 万，一个孩子，每月大致是 4000 至 6000 元。网页版有抚养费计算器。<\/p>\n<p>抚养权没有协商好的，可以起诉，判断标准是子女利益最大化。不满两周岁的孩子，一般由母亲直接抚养；已满两周岁的，要综合考虑多种因素；已满八周岁的，要尊重孩子本人的真实意愿。不直接抚养的一方，享有探望权。<\/p>\n<p>抚养费是长期支出，十八年左右。别觉得\"没领证，就不用管\"：拒付抚养费，可能被强制执行，还可能进入失信名单。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1071 条、第 1084 条、第 1085 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 42 条、第 44 条至第 49 条。<\/p>\n<p><strong>把握度<\/strong>：A｜原则明确；具体数额依个案是 B。<\/p>", "text": "没领证，孩子也要养 \n 孩子是谁的，抚养义务就是谁的，和领没领证无关。\n\n小冯和女友同居期间生了一个孩子，分手后女方带孩子。他月收入 2 万，想知道抚养费要付多少。\n\n法律的规定很明确：非婚生子女，和婚生子女享有同等的权利，任何人不得加以危害和歧视（《民法典》第 1071 条）。不直接抚养孩子的一方，要负担抚养费，直到孩子成年；孩子不能独立生活的，继续负担。\n\n抚养费怎么算？《婚姻家庭编解释（一）》第 49 条：有固定收入的，一般按负担方月总收入的 20% 至 30% 确定；有两个以上子女的，比例可以适当提高，但一般不超过月总收入的 50%；无固定收入的，参照上一年度或者当地同行业的平均收入。小冯月收入 2 万，一个孩子，每月大致是 4000 至 6000 元。网页版有抚养费计算器。\n\n抚养权没有协商好的，可以起诉，判断标准是子女利益最大化。不满两周岁的孩子，一般由母亲直接抚养；已满两周岁的，要综合考虑多种因素；已满八周岁的，要尊重孩子本人的真实意愿。不直接抚养的一方，享有探望权。\n\n抚养费是长期支出，十八年左右。别觉得\"没领证，就不用管\"：拒付抚养费，可能被强制执行，还可能进入失信名单。\n\n法律依据：《民法典》第 1071 条、第 1084 条、第 1085 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 42 条、第 44 条至第 49 条。\n\n把握度：A｜原则明确；具体数额依个案是 B。\n\n"}, {"num": "033", "title": "孩子是不是亲生的，怎么验才合法", "grade": "A", "lead": "对孩子是否亲生有合理怀疑，要走合法的渠道，不要偷偷拿头发去做鉴定。", "html": "<blockquote>对孩子是否亲生有合理怀疑，要走合法的渠道，不要偷偷拿头发去做鉴定。<\/blockquote>\n<p>小曲偷偷拿了孩子的头发，去私人机构做鉴定，结果显示不是亲生。他拿着报告去起诉，法院对这份报告的采样来源提出质疑，没有直接采信，他又花了几个月重新走程序。<\/p>\n<p>想知道真相，可以，但路要走对。走歪了，真相有了，证据没了。<\/p>\n<p>怎么走？<\/p>\n<p>第一，先和对方沟通，争取双方同意做鉴定。<\/p>\n<p>第二，到有资质的司法鉴定机构，双方、监护人书面同意，现场采样。<\/p>\n<p>第三，对方不同意，可以向法院起诉，请求确认或者否认亲子关系，并提供必要的证据，证明有\"正当理由\"（《民法典》第 1073 条）。一方提供了必要的证据，另一方没有相反证据又拒绝做鉴定的，法院可以推定主张成立（《婚姻家庭编解释（一）》第 39 条）。<\/p>\n<p>私下做的鉴定，如果样本来源不合法，法庭可能不采信；偷采孩子的样本，还可能侵犯孩子的个人信息和隐私。孩子出生时如果是婚生子女，抚养关系已经建立，就算最终证明不是亲生，已经形成的抚养关系、已经支付的抚养费，处理起来很复杂，建议由律师评估。发现对方婚内与他人发生关系生子的，可以评估是否属于离婚损害赔偿里的\"其他重大过错\"。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我想和你一起去做一个正规的亲子鉴定，为了孩子，也为了我们都放心。我们一起去，这样结果大家都认。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1073 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 39 条；《个人信息保护法》第 28 条（生物识别信息等敏感个人信息）。<\/p>\n<p><strong>把握度<\/strong>：A｜条文明确；费用、私下鉴定的证据效力是 B。<\/p>", "text": "孩子是不是亲生的，怎么验才合法 \n 对孩子是否亲生有合理怀疑，要走合法的渠道，不要偷偷拿头发去做鉴定。\n\n小曲偷偷拿了孩子的头发，去私人机构做鉴定，结果显示不是亲生。他拿着报告去起诉，法院对这份报告的采样来源提出质疑，没有直接采信，他又花了几个月重新走程序。\n\n想知道真相，可以，但路要走对。走歪了，真相有了，证据没了。\n\n怎么走？\n\n第一，先和对方沟通，争取双方同意做鉴定。\n\n第二，到有资质的司法鉴定机构，双方、监护人书面同意，现场采样。\n\n第三，对方不同意，可以向法院起诉，请求确认或者否认亲子关系，并提供必要的证据，证明有\"正当理由\"（《民法典》第 1073 条）。一方提供了必要的证据，另一方没有相反证据又拒绝做鉴定的，法院可以推定主张成立（《婚姻家庭编解释（一）》第 39 条）。\n\n私下做的鉴定，如果样本来源不合法，法庭可能不采信；偷采孩子的样本，还可能侵犯孩子的个人信息和隐私。孩子出生时如果是婚生子女，抚养关系已经建立，就算最终证明不是亲生，已经形成的抚养关系、已经支付的抚养费，处理起来很复杂，建议由律师评估。发现对方婚内与他人发生关系生子的，可以评估是否属于离婚损害赔偿里的\"其他重大过错\"。\n\n可以这样说：\n\n \"我想和你一起去做一个正规的亲子鉴定，为了孩子，也为了我们都放心。我们一起去，这样结果大家都认。\"\n\n法律依据：《民法典》第 1073 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 39 条；《个人信息保护法》第 28 条（生物识别信息等敏感个人信息）。\n\n把握度：A｜条文明确；费用、私下鉴定的证据效力是 B。\n\n"}, {"num": "034", "title": "她一个人把孩子生了：做父亲的权利和义务", "grade": "B", "lead": "对方想独自生养，不等于父亲的义务消失；同样，父亲的权利也不会自动消失。", "html": "<blockquote>对方想独自生养，不等于父亲的义务消失；同样，父亲的权利也不会自动消失。<\/blockquote>\n<p>小戴得知前女友生下孩子，对方说\"不用你管\"。他不知道该不该付抚养费，也不知道能不能探望。其实，孩子是他的，法律上他有抚养义务，也有探望的权利。<\/p>\n<p>这类事，常被叫作\"去父留子\"：女方单方面生育，不希望男方参与。但法律层面，父亲的法定权利和义务，不会因此消失。<\/p>\n<p>第一，先确认是否亲生，必要时通过合法途径鉴定，见 <a href=\"#/e/033\">第 033 条<\/a>。<\/p>\n<p>第二，抚养费：父亲有义务负担，可以协商，也可以由法院判决。<\/p>\n<p>第三，探望：父亲有权探望。对方拒绝的，先协商调解，协商不成，可以起诉，请求确认探望的方式和时间。非婚生子女的探望权，法条主要是对离婚后的父母规定的，实践中通常比照适用，各地法院的认定可能有差异。<\/p>\n<p>第四，抚养权：想争取孩子，需要证明自己更有利于孩子成长，包括照料能力、经济条件、居住环境。<\/p>\n<p>第五，想放弃，也不能通过协议完全免除抚养义务。抚养费可以一次性给付，但要写清楚、有凭证，不能限制孩子将来可能的合理请求。<\/p>\n<p>同时，也要认清现实：抚养权、日常照料的现实难度很大。理性评估维权成本，分清哪些诉求可以通过法律实现，哪些只是难以落地的期待。<\/p>\n<p>她说\"不用你管\"，法律说\"你得管\"。义务和权利，是一起来的。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1071 条、第 1084 条至第 1086 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 44 条至第 49 条。<\/p>\n<p><strong>把握度<\/strong>：B｜法条比照适用。<\/p>", "text": "她一个人把孩子生了：做父亲的权利和义务 \n 对方想独自生养，不等于父亲的义务消失；同样，父亲的权利也不会自动消失。\n\n小戴得知前女友生下孩子，对方说\"不用你管\"。他不知道该不该付抚养费，也不知道能不能探望。其实，孩子是他的，法律上他有抚养义务，也有探望的权利。\n\n这类事，常被叫作\"去父留子\"：女方单方面生育，不希望男方参与。但法律层面，父亲的法定权利和义务，不会因此消失。\n\n第一，先确认是否亲生，必要时通过合法途径鉴定，见 第 033 条。\n\n第二，抚养费：父亲有义务负担，可以协商，也可以由法院判决。\n\n第三，探望：父亲有权探望。对方拒绝的，先协商调解，协商不成，可以起诉，请求确认探望的方式和时间。非婚生子女的探望权，法条主要是对离婚后的父母规定的，实践中通常比照适用，各地法院的认定可能有差异。\n\n第四，抚养权：想争取孩子，需要证明自己更有利于孩子成长，包括照料能力、经济条件、居住环境。\n\n第五，想放弃，也不能通过协议完全免除抚养义务。抚养费可以一次性给付，但要写清楚、有凭证，不能限制孩子将来可能的合理请求。\n\n同时，也要认清现实：抚养权、日常照料的现实难度很大。理性评估维权成本，分清哪些诉求可以通过法律实现，哪些只是难以落地的期待。\n\n她说\"不用你管\"，法律说\"你得管\"。义务和权利，是一起来的。\n\n法律依据：《民法典》第 1071 条、第 1084 条至第 1086 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 44 条至第 49 条。\n\n把握度：B｜法条比照适用。\n\n"}, {"num": "035", "title": "同居分手，一次谈完：钱、债、孩子，一份协议写清", "grade": "B", "lead": "分手谈判的目标不是赢，是了结。一次谈完，别留尾巴。", "html": "<blockquote>分手谈判的目标不是赢，是了结。一次谈完，别留尾巴。<\/blockquote>\n<p>小翟和女友分手，约了一个下午，把房租押金、共同买的电器、两个人欠的 5000 元信用卡，以及孩子的抚养安排，一项一项写在一张纸上，各自签字。三年后，没有任何一件事再被翻出来。<\/p>\n<p>怎么谈？<\/p>\n<p>第一，先列财产清单：房产、车辆、存款、理财、债务，谁出的钱，在谁名下。<\/p>\n<p>第二，按出资比例协商分割，也可以按双方的实际贡献协商。<\/p>\n<p>第三，孩子：谁直接抚养、抚养费金额与支付方式、探望的时间与交接方式、教育医疗费用怎么分。<\/p>\n<p>第四，协议要写清：履行时间、过户时间、违约责任。<\/p>\n<p>第五，双方签字，各留一份原件，必要时做公证。签协议前，各自独立咨询律师。<\/p>\n<p>要注意的是，子女抚养相关的条款，不能剥夺子女的合法权益，协议约定不利于子女的，法院可以不予支持。<\/p>\n<p><strong>附件<\/strong>：见附录 E。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条；《民法典》第 1084 条至第 1086 条。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实。<\/p>", "text": "同居分手，一次谈完：钱、债、孩子，一份协议写清 \n 分手谈判的目标不是赢，是了结。一次谈完，别留尾巴。\n\n小翟和女友分手，约了一个下午，把房租押金、共同买的电器、两个人欠的 5000 元信用卡，以及孩子的抚养安排，一项一项写在一张纸上，各自签字。三年后，没有任何一件事再被翻出来。\n\n怎么谈？\n\n第一，先列财产清单：房产、车辆、存款、理财、债务，谁出的钱，在谁名下。\n\n第二，按出资比例协商分割，也可以按双方的实际贡献协商。\n\n第三，孩子：谁直接抚养、抚养费金额与支付方式、探望的时间与交接方式、教育医疗费用怎么分。\n\n第四，协议要写清：履行时间、过户时间、违约责任。\n\n第五，双方签字，各留一份原件，必要时做公证。签协议前，各自独立咨询律师。\n\n要注意的是，子女抚养相关的条款，不能剥夺子女的合法权益，协议约定不利于子女的，法院可以不予支持。\n\n附件：见附录 E。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 4 条；《民法典》第 1084 条至第 1086 条。\n\n把握度：B｜依个案事实。\n\n"}]}, {"title": "第四章　彩礼纠纷", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：彩礼是\"为结婚给的钱\"，能不能退，看这笔钱的目的实现了没有。谈得明白，给得明白，才退得明白。<br><br><strong>口诀<\/strong>：一看登记，二看同居，三看孩子，四看金额。<\/blockquote>\n<p>这一章按 2024 年 2 月 1 日起施行的《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》（下文简称《彩礼规定》）和《婚姻家庭编解释（一）》第 5 条来写，并用了最高人民法院公布的 8 个彩礼案例，看法官实际是怎么算的，案情详见附录 O。<\/p>", "entries": [{"num": "036", "title": "彩礼是什么，什么不是", "grade": "A", "lead": "彩礼是为了结婚，按当地习俗给的较大金额钱物。日常开销和小礼物，不是。", "html": "<blockquote>彩礼是为了结婚，按当地习俗给的较大金额钱物。日常开销和小礼物，不是。<\/blockquote>\n<p>订婚时，男方给了 18 万\"订婚礼金\"，一枚 3 万的金戒指，另外平时给女方转过几次 520、1314。法院认定：18 万和金戒指，可能是彩礼；那些 520、1314，不是。<\/p>\n<p>彩礼没有法律上的统一定义，《彩礼规定》第 3 条给的判断方法是：综合看给付的目的、当地习俗、给付的时间和方式、财物的价值，以及给付人和接收人的情况。<\/p>\n<p><strong>不属于彩礼的<\/strong>：节日、生日等场合给的价值不大的礼物、礼金；为表达感情支付的日常消费性支出；其他价值不大的财物。<\/p>\n<p><strong>可能是彩礼的<\/strong>：订婚时按当地习俗给付的\"订婚礼金\"\"聘金\"\"金银首饰\"；明确用于结婚的大额转账；为缔结婚姻给付的购房款、购车款（见 <a href=\"#/e/041\">第 041 条<\/a>）。<\/p>\n<p>双方就款项性质有争议的，聊天记录、中间人、家庭成员的证言，都可以作为证据。恋爱期间的 520、1314 小额转账，不是彩礼，不能按彩礼规则返还。<\/p>\n<p>彩礼不是你给的所有钱。分得清，才要得回。<\/p>\n<p><strong>法律依据<\/strong>：《彩礼规定》第 1 条、第 3 条；《民法典》第 1042 条第 1 款。<\/p>\n<p><strong>把握度<\/strong>：A｜条文明确。<\/p>", "text": "彩礼是什么，什么不是 \n 彩礼是为了结婚，按当地习俗给的较大金额钱物。日常开销和小礼物，不是。\n\n订婚时，男方给了 18 万\"订婚礼金\"，一枚 3 万的金戒指，另外平时给女方转过几次 520、1314。法院认定：18 万和金戒指，可能是彩礼；那些 520、1314，不是。\n\n彩礼没有法律上的统一定义，《彩礼规定》第 3 条给的判断方法是：综合看给付的目的、当地习俗、给付的时间和方式、财物的价值，以及给付人和接收人的情况。\n\n不属于彩礼的：节日、生日等场合给的价值不大的礼物、礼金；为表达感情支付的日常消费性支出；其他价值不大的财物。\n\n可能是彩礼的：订婚时按当地习俗给付的\"订婚礼金\"\"聘金\"\"金银首饰\"；明确用于结婚的大额转账；为缔结婚姻给付的购房款、购车款（见 第 041 条）。\n\n双方就款项性质有争议的，聊天记录、中间人、家庭成员的证言，都可以作为证据。恋爱期间的 520、1314 小额转账，不是彩礼，不能按彩礼规则返还。\n\n彩礼不是你给的所有钱。分得清，才要得回。\n\n法律依据：《彩礼规定》第 1 条、第 3 条；《民法典》第 1042 条第 1 款。\n\n把握度：A｜条文明确。\n\n"}, {"num": "037", "title": "给彩礼，别给现金", "grade": "A", "lead": "不用现金，不用口头，不用\"改天补手续\"。", "html": "<blockquote>不用现金，不用口头，不用\"改天补手续\"。<\/blockquote>\n<p>男方父母在订婚宴上，给了女方父母 18 万现金，当时没写收条，也没转账。后来婚事不成，对方说\"我们没收过这笔钱\"。<\/p>\n<p>这是彩礼维权里最常见的障碍：现金交付，没有收条。<\/p>\n<p>给彩礼，留证据的动作有这几个：<\/p>\n<p>第一，用银行转账，不用现金。必须用现金的，当面写收条，请对方签字，并录像（需双方知情）。<\/p>\n<p>第二，转账备注写\"彩礼\"或\"订婚礼金\"，聊天里同时确认。父母出资的，从父母的账户转账，并在聊天里写明\"这是我们给 ×× 的彩礼\"。<\/p>\n<p>第三，办一个简单的书面约定：写清金额、用途、婚事不成怎么处理。范本见附录 B。<\/p>\n<p>第四，保存当地习俗相关的证据：媒人、双方家长的聊天、订婚现场的照片。<\/p>\n<p>已经给付但没留证据的，补一次文字沟通，让对方确认过去给付了这笔钱，是彩礼。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"订婚的这笔 18 万，我们家是按当地的规矩给的，转到您账上。我们把这个写一下，万一以后有变化，彼此都有依据，您看行吗？\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《彩礼规定》第 3 条；《民事诉讼法》第 67 条。<\/p>\n<p><strong>把握度<\/strong>：A｜举证规则明确；具体做法属于经验。<\/p>", "text": "给彩礼，别给现金 \n 不用现金，不用口头，不用\"改天补手续\"。\n\n男方父母在订婚宴上，给了女方父母 18 万现金，当时没写收条，也没转账。后来婚事不成，对方说\"我们没收过这笔钱\"。\n\n这是彩礼维权里最常见的障碍：现金交付，没有收条。\n\n给彩礼，留证据的动作有这几个：\n\n第一，用银行转账，不用现金。必须用现金的，当面写收条，请对方签字，并录像（需双方知情）。\n\n第二，转账备注写\"彩礼\"或\"订婚礼金\"，聊天里同时确认。父母出资的，从父母的账户转账，并在聊天里写明\"这是我们给 ×× 的彩礼\"。\n\n第三，办一个简单的书面约定：写清金额、用途、婚事不成怎么处理。范本见附录 B。\n\n第四，保存当地习俗相关的证据：媒人、双方家长的聊天、订婚现场的照片。\n\n已经给付但没留证据的，补一次文字沟通，让对方确认过去给付了这笔钱，是彩礼。\n\n可以这样说：\n\n \"订婚的这笔 18 万，我们家是按当地的规矩给的，转到您账上。我们把这个写一下，万一以后有变化，彼此都有依据，您看行吗？\"\n\n法律依据：《彩礼规定》第 3 条；《民事诉讼法》第 67 条。\n\n把握度：A｜举证规则明确；具体做法属于经验。\n\n"}, {"num": "038", "title": "哪些情况下，彩礼能要回来", "grade": "A", "lead": "没领证，通常可以主张返还；领了证，要看有没有真正共同生活、共同生活多久、金额是不是过高。", "html": "<blockquote>没领证，通常可以主张返还；领了证，要看有没有真正共同生活、共同生活多久、金额是不是过高。<\/blockquote>\n<p>男方给了 20 万彩礼，订婚三个月后婚事不成，没登记，没同居。男方起诉要回，法院认定彩礼的目的没有实现，大概率支持返还。<\/p>\n<p>彩礼能不能退、退多少，要把两份司法解释叠在一起看。一份定\"能不能要\"，一份定\"要多少\"和特殊情形。<\/p>\n<p><strong>第一层：能不能要。<\/strong> 《婚姻家庭编解释（一）》第 5 条规定，当事人请求返还按习俗给付的彩礼，有下列情形之一的，法院应当支持：一、双方没有办理结婚登记；二、双方办理了结婚登记，但确实没有共同生活；三、婚前给付，并导致给付人生活困难。其中第二项、第三项，以双方离婚为条件；第一项不要求离婚。<\/p>\n<p><strong>第二层：要多少，以及特殊情形。<\/strong> 《彩礼规定》补充了几种情形：<\/p>\n<ul><li><strong>未登记，也没共同生活<\/strong>：适用第 5 条第一项，一般支持返还，比例结合彩礼使用、嫁妆、双方过错、当地习俗来确定。\n<\/li><li><strong>未登记，但共同生活过<\/strong>：法院根据彩礼实际使用、嫁妆情况、共同生活及孕育情况、双方过错、当地习俗，确定是否返还及比例（《彩礼规定》第 6 条）。\n<\/li><li><strong>已登记，并共同生活<\/strong>：离婚时，一般不支持返还；但共同生活时间较短、彩礼数额过高的，法院可以综合考虑，决定是否返还以及返还比例（《彩礼规定》第 5 条）。\n<\/li><li><strong>已登记，但确未共同生活<\/strong>：回到解释（一）第 5 条第二项，离婚时可主张返还。附录 O 的案例 O-4，就是这种情形，全额返还。\n<\/li><\/ul>\n<p>\"过高\"怎么判断？参考给付方所在地居民人均可支配收入、给付方的家庭经济情况，以及当地习俗。<\/p>\n<p>要提醒的是：不要以为新规定出来，第 5 条就作废了。官方资料把 2024 年的规定称为对第 5 条的\"补充和完善\"，两者配合使用。解释（一）有没有后续修改，以官方最新文本为准。<\/p>\n<p><strong>法律依据<\/strong>：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 5 条；《彩礼规定》第 5 条、第 6 条。<\/p>\n<p><strong>把握度<\/strong>：A｜框架明确；具体比例是 B。<\/p>", "text": "哪些情况下，彩礼能要回来 \n 没领证，通常可以主张返还；领了证，要看有没有真正共同生活、共同生活多久、金额是不是过高。\n\n男方给了 20 万彩礼，订婚三个月后婚事不成，没登记，没同居。男方起诉要回，法院认定彩礼的目的没有实现，大概率支持返还。\n\n彩礼能不能退、退多少，要把两份司法解释叠在一起看。一份定\"能不能要\"，一份定\"要多少\"和特殊情形。\n\n第一层：能不能要。 《婚姻家庭编解释（一）》第 5 条规定，当事人请求返还按习俗给付的彩礼，有下列情形之一的，法院应当支持：一、双方没有办理结婚登记；二、双方办理了结婚登记，但确实没有共同生活；三、婚前给付，并导致给付人生活困难。其中第二项、第三项，以双方离婚为条件；第一项不要求离婚。\n\n第二层：要多少，以及特殊情形。 《彩礼规定》补充了几种情形：\n\n 未登记，也没共同生活：适用第 5 条第一项，一般支持返还，比例结合彩礼使用、嫁妆、双方过错、当地习俗来确定。\n 未登记，但共同生活过：法院根据彩礼实际使用、嫁妆情况、共同生活及孕育情况、双方过错、当地习俗，确定是否返还及比例（《彩礼规定》第 6 条）。\n 已登记，并共同生活：离婚时，一般不支持返还；但共同生活时间较短、彩礼数额过高的，法院可以综合考虑，决定是否返还以及返还比例（《彩礼规定》第 5 条）。\n 已登记，但确未共同生活：回到解释（一）第 5 条第二项，离婚时可主张返还。附录 O 的案例 O4，就是这种情形，全额返还。\n\n\"过高\"怎么判断？参考给付方所在地居民人均可支配收入、给付方的家庭经济情况，以及当地习俗。\n\n要提醒的是：不要以为新规定出来，第 5 条就作废了。官方资料把 2024 年的规定称为对第 5 条的\"补充和完善\"，两者配合使用。解释（一）有没有后续修改，以官方最新文本为准。\n\n法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 5 条；《彩礼规定》第 5 条、第 6 条。\n\n把握度：A｜框架明确；具体比例是 B。\n\n"}, {"num": "039", "title": "彩礼能退多少：法官怎么算", "grade": "B", "lead": "没有固定比例。看的是：钱花到哪儿了，日子过了多久，孩子有没有，谁的过错。", "html": "<blockquote>没有固定比例。看的是：钱花到哪儿了，日子过了多久，孩子有没有，谁的过错。<\/blockquote>\n<p>法院通常综合这几项：彩礼的实际使用情况，是否已经用于共同生活、办婚礼、置办家具，这些会相应扣减；嫁妆，女方家庭陪送的嫁妆，在计算返还时一并考虑；共同生活的时间和孕育情况，时间越长、有孩子，返还比例通常越低；双方过错，谁导致婚约解除；当地习俗。<\/p>\n<p>看最高人民法院公布的案例里，法官实际是怎么判的（案情详见附录 O。每个案子都有自己的情况，不能直接套用）：<\/p>\n<div class='tw'><table><thead><tr><th>案例<\/th><th>情况<\/th><th>彩礼数额<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>O-4<\/td><td>登记，认识 3 天，共同生活很短，没孩子<\/td><td>20 万<\/td><td>全额返还<\/td><\/tr><tr><td>O-1<\/td><td>没登记，办了婚礼，同居，女方终止妊娠；彩礼含购车款<\/td><td>21.6 万<\/td><td>返还约八成<\/td><\/tr><tr><td>O-8<\/td><td>登记，不在一个城市，没有稳定共同生活，3 个月协议离婚<\/td><td>106 万<\/td><td>返还 80 万，约 75%<\/td><\/tr><tr><td>O-9<\/td><td>订婚，没登记，没共同生活，有少量嫁妆<\/td><td>13.66 万 + 3.66 万礼金<\/td><td>返还约九成<\/td><\/tr><tr><td>O-6<\/td><td>登记，共同生活短，女方终止妊娠，彩礼明显超出男方家庭承受<\/td><td>18.8 万<\/td><td>返还 30%（5.64 万）<\/td><\/tr><tr><td>O-7<\/td><td>没登记，办了婚礼，同居三年多，有孩子<\/td><td>16 万<\/td><td>不返还<\/td><\/tr><tr><td>O-3<\/td><td>没登记，办了婚礼，同居近四年，有孩子<\/td><td>20 万<\/td><td>不返还<\/td><\/tr><tr><td>O-2<\/td><td>小额转账，日常开销，不是彩礼<\/td><td>3.15 万<\/td><td>不返还<\/td><\/tr><\/tbody><\/table><\/div>\n<p>粗略的直觉：没领证、也没一起生活，返还比例较高；没领证，但同居较久，或已有孩子，返还比例会大幅降低，甚至不返还；已领证，共同生活时间很短、彩礼金额明显偏高，可能有一定比例返还；已领证，共同生活多年、有孩子，一般不支持返还。<\/p>\n<p>表里有些案子，是 2024 年 2 月新规则施行之前审理的，只能当作参考。网上的案例比例，不能直接套到自己的案件。<\/p>\n<p><strong>法律依据<\/strong>：《彩礼规定》第 5 条、第 6 条。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实。<\/p>", "text": "彩礼能退多少：法官怎么算 \n 没有固定比例。看的是：钱花到哪儿了，日子过了多久，孩子有没有，谁的过错。\n\n法院通常综合这几项：彩礼的实际使用情况，是否已经用于共同生活、办婚礼、置办家具，这些会相应扣减；嫁妆，女方家庭陪送的嫁妆，在计算返还时一并考虑；共同生活的时间和孕育情况，时间越长、有孩子，返还比例通常越低；双方过错，谁导致婚约解除；当地习俗。\n\n看最高人民法院公布的案例里，法官实际是怎么判的（案情详见附录 O。每个案子都有自己的情况，不能直接套用）：\n\n 案例  情况  彩礼数额  结果 \n\n O4  登记，认识 3 天，共同生活很短，没孩子  20 万  全额返还 \n O1  没登记，办了婚礼，同居，女方终止妊娠；彩礼含购车款  21.6 万  返还约八成 \n O8  登记，不在一个城市，没有稳定共同生活，3 个月协议离婚  106 万  返还 80 万，约 75% \n O9  订婚，没登记，没共同生活，有少量嫁妆  13.66 万 + 3.66 万礼金  返还约九成 \n O6  登记，共同生活短，女方终止妊娠，彩礼明显超出男方家庭承受  18.8 万  返还 30%（5.64 万） \n O7  没登记，办了婚礼，同居三年多，有孩子  16 万  不返还 \n O3  没登记，办了婚礼，同居近四年，有孩子  20 万  不返还 \n O2  小额转账，日常开销，不是彩礼  3.15 万  不返还 \n\n粗略的直觉：没领证、也没一起生活，返还比例较高；没领证，但同居较久，或已有孩子，返还比例会大幅降低，甚至不返还；已领证，共同生活时间很短、彩礼金额明显偏高，可能有一定比例返还；已领证，共同生活多年、有孩子，一般不支持返还。\n\n表里有些案子，是 2024 年 2 月新规则施行之前审理的，只能当作参考。网上的案例比例，不能直接套到自己的案件。\n\n法律依据：《彩礼规定》第 5 条、第 6 条。\n\n把握度：B｜依个案事实。\n\n"}, {"num": "040", "title": "漫天要价，算不算\"借婚姻要钱\"", "grade": "A", "lead": "以彩礼之名索取财物，另一方要求返还的，法院应当支持。这是明文规定。", "html": "<blockquote>以彩礼之名索取财物，另一方要求返还的，法院应当支持。这是明文规定。<\/blockquote>\n<p>对方家里要求 60 万彩礼，否则不结婚。男方家庭收入一般，借遍亲友凑齐。结婚不到一个月，对方就要离婚。法院判断这笔钱是不是\"借婚姻索取财物\"，看金额是否明显超出当地习俗和给付方的家庭能力、是否以此为条件、结婚后的共同生活情况。<\/p>\n<p>《民法典》第 1042 条第一款，禁止借婚姻索取财物。《彩礼规定》第 2 条进一步明确：以彩礼名义索取财物，另一方要求返还的，法院应当支持。<\/p>\n<p>判断是不是\"借婚姻索取财物\"，看三点：要求的金额，是否远超当地习俗和你家庭的经济能力；是否以结婚为条件，反复加码；收到钱后，是否迅速失联，或明确拒绝结婚。<\/p>\n<p>怎么应对？保存证据：聊天里的\"要求\"、转账记录、对方态度的变化。已经给付的，可以主张返还，法院一般支持。对方涉嫌诈骗的，可以报警，见 <a href=\"#/e/017\">第 017 条<\/a>。谈数额时，把底线提前说清楚，并留存聊天。<\/p>\n<p>不是每一次\"要价高\"，都构成借婚姻索取财物。要看是否违背当地习俗，是否有\"以此为条件\"的表示。但要钱要到你扛不住，就不叫习俗了。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们家能拿出 15 万，这是我们的上限，再多我们确实拿不出。如果你们觉得不够，我们再商量别的办法，或者我们都再想想。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1042 条第 1 款；《彩礼规定》第 2 条；《刑法》第 266 条。<\/p>\n<p><strong>把握度<\/strong>：A｜规则明确；认定依个案是 B。<\/p>", "text": "漫天要价，算不算\"借婚姻要钱\" \n 以彩礼之名索取财物，另一方要求返还的，法院应当支持。这是明文规定。\n\n对方家里要求 60 万彩礼，否则不结婚。男方家庭收入一般，借遍亲友凑齐。结婚不到一个月，对方就要离婚。法院判断这笔钱是不是\"借婚姻索取财物\"，看金额是否明显超出当地习俗和给付方的家庭能力、是否以此为条件、结婚后的共同生活情况。\n\n《民法典》第 1042 条第一款，禁止借婚姻索取财物。《彩礼规定》第 2 条进一步明确：以彩礼名义索取财物，另一方要求返还的，法院应当支持。\n\n判断是不是\"借婚姻索取财物\"，看三点：要求的金额，是否远超当地习俗和你家庭的经济能力；是否以结婚为条件，反复加码；收到钱后，是否迅速失联，或明确拒绝结婚。\n\n怎么应对？保存证据：聊天里的\"要求\"、转账记录、对方态度的变化。已经给付的，可以主张返还，法院一般支持。对方涉嫌诈骗的，可以报警，见 第 017 条。谈数额时，把底线提前说清楚，并留存聊天。\n\n不是每一次\"要价高\"，都构成借婚姻索取财物。要看是否违背当地习俗，是否有\"以此为条件\"的表示。但要钱要到你扛不住，就不叫习俗了。\n\n可以这样说：\n\n \"我们家能拿出 15 万，这是我们的上限，再多我们确实拿不出。如果你们觉得不够，我们再商量别的办法，或者我们都再想想。\"\n\n法律依据：《民法典》第 1042 条第 1 款；《彩礼规定》第 2 条；《刑法》第 266 条。\n\n把握度：A｜规则明确；认定依个案是 B。\n\n"}, {"num": "041", "title": "给她买车、买房首付，算不算彩礼", "grade": "B", "lead": "为了结婚而给的购车款、购房款，同样可能按彩礼处理。别以为换个名目，就换了规则。", "html": "<blockquote>为了结婚而给的购车款、购房款，同样可能按彩礼处理。别以为换个名目，就换了规则。<\/blockquote>\n<p>男方在订婚后，给女方转了 15 万买车，聊天里写\"买了车我们一起用，等结婚\"。车登记在女方名下。后来没结婚。男方起诉要求返还。法院可以把这笔购车款，按彩礼的规则来处理。<\/p>\n<p>最高人民法院 2026 年 1 月公布的案例就是这种情形：男方在女方承诺登记结婚的前提下，转账 15 万元用于购车，后来双方没有登记。法院把购车款按彩礼规则处理，并结合共同生活、终止妊娠等因素，判决返还了大部分。见附录 O 案例 O-1。<\/p>\n<p>所以给对方买车、买房之前，先写清楚用途：\"这是为了结婚后共同使用，如果结婚不成，退还给我。\"登记在谁名下，提前约定。保存聊天、订单、发票、转账凭证。已经买了、没约定的，补一次文字沟通，让对方确认当初的用途。<\/p>\n<p>是否按彩礼处理，法院会结合给付目的、当地习俗、金额等综合判断，不是只要买了车，就一定算。<\/p>\n<p><strong>法律依据<\/strong>：《彩礼规定》第 3 条；《民法典》第 1042 条第 1 款。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实，来自官方案例。<\/p>", "text": "给她买车、买房首付，算不算彩礼 \n 为了结婚而给的购车款、购房款，同样可能按彩礼处理。别以为换个名目，就换了规则。\n\n男方在订婚后，给女方转了 15 万买车，聊天里写\"买了车我们一起用，等结婚\"。车登记在女方名下。后来没结婚。男方起诉要求返还。法院可以把这笔购车款，按彩礼的规则来处理。\n\n最高人民法院 2026 年 1 月公布的案例就是这种情形：男方在女方承诺登记结婚的前提下，转账 15 万元用于购车，后来双方没有登记。法院把购车款按彩礼规则处理，并结合共同生活、终止妊娠等因素，判决返还了大部分。见附录 O 案例 O1。\n\n所以给对方买车、买房之前，先写清楚用途：\"这是为了结婚后共同使用，如果结婚不成，退还给我。\"登记在谁名下，提前约定。保存聊天、订单、发票、转账凭证。已经买了、没约定的，补一次文字沟通，让对方确认当初的用途。\n\n是否按彩礼处理，法院会结合给付目的、当地习俗、金额等综合判断，不是只要买了车，就一定算。\n\n法律依据：《彩礼规定》第 3 条；《民法典》第 1042 条第 1 款。\n\n把握度：B｜依个案事实，来自官方案例。\n\n"}, {"num": "042", "title": "嫁妆、礼金、改口费和婚礼开销", "grade": "B", "lead": "嫁妆不是\"对价\"，但算账的时候，它会被算进去。婚礼办了的钱，大多要不回来。", "html": "<blockquote>嫁妆不是\"对价\"，但算账的时候，它会被算进去。婚礼办了的钱，大多要不回来。<\/blockquote>\n<p>女方家陪嫁了价值 5 万的家具家电，放在男方家。婚没结成，男方要求返还彩礼，女方家说要扣除嫁妆。最高人民法院的案例 O-9，就把嫁妆在返还时扣除了。<\/p>\n<p>先说嫁妆。嫁妆一般指女方家庭在结婚时陪送的财物，没有统一的法律定义，要结合具体情况：婚前给付、登记在女方名下的，一般是女方个人财产；婚后给付，没有明确只给女方的，可能被认定为夫妻共同财产。在彩礼返还的纠纷里，嫁妆会被法院考虑（《彩礼规定》第 5 条、第 6 条）。\"三金\"这类，既可能是彩礼，也可能是日常赠与，看当地习俗和价值。<\/p>\n<p>再说婚礼开销。已经办了的酒席费用，难以返还，而且是法院确定彩礼返还比例时，重要的扣减项。小额红包、改口费，一般属于礼金，不属于彩礼；较大金额的改口费，如果按当地习俗、明确是为婚姻给付，可能被认定为彩礼的一部分。婚礼上收到的礼金，一般属于双方共同收到，归夫妻共同所有，婚约取消的，需要协商处理。<\/p>\n<p>所以办婚礼之前，把费用由谁出、礼金归谁，写下来。办了的酒席要不回来；没办的，就别预付。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1062 条、第 1063 条；《彩礼规定》第 5 条、第 6 条。；《彩礼规定》第 3 条。<\/p>\n<p><strong>把握度<\/strong>：B｜依个案事实。<\/p>", "text": "嫁妆、礼金、改口费和婚礼开销 \n 嫁妆不是\"对价\"，但算账的时候，它会被算进去。婚礼办了的钱，大多要不回来。\n\n女方家陪嫁了价值 5 万的家具家电，放在男方家。婚没结成，男方要求返还彩礼，女方家说要扣除嫁妆。最高人民法院的案例 O9，就把嫁妆在返还时扣除了。\n\n先说嫁妆。嫁妆一般指女方家庭在结婚时陪送的财物，没有统一的法律定义，要结合具体情况：婚前给付、登记在女方名下的，一般是女方个人财产；婚后给付，没有明确只给女方的，可能被认定为夫妻共同财产。在彩礼返还的纠纷里，嫁妆会被法院考虑（《彩礼规定》第 5 条、第 6 条）。\"三金\"这类，既可能是彩礼，也可能是日常赠与，看当地习俗和价值。\n\n再说婚礼开销。已经办了的酒席费用，难以返还，而且是法院确定彩礼返还比例时，重要的扣减项。小额红包、改口费，一般属于礼金，不属于彩礼；较大金额的改口费，如果按当地习俗、明确是为婚姻给付，可能被认定为彩礼的一部分。婚礼上收到的礼金，一般属于双方共同收到，归夫妻共同所有，婚约取消的，需要协商处理。\n\n所以办婚礼之前，把费用由谁出、礼金归谁，写下来。办了的酒席要不回来；没办的，就别预付。\n\n法律依据：《民法典》第 1062 条、第 1063 条；《彩礼规定》第 5 条、第 6 条。；《彩礼规定》第 3 条。\n\n把握度：B｜依个案事实。\n\n"}, {"num": "043", "title": "彩礼怎么谈：先摸行情，再算家底，最后写下来", "grade": "C", "lead": "数额先谈、早谈、写下来。谈数额不是算计，是为了避免更大的冲突。", "html": "<blockquote>数额先谈、早谈、写下来。谈数额不是算计，是为了避免更大的冲突。<\/blockquote>\n<p>男女双方家长见面时，男方家长直接提出：我们家能拿 12 万，用于婚礼和日常，剩下的，你们小两口自己挣。女方家长回应：好，我们陪嫁家电家具。双方当场写在一张纸上，各自签字。<\/p>\n<p>怎么谈？<\/p>\n<p>第一，先了解当地的习俗：问问当地民政局、法院、亲友，参考近年的情况。近年各地出台过治理高额彩礼的措施，具体做法以当地为准。<\/p>\n<p>第二，评估自己的承受能力：不要借高利贷，不要掏空家底。<\/p>\n<p>第三，把彩礼和其他安排一起谈：婚房、嫁妆、婚礼费用，形成整体方案。<\/p>\n<p>第四，把达成的结果，写成书面的《订婚协议》或《彩礼约定》，写清：数额、用途、婚事不成怎么处理。范本见附录 B。<\/p>\n<p>第五，如果对方坚持天价彩礼，要想一想：这是不是对方对婚姻的整体态度。<\/p>\n<p>不要在没有书面约定的情况下，答应\"先给钱再说\"。谈彩礼不丢人，不谈清楚才丢人。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1042 条第 1 款；《彩礼规定》第 2 条、第 5 条。<\/p>\n<p><strong>把握度<\/strong>：C｜经验做法。<\/p>", "text": "彩礼怎么谈：先摸行情，再算家底，最后写下来 \n 数额先谈、早谈、写下来。谈数额不是算计，是为了避免更大的冲突。\n\n男女双方家长见面时，男方家长直接提出：我们家能拿 12 万，用于婚礼和日常，剩下的，你们小两口自己挣。女方家长回应：好，我们陪嫁家电家具。双方当场写在一张纸上，各自签字。\n\n怎么谈？\n\n第一，先了解当地的习俗：问问当地民政局、法院、亲友，参考近年的情况。近年各地出台过治理高额彩礼的措施，具体做法以当地为准。\n\n第二，评估自己的承受能力：不要借高利贷，不要掏空家底。\n\n第三，把彩礼和其他安排一起谈：婚房、嫁妆、婚礼费用，形成整体方案。\n\n第四，把达成的结果，写成书面的《订婚协议》或《彩礼约定》，写清：数额、用途、婚事不成怎么处理。范本见附录 B。\n\n第五，如果对方坚持天价彩礼，要想一想：这是不是对方对婚姻的整体态度。\n\n不要在没有书面约定的情况下，答应\"先给钱再说\"。谈彩礼不丢人，不谈清楚才丢人。\n\n法律依据：《民法典》第 1042 条第 1 款；《彩礼规定》第 2 条、第 5 条。\n\n把握度：C｜经验做法。\n\n"}, {"num": "044", "title": "彩礼官司怎么打：从立案到执行", "grade": "A", "lead": "协商不成，起诉；判决后对方不给，申请强制执行。起诉之前，先算三笔账。", "html": "<blockquote>协商不成，起诉；判决后对方不给，申请强制执行。起诉之前，先算三笔账。<\/blockquote>\n<p>小罗准备起诉要回 15 万。他按顺序准备了：转账流水打印盖章、聊天记录导出、中间人的书面说明、当地居民人均可支配收入的统计数据、起诉状。立案后，法院先组织调解，对方同意返还 10 万，出了调解书。<\/p>\n<p>彩礼多数是父母出的钱。《彩礼规定》第 4 条：婚约财产纠纷中，订婚的男女双方，加上实际给付和接收彩礼的父母，可以作为共同原告、共同被告。离婚案件里，当事人仍然是夫妻双方，彩礼问题在离婚案件里一并处理。只列男方一个人为原告，可能被要求追加共同原告。<\/p>\n<p>流程是这样的：<\/p>\n<p>第一，备材料：身份证明、转账记录、聊天记录、对方家庭情况、当地习俗的证明、起诉状（附录 D）。<\/p>\n<p>第二，管辖：一般是被告住所地法院（《民事诉讼法》第 22 条）。<\/p>\n<p>第三，很多法院会先诉前调解，成功了出调解书。<\/p>\n<p>第四，立案、举证、开庭。在举证期限内提交证据，开庭时客观陈述。<\/p>\n<p>第五，判决。一审判决后，不服的，15 日内上诉（第 171 条）。<\/p>\n<p>第六，执行。对方不履行的，申请强制执行，可以查询、冻结、扣划财产，把对方纳入失信被执行人名单。申请执行的期间是二年（第 250 条）。<\/p>\n<p>起诉之前，先算三笔账：证据够不够，对方有没有可执行的钱，值不值得。诉讼费按标的额分段收取，见 <a href=\"#/e/110\">第 110 条<\/a>，律师费另算，时间通常三到十二个月。<\/p>\n<p><strong>附件<\/strong>：彩礼约定书见附录 B，起诉状见附录 D。<\/p>\n<p><strong>法律依据<\/strong>：《民事诉讼法》第 22 条（被告住所地管辖）、第 171 条（判决上诉期限）及执行编；《诉讼费用交纳办法》。；《彩礼规定》第 4 条。<\/p>\n<p><strong>把握度<\/strong>：A｜程序明确。<\/p>", "text": "彩礼官司怎么打：从立案到执行 \n 协商不成，起诉；判决后对方不给，申请强制执行。起诉之前，先算三笔账。\n\n小罗准备起诉要回 15 万。他按顺序准备了：转账流水打印盖章、聊天记录导出、中间人的书面说明、当地居民人均可支配收入的统计数据、起诉状。立案后，法院先组织调解，对方同意返还 10 万，出了调解书。\n\n彩礼多数是父母出的钱。《彩礼规定》第 4 条：婚约财产纠纷中，订婚的男女双方，加上实际给付和接收彩礼的父母，可以作为共同原告、共同被告。离婚案件里，当事人仍然是夫妻双方，彩礼问题在离婚案件里一并处理。只列男方一个人为原告，可能被要求追加共同原告。\n\n流程是这样的：\n\n第一，备材料：身份证明、转账记录、聊天记录、对方家庭情况、当地习俗的证明、起诉状（附录 D）。\n\n第二，管辖：一般是被告住所地法院（《民事诉讼法》第 22 条）。\n\n第三，很多法院会先诉前调解，成功了出调解书。\n\n第四，立案、举证、开庭。在举证期限内提交证据，开庭时客观陈述。\n\n第五，判决。一审判决后，不服的，15 日内上诉（第 171 条）。\n\n第六，执行。对方不履行的，申请强制执行，可以查询、冻结、扣划财产，把对方纳入失信被执行人名单。申请执行的期间是二年（第 250 条）。\n\n起诉之前，先算三笔账：证据够不够，对方有没有可执行的钱，值不值得。诉讼费按标的额分段收取，见 第 110 条，律师费另算，时间通常三到十二个月。\n\n附件：彩礼约定书见附录 B，起诉状见附录 D。\n\n法律依据：《民事诉讼法》第 22 条（被告住所地管辖）、第 171 条（判决上诉期限）及执行编；《诉讼费用交纳办法》。；《彩礼规定》第 4 条。\n\n把握度：A｜程序明确。\n\n"}]}, {"title": "第五章　婚前准备", "intro": "<blockquote><strong>这一章想让你想明白的事<\/strong>：婚前花的是谈话的功夫，省的是婚后的官司。全书性价比最高的一章。<br><br><strong>口诀<\/strong>：问清人，问清钱，问清未来，再谈协议；红灯三个以上，先别领证。<\/blockquote>\n<p>婚后大部分矛盾，根子在婚前。婚姻不会修复婚前就存在的问题，只会把它放大。<\/p>", "entries": [{"num": "045", "title": "婚检：不是走形式，是保住你的知情权", "grade": "A", "lead": "婚检现在是自愿的。去不去，由你们决定；但有重大疾病不告知，对方可以请求撤销婚姻。", "html": "<blockquote>婚检现在是自愿的。去不去，由你们决定；但有重大疾病不告知，对方可以请求撤销婚姻。<\/blockquote>\n<p>婚后三个月，小黄发现妻子婚前就患有严重的遗传性疾病，没告诉他。他想撤销婚姻，却发现已经过了一年的撤销期限，只能走离婚。<\/p>\n<p>很多人觉得婚检是走流程，其实它的价值，是在登记之前，知道对方基础的健康情况。2003 年起，婚姻登记不再强制婚检，但婚前检查依然被推荐，各地有免费或补贴项目。<\/p>\n<p>《民法典》第 1053 条规定：一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向法院请求撤销婚姻，期限是知道或应当知道撤销事由之日起一年内。婚姻被撤销后，自始没有法律约束力，无过错方有权请求损害赔偿（第 1054 条）。\"重大疾病\"没有统一清单，实务中结合病情、对婚姻关系的影响来判断。<\/p>\n<p>所以婚检的意义，不是筛选伴侣，而是让双方在知情的前提下，做同一个决定。一起去，一起拿报告，当面交换。婚检能多查就多查，传染病、遗传性疾病评估、生育相关检查，都可以纳入，不要觉得不好意思，也不要因为信任对方的口头描述就省略，口头陈述，代替不了医学报告。<\/p>\n<p>要记住那个一年的期限：过了，就不能再请求撤销了。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们结婚前去做个婚检吧，我们都做，你的我不看你的隐私细节，只是为了我们都放心。\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：《民法典》第 1053 条、第 1054 条；《婚姻登记条例》。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "婚检：不是走形式，是保住你的知情权 \n 婚检现在是自愿的。去不去，由你们决定；但有重大疾病不告知，对方可以请求撤销婚姻。\n\n婚后三个月，小黄发现妻子婚前就患有严重的遗传性疾病，没告诉他。他想撤销婚姻，却发现已经过了一年的撤销期限，只能走离婚。\n\n很多人觉得婚检是走流程，其实它的价值，是在登记之前，知道对方基础的健康情况。2003 年起，婚姻登记不再强制婚检，但婚前检查依然被推荐，各地有免费或补贴项目。\n\n《民法典》第 1053 条规定：一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向法院请求撤销婚姻，期限是知道或应当知道撤销事由之日起一年内。婚姻被撤销后，自始没有法律约束力，无过错方有权请求损害赔偿（第 1054 条）。\"重大疾病\"没有统一清单，实务中结合病情、对婚姻关系的影响来判断。\n\n所以婚检的意义，不是筛选伴侣，而是让双方在知情的前提下，做同一个决定。一起去，一起拿报告，当面交换。婚检能多查就多查，传染病、遗传性疾病评估、生育相关检查，都可以纳入，不要觉得不好意思，也不要因为信任对方的口头描述就省略，口头陈述，代替不了医学报告。\n\n要记住那个一年的期限：过了，就不能再请求撤销了。\n\n可以这样说：\n\n \"我们结婚前去做个婚检吧，我们都做，你的我不看你的隐私细节，只是为了我们都放心。\"\n\n法律依据：《民法典》第 1053 条、第 1054 条；《婚姻登记条例》。\n\n把握度：A｜法条明确。\n\n"}, {"num": "046", "title": "领证前，必须当面问清的七件事", "grade": "A", "lead": "重大信息要在登记前当面交换：婚史、子女、疾病、债务、收入、房产、家庭。", "html": "<blockquote>重大信息要在登记前当面交换：婚史、子女、疾病、债务、收入、房产、家庭。<\/blockquote>\n<p>登记后，小吕才发现妻子有 12 万的网贷没告诉他，每月要还 4000。他想追究，却发现隐瞒债务，不是撤销婚姻的法定事由。<\/p>\n<p>领证前不好意思问的，领证后会变成官司。双方都要提供，当面交换这七件事：<\/p>\n<p>第一，<strong>身份和婚史<\/strong>：是否有过婚姻，离婚证、离婚协议或判决书；有没有\"还没离完\"的婚姻。有人说\"早就分居了\"\"早就离了\"，这几个字不能当证据，要看证件。对方曾经结过婚的，要看离婚证或判决书的真实性，必要时，请对方到婚姻登记机关或通过当地民政渠道，打印自己的婚姻登记记录，具体方式各地不同。对方如果仍在婚姻里，你和她的婚姻将是重婚，无效，见 <a href=\"#/e/054\">第 054 条<\/a>。<\/p>\n<p>第二，<strong>子女<\/strong>：有无子女，是否由对方抚养，抚养费。<\/p>\n<p>第三，<strong>健康<\/strong>：重大疾病、传染病、生育情况。<\/p>\n<p>第四，<strong>债务<\/strong>：房贷、车贷、信用卡、网贷、民间借贷、担保。<\/p>\n<p>第五，<strong>收入和资产<\/strong>：大致范围，房产、存款、投资。<\/p>\n<p>第六，<strong>家庭<\/strong>：双方父母的经济状况、赡养责任、家庭内部的债务。<\/p>\n<p>第七，<strong>未了结的纠纷<\/strong>：未决的诉讼、被执行、失信记录。<\/p>\n<p>怎么核实？请对方主动提供；个人可以向中国人民银行征信中心申请查询自己的信用报告，双方各自查询后交换；不得通过非法渠道购买对方的个人信息。<\/p>\n<p>要知道，隐瞒婚史、学历、收入、债务，不属于法定的撤销婚姻事由。登记之后，只能通过离婚等方式处理。所以要在登记前问清。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1053 条；《个人信息保护法》；《刑法》第 253 条之一。；《民法典》第 1051 条、第 1054 条；《刑法》第 258 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 1 条。<\/p>\n<p><strong>把握度<\/strong>：A｜撤销事由的范围明确；清单属于经验。<\/p>", "text": "领证前，必须当面问清的七件事 \n 重大信息要在登记前当面交换：婚史、子女、疾病、债务、收入、房产、家庭。\n\n登记后，小吕才发现妻子有 12 万的网贷没告诉他，每月要还 4000。他想追究，却发现隐瞒债务，不是撤销婚姻的法定事由。\n\n领证前不好意思问的，领证后会变成官司。双方都要提供，当面交换这七件事：\n\n第一，身份和婚史：是否有过婚姻，离婚证、离婚协议或判决书；有没有\"还没离完\"的婚姻。有人说\"早就分居了\"\"早就离了\"，这几个字不能当证据，要看证件。对方曾经结过婚的，要看离婚证或判决书的真实性，必要时，请对方到婚姻登记机关或通过当地民政渠道，打印自己的婚姻登记记录，具体方式各地不同。对方如果仍在婚姻里，你和她的婚姻将是重婚，无效，见 第 054 条。\n\n第二，子女：有无子女，是否由对方抚养，抚养费。\n\n第三，健康：重大疾病、传染病、生育情况。\n\n第四，债务：房贷、车贷、信用卡、网贷、民间借贷、担保。\n\n第五，收入和资产：大致范围，房产、存款、投资。\n\n第六，家庭：双方父母的经济状况、赡养责任、家庭内部的债务。\n\n第七，未了结的纠纷：未决的诉讼、被执行、失信记录。\n\n怎么核实？请对方主动提供；个人可以向中国人民银行征信中心申请查询自己的信用报告，双方各自查询后交换；不得通过非法渠道购买对方的个人信息。\n\n要知道，隐瞒婚史、学历、收入、债务，不属于法定的撤销婚姻事由。登记之后，只能通过离婚等方式处理。所以要在登记前问清。\n\n法律依据：《民法典》第 1053 条；《个人信息保护法》；《刑法》第 253 条之一。；《民法典》第 1051 条、第 1054 条；《刑法》第 258 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（二）》第 1 条。\n\n把握度：A｜撤销事由的范围明确；清单属于经验。\n\n"}, {"num": "047", "title": "对方婚前欠的债，会不会算到你头上", "grade": "A", "lead": "婚前债务，原则上是个人债务；但婚后共同财产会受到间接影响。", "html": "<blockquote>婚前债务，原则上是个人债务；但婚后共同财产会受到间接影响。<\/blockquote>\n<p>小郑的妻子婚前欠了 20 万网贷。婚后，债权人找上门，说\"你们是夫妻\"。小郑查了法条：婚前个人债务，原则上由本人偿还，债权人要证明这笔钱用于婚后家庭共同生活，才能主张是夫妻共同债务（《民法典》第 1064 条；《婚姻家庭编解释（一）》第 33 条）。<\/p>\n<p>说\"原则上\"，是因为有三个例外和风险。<\/p>\n<p>第一，债权人可以执行债务人个人名下的财产，包括她在夫妻共同财产中应得的份额，但要受到\"保护另一方份额\"的限制。<\/p>\n<p>第二，婚后用共同财产替对方还婚前的债，钱已经付出，很难追回，实际上相当于赠与。要么用你自己的婚前财产，要么写明是借款。<\/p>\n<p>第三，你对对方的债务提供了担保，或者与对方共同借款的，另当别论，你签字的，是你自己的责任。<\/p>\n<p>怎么办？婚前协议里写清：谁的债务谁负责，婚后偿还的资金来源。婚前有大额债务的，更要写。<\/p>\n<p><strong>法律依据<\/strong>：《民法典》第 1064 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 33 条。<\/p>\n<p><strong>把握度<\/strong>：A｜法条明确。<\/p>", "text": "对方婚前欠的债，会不会算到你头上 \n 婚前债务，原则上是个人债务；但婚后共同财产会受到间接影响。\n\n小郑的妻子婚前欠了 20 万网贷。婚后，债权人找上门，说\"你们是夫妻\"。小郑查了法条：婚前个人债务，原则上由本人偿还，债权人要证明这笔钱用于婚后家庭共同生活，才能主张是夫妻共同债务（《民法典》第 1064 条；《婚姻家庭编解释（一）》第 33 条）。\n\n说\"原则上\"，是因为有三个例外和风险。\n\n第一，债权人可以执行债务人个人名下的财产，包括她在夫妻共同财产中应得的份额，但要受到\"保护另一方份额\"的限制。\n\n第二，婚后用共同财产替对方还婚前的债，钱已经付出，很难追回，实际上相当于赠与。要么用你自己的婚前财产，要么写明是借款。\n\n第三，你对对方的债务提供了担保，或者与对方共同借款的，另当别论，你签字的，是你自己的责任。\n\n怎么办？婚前协议里写清：谁的债务谁负责，婚后偿还的资金来源。婚前有大额债务的，更要写。\n\n法律依据：《民法典》第 1064 条；《最高人民法院关于适用〈中华人民共和国民法典〉婚姻家庭编的解释（一）》第 33 条。\n\n把握度：A｜法条明确。\n\n"}, {"num": "048", "title": "看钱怎么花，也看家怎么过", "grade": "C", "lead": "收入是一时的，习惯是一辈子的。你娶的是一个人，但你们要共同面对两个家。", "html": "<blockquote>收入是一时的，习惯是一辈子的。你娶的是一个人，但你们要共同面对两个家。<\/blockquote>\n<p>两个月薪都 2 万的人，一个每月存 8000，一个每月刷爆信用卡再用网贷还。三年后，两人的财务状况完全不同。<\/p>\n<p>比起看收入，更要看这几样：<\/p>\n<p><strong>现金流<\/strong>：每月的固定收入、支出、结余。<\/p>\n<p><strong>负债结构<\/strong>：信用卡使用率，网贷数量，有没有\"以贷养贷\"。<\/p>\n<p><strong>消费观<\/strong>：对大额支出、对储蓄的态度。<\/p>\n<p><strong>透明度<\/strong>：对方愿不愿意谈钱，是回避，还是含糊。<\/p>\n<p>互相交换信用报告，不是\"审查对方\"，而是共同制定婚后预算。消费习惯，很难在婚后短期内改变，不要靠\"以后会好\"，替代婚前的沟通。<\/p>\n<p>再看家。小罗发现女友的大小事，都要听母亲的：买房选哪套、生几个孩子、工资交多少给家里。他后来才意识到，问题不在对方的母亲，而是女友自己没有边界。他自己的父母，其实也一样。<\/p>\n<p>观察几点：对方和父母之间的边界，重大决定是不是由对方自己做主；家庭对钱的态度，是否把子女的收入视为家庭共同财产；家庭内部遇到分歧，是讨论，还是压制；对婚后生活的期待，是否同住、是否带孩子、是否需要经济支持。<\/p>\n<p>你自己的家庭同样要看。可以做的：婚前，和双方父母聊一次，把期待说清楚；约定好，大额支出、买房、生育，由夫妻两人决定，父母提供意见。<\/p>\n<p>不是原生家庭有问题，就不能结婚。要看的是：对方有没有能力，建立自己的边界。<\/p>\n<p><strong>可以这样说<\/strong>：<\/p>\n<ul><li>\"我们结婚前，把各自的收入、存款和负债都摊开来看一下，不是互相审查，是为了一起做个婚后的预算，你觉得呢？\"\n<\/li><\/ul>\n<p><strong>法律依据<\/strong>：无直接条文，属于经验判断。；《民法典》第 1043 条（树立优良家风、互相关爱）；第 26 条（父母对未成年子女的抚养义务，成年子女对父母的赡养义务）。<\/p>\n<p><strong>把握度<\/strong>：C｜经验判断。<\/p>", "text": "看钱怎么花，也看家怎么过 \n 收入是一时的，习惯是一辈子的。你娶的是一个人，但你们要共同面对两个家。\n\n两个月薪都 2 万的人，一个每月存 8000，一个每月刷爆信用卡再用网贷还。三年后，两人的财务状况完全不同。\n\n比起看收入，更要看这几样：\n\n现金流：每月的固定收入、支出、结余。\n\n负债结构：信用卡使用率，网贷数量，有没有\"以贷养贷\"。\n\n消费观：对大额支出、对储蓄的态度。\n\n透明度：对方愿不愿意谈钱，是回避，还是含糊。\n\n互相交换信用报告，不是\"审查对方\"，而是共同制定婚后预算。消费习惯，很难在婚后短期内改变，不要靠\"以后会好\"，替代婚前的沟通。\n\n再看家。小罗发现女友的大小事，都要听母亲的：买房选哪套、生几个孩子、工资交多少给家里。他后来才意识到，问题不在对方的母亲，而是女友自己没有边界。他自己的父母，其实也一样。\n\n观察几点：对方和父母之间的边界，重大决定是不是由对方自己做主；家庭对钱的态度，是否把子女的收入视为家庭共同财产；家庭内部遇到分歧，是讨论，还是压制；对婚后生活的期待，是否同住、是否带孩子、是否需要经济支持。\n\n你自己的家庭同样要看。可以做的：婚前，和双方父母聊一次，把期待说清楚；约定好，大额支出、买房、生育，由夫妻两人决定，父母提供意见。\n\n不是原生家庭有问题，就不能结婚。要看的是：对方有没有能力，建立自己的边界。\n\n可以这样说：\n\n \"我们结婚前，把各自的收入、存款和负债都摊开来看一下，不是互相审查，是为了一起做个婚后的预算，你觉得呢？\"\n\n法律依据：无直接条文，属于经验判断。；《民法典》第 1043 条（树立优良家风、互相关爱）；第 26 条（父母对未成年子女的抚养义务，成年子女对父母的赡养义务
