name: build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 重新构建（同时检查引用和链接）
        run: python3 tools/build.py

      - name: 检查生成物是否和源稿一致
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "生成物与 src/ 不一致。请在本地运行 python3 tools/build.py，并把生成的文件一起提交。"
            git status --short
            exit 1
          fi
